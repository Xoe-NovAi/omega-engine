# 🔱 omega-vetala — pytest Configuration
# ⬡ OMEGA ⬡ P10-VALIDATION ⬡ PYTEST-CONFIG
#
# AP Token: AP-MODERATION-P10-v1.0.0

[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode: auto-detect async test functions
# Tests with @pytest.mark.anyio will use anyio backend
# All other async tests will use asyncio backend
asyncio_mode = auto
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multi-component)
    adversarial: Adversarial obfuscation detection tests (placeholder text only)
    benchmark: Performance benchmarks
    regression: Regression tests

# Coverage configuration
addopts =
    --tb=short
    --strict-markers
    -p no:cacheprovider

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
