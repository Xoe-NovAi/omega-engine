# 🔱 Omega Engine — CI Pipeline
# ⬡ OMEGA ⬡ PROMETHEUS ⬡ github-actions ⬡ trc_ci ⬡ PHASE-1a
#
# Runs on every push and pull request to the main branch.
# Tests use MockProvider (OMEGA_ENV=test) — no live inference needed.
# Native GGUF is available via `.[all]` extra but tests don't require it.

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  OMEGA_ENV: test
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: 🧪 pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create and activate virtualenv (M24 Venv Sovereignty)
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies into venv
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[cli,dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify imports
        run: |
          python3 -c "import importlib.metadata; print(f'AnyIO {importlib.metadata.version(\"anyio\")}')"
          python3 -c "from omega.oracle.model_gateway import ModelGateway; print('ModelGateway OK')"

      - name: Prepare test fixtures (.firecrawl cache dir)
        run: |
          mkdir -p .firecrawl
          echo "✅ .firecrawl/ cache directory created (test_search_tools fixture)"

      - name: Run tests
        run: |
          python3 -m pytest tests/ -v --tb=short -x

      - name: Verify Mining Ports (S3 Engineering)
        run: |

      - name: AnyIO-only check (Mandate 1)
        # SSOT: Makefile `check-m1-anyio` (+ `check-asyncio-import`).
        # Do NOT duplicate the asyncio rule here — the grep below had no
        # carve-outs, so it flagged the three sanctioned CLI/TTY exceptions
        # that the Makefile intentionally exempts:
        #   src/omega/agents/tty_agent.py              — permanent Architect
        #     exemption, 2026-08; asyncio loop is the correct primitive for a
        #     TTY agent driven outside the anyio fabric.
        #   src/omega/governance/scribe_federation.py    — CLI entry (asyncio.run)
        #   src/omega/governance/federation_invariant.py — CLI entry (asyncio.run)
        # Single source of truth lives in the Makefile so the rule cannot drift.
        run: |
          make check-m1-anyio
          make check-asyncio-import

      - name: Error integrity check (Mandate 9)
        run: |
          # Check for bare 'except:' (no exception type)
          if grep -rn "except:" src/omega/ --include="*.py" | grep -v "except Exception" | grep -v "# noqa"; then
            echo "⚠️ WARNING: Bare except clauses found (review needed)"
          fi
          echo "✅ Error integrity check complete"

      - name: Sovereignty Gate (Mandate 7 — Local-First)
        run: |
          pip install -e ".[cli,dev]"
          python3 -m omega.governance.sovereignty_gate --min-ratio 0.80

      - name: Heritage Vetting (Mandate 14)
        run: |
          make heritage-vet

      - name: Lint check (non-blocking)
        continue-on-error: true
        run: |
          pip install flake8
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docs:
    name: 📖 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify docs Index
        run: |
          DOC_COUNT=$(find docs/research -maxdepth 1 -name 'R*.md' | wc -l)
          echo "📚 Research documents: $DOC_COUNT"
          if [ -f docs/research/INDEX.md ]; then
            echo "✅ INDEX.md present"
          else
            echo "⚠️ INDEX.md missing"
          fi
