# M35 VAULT Allowlist Enforcement — CI Gate
# Runs check_secrets.py on PR changes to enforce fail-closed secret scanning
# with TOML-based allowlist (data/secrets-public.toml)

name: M35 Secrets Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, release/debut, release/debut-v1.6.0]

permissions:
  contents: read
  security-events: write

jobs:
  m35-secrets-check:
    name: M35 VAULT Allowlist Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for staged file detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pyyaml toml

      - name: Run M35 VAULT Allowlist Check (staged files)
        id: m35-check
        # [maat 2026-10-09, Phase 2.3] The trailing `|| true` is REMOVED.
        # It made this step unconditionally succeed, which meant the very next
        # step — `if: failure()` — could never be true. The guard was dead code:
        # a secret violation would have produced a green checkmark and a job
        # named "Fail on violations" that never failed anything.
        # The artifact upload below is `if: always()`, so results are still
        # captured on failure; we get the evidence AND the correct exit code.
        run: |
          python scripts/check_secrets.py --staged --json > m35_results.json

      - name: Upload M35 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m35-secrets-results
          path: m35_results.json
          retention-days: 7

      - name: Fail on violations
        if: failure()
        run: |
          echo "::error::M35 VAULT Allowlist Check FAILED — secret violations detected"
          echo "Review m35_results.json artifact for details"
          exit 1

  gitleaks-check:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (CLI)
        run: |
          # gitleaks-action@v2 input schema changed (args no longer valid);
          # use the CLI directly with our allowlist config.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
            ./gitleaks detect --source . --redact --verbose --config .gitleaks.toml --baseline-path .gitleaksignore --log-opts="--all"

  trufflehog-check:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only meaningful on PRs (diff scan); on push base==head → action errors.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  c3-secret-scan:
    name: C3 Secret Scan (sk/csk/AIza/ghp/xai)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run C3 Secret Scan
        # [maat 2026-10-09, Phase 2.3] The previous line was:
        #     python scripts/ci_secret_scan.py --staged || true
        # TWO defects, both load-bearing:
        #   1. `--staged` does not exist. ci_secret_scan.py's argparse accepts
        #      only [files ...], --stdin, --exclude. Passing `--staged` made
        #      argparse exit 2 — so this step NEVER SCANNED ANYTHING. It was a
        #      green checkmark over zero coverage.
        #   2. `|| true` swallowed that exit 2, so the job stayed green and the
        #      failure was invisible. A gate that cannot fail is not a gate.
        # Verified 2026-10-09 on a full tracked-file scan: exit 0, zero findings.
        # NUL-delimited on both sides so tracked filenames containing spaces are
        # passed verbatim rather than split into phantom paths.
        run: |
          git ls-files -z | xargs -0 --no-run-if-empty python scripts/ci_secret_scan.py

  summary:
    name: M35 Secrets Summary
    runs-on: ubuntu-latest
    needs: [m35-secrets-check, gitleaks-check, trufflehog-check, c3-secret-scan]
    if: always()
    steps:
      - name: Check all secret scans passed
        run: |
          if [ "${{ needs.m35-secrets-check.result }}" != "success" ]; then
            echo "::error::M35 VAULT Allowlist Check FAILED"
            exit 1
          fi
          if [ "${{ needs.gitleaks-check.result }}" != "success" ]; then
            echo "::error::Gitleaks Check FAILED"
            exit 1
          fi
          # TruffleHog is PR-only (diff scan); skipped on push is expected.
          if [ "${{ needs.trufflehog-check.result }}" != "success" ] && [ "${{ needs.trufflehog-check.result }}" != "skipped" ]; then
            echo "::error::TruffleHog Check FAILED"
            exit 1
          fi
          if [ "${{ needs.c3-secret-scan.result }}" != "success" ]; then
            echo "::error::C3 Secret Scan FAILED"
            exit 1
          fi
          echo "✅ All secret scans PASSED"