---
name: Secret Scan (gitleaks + trufflehog + C3 mirror)

# [INST-1-C3] Per DEBUT_REMEDIATION_MANUAL §5 P0-1c
# Catches sk-, csk-, AIza, ghp_, xai-, age-secret-key patterns.
# Plants test fixture in /tmp/sk-test (not committed) — must fail CI.

on:
  push:
    branches: ["main", "release/initial-v1", "release/debut"]
  pull_request:
    branches: ["main", "release/initial-v1", "release/debut"]
  workflow_dispatch:

jobs:
  gitleaks:
    name: 🔒 gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Pro only; community uses default
        with:
          args: --redact --verbose

  trufflehog:
    name: 🐷 trufflehog (verified only)
    runs-on: ubuntu-latest
    # Only meaningful on PRs (diff scan); on push base==head → action errors.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: trufflehog filesystem scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.head_ref }}
          extra_args: --only-verified

  c3-mirror:
    name: 🪞 C3 mirror (local scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: C3 plant test (must catch planted sk- in /tmp)
        run: |
          echo "sk-test1234567890abcdefghij" > /tmp/sk-test
          python3 scripts/ci_secret_scan.py /tmp/sk-test
          if [ $? -ne 1 ]; then
            echo "❌ C3 MIRROR FAILED: did not catch planted sk- fixture"
            exit 1
          fi
          echo "✅ C3 mirror caught planted sk- fixture (expected)"

      - name: C3 full repo scan
        run: |
          # Scan tracked files only (fast, focused on committed code)
          git ls-files | xargs python3 scripts/ci_secret_scan.py
          if [ $? -ne 0 ]; then
            echo "❌ C3 FULL SCAN FAILED"
            exit 1
          fi
          echo "✅ C3 full repo scan clean"
