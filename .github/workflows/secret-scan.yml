name: Secret Scan (gitleaks + trufflehog + C3 mirror)

# [INST-1-C3] Per DEBUT_REMEDIATION_MANUAL §5 P0-1c
# Catches sk-, csk-, AIza, ghp_, xai-, age-secret-key patterns.
# Plants test fixture in /tmp/sk-test (not committed) — must fail CI.

on:
  push:
    branches: ["main", "release/initial-v1", "release/debut"]
  pull_request:
    branches: ["main", "release/initial-v1", "release/debut"]
  workflow_dispatch:

jobs:
  gitleaks:
    name: 🔒 gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run gitleaks (CLI)
        run: |
          # gitleaks-action@v2 input schema changed (args no longer valid);
          # use the CLI directly with our allowlist config.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
            ./gitleaks detect --source . --redact --verbose --config .gitleaks.toml --baseline-path .gitleaksignore --log-opts="--all"

  trufflehog:
    name: 🐷 trufflehog (verified only)
    runs-on: ubuntu-latest
    # Only meaningful on PRs (diff scan); on push base==head → action errors.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: trufflehog filesystem scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.head_ref }}
          extra_args: --only-verified

  c3-mirror:
    name: 🪞 C3 mirror (local scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: C3 plant test (must catch planted sk- in /tmp)
        run: |
          # Generate a RANDOM fixture (never committed, never allowlisted) —
          # the plant test must FAIL (exit 1) to prove the scanner catches
          # real patterns. The allowlist in ci_secret_scan.py only covers the
          # static fixture string that appears in THIS workflow file.
          FIXTURE="sk-planted$(date +%s%N)abcdefghijklmnopqrstuvwxyz"
          echo "$FIXTURE" > /tmp/sk-test
          set +e
          python3 scripts/ci_secret_scan.py /tmp/sk-test
          status=$?
          set -e
          if [ $status -ne 1 ]; then
            echo "❌ C3 MIRROR FAILED: did not catch planted sk- fixture"
            exit 1
          fi
          echo "✅ C3 mirror caught planted sk- fixture (expected)"

      - name: C3 full repo scan
        run: |
          # Scan tracked files only (fast, focused on committed code)
          #
          # NUL-delimited on BOTH sides. `git ls-files | xargs` splits on
          # whitespace, so any tracked filename containing a space was
          # fragmented into non-existent paths and each fragment was reported
          # as a READ_ERROR finding (11 spaced files -> 33 findings, PR #5,
          # 2026-10-03). `-z` + `-0` passes each path verbatim so the real
          # files are scanned instead of their fragments.
          set +e
          git ls-files -z | xargs -0 python3 scripts/ci_secret_scan.py
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "❌ C3 FULL SCAN FAILED"
            exit 1
          fi
          echo "✅ C3 full repo scan clean"
