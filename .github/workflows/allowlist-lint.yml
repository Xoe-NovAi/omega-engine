# .github/workflows/allowlist-lint.yml
# 🔱 Allowlist Lint — PR-only structural validation of PUBLIC_ALLOWLIST.txt.
# Per R_VAULT_COPILOT_20260827 §1.2 Area 8 + R_VAULT_COPILOT_ROUND3_20260827 §1.3.
# Per M23: this is the structural companion to allowlist-check.yml (which validates
#          the *applied* tree). This file validates the *file itself*.
#
# M23 fail-closed: errors block merge. Warnings are informational only.

name: Allowlist Lint

on:
  pull_request:
    paths:
      - "docs/strategy/PUBLIC_ALLOWLIST.txt"
      - ".github/workflows/allowlist-*.yml"
      - "scripts/apply_public_allowlist.sh"
  push:
    branches: [main, release/debut]
    paths:
      - "docs/strategy/PUBLIC_ALLOWLIST.txt"

permissions:
  contents: read

concurrency:
  group: allowlist-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Allowlist structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify required sections present
        run: |
          FAIL=0
          for section in "## ✅ ALLOW" "## 🚫 FORGE" "## ⚠️ Explicit Exclusions"; do
            if ! grep -qF "$section" docs/strategy/PUBLIC_ALLOWLIST.txt; then
              echo "::error file=docs/strategy/PUBLIC_ALLOWLIST.txt::Missing required section: $section"
              FAIL=1
            fi
          done
          if [[ $FAIL -eq 1 ]]; then
            exit 1
          fi
          echo "✅ All required sections present"

      - name: Verify ALLOW section is non-empty
        run: |
          # Count non-comment, non-blank, non-fence lines in the ALLOW section
          ALLOW_LINES=$(awk '/^## ✅ ALLOW/,/^## 🚫 FORGE/' \
            docs/strategy/PUBLIC_ALLOWLIST.txt \
            | grep -vE '^\s*(#|$|```)' \
            | wc -l)
          if [[ "$ALLOW_LINES" -lt 5 ]]; then
            echo "::error file=docs/strategy/PUBLIC_ALLOWLIST.txt::ALLOW section has only $ALLOW_LINES pattern(s); expected ≥5. Empty allowlist is a sovereignty violation."
            exit 1
          fi
          echo "✅ ALLOW section has $ALLOW_LINES pattern(s)"

      - name: Detect ALLOW→FORGE drift (debut surface shrink)
        # If a path was in ALLOW and is now in FORGE, that is the debut
        # surface shrinking. Likely deliberate removal but worth human review.
        run: |
          if git diff --name-only origin/main..HEAD 2>/dev/null | grep -q "PUBLIC_ALLOWLIST.txt"; then
            PREV=$(mktemp); CURR=$(mktemp)
            git show origin/main:docs/strategy/PUBLIC_ALLOWLIST.txt 2>/dev/null \
              | awk '/^## ✅ ALLOW/,/^## 🚫 FORGE/' | sort -u > "$PREV" || true
            awk '/^## ✅ ALLOW/,/^## 🚫 FORGE/' \
              docs/strategy/PUBLIC_ALLOWLIST.txt | sort -u > "$CURR"
            if [[ -s "$PREV" ]] && diff "$PREV" "$CURR" | grep -q '^<'; then
              echo "::warning::ALLOW section shrank. Reviewer, please confirm the removed path(s) are intended (likely dropping a feature from debut)."
              diff "$PREV" "$CURR" | grep '^<' | head -20
            fi
          fi

      - name: Detect FORGE→ALLOW drift (debut surface expansion)
        # If a path was in FORGE and is now in ALLOW, that is the surface
        # expanding. It is a real change, but it is *informational*, not a
        # gate. We log it; humans review in the PR.
        run: |
          if git diff --name-only origin/main..HEAD 2>/dev/null | grep -q "PUBLIC_ALLOWLIST.txt"; then
            PREV=$(mktemp); CURR=$(mktemp)
            git show origin/main:docs/strategy/PUBLIC_ALLOWLIST.txt 2>/dev/null \
              | awk '/^## ✅ ALLOW/,/^## 🚫 FORGE/' | sort -u > "$PREV" || true
            awk '/^## ✅ ALLOW/,/^## 🚫 FORGE/' \
              docs/strategy/PUBLIC_ALLOWLIST.txt | sort -u > "$CURR"
            if [[ -s "$PREV" ]] && diff "$PREV" "$CURR" | grep -q '^>'; then
              echo "::notice::ALLOW section grew. Reviewer, please confirm the new path(s) are intentional for public debut."
              diff "$PREV" "$CURR" | grep '^>' | head -20
            fi
          fi

      - name: Validate glob syntax (call apply_public_allowlist.sh --strict)
        run: |
          if [[ ! -f scripts/apply_public_allowlist.sh ]]; then
            echo "::error::scripts/apply_public_allowlist.sh is missing. The cut-tool is required for allowlist validation."
            exit 1
          fi
          chmod +x scripts/apply_public_allowlist.sh
          if ! bash scripts/apply_public_allowlist.sh --strict --summary >/dev/null 2>&1; then
            echo "::error::Allowlist contains malformed patterns (--strict failed)"
            bash scripts/apply_public_allowlist.sh --strict --summary || true
            exit 1
          fi
          echo "✅ All glob patterns parse cleanly"

      - name: Summary
        if: always()
        run: |
          echo "### Allowlist Lint Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required sections: 3/3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Glob validation: pass" >> "$GITHUB_STEP_SUMMARY"
