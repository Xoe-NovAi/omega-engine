# 🔱 Omega Engine — Release Workflow
# ⬡ OMEGA ⬡ PROMETHEUS ⬡ github-actions ⬡ trc_release ⬡ v1.0.0
#
# Triggers on: tag push (v*.*.*)
# Runs: temple-grade, builds artifacts, creates GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: 🏷️ Release v${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create and activate virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli,dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Temple-Grade validation
        run: |
          make temple-grade

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION=${{ steps.version.outputs.version }}
          awk -v v="$VERSION" '
            /^## \[v/ { in_section=0 }
            $0 ~ "\\[" v "\\]" { in_section=1 }
            in_section { print }
          ' CHANGELOG.md > release_notes.md || echo "No changelog section found" > release_notes.md

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Omega Engine ${{ github.ref }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify install
        run: |
          pip install dist/*.whl
          OMEGA_PROVIDER=mock omega talk "Release verification: hello from ${{ github.ref }}"

