# 🔱 Omega Engine — Release Workflow
# ⬡ OMEGA ⬡ PROMETHEUS ⬡ github-actions ⬡ trc_release ⬡ v1.1.0
#
# Triggers on: tag push (v*.*.*)
# Runs: temple-grade, version consistency, changelog gate, clean build,
#       wheel content gate, creates GitHub Release, clean-env verification

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: 🏷️ Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create and activate virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli,dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Temple-Grade validation
        run: |
          make temple-grade require_clean=1 HUB_IMPORT_MODE=pristine

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: G9 — Version consistency (tag == pyproject == CHANGELOG)
        run: |
          .venv/bin/python scripts/check_version_consistency.py \
            --tag "${{ github.ref_name }}" \
            --pyproject pyproject.toml \
            --changelog CHANGELOG.md

      - name: G8 — Fail-closed CHANGELOG section gate
        run: |
          .venv/bin/python scripts/check_release_changelog.py \
            --tag "${{ github.ref_name }}" \
            --changelog CHANGELOG.md \
            --out release_notes.md

      - name: Clean build directories
        run: |
          rm -rf build dist src/*.egg-info

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          # Build BOTH artifacts. This step previously ran `--wheel` only, while
          # the release step below attaches `dist/*.whl dist/*.tar.gz`; with no
          # sdist present, the glob had no matches and `gh release create` died
          # with "no matches found for dist/*.tar.gz" after every content gate
          # had already passed. `python -m build` with no flags builds both.
          python -m build --sdist --wheel

      - name: G10 — Wheel content gate
        run: |
          .venv/bin/python scripts/check_wheel_contents.py \
            --wheel dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deterministic release creation (replaces softprops/action-gh-release,
          # whose retry logic created duplicate drafts for a moved tag and then
          # failed finalizing with 'already_exists'). Self-healing: remove any
          # stale release for this tag first. The tag itself is never touched.
          gh release delete "${{ github.ref_name }}" -y || true
          # PEP 440 prerelease detection: a shell glob for '*-alpha*' does NOT match
          # the canonical PEP 440 alpha tag (v1.6.0a0 / v1.6.0a1), which would publish
          # an alpha as a full 'latest' release. packaging.version is authoritative.
          if python -c "
          import sys, packaging.version as pv
          sys.exit(0 if pv.Version('${{ steps.version.outputs.version }}').is_prerelease else 1)
          "; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            $PRERELEASE \
            --title "Omega Engine ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            dist/*.whl dist/*.tar.gz

      - name: G11 — Clean-environment artifact verification
        # Smoke command MUST exercise the full cold-start config surface.
        # 'omega list-entities' only instantiates EntityRegistry and prints a
        # table — it never loads capability_matrix.py, embedding_strategy.py,
        # models.yaml, provider_capabilities.yaml or providers.yaml, which are
        # exactly the startup configs that broke the previous release twice.
        # G11 can therefore pass while the README flagship command crashes.
        env:
          OMEGA_PROVIDER: mock
        run: |
          .venv/bin/python scripts/verify_artifact_clean_env.py \
            --wheel dist/*.whl \
            --repo-root ${{ github.workspace }} \
            --smoke-cmd "omega talk \"hello\""