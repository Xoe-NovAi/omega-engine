# 🔱 Omega Engine — Release Workflow
# ⬡ OMEGA ⬡ PROMETHEUS ⬡ github-actions ⬡ trc_release ⬡ v1.1.0
#
# Triggers on: tag push (v*.*.*)
# Runs: temple-grade, version consistency, changelog gate, clean build,
#       wheel content gate, creates GitHub Release, clean-env verification

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: 🏷️ Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Pre-flight — release-critical scripts present (fail closed)
        # [RELEASE-HARDENING P1 / D2] Derive the required set from this workflow
        # plus Makefile RECIPES (one source of truth): any newly-added script
        # invocation is checked automatically. Three dev-only probe/observe refs
        # are stale targets that do not exist in the source tree and are never
        # on the release path; excluded explicitly so they cannot block a cut.
        run: |
          set -euo pipefail
          mapfile -t REQUIRED < <(
            { cat .github/workflows/release.yml; grep -P '^\t' Makefile; } \
              | grep -oE 'scripts/[A-Za-z0-9_./-]+\.(py|sh)' | sort -u
          )
          DEAD=(scripts/network_metrics.sh scripts/observe-build.sh scripts/probe_free_models.sh)
          MISSING=0
          for s in "${REQUIRED[@]}"; do
            skip=0
            for d in "${DEAD[@]}"; do
              if [[ "$s" == "$d" && ! -f "$d" ]]; then skip=1; fi
            done
            [[ "$skip" -eq 1 ]] && continue
            if [[ ! -f "$s" ]]; then
              echo "FATAL: release-critical script missing from cut: $s" >&2
              MISSING=1
            fi
          done
          if [[ "$MISSING" -ne 0 ]]; then
            echo "FATAL: curated cut omitted scripts required by CI — refusing to release." >&2
            exit 1
          fi
          echo "OK: all workflow/Makefile script references resolve ($((${#REQUIRED[@]} - 3)) required; 3 dead dev refs excluded)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create and activate virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli,dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Temple-Grade validation
        run: |
          make temple-grade require_clean=1 HUB_IMPORT_MODE=pristine

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: G9 — Version consistency (tag == pyproject == CHANGELOG)
        run: |
          .venv/bin/python scripts/check_version_consistency.py \
            --tag "${{ github.ref_name }}" \
            --pyproject pyproject.toml \
            --changelog CHANGELOG.md

      - name: G8 — Fail-closed CHANGELOG section gate
        run: |
          .venv/bin/python scripts/check_release_changelog.py \
            --tag "${{ github.ref_name }}" \
            --changelog CHANGELOG.md \
            --out release_notes.md

      - name: Clean build directories
        run: |
          rm -rf build dist src/*.egg-info

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          # Build BOTH artifacts. This step previously ran `--wheel` only, while
          # the release step below attaches `dist/*.whl dist/*.tar.gz`; with no
          # sdist present, the glob had no matches and `gh release create` died
          # with "no matches found for dist/*.tar.gz" after every content gate
          # had already passed. `python -m build` with no flags builds both.
          python -m build --sdist --wheel

      - name: G10 — Wheel content gate
        run: |
          .venv/bin/python scripts/check_wheel_contents.py \
            --wheel dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deterministic release creation (replaces softprops/action-gh-release,
          # whose retry logic created duplicate drafts for a moved tag and then
          # failed finalizing with 'already_exists'). Self-healing: remove any
          # stale release for this tag first. The tag itself is never touched.
          gh release delete "${{ github.ref_name }}" -y || true
          if [[ "${{ github.ref_name }}" == *-alpha* || "${{ github.ref_name }}" == *-beta* || "${{ github.ref_name }}" == *-rc* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            $PRERELEASE \
            --title "Omega Engine ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            dist/*.whl dist/*.tar.gz

      - name: G11 — Clean-environment artifact verification
        run: |
          .venv/bin/python scripts/verify_artifact_clean_env.py \
            --wheel dist/*.whl \
            --repo-root ${{ github.workspace }} \
            --smoke-cmd "omega list-entities"