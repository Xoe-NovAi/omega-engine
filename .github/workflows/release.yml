# 🔱 Omega Engine — Release Workflow
# ⬡ OMEGA ⬡ PROMETHEUS ⬡ github-actions ⬡ trc_release ⬡ v1.0.0
#
# Triggers on: tag push (v*.*.*)
# Runs: temple-grade, builds artifacts, creates GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: 🏷️ Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create and activate virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli,dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Temple-Grade validation
        run: |
          make temple-grade require_clean=1 HUB_IMPORT_MODE=pristine

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION=${{ steps.version.outputs.version }}
          awk -v v="$VERSION" '
            /^## \[v/ { in_section=0 }
            $0 ~ "\\[" v "\\]" { in_section=1 }
            in_section { print }
          ' CHANGELOG.md > release_notes.md || echo "No changelog section found" > release_notes.md

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deterministic release creation (replaces softprops/action-gh-release,
          # whose retry logic created duplicate drafts for a moved tag and then
          # failed finalizing with 'already_exists'). Self-healing: remove any
          # stale release for this tag first. The tag itself is never touched.
          gh release delete "${{ github.ref_name }}" -y || true
          if [[ "${{ github.ref_name }}" == *-alpha* || "${{ github.ref_name }}" == *-beta* || "${{ github.ref_name }}" == *-rc* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            $PRERELEASE \
            --title "Omega Engine ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            dist/*.whl dist/*.tar.gz

      - name: Verify install
        run: |
          pip install dist/*.whl
          OMEGA_PROVIDER=mock omega talk "Release verification: hello from ${{ github.ref_name }}"

