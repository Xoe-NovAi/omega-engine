name: CI

on:
  push:
    branches: [ "main", "release/initial-v1" ]
  pull_request:
    branches: [ "main", "release/initial-v1" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create and activate virtualenv (M24 Venv Sovereignty)
      run: |
        python -m venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    - name: Install dependencies into venv
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest anyio pyyaml ruff reuse
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure the omega package and dev tooling are importable in venv
        pip install -e ".[cli,dev]"
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: REUSE Compliance (M37 — SPDX headers)
      run: |
        # Verify all files have SPDX-FileCopyrightText and SPDX-License-Identifier
        # M37 mandates REUSE v3.3 compliance for heritage tracking
        reuse --version
        reuse lint
        
    - name: Mandate Compliance (Makefile gates — M1, M7, M8, M9, M23)
      run: |
        make check-mandates

    - name: Temple-Grade (full release gate)
      # D-620: require_clean=1 — CI checks out a clean tree, so the import gate
      # must describe HEAD exactly. With an overlay it could pass on code that
      # does not exist in the commit being gated.
      run: |
        make temple-grade require_clean=1 HUB_IMPORT_MODE=pristine

    - name: Test with pytest (Mock Mode)
      env:
        OMEGA_ENV: test
      run: |
        pytest tests/ -v

    - name: Omega Doc Lint
      run: |
        chmod +x scripts/ci_check_docs.sh
        ./scripts/ci_check_docs.sh
