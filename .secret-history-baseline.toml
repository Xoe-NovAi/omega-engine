# Audited secret-history baseline. D-629.
#
# WHY this file exists
#   scripts/check_secret_history.py scans every durable ref for credential-shaped
#   strings, hashes each distinct token (sha256, first 16 hex) and compares the hash
#   to this file. No secret material is stored here -- only hashes -- so the baseline
#   can be reviewed and shipped publicly. An un-audited token fails the gate.
#
# HOW THIS FILE WAS BUILT (anti-fabrication)
#   Every sha256_16 below was emitted by scripts/check_secret_history.py's own
#   token_hash() over a token its own scan_history() actually matched in a durable
#   ref. No digest was hand-written. A prior attempt fabricated digests
#   (a1b2c3d4e5f67890, ...); that file was quarantined at
#   /tmp/opencode/quarantine/secret-history-baseline.FABRICATED.toml and is NOT this file.
#   Regenerate/verify with: python3 scripts/check_secret_history.py
#
# DISPOSITIONS
#   retained-public / template / false-positive -> may appear in the working tree.
#   revoked / purged                           -> MUST NOT appear in the working tree;
#                                                  the gate hard-fails if it does.
#
# D-629 TAILSCALE
#   This baseline previously had NO Tailscale pattern in the checker, so a real
#   Tailscale auth key shipped through a gate that was, by construction, blind to
#   Tailscale. PATTERNS now matches tskey-(auth|client|api)-... .
#
# REVIEW CAVEAT (2 entries need a human decision)
#   ts-db3a33 : a REAL Tailscale auth key. Rotation is operator-attested, NOT verified
#               by this gate. Confirm revocation in the Tailscale admin console.
#   fc-41fb17 / fc-b61113 : recorded in the 2026-09-25 baseline as "revoked Firecrawl
#               API keys" on the strength of the 'fc-' prefix. Literal inspection shows
#               both are UUID fragments (a callID and a filesystem path). They are
#               recorded here as false-positive rather than revoked; if the original
#               auditor had out-of-band evidence of real keys, re-mark them 'revoked'.

