# Audited secret-history baseline.
#
# WHY this file exists
#   `make gate-secrets` scans every durable ref for credential-shaped strings.
#   History contains 6 such strings (40 commit matches). All 6 were reviewed
#   and dispositioned below. The previous gate could express no disposition at
#   all: it failed on any non-zero count, so it failed on history the project
#   had already audited — while gitleaks passed the same findings via
#   `.gitleaksignore`. The gate was structurally unpassable.
#
# HOW it works
#   scripts/check_secret_history.py extracts each distinct token from durable
#   refs, hashes it (sha256, first 16 hex chars) and compares the hash to this
#   file. NO secret material is stored here — only hashes, so the baseline can
#   be reviewed and shipped publicly. A new, changed, or un-audited token fails
#   the gate and must be audited here (or the history purged).
#
#   A token with disposition "revoked" may additionally NEVER reappear in the
#   working tree; the checker fails if it does. That closes the loop between
#   "we rotated it" and "we did not paste it back into a tracked file".
#
# Review any addition with: a rotated/revoked credential, or an inert
# key-shaped string. Do not add a disposition to silence a scanner.

schema = 1
audited_on = "2026-09-25"
audited_by = "KALI/Cline — public Alpha release review"

