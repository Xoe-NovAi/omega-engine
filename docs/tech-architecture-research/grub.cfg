# /EFI/BOOT/grub.cfg -- ASUS ExpertBook P1503CVA / Ubuntu 26.04.1 / Secure Boot
# Rebuilt: chainload-first, ASCII-only (no smart quotes), no duplicated boot logic.
# Regenerate this file with a plain-text editor only -- do not paste through
# any tool that auto-converts straight quotes (") to curly quotes (" ").

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search
insmod search_fs_file
insmod search_label
insmod chain
insmod configfile
insmod linux
insmod echo
insmod normal

set timeout=15
set default=0

# --- 1. PRIMARY: chainload into Canonical's own tested grub.cfg ---
# This reuses the exact boot stanza that already works when the ISO boots
# natively (see section 5 of the briefing) instead of re-deriving it by hand.
menuentry "Ubuntu 26.04.1 Live (chainload native grub.cfg)" {
    insmod iso9660
    search --no-floppy --set=root --file /casper/vmlinuz
    echo "root resolved to: ${root}"
    configfile /boot/grub/grub.cfg
}

# --- 2. FALLBACK: manual boot, stock kernel params only ---
# iso-scan/filename and layerfs-path removed: those target the
# ISO-sitting-on-a-filesystem (loopback) case, not a dd'd raw partition.
# Add layerfs-path=<name> back only if you confirm the exact squashfs
# filename via `ls (hd0,gpt1)/casper/` and casper still can't find rootfs.
menuentry "Ubuntu 26.04.1 Live (manual, stock params)" {
    insmod iso9660
    search --no-floppy --set=root --file /casper/vmlinuz
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

# --- 3. CONTROL: direct device path, no search (isolates search vs linux) ---
menuentry "Ubuntu 26.04.1 Live (direct hd0,gpt1, no search)" {
    insmod iso9660
    set root=(hd0,gpt1)
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

# To reach a live command shell for diagnostics: press 'c' at this menu
# (do NOT use a menuentry for this -- shell access is a GRUB keybinding,
# not a bootable entry).
