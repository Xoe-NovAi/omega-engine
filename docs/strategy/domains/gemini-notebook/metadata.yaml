---

domain: "gemini-notebook"
display_name: "Gemini Notebook (Free-tier Research)"
version: "2.0"
description: "Free-tier-only Gemini Notebook domain for source-grounded research synthesis. 3 accounts, 30 DR/month, 2-notebook architecture (Active Research + Knowledge Base)."

# Free-tier constraints
accounts: 3
dr_per_month_per_account: 10
dr_per_month_total: 30
cost_model: "free_tier_only"
no_pro_accounts: true

# Notebook architecture
notebooks:
  - name: "Ω-ACTIVE-RESEARCH"
    purpose: "Active research questions, gap analysis, synthesis"
    source_limit: 50
    target_sources: 25
    key_labels: ["RESEARCH", "GAP-ANALYSIS", "SYNTHESIS", "ACTION-ITEMS"]
  - name: "Ω-KNOWLEDGE-BASE"
    purpose: "Curated knowledge, reference docs, distilled principles"
    source_limit: 50
    target_sources: 25
    key_labels: ["REFERENCE", "PRINCIPLES", "LESSONS", "ARCHIVE"]

# Token density (validated by NLG-B)
token_density:
  sweet_spot: "5-25"
  max_sources_per_notebook: 50
  words_per_source: 500000

# Automation
automation:
  tool: "notebooklm-py[mcp]"
  transport: "stdio"
  deep_research_trigger: "source add-research --mode deep"
  export_format: "markdown"
  auth: "master_token.json + RotateCookies"
  profile_isolation: true

# SDP Integration
sdp:
  gate: "§10 — Honor manual study phase (10 executions + ledger)"
  distillation_model: "qwen3-1.7b"
  output: "proposed_lessons.yaml"
  scribe_handoff: true

# Sovereign boundaries
mandates:
  - "M7 Local-First: Research only, never production inference"
  - "M8 Zero Telemetry: Google telemetry treated as advisory"
  - "M23 Failure Integrity: Verify all claims, no soft failures"

# ToS risk mitigation
tos_mitigation:
  dedicated_ip_per_account: true
  isolated_profile_per_account: true
  staggered_scheduling: true
  backoff_jitter: true
  no_bot_account_creation: true

# Provenance
provenance:
  arbitration: ["D-582", "D-583"]
  research: ["NLG-A", "NLG-B", "NLG-C"]
  supersedes: ["D-572", "D-573", "D-574"]