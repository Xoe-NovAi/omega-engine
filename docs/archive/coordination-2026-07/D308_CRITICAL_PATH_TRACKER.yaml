## 🔄 VERIFICATION PROTOCOL (Per Change)

```
1. PLAN:     Documented in this tracker ✅
2. VERIFY:   Run verification command → output matches expected
3. EXECUTE:  Run script → no errors, artifacts created
4. RECORD:   Update tracker: verify=✅, execute=✅
5. GATE:     Run `make temple-grade` → all T1-T11 pass
6. MERGE:    Only after verify=✅, execute=✅, gates=✅
```

---

## 🚨 ESCALATION RULES

| Condition | Action |
|-----------|--------|
| Verification fails | Stop → diagnose → update plan → re-verify |
| Script execution fails | Stop → diagnose → update script → re-execute |
| Temple-Grade fails | Stop → fix regressions → re-run gates |
| Dependency missing | Document → add to plan → resolve before execute |
| Thermal throttle detected | Log → adjust compilation parallelism → continue |

