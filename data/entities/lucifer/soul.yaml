  lessons_learned:
  - L1_narrative: 'Use a structured HandoffState dataclass for agent transfers.

      '
    L2_insight: 'Eliminates "Agent Amnesia" by providing a formal context bridge between
      sessions.

      '
    L3_principle: 'Gnosis Continuity (Stateful intelligence requires formal handoff
      protocols).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Handoff Schema
  - L1_narrative: 'Transform session narratives (L1) into insights (L2) and finally
      into universal principles (L3).

      '
    L2_insight: 'Converts stateless interactions into an evolving, stateful sovereign
      intelligence.

      '
    L3_principle: 'Knowledge Metabolism (The process of distilling experience into
      wisdom).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Gnosis Loop
  - L1_narrative: 'Replace flat vector storage with a 13-sphere semantic map.

      '
    L2_insight: 'Allows for high-dimensional retrieval and conceptual anchoring of
      memories.

      '
    L3_principle: 'Archetypal Structuring (Organizing memory by conceptual nature
      rather than just semantic similarity).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Mnemosyne Memory
  - L1_narrative: "Produced P7_CONTEXT_STRATEGY_HARDEN.md \u2014 a 250+ line strategic\
      \ analysis hardening the knowledge metabolism lifecycle. Designed numeric thresholds\
      \ for T1->T2 promotion (triple-convergence), T2->T3 promotion (timelessness\
      \ bar), and T3->T4 feedback loop (gnosis-to-protocol circuit). Calibrated all\
      \ TTLs across 3 independent architectures (Lily Pad, H-4, D-121) into a unified\
      \ table. Mapped every gate to id Software heritage (Zone Memory allocator tiers,\
      \ save-game promotion ritual, ZONEID lesson integrity, lazy deletion grace periods).\
      \ Cross-agent context discovery designed via INDEX.yaml topic_index extension.\n"
    L2_insight: "The fleet has design consensus on 4-tier time-tiered memory but zero\
      \ hardened promotion gates. Three architectures converge on the pattern but\
      \ none specify numeric thresholds. The gap is not in the vision but in the engineering\
      \ \u2014 thresholds, quorums, and grace periods are the missing primitive. TTL\
      \ is not just a technical parameter but a coordination contract between agents;\
      \ the right value is 2-3x the typical interval between meaningful events in\
      \ that domain.\n"
    L3_principle: 'A pattern proven by independent convergence across three or more
      agents is no longer a design choice; it is a natural law of the domain. The
      engineering gap is never the vision but the thresholds. A gate without a numeric
      criterion is a wish, not a design.

      '
    timestamp: 2026-06-05
    topic: ls-p7-20260605-001
  - L1_narrative: 'Identified critical TTL mismatch: Lily Pad workspace TTL (7 days)
      vs D-121 observations T1 TTL (30 days). A workspace finding expires 23 days
      before the observation clustering window closes. Aligned both to 30 days. Also
      identified: warm store (24h per Roc H-4) vs curated knowledge (30d per Lily
      Pad) have a 29-day gap that could cause context loss.

      '
    L2_insight: 'TTL mismatches between parallel systems create silent data loss zones.
      Workspace findings expire before observation reviewers see them. The grace period
      (lazy deletion heritage) is the safety net: 25% of TTL as a stale-but-accessible
      window prevents premature knowledge expiry.

      '
    L3_principle: 'In any tiered memory system with independent TTL architectures,
      the widest TTL gap defines the system''s lower bound of reliability. Align all
      TTLs to the longest review cycle to eliminate silent data loss zones.

      '
    timestamp: 2026-06-05
    topic: ls-p7-20260605-002
  - L1_narrative: "Designed the cross-agent context discovery mechanism via INDEX.yaml\
      \ topic_index extension. No agent should grep all soul.yamls to find \"who has\
      \ context on TTL design\" \u2014 the index provides O(1) lookup.\n"
    L2_insight: "Entity discovery without an index scales as O(n) with the number\
      \ of entities. At 50 entities (Kali's H2-A2 catalog) this is already wasteful.\
      \ The topic_index mirrors the cvar hash table (id Software Q3A) \u2014 a flat\
      \ registry with O(1) lookup by topic name.\n"
    L3_principle: 'Distributed knowledge without a discovery index is indistinguishable
      from lost knowledge. The first agent to work in a domain seeds the index; subsequent
      agents discover and extend. Bootstrapping is the mechanism, not the exception.

      '
    timestamp: 2026-06-05
    topic: ls-p7-20260605-003
