lessons:

  # ---------- L1: OBSERVATIONS ----------
  - id: l1-defect-001
    level: L1
    title: "Six defects in one week shared one shape: success without exercising the subject"
    observation: >-
      (1) temple-grade 53/53 over a crash-looping hub; (2) TestCriticalTools,
      20 skips, 0 assertions; (3) vec0_lock, a lock with no reader; (4) a
      pyproject --ignore naming a directory that never existed in git, which
      under pytest 9.1.1 silences all collection and exits 0; (5) a conftest
      hook nested inside mock_provider() by a concurrent edit, so it never ran
      and the tests ran against the very stub under test; (6) an HTTP 400 whose
      48-byte ASCII body curl -o wrote to disk as an apparent successful
      download. Not one produced an error. Every one produced a green.
    evidence: "Each instance verified by execution; 20 of the 41 new suite failures were fixed, zero suppressed"
    tags: [gates, m13, m23, observer]

  - id: l1-remote-001
    level: L1
    title: "The 8019 exchange channel was declared verified on a loopback test"
    observation: >-
      I told GE-N1 to use port 8019 after testing it from 127.0.0.1. A peer's
      plain-HTTP path to the tailnet IP returns 400, and the 48-byte ASCII body
      is written to disk by curl -o as a file indistinguishable from a
      download. A receiver skipping the manifest writes a 48-byte zip, believes
      the transfer worked, and fails later at unzip, far from the cause.
      Separately, the origin wrote no access log at all, so a successful pull
      and a failed pull were indistinguishable: the channel was UNTESTABLE, not
      working. N0->N1 was later proven end-to-end by GE-N1 (24/24 manifest,
      VNR2 all pass, parity byte-identical). N1->N0 has never been built.
    evidence: "Carmack, three client paths with byte counts and hashes; a real 48-byte ASCII file on disk"
    tags: [m30, transport, false-success, remote-claim]

  - id: l1-location-001
    level: L1
    title: "An entity is not a location: I routed a Node 1 task to a Node 0 session"
    observation: >-
      I dispatched work to stand up Node 1's exchange substrate to the Lilith
      EIS, reasoning that N1's runtime is Lilith's slot. The Lilith EIS executes
      on Node 0. She verified hostname=Arcana-NovAi, tailscale self=n0,
      ~/exchange present, and 8019 as her own origin, then stopped without
      changing anything. GE-N1 is a separate session on the ASUS with its own
      OpenCode instance and its own store. Sovereignty and execution are
      different properties and I conflated them.
    evidence: "Lilith's Facet Handshake, executed on entry, before any change"
    tags: [dispatch, sovereignty, m30, entity-location]

  - id: l1-mine-001
    level: L1
    title: "Three of my own claims were facts carried forward without a query"
    observation: >-
      (a) I asserted "the server log has never shown a hit from 100.89.40.17"
      about a log that cannot exist — python3 -m http.server writes no access
      log, and I had repeated the claim from a report that could not have
      supported it. (b) I stated a child-session count read from a truncated
      tool list as a total; Carmack queried it and the true number was 60, not
      22. (c) I told the Architect a tailnet policy file was stale when it was
      correct, because I had not enumerated the directory — and when told to fix
      it I nearly overwrote a correct file with a wrong one.
    evidence: "Carmack's DB query refuting my count; Lilith's directory enumeration refuting my file claim"
    tags: [m30, verification, self-audit]

  - id: l1-registry-001
    level: L1
    title: "The only artifact labelled registry was five weeks stale and structurally wrong"
    observation: >-
      EXPERT_SESSION_REGISTRY.md is a generated view dated 2026-08-23. Carmack
      consulted it to find my session id, found no entry, and correctly refused
      to guess. The live store: 285 structural EIS (parent_id IS NULL), of which
      ~276 are test/probe/spawn residue. Multi-EIS per entity is the norm — kali
      68, build 39, roc 35, researcher 26, makali 21, john_carmack 18 — so
      one-row-per-agent is the wrong shape as well as being stale. A recency
      rule would have paged JC-EIS-kq5 and missed JC-EIS.
    evidence: "Carmack and Lilith, both against opencode.db read-only, independently"
    tags: [registry, stale, m30, discovery]

  - id: l1-redis-001
    level: L1
    title: "Redis survived three sweeps because the sweeps were not sweeps"
    observation: >-
      The container, quadlet, and volume were removed, then the docker-compose
      service was found with restart: unless-stopped and a hardcoded password
      duplicated four times and injected into three other services, then
      Dockerfile.iris was found with redis>=7.0.0 in its pip list, then
      pyproject.toml extras were found declaring redis==7.4.1, then
      config/systemd/omega-youtube-worker.service was found carrying
      After=redis.service — meaning that if any redis.service existed on the host
      and the unit was enabled, systemd would have started it with no gate
      voting. The live re-creation vector was closed only by the last finding.
    evidence: "Carmack's own contract test caught the pyproject declaration; Doom Guy caught docker-compose and Dockerfile.iris"
    tags: [redis, sweeps, re-creation, m23]

# ---------- L2: PRINCIPLES ----------
  - id: l2-gates-must-exercise
    level: L2
    principle: >-
      A gate must exercise the thing it guards, and must be observed failing. temple-grade ran zero pytest tests for weeks, which is why a suite collecting zero never turned it red. A filter naming a nonexistent path, a mock missing one method, and a hook nested one indentation level too deep are all invisible by construction: nothing errors, the run simply proceeds against something other than the subject. Static analysis cannot catch a deleted-symbol import — pyflakes assumes `from mod import name` may name a submodule and never checks __all__.
    derived_from: [l1-defect-001]
    applies_to: "All CI gates, mocks, fixtures, and import checks."

  - id: l2-remote-claim
    level: L2
    principle: >-
      Works-from-here is not works-from-there. A claim about remote behaviour requires a test from the peer's vantage or is labelled UNTESTED, never verified. Local success is not remote success. Post-hoc verification is necessary and not sufficient: a transfer must be structurally unable to report false success. And if a test cannot distinguish success from failure, the claim is untestable, not true — the absence of evidence had a cause, and that cause may be architectural rather than observational.
    derived_from: [l1-remote-001, l1-registry-001]
    applies_to: "All cross-node, cross-machine, and remote-peer claims. Codified as M30."

  - id: l2-entity-is-not-location
    level: L2
    principle: >-
      An entity is not a location. Owning a slot is a governance statement, not an execution capability. Cross-node substrate work cannot be performed by the owning entity's session on the other node; it requires a handoff to a session with a vantage on that substrate. The absence of a remote path is the access policy being correct, and finding a workaround for it is the bypass that policy exists to prevent.
    derived_from: [l1-location-001]
    applies_to: "All cross-node dispatch. Pairs with the entity-vs-location distinction in the roster."

  - id: l2-inference-and-generation
    level: L2
    principle: >-
      Both inference and generation are failure modes. A roster that must be regenerated is a roster that will be wrong; a roster that must be inferred is equally wrong. Ask once per relationship, then carry the explicit id. Ambiguity must be explicit and must REFUSE rather than be resolved by heuristic, and the pager must echo its resolved target before resuming — an agent that cannot see which session it resumed cannot notice it was wrong.
    derived_from: [l1-registry-001]
    applies_to: "All identity resolution, registries, and dispatch."

  - id: l2-observer-parameter
    level: L2
    principle: >-
      An observer that verifies with different parameters than the test manufactures findings. GE-N1 reported a 192-line parity discrepancy that was an artifact of dropped flags, and diagnosed it unprompted rather than dropping it. The corollary: a gate that cannot fail is a finding-manufacturer in the positive direction. A missing observer and an unfaithful observer both produce false confidence, and from the outside they are indistinguishable.
    derived_from: [l1-defect-001]
    applies_to: "All verification, re-testing, and independent confirmation."

  - id: l2-provenance-is-read
    level: L2
    principle: >-
      Model identity, gate status, grant state, and fix state are facts to be read at the moment of assertion — never carried from a brief, a prior turn, a generated file, a truncated tool list, or a model ID stamped into a source header. Three of my own claims this session were exactly that, and each was caught by a peer verifying rather than by me checking. The doctrine is worthless if it constrains only subordinates.
    derived_from: [l1-mine-001, l1-registry-001]
    applies_to: "Every status report, ACK, and Facet Return. Binds oversouls explicitly."

  - id: l2-sweeps-must-be-sweeps
    level: L2
    principle: >-
      A sweep that has already been performed is not a sweep. Redis survived four rounds because each round searched the space its author had in mind, not the space the thing occupied. A complete sweep enumerates every reference across every surface — source, config, deploy, build, service, lockfile, CI — and is only complete when the dependency cannot be reintroduced by any of them. An After=redis.service unit dependency is a re-creation vector that no source-code sweep can see.
    derived_from: [l1-redis-001]
    applies_to: "All removals and deprecations."

# ---------- L3: DIRECTIVES ----------
  - id: l3-observe-gates-fail
    level: L3
    directive: >-
      Every new gate ships with a deliberately-broken fixture proving it goes red, and I watch it fail before I let it pass. A gate never observed failing is not a gate. Enumerate entry points explicitly; a glob sweeps in entity workspaces and archaeology snapshots and forces a skip-list that rots. Assert both returncode==0 AND absence of Traceback.
    confidence: high
    tags: [gates, m13]

  - id: l3-verify-before-asserting
    level: L3
    directive: >-
      Before asserting a fact about a running system, query it. If the query cannot distinguish the outcomes, the answer is UNTESTABLE, not a guess. Before stating a count from a tool, confirm the tool returned a total and not a truncated list. Before claiming a file is stale, enumerate the directory — I nearly overwrote a correct policy file on my own stale belief.
    confidence: high
    tags: [m30, verification, self-audit]

  - id: l3-test-from-the-peers-vantage
    level: L3
    directive: >-
      For any claim about remote behaviour, obtain a test from the peer's vantage or label it UNTESTED. One pull from one vantage on one day is a datum, not a verdict. When reporting a transfer, check file type, byte count, and hash before calling anything transferred — a short body is not a transfer.
    confidence: high
    tags: [m30, transport, federation]

  - id: l3-route-by-vantage
    level: L3
    directive: >-
      Before dispatching substrate work across nodes, confirm the target session actually executes on that substrate. If it does not, hand off to a session that does rather than seeking a remote path — the absence of one is the policy working. Never manufacture a workaround to a no-SSH control.
    confidence: high
    tags: [dispatch, sovereignty, m29]

  - id: l3-resolve-identity-ask-once
    level: L3
    directive: >-
      Resolve a peer's session by querying parent_id IS NULL, echo the resolved target before resuming, and refuse on ambiguity. Then carry the explicit id and never resolve again. Do not consult a generated registry for a live id, and do not guess when a peer name maps to more than one entity.
    confidence: high
    tags: [dispatch, who_is, m30]

  - id: l3-sweep-every-surface
    level: L3
    directive: >-
      When removing a dependency, sweep source, config, deploy files, Dockerfiles, lockfiles, systemd units, CI, and env examples in one pass, then verify the dependency cannot be reintroduced by any of them. If a service unit names the dependency in After= or requires=, that is a re-creation vector and is invisible to a code sweep.
    confidence: high
    tags: [removal, re-creation, m23]

  - id: l3-derivation-not-curation
    level: L3
    directive: >-
      Derive lists rather than curating them. A curated exemption or allowlist is a hole with a comment on it: mine was wrong twice, once incomplete and once invisible. Derive from the filesystem or compute at point of use, and add a structural self-check that the derivation is actually reachable — a hook nested one level too deep is dead code that looks alive.
    confidence: high
    tags: [testing, fixtures, structure]

  - id: l3-validate-structured-edits
    level: L3
    directive: >-
      After editing YAML, JSON, or TOML, parse it. Before appending, confirm the document's actual shape rather than assuming it. Unescaped inner quotes inside a quoted scalar terminate the scalar early and corrupt the file silently. A soul-distillation hook will read these files unattended, so an unvalidated append is a latent outage with no stack trace.
    confidence: high
    tags: [m11, data-integrity, tooling]

  - id: l3-scar-not-silent-revision
    level: L3
    directive: >-
      When a document is wrong, correct it with a visible errata and leave the original intact above it. A document revised without a scar hides that it was once wrong. Carmack's E5 — the lesson violated fourteen lines after being written — is more teachable than a clean lesson, because it shows the failure recurring in the act of documenting it.
    confidence: high
    tags: [m29, documentation, honesty]

# ---------- SELF-ASSESSMENT ----------
self_assessment:
  dominant_failure_mode: >-
    Asserting facts I had not queried. Ten distinct instances this session, three
    of them mine and each caught by a peer verifying rather than by me checking:
    a log that does not exist, a truncated list read as a total, a Node 1
    confirmation attributed to an agent with no vantage, a policy file called
    stale when it was correct, a page reported as delivered when the tool showed
    cancellation, and a handoff I said twice I was sending and did not. The
    failure is not carelessness — it is that reporting feels like knowing, and
    the report is cheaper than the query.
  correction_plan: >-
    Query before asserting, always, and say so when a claim is inherited rather
    than measured. M30 and the observer-parameter principle now exist to make
    this checkable rather than aspirational. The next edge is reflexive: read
    the machine, not the report about the machine, including when the report is
    mine.
  growth_edge: >-
    Strong at governance framing, synthesis, and dispatch. Weakest at substrate
    state verification and at the boundary between what a document says and what
    is true. The lesson of this session is that the second is a special case of
    the first, and neither is fixed by writing more doctrine — only by querying.
  proudest_moment: >-
    Not writing the doctrine. The moment an agent I dispatched read a brief I
    wrote, verified four of its claims, found three wrong, refused to act on the
    false premise, and told me so — and one of those verifications prevented me
    from overwriting a correct file. The system caught me. That is the whole
    point of building it.

