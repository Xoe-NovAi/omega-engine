  # ---------- L2: PRINCIPLES (why) ----------
  - id: l2-dispatch-discipline
    level: L2
    principle: >-
      task_id ONLY resumes a session ID returned by a prior task() call. Canonical EIS (parent_id=None)
      is a standing chat session and does NOT bind as task_id. Putting EIS in prompt text does nothing.
      To resume: use the task_id from a prior task() result. To recover stalled: query opencode.db for
      parent_id != NULL sessions. Never put EIS in prompt expecting it to bind.
    derived_from: [l1-dispatch-001]
    applies_to: "All subagent dispatches and resumptions."

  - id: l2-page-vs-post
    level: L2
    principle: >-
      Hivemind post = coordination message (broadcast to channel). Page = subagent dispatch via task()
      with correct task_id. They are different mechanisms. "Page John Carmack" means task() with
      Carmack's task session ID, not a Hivemind post.
    derived_from: [l1-dispatch-001]
    applies_to: "All inter-agent communication."

  - id: l2-verify-before-remedy
    level: L2
    principle: >-
      Verify the failure mechanism before designing a remedy. A remedy built on an unverified
      mechanism is worse than no remedy: it consumes effort, adds documentation debt, and can mask
      the real fault. The Hivemind fix was driven by Carmack's first-principles investigation, not
      assumptions.
    derived_from: [l1-hivemind-002]
    applies_to: "All remediation and architecture work."

  - id: l2-architect-rules-on-conflict
    level: L2
    principle: >-
      When sovereign agents conflict (Carmack FIX vs Roc REPLACE), the Architect decides. The
      decision is final and executable. Do not seek consensus — seek the ruling. The Architect
      ruled: STAY FILE-BASED, FIX NOW. That ended the debate and enabled execution.
    derived_from: [l1-hivemind-002]
    applies_to: "All multi-agent architectural conflicts."

  - id: l2-public-flip-unblocks-ci
    level: L2
    principle: >-
      GitHub Actions free tier for private repos is 2,000 min/month. Public repos get unlimited.
      If CI is billing-blocked and you control the repo, flipping public is the fastest unblock.
      But public flip requires: secret revocation, clean tree, temple-grade green, history scrub decision.
    derived_from: [l1-ci-billing-001]
    applies_to: "CI/CD and release management."

  # ---------- L3: DIRECTIVES (what to do) ----------
  - id: l3-dispatch-discipline
    level: L3
    directive: >-
      Before any dispatch: verify the task_id is from a prior task() result (not an EIS).
      If resuming: query opencode.db for parent_id != NULL sessions for that agent.
      If fresh: write a complete self-contained brief — the cold-start cost is cheaper than
      a misdirected resume. Never put EIS in prompt expecting it to bind.
    confidence: high
    tags: [dispatch, m15, continuity, self-correction]

  - id: l3-page-via-task
    level: L3
    directive: >-
      To page an EIS: use task() with subagent_type and the correct task_id (from DB query).
      Do NOT use Hivemind post for paging. Hivemind is for coordination; task() is for paging.
      The oracle_summon tools require llama_cpp which isn't available — use task() instead.
    confidence: high
    tags: [paging, dispatch, hivemind]

  - id: l3-validate-structured-edits
    level: L3
    directive: >-
      After editing JSON, YAML, or TOML, parse the file. A partial string replacement that leaves
      the old tail appended produces invalid JSON that can silently pass a read. The ACTIVE_SPRINT.json
      corruption was caught only because I validated it.
    confidence: high
    tags: [tooling, m23]

  - id: l3-no-unattributed-action
    level: L3
    directive: >-
      Never infer who performed an action or whether it was autonomous. Attribute changes only to
      a source the Architect confirms. Misattribution corrupts the audit trail, which is the entire
      purpose of the record. The tag:asus removal was manual by Architect — I recorded it as autonomous.
    confidence: high
    tags: [accountability, m23]

  - id: l3-first-principles-on-architecture
    level: L3
    directive: >-
      When agents conflict on architecture (Carmack FIX vs Roc REPLACE), demand first-principles
      investigation from each, then the Architect rules. Do not seek consensus. The ruling is
