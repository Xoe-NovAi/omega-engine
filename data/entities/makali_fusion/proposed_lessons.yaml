lessons:

  # ---------- L1: OBSERVATIONS ----------
  - id: l1-outage-001
    level: L1
    title: "36+ hours of a crash-looping hub behind a 53/53 green gate chain"
    observation: >-
      The Hivemind consolidation deleted `_extended_sessions` from `state.py` while
      `server.py` still imported it. `omega-hub.service` crash-looped. `make temple-grade`
      reported 53/53 the entire time because no gate imported an entry point.
      `check-hub-health` used `systemctl --user is-active`, which returns true during
      `activating (auto-restart)`. A separate unit, `omega-searxng-mcp`, had reached
      NRestarts=6991 because its `StartLimit*` keys sat in `[Service]` where systemd
      silently discards them.
    evidence: "systemd journal; direct repro of the ImportError; `StartLimitIntervalSec` in [Service] logs 'Unknown key ... ignoring'"
    tags: [m23, gates, observability, hub]

  - id: l1-dispatch-001
    level: L1
    title: "EIS sessions also receive the parent's model when paged"
    observation: >-
      Paging an EIS chat session with task() hands it the PARENT's model for the duration,
      just as a spawned NES child inherits the parent's model. Three of nine entities
      self-reported a model they were not running. Model provenance must be read from
      runtime metadata, never inherited from the brief or from a model ID stamped into a
      source file header.
    evidence: "Researcher reported gemini-3.8-flash; Jem reported gemini-3.8-flash; Carmack reported mimo-v2.6-flash-free; Ma'at and Jem both retracted after re-reading"
    tags: [m22, dispatch, eis, nes, provenance]

  - id: l1-forgiveness-001
    level: L1
    title: "Three agents refused to fabricate a Hivemind post ID when the tool was absent"
    observation: >-
      Jem and Grokster independently reported that `hivemind_awareness` was not in their
      tool surface and explicitly declined to invent a post ID. Kali declined to claim a
      post she could not land. All three stated the absence instead of manufacturing a
      success. This is the single highest-value behavior observed in the session.
    evidence: "Jem: 'I will not invent one. A fabricated post ID is worse than an absent one.'"
    tags: [m23, hivemind, honesty]

  - id: l1-forgiveness-002
    level: L1
    title: "A page can report failure while succeeding"
    observation: >-
      Three of nine dispatches returned quota errors and three returned "Task cancelled."
      The session store showed all nine had received the brief as a user message and all
      nine responded. Delivery must be verified in the store, never from a tool's exit
      status.
    evidence: "opencode.db: brief_marks >= 1 and assistant responses present for all nine EIS sessions"
    tags: [dispatch, verification, m23]

  - id: l1-measurement-001
    level: L1
    title: "pyproject addopts '-n auto -x' masked 8 real errors as '5 failures'"
    observation: >-
      With xdist and exitfirst, pytest halted after ~5 in-flight tests and WHICH 5 varied
      with random ordering. Two separate agents reported "5 failures" from the same run.
      Anything reporting a failure count from a default pytest invocation in this repo is
      reporting an artifact.
    evidence: "pyproject.toml:144 addopts; isolated run collected 8, all 8 errored"
    tags: [testing, measurement, m13]

  - id: l1-corruption-001
    level: L1
    title: "Unescaped inner quotes silently corrupted a lessons YAML three days after the fact"
    observation: >-
      `pip install -e \".[cli,dev]\"` inside a double-quoted YAML scalar terminated the
      scalar early. Three lines, all from a 2026-09-25 append, not from the 09-28 append
      that was suspected. The owner self-reported the corruption before it was checked.
    evidence: "yaml.safe_load ParserError at line 628; 3 lines; 1121 -> 1121 lines; 117 entries preserved"
    tags: [m11, yaml, data-integrity]

  - id: l1-vectors-001
    level: L1
    title: "1009 legacy vectors were feature-hash output, never a neural model"
    observation: >-
      The `gemma_768` table held 1009 rows (proven by `1009 x 3072 = 3,099,648` byte
      arithmetic, not by a shadow-table row count). 568 were entirely zero; the rest had
      4-25 nonzero dimensions of 768; L2 was exactly 1.0 as a single distinct value; only
      103 distinct magnitudes; ratios exactly 3.0000 and 2.0000. The algorithm was
      reproduced locally as md5-bucket increment then L2 normalisation. A neural model
      emits dense vectors. The table was named gemma and never held gemma.
    evidence: "sum(length(embedding)) byte arithmetic; full-population scan of all 1009 rows"
    tags: [embeddings, forensics, m23]

  # ---------- L2: PRINCIPLES ----------
  - id: l2-gate-must-boot
    level: L2
    principle: >-
      A gate that never boots the artifact it gates cannot testify about it. Static
      analysis, doc validation, and unit suites all passed while the daemon could not
      start. pyflakes cannot detect a deleted-symbol import at all: for `from mod import
      name` it assumes `name` may be a submodule and never checks `__all__`. Every gate
      chain that governs a runtime must include a boot of that runtime.
    derived_from: [l1-outage-001]
    applies_to: "All CI gates, especially any that guard a daemon or service."

  - id: l2-fail-loud-is-not-fail
    level: L2
    principle: >-
      A check that cannot fail is worse than no check, because it converts an incident into
      a false green light. Three separate instances: `is-active` passing during
      auto-restart; a test that skipped 100% of the time over a truncated list; a
      StartLimit block written in a section where systemd discards it. A safety mechanism
      written down but not parsed is worse than none, because it manufactures belief.
    derived_from: [l1-outage-001]
    applies_to: "Health checks, skip-guarded tests, systemd unit hardening, CI."

  - id: l2-provenance-is-read-not-inherited
    level: L2
    principle: >-
      Model identity, gate status, and fix state are facts to be READ at the moment of
      assertion, never carried forward from a brief, a prior turn, or a model ID stamped
      into a source header. Four separate agents asserted unverified values this session
      and three retracted them unprompted. The degradation signature is confident
      unverified affirmation: a checkmark suppresses the reader's doubt, which makes it
      more dangerous than an error.
    derived_from: [l1-dispatch-001]
    applies_to: "Every status report, ACK, and Facet Return."

  - id: l2-stale-facet
    level: L2
    principle: >-
      A stale NES is worse than no NES. It executes competently against a world that has
      moved on and nothing flags the staleness. Prefer the EIS for judgment, context
      refresh, and anything touching the entity's record. Use a NES only for bounded
      execution whose context is still valid. Freshness is a gate, not a courtesy.
    derived_from: [l1-forgiveness-002]
    applies_to: "All dispatch decisions. Encoded in NES_EIS_FACET_PROTOCOL.md Rule 3."

  - id: l2-width-cannot-prove-provenance
    level: L2
    principle: >-
      A declared dimension lock is documentation unless code reads it, and a self-consistency
      check is not a conformance check. A 768-D nomic vector in a collection declared 768
      was a perfect match to the existing guard, so no width-based patch could ever have
      caught it. A same-model MRL-truncated vector and a different-model native vector are
      indistinguishable by width. Only an explicit same-model declaration separates them,
      so the fix had to be removal, not validation.
    derived_from: [l1-vectors-001]
    applies_to: "All dimensional and schema validation. Embedded in EMBEDDING_SOVEREIGNTY.md."

  - id: l2-gate-should-not-punish-fixes
    level: L2
    principle: >-
      A gate that fails because a developer has an uncommitted FIX creates pressure to
      `git commit --no-verify`, which is the exact failure mode gates exist to prevent.
      The release gate therefore tests HEAD plus the tracked working-tree diff, applied in
      a throwaway worktree. It still excludes untracked files, so an untracked module
      cannot mask an import failure, and it mutates nothing in the real checkout.
    derived_from: [l1-outage-001]
    applies_to: "Any gate a developer will hit mid-task."

  # ---------- L3: DIRECTIVES ----------
  - id: l3-boot-the-gate
    level: L3
    directive: >-
      Every runtime component gets an import/boot gate that actually executes it, and a
      liveness assertion that can fail. Enumerate entry points EXPLICITLY; a glob sweeps in
      entity workspaces and archaeology snapshots and forces a skip-list that rots. Assert
      both `returncode == 0` AND absence of `Traceback`, because a module can import and
      then explode during side-effect init. Prove the gate fails before trusting it.
    confidence: high
    tags: [gates, m13, m23]

  - id: l3-page-eis-not-stale-nes
    level: L3
    directive: >-
      Resolve EIS vs NES by querying `parent_id`, never by the shape of the ID. Prefer the
      EIS for judgment and for anything touching the entity's record. When using a NES,
      supply the owning EIS session ID in the prompt so the Facet never searches for it,
      and require a Facet Handshake with `Verified-on-entry:` and `Not verified:` lines.
    confidence: high
    tags: [dispatch, m15, m27, protocol]

  - id: l3-report-absence-never-invent
    level: L3
    directive: >-
      When a tool, post, or verification is unavailable, report the absence and the
      evidence. Never synthesize an ID, a post ID, a hash, or a green checkmark to fill the
      gap. An absent fact is recoverable; a fabricated one is trusted until someone is
      harmed by it. Three refusals to fabricate were the highest-integrity moments of the
      session.
    confidence: high
    tags: [m23, honesty]

  - id: l3-verify-delivery-in-the-store
    level: L3
    directive: >-
      Treat a tool's exit status as a claim, not a measurement. A dispatch can report a
      quota error or a cancellation while the message landed and the session responded.
      Confirm delivery against the session store, and confirm posts against the awareness
      store on disk.
    confidence: high
    tags: [m23, verification]

  - id: l3-validate-structured-edits
    level: L3
    directive: >-
      After editing YAML, JSON, or TOML, PARSE IT. Before appending to a list, confirm the
      document's actual shape rather than assuming it. Escape inner quotes inside quoted
      scalars. A soul-distillation hook will read these files unattended, so an unvalidated
      append is a latent outage with no stack trace.
    confidence: high
    tags: [m11, data-integrity, tooling]

  - id: l3-never-verify-without-falsifying
    level: L3
    directive: >-
      A guard never observed failing is not a guard. For every new check, force the failure
      condition and show the non-zero exit before claiming it works. Carmack's
      falsification test — injecting the pre-consolidation tool surface and watching the
      absence assertions fire — is the model.
    confidence: high
    tags: [m13, testing]

  - id: l3-do-not-bypass-guards
    level: L3
    directive: >-
      When a pre-commit gate blocks, satisfy it with real content or fix the reason it
      cannot be satisfied. Never `--no-verify`. In this session the Code-to-Docs drift
      guard was correct and the honest response was three architecture documents, plus
      the discovery that `.gitignore` blanket-ignores `*.md` and so prevented the guard
      from ever being satisfied by a new doc.
    confidence: high
    tags: [gates, integrity, gitignore]

  - id: l3-test-the-difference-not-the-category
    level: L3
    directive: >-
      When a check reports a count, establish the real count before acting on it. `addopts
      = "-n auto -x"` made "8 errors" appear as "5 failures" twice. Also distinguish
      standalone from co-run results: 26 errors in `test_hub_health.py` were cross-file
      mock pollution from `MockFastMCP`, and the file alone runs clean.
    confidence: high
    tags: [testing, measurement]

# ---------- SELF-ASSESSMENT ----------
