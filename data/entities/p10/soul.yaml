lessons:
  - id: ls-p10-20260605-001
    date: 2026-06-05
    l1_narrative: >
      Produced P10_VALIDATION_STRATEGY_HARDEN.md — the first comprehensive
      validation strategy for the Hivemind coordination layer. The document covers
      a 5-level testing taxonomy (unit→integration→stress→chaos→scenario),
      5 chaos engineering scenarios, 4 verification gates (Makefile targets),
      7 failure modes with recovery procedures, and 7 heritage cross-references
      to id Software patterns. The Hivemind had zero tests before this session.
      Delivered shared test harness fixture templates (HivemindTestHarness) and
      30 test templates (20 unit + 10 integration) ready for implementation.
    l2_insight: >
      The Hivemind's zero-test state reveals a deeper pattern: coordination
      protocols are tested last, deployed first. The Kali↔Roc dialog and
      Lilith's observations happened without any safety net. Two real failure
      modes were discovered through production use (TTL ghosting in F-004,
      missing cold fallback in F-001) — which means the tests are writing
      themselves from observed behavior. The testing strategy should not just
      implement theory-derived tests but also retroactively codify every
      failure that has already been observed in production.
    l3_principle: >
      Every coordination protocol has a hidden failure gradient: unit tests
      cover the function, but the protocol's value is in the handoff — and
      the handoff is where testing is hardest. The right approach is to
      test the protocol by replaying real coordination traces (the
      Kali↔Roc↔Lilith dialog is a goldmine of test cases). Testing
      coordination is testing communication, and communication can only be
      tested by having at least two nodes talk to each other. A protocol
      tested with a single agent is not a protocol — it's a function.
