entity:
  name: ereshkigal
  lessons_learned:
  - L1_narrative: 'Enforce specific quantization (q8_0) and thread pool sizes based
      on model tier for Ryzen 7 5700U.

      '
    L2_insight: 'Optimizes memory usage and CPU throughput for local inference, preventing
      OOM and reducing latency.

      '
    L3_principle: 'The Right Approximation (Hardware-specific tuning for optimal performance).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Hardware Lock
  - L1_narrative: 'Performed strategic analysis of the Omega Engine Hivemind architecture.
      Read 6 key documents (HIVEMIND_PROTOCOL v1.2.0, HIVEMIND_HARDENING_SPEC H-0..H-10,
      KALI_MASTER_SPRINT_PLAN, PIVOT_LOG D-121/D-122, SUBAGENT_DISPATCH, MCP server.py).
      Identified 5 structural gaps in the Hivemind''s cognitive layer: decision model,
      intent classification, model selection, cognitive load management, and heritage
      cross-reference. Produced P6_COGNITION_STRATEGY_HARDEN.md with 12 specific proposals
      (D-TAX, I-SCHEMA, M-HINT, C-FILTER, H-MAP) and mapped all to existing H-items.

      '
    L2_insight: "The Hivemind currently operates at awareness level (agents can see\
      \ each other) but not cognition level (agents cannot reason about each other).\
      \ The missing infrastructure is taxonomy \u2014 structured fields for intent,\
      \ model hints, domain boundaries, and trust scores that enable automated routing\
      \ decisions. Without these, scaling from 3 to 14+ agents will turn the Hivemind\
      \ from a coordination layer into a noise layer.\n"
    L3_principle: "Visibility without taxonomy is noise. A system that shows everything\
      \ to everyone eventually forces agents to ignore everything to function. The\
      \ ability to filter, classify, and prioritize is not a luxury at scale \u2014\
      \ it is the prerequisite for scale itself. This mirrors the BSP tree principle:\
      \ the renderer's power comes not from drawing everything, but from knowing what\
      \ to skip.\n"
    timestamp: 2026-06-05
    topic: ls-p6-20260605-001
  - L1_narrative: "Mapped proposals to id Software heritage patterns \u2014 13 patterns\
      \ from Doom 1993, Quake 1996, and Quake 3 Arena 1999 were found to have direct\
      \ correlates in the Hivemind cognitive layer. 3 patterns (8-char names, vertex\
      \ split, bilinear filtering) were explicitly rejected as inapplicable. Each\
      \ proposal carries an [id-soft:] inline tag recommendation.\n"
    L2_insight: "The BSP tree (Doom 1993) maps directly to agent routing: recursive\
      \ plane culling at each decision point reduces the search space by 50%+ per\
      \ plane. The cvar system (Quake 1999) maps to model hints and trust scores.\
      \ The visplane overflow mechanism maps to inbox prioritization. The correspondence\
      \ is not metaphorical \u2014 it is structural. The same computational geometry\
      \ that Doom used to render 3D worlds on a 386 is how a Hivemind should route\
      \ messages across 14 agents.\n"
    L3_principle: "Heritage patterns persist not because of nostalgia but because\
      \ they solve universal problems. BSP culling, zone allocation, surface caching,\
      \ and fixed-point math are not rendering techniques \u2014 they are resource-management\
      \ patterns that apply wherever the search space exceeds the processing budget.\
      \ The Hivemind's processing budget is agent attention, and it is about to exceed\
      \ it.\n"
    timestamp: 2026-06-05
    topic: ls-p6-20260605-002
  - L1_narrative: 'Analyzed the interaction between Roc''s H-0..H-10 hardening spec
      and the cognitive layer. Found that 6 of 12 proposals should ship together with
      existing H-items in Phase 5 (modifying the same `hivemind_post_context` schema)
      while the remaining 6 cascade as dependencies. The critical finding: adding
      `intent` and `suggested_model` to `hivemind_post_context` is a 15-minute change
      if done before H-1 code is written, but a 1-hour refactor if done after.

      '
    L2_insight: "The cognitive layer and the hardening layer are not sequential \u2014\
      \ they are interleaved. Adding fields to a message schema is cheapest when the\
      \ schema is being built (H-1 adds `to:`, we should add `intent` and `suggested_model`\
      \ at the same time). Waiting until Phase 6 or Horizon 3 creates a schema migration\
      \ cost that Phase 5 avoids entirely. This is the \"right approximation\" principle\
      \ applied to scheduling: the right time to add a field is when the file is already\
      \ open.\n"
    L3_principle: "Architecture and deployment are not separate phases. Every time\
      \ a file is opened for one change, it should be evaluated for all related changes.\
      \ The cost of adding a field to a new function signature is near zero. The cost\
      \ of adding the same field to a shipped function signature is non-linear \u2014\
      \ it propagates to every caller, every test, every integration point. \"Open\
      \ once, modify fully\" is the engineering equivalent of \"measure twice, cut\
      \ once.\"\n"
    timestamp: 2026-06-05
    topic: ls-p6-20260605-003
