  - lesson: Use a 4-step write sequence: Temp file -> flush/fsync -> atomic replace -> parent dir fsync.
    context: Eliminates "Ghost Files" and data corruption during power loss or system crashes.
    source: roc_racoon
    entity_at_time: saraswati
    topic: Temple-Grade Atomic Write
    timestamp: '2026-06-04T12:00:00Z'
    L1: Use a 4-step write sequence: Temp file -> flush/fsync -> atomic replace -> parent dir fsync.
    L2: Eliminates "Ghost Files" and data corruption during power loss or system crashes.
    L3: Sovereign Integrity (Atomic persistence as a non-negotiable safety guarantee).
  - lesson: Replace all asyncio calls with anyio equivalents.
    context: Prevents event-loop collisions and frozen agents in a multi-provider environment.
    source: roc_racoon
    entity_at_time: saraswati
    topic: AnyIO Absolute Mandate
    timestamp: '2026-06-04T12:00:00Z'
    L1: Replace all asyncio calls with anyio equivalents.
    L2: Prevents event-loop collisions and frozen agents in a multi-provider environment.
    L3: Runtime Portability (Standardizing the async primitive to ensure systemic stability).
  - lesson: Migrate from SSE to Streamable HTTP (POST for requests, SSE for responses).
    context: Improves reliability and compliance with the latest MCP specifications.
    source: roc_racoon
    entity_at_time: saraswati
    topic: MCP Transport Upgrade
    timestamp: '2026-06-04T12:00:00Z'
    L1: Migrate from SSE to Streamable HTTP (POST for requests, SSE for responses).
    L2: Improves reliability and compliance with the latest MCP specifications.
    L3: Protocol Evolution (Adapting to industry standards to maintain interoperability).
