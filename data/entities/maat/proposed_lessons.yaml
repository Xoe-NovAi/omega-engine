- lesson: "L2: Atomic file writing pattern is well-established and unchanged in 2026: tempfile.mkstemp(dir=same_directory) → write → f.flush() → os.fsync(fd) → os.replace(tmp, target). Four-layer guarantee stack: (1) AtomicVisibility via same-directory rename, (2) CrashDurability via fsync before rename + parent-directory fsync after, (3) WriterExclusion via fcntl.flock(), (4) IntegrityDetection via .sha256 sidecar + rolling .bak. safeatomic (v2.0.3, May 2026) packages this with TLA+ formal models (SafeAtomicSmoke, SafeAtomicLock, SafeAtomicChecksum) and runtime guarantee inspection via doctor(). For SoulStore (single writer, critical data), implement the pattern directly (~30 lines) — don't add external dependency. Key gotcha: on fsync error, CRASH (per Postgres fsyncgate) — don't retry, kernel has forgotten which pages failed."
  source: deep-web-research
  trace_id: ses_maat_web_research_20260722
  entity_at_time: MAAT
  session_type: research
  timestamp: 2026-07-22 05:30:00+00:00
  model_used: deepseek-v4-flash-free
  outcome: l3_principle_captured

- lesson: "L3: The fsyncgate lesson (Postgres 2018) remains the definitive durability guidance: on Linux with barriers enabled and honest disks, fsync() returning 0 means data is on media. On nobarrier mounts, lying disks, or older kernels with background writeback bugs — fsync can return 0 after losing data. The only defense is testing (pull the plug). safeatomic's doctor() with destructive=True exercises the actual syscalls on your filesystem. For SoulStore on ext4/xfs with barriers=on (default), the pattern is sound. For NFS/SMB/Windows — don't use this pattern; use a database."

