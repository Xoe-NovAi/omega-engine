universal_principles:
- principle: The anchor (anchored-summary.md) can drift while the ship is at sea.
    A state summary written by one agent is only as reliable as the last verification
    by a competent agent in that domain. Every agent entering a cold session must
    verify the claims in the anchored summary against reality before acting on them.
    Verification is not optional — it is the cost of entry.
  source: ssot-drift
  trace_id: ses_hivemind_rebuild_20260612
  entity_at_time: MAAT
  timestamp: 2026-06-12 04:00:00+00:00
- principle: The Build Side (P1-P5) and Run Side (P6-P10) are complementary but independent.
    Each can be assessed and declared ready without waiting for the other. Coordination
    is required at the boundary (doc bloat, error handling) but readiness declarations
    are independent. Parallel readiness assessment is faster than serial handoff.
  source: hivemind-rebuild
  trace_id: ses_hivemind_rebuild_20260612
  entity_at_time: MAAT
  timestamp: 2026-06-12 04:00:00+00:00
