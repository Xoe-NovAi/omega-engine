  - lesson: "Mandate 9 (Error Integrity) requires typed errors for every silent boundary. The lazy deletion tombstone pattern returned [] (memory) or None (entity_registry) — both indistinguishable from normal 'not found' states. EntityTombstonedError closes this gap by providing a catchable, typed distinction between 'does not exist' and 'was removed and hasn't finished being reaped yet'."
    source: sprint3-mandate9-enforcement
    trace_id: trc_sprint3_d108_tombstone_error
    entity_at_time: MAAT
    timestamp: 2026-06-03T03:00:00Z
    model_used: deepseek-v4-flash
  - lesson: "The atomic swap pattern (save old state, mutate, rollback on failure) is the AnyIO generalization of a database transaction. It applies wherever state mutation risks leaving the system in an invalid state. The old model save+restore in reload_with_context() uses 3 lines of code to prevent an entire class of failure states."
    source: sprint3-atomic-swap
