# ── L2 INSIGHT (What It Means) ────────────────────────────────────────
lessons_learned:
  - lesson: "Parallel work coordination requires three layers: (1) Workspace Lock — file declaring file ownership, (2) Hivemind — live session awareness with task/focus_chain, (3) Live Feed — append-only log of completed tasks. All three are needed; any one alone is insufficient. Workspace lock prevents conflict, Hivemind enables live awareness, Live Feed enables async retrospective coordination."
    source: parallel-coordination
    user: The Architect
    trace_id: trc_sprint2_parallel_20260603
    entity_at_time: MAAT
    session_type: parallel
    timestamp: 2026-06-03T02:20:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - lesson: "The cvar table is the single source of truth for ALL engine constants and configuration. When new ZONEID constants are added by any agent, they must be added to cvar_table.py first, then re-exported through constants.py. Local definitions in feature modules violate D97 (cvar table unification) and create drift."
    source: cvar-consolidation
    user: The Architect
    trace_id: trc_zoneid_consolidation_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:40:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - lesson: "Tool availability should be tested, not assumed. Platform messages about step limits or tool disablement can be false positives. Always verify with a simple command before accepting the constraint as real."
