    user: The Architect
    trace_id: trc_resilience_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:39:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - lesson: "The lazy deletion pattern from id Software (doom-1993) and grace period (quake-1996) generalize well beyond memory management. Any 'remove + async consumers' scenario benefits from tombstone-then-reap-after-grace. The 0.5s value (15 packets at 30Hz) is the canonical Quake server value — keep it as the default unless domain-specific tuning is required."
    source: lazy-deletion-port
    user: The Architect
    trace_id: trc_memory_store_tombstone_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:30:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - lesson: "Validation functions should validate the EXACT thing they're called on, not the surrounding context. validate_llama_kwargs was getting the raw provider config (which contains 'provider', 'priority', 'cores') and treating those as if they should be llama_cpp.Llama() kwargs. The fix was to validate the actual llama_kwargs dict at the call site, not at init time."
    source: bug-fix
    user: The Architect
    trace_id: trc_kwarg_validator_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:28:00Z
