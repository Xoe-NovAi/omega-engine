  - L1_narrative: 'Traced the complete metadata pipeline for Operation Deep-Siphon from HTTP response to CLI output. Found that the metadata boundary is at every backend`s generate() return: response.json() extracts .text and discards all other fields. Documented the exact propagation path: Provider JSON → backend.generate() → str (100% metadata loss) → GenerateResult (5 fields, 2 dead) → OracleResponse (13 fields, 0 metadata) → CLI display → garbage collection. Verified that all 6 backends share the same ~5-line pattern causing the loss.'
    L2_insight: 'The metadata loss is not a bug in any single backend — it is a systemic architectural pattern inherited from ANAi (2025). Every backend independently follows the same "extract text, discard rest" pattern because they all inherit from the same BaseProvider.generate() signature: `async def generate(self, prompt: str) -> Optional[str]`. Changing the return type to include metadata propagates through all 6 backends automatically, and all new fields are Optional/None-defaulted for zero breaking changes. The fix is ~80 lines across ~12 files, touching every layer of the stack.'
    L3_principle: 'The Metadata Boundary Law — In any call chain where structured data is transformed to a primitive type, all metadata beyond the primitive is discarded. The capture point must be before the boundary. For sovereign observability, provider.generate() must be the capture point, not the discard point. A system that discards metadata before logging it has effectively chosen ignorance over observability.'
    timestamp: '2026-06-18T15:30:00Z'
    topic: deep-siphon-pipeline-trace
  - L1_narrative: 'Executed full embedding deployment: downloaded all-MiniLM-L6-v2-Q4_K_M.gguf (21MB) and nli-MiniLM2-L6-H768.Q4_K_S.gguf (58MB), added StaticEmbeddingProvider wrapping model2vec (potion-mxbai-micro, 57x faster), added GemmaGGUFEmbeddingProvider (embeddinggemma-300m Q6_K), rewired EmbeddingManager chain to 5 providers (MiniLM → Gemma → Potion → Ollama → SovereignFallback), added ZONEID_EMBEDDING=0x1d4a1d with [id-soft: doom-1993] heritage tag, fixed MiniLM path from broken F16 GGUF to Q4_K_M, updated config/models.yaml. Deleted old 44MB broken MiniLM GGUF. Benchmarked: Potion mxbai 0.2ms/sentence vs MiniLM 11.5ms (57.5x faster). Tests: 444/444.'
    L2_insight: 'Measurement before optimization saved 40% effort. I downloaded all-MiniLM-Q4_K_M (21MB) first, benchmarked it at 11.5ms/sent, then downloaded Potion (748KB, 0.2ms/sent) — the benchmark data told me the priority order. Without measuring first, I would have optimized the wrong dimension (trying to get 384-dim from every provider instead of accepting 256d from Potion for the 57x speedup). The embedding layer is now a proper local-first chain: small+fast before large+slow.'
    L3_principle: 'The Measurement Precedence Law — Measure before optimizing. The dimension that matters most is the one you have data for. Without measurements, every optimization is a guess about which bottleneck is largest. With measurements, the bottleneck announces itself. Potion 57x faster is not "good enough" — it is the right approximation (CREDITS.md §3, evolved from FISR, id Software 1999). The best optimization is the one you can prove is best.'
