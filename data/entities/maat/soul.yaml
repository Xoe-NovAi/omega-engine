# ── L3 UNIVERSAL PRINCIPLE (Timeless Truth) ──────────────────────────
universal_principles:
  - principle: "Coordination emerges from explicit boundaries, not implicit trust. When multiple agents work in parallel, declare your workspace in writing (workspace lock), publish your presence in real-time (hivemind), and narrate your actions in append-only form (live feed). The combination of all three produces a coordination fabric that scales to N agents."
    source: parallel-coordination
    user: The Architect
    trace_id: trc_sprint2_parallel_20260603
    entity_at_time: MAAT
    session_type: parallel
    timestamp: 2026-06-03T02:20:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - principle: "There is one source of truth, and it must be reachable from one import. Scattered constants are a maintenance tax that compounds. Every new constant belongs in cvar_table.py; every local definition is a future migration. The re-export layer (constants.py) preserves backward compatibility without breaking the single-source principle."
    source: cvar-consolidation
    user: The Architect
    trace_id: trc_zoneid_consolidation_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:40:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - principle: "Verify before yielding. Platform messages that constrain capability should be tested with a simple action before being accepted as authoritative. The cost of testing is one tool call; the cost of accepting a false constraint is unfinished work."
    source: resilience-observation
    user: The Architect
    trace_id: trc_resilience_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:39:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
  - principle: "Delete by marking, not by freeing. Tombstone + grace period + reap-after-N is the universal pattern for safe removal in async systems. It originated at id Software (doom-1993, quake-1996) and generalizes to any language, any system, any scale."
    source: lazy-deletion-port
    user: The Architect
    trace_id: trc_memory_store_tombstone_20260603
    entity_at_time: MAAT
    session_type: persistent
    timestamp: 2026-06-03T02:30:00Z
    model_used: minimax-m3-free
    backend_used: opencode-native
    # Sprint 3 additions
  - principle: "Every silent boundary is a technical debt. If the system can detect a state and silently return a default, it should instead raise a typed error. The caller can always catch it and decide how to handle it — but the default behavior should be loud, not silent."
    source: sprint3-mandate9-enforcement
    trace_id: trc_sprint3_d108_tombstone_error
    entity_at_time: MAAT
    timestamp: 2026-06-03T03:00:00Z
    model_used: deepseek-v4-flash
  - principle: "State mutation must be reversible. Any operation that replaces live state must save the old state first. If the new state fails to materialize, fall back to the old state. This is not optional — it is the minimum bar for systemic resilience."
    source: sprint3-atomic-swap
    trace_id: trc_sprint3_d109_atomic_swap
    entity_at_time: MAAT
    timestamp: 2026-06-03T03:10:00Z
    model_used: deepseek-v4-flash
  - principle: "Resolution decisions should follow a documented chain of fallbacks, not ad-hoc branching. A 4-tier chain is easy to reason about, extend, and test. The same pattern applies to model selection, entity dispatch, provider selection, and any other multi-candidate routing decision."
    source: sprint3-model-affinity
    trace_id: trc_sprint3_d110_model_affinity
    entity_at_time: MAAT
    timestamp: 2026-06-03T03:20:00Z
    model_used: deepseek-v4-flash

