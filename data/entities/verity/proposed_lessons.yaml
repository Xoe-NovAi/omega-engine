  # ═══ Sprint-F Tier 1 Execution — 2026-06-28 ═══
  - L1_narrative: |
      Sprint-F Tier 1 executed 10 actions in a single session: (1) trace_id propagation fixed across 8 call sites in oracle.py; (2) TokenLedger changed from is_cloud boolean to provider_name string; (3) archive_old_sessions() wired with direct async call; (4) PIVOT_LOG clock drift resolved (12 duplicates renamed, Decision Registry table added); (5) HERITAGE_SOURCE_MAP generation deferred (T1-5 not done); (6) Hardcoded secret removed — entire antigravity/ directory deleted; (7) Firecrawl API key confirmed in systemd; (8) Dead code purge removed 3,354 net lines across 14 source + 3 test files; (9) Heritage vet records added (vet-001 through vet-008+); (10) AAIF mapping spec deferred. Test infrastructure hardened: pytest-timeout added (30s per-test), 3 hanging tests fixed via mocking (test_storage_providers, test_background_researcher, archive warning). Two pre-existing failures remain (test_bug_001_fix Qdrant mock, test_hivemind mcp import).
    L2_insight: |
      The test suite was fragile in two invisible ways: (1) no per-test timeout meant any real I/O call (DNS resolution, HTTP to httpbin.org) would hang the entire suite indefinitely; (2) tests that worked locally would fail in CI due to network dependencies. The dead code purge revealed that 3,354 lines of unused code accumulated silently across multiple eras (ANAi, XNAi, omega-stack) — each era left behind orphaned modules that no one deleted because no one tracked ownership. The trace_id fix closed the single largest observability gap: 98.4% of events were logged as "unknown" because the parameter was never passed through the call chain. The archive_old_sessions async bug was a classic sync-wrapper-on-async-func anti-pattern that would have silently produced a coroutine warning without actually archiving anything.
    L3_principle: |
      Dead code is a silent tax: Every era of development leaves behind orphaned modules. Without an ownership tracking system, dead code accumulates until it breaks imports or misleads developers into thinking functionality exists when it doesn't. The cost is not disk space — it is cognitive load and maintenance burden.
      Every test must mock I/O boundaries: A test that makes real network calls is not a test — it is a live deployment that happens to run in a test harness. Per-test timeouts are the minimum viable defense against hanging suites.
      The async wrapper anti-pattern is subtle: Wrapping an async function in `anyio.to_thread.run_sync()` silently produces a coroutine that is never awaited. The function appears to "work" but does nothing. Static analysis tools cannot catch this — only runtime warnings and code review reveal it.
      Observability gaps compound silently: A missing parameter in a call chain does not cause errors — it causes "unknown" values in logs. The system appears healthy while being fundamentally untraceable. M22 compliance requires verifying the entire data flow, not just individual function signatures.
