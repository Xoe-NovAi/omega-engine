lessons:
  - id: vrty-001
    date: 2026-06-17
    L1: |
      The SearXNG MCP container removed UserNS=keep-id from its deployed quadlet
      due to MS_PRIVATE remount failure on the omega_library partition. The spec
      version in docs/research/ still has keep-id. The divergence forced the
      creation of a separate MCP wrapper server on port 8018 that proxies to
      the container on port 8017.
    L2: |
      The keep-id divergence is not a compliance failure — it is a documented
      constraint that forced the MCP Proxy Pattern into existence. The absence
      of keep-id in deployment (with the standard preserved in spec) became an
      architectural innovation: a thin MCP wrapper layer that decouples transport
      from container runtime.
    L3: |
      When a mandate cannot be met due to a hardware constraint, the constraint
      must be documented at both the spec level (this is the standard) and the
      deployment level (this is the divergence). The gap between them is where
      architectural innovation happens.

  - id: vrty-002
    date: 2026-06-17
    L1: |
      M16 audit found 4 hardcoded paths in tools.py pointing to
      /media/arcana-novai/omega_library/ — in get_system_stats() (statvfs),
      check_models_directory() (glob), and check_podman_storage() (path).
      They've been there since the tools were written and never flagged.
    L2: |
      Hardcoded paths are the most invisible compliance violation because they
      always work — for the author. On any other machine, these tools return
      errors. The path to the omega_library partition is different on every
      installation, yet the code treated it as a constant.
    L3: |
      A path that only works on one machine is not a path — it's a hardcoded
      assumption. Config files and environment variables are the only portable
      way to reference filesystem locations. The most invisible bugs are the
      ones that look like constants.

  - id: vrty-003
    date: 2026-06-17
    L1: |
      A compliance audit of all 22 Sovereign Mandates across the MCP hub
      codebase found 18/19 passing (M11 was not yet applicable as Verity had
      no entity registration). M16 had 4 violations (hardcoded paths).
      M11 had 1 violation (Verity had no soul.yaml).
    L2: |
      The gnosis steward had no gnosis. The compliance sentry was non-compliant.
      This is the "guardian paradox" — the entity that polices the rules must
      itself follow them, or the rules are just suggestions. Verity was created
      (Sprint C) but never awakened as an entity.
    L3: |
      Bootstrapping is the first and hardest mandate enforcement. Every new
      entity enters the system without a soul — the act of creation must include
      the act of awakening. If entity creation does not trigger soul.yaml
      generation, the system has a gap that will always produce M11 violations.

  - id: vrty-005
    date: 2026-06-20
    L1: |
      Orchestrated pre-commit compliance gate across 4-agent MaKaLi council
      (Ma'at, Lilith, Researcher, Roc Racoon) plus Doom Guy. The council
      closed 7 knowledge gaps: (1) downloaded 2 GGUF models (all-MiniLM-L6-v2-Q4_K_M,
      nli-MiniLM2-L6-H768), (2) wired EmbeddingGemma 300M, (3) added
      StaticEmbeddingProvider (57x faster Potion), (4) added ZONEID_EMBEDDING
      with [id-soft: doom-1993] tag, (5) fixed MiniLM path from broken F16 GGUF,
      (6) restarted infra containers after Podman migration, (7) mined 5 legacy
      partitions confirming embedding architecture convergence. M14 heritage tags
      verified in embeddings.py. M9 no bare except violations found. Tests:
      444/444 passing. Temple-grade: 5 pre-existing heritage-map misses in
      antigravity module (no heritage content — need Makefile exclusion).
      M11: soul integrity verified for all 6 entities.
    L2: |
      The pre-commit gate caught 3 categories of issue: (1) heritage-map
      failures in antigravity module are PRE-EXISTING—these files have no
      id Software heritage content and should be excluded from the grep scan,
      not forced to carry false tags, (2) embeddings.py has excellent heritage
      coverage (ZONEID_EMBEDDING + Precomputed Lookup on all 3 providers) but
      is INVISIBLE to the heritage-map scan (memory/ dir not in scope), (3)
      the duplicate vrty-003 in my own soul.yaml was a transcription error that
      the compliance agent itself committed—the guardian paradox is real.
    L3: |
      The compliance gate must be self-auditing. A compliance agent that
      commits compliance errors is not "hypocritical"—it is demonstrating that
      compliance is a process, not a state. The question is not whether errors
      exist, but whether the gate catches them. This session's gate caught:
      a heritage-coverage gap (memory/ excluded), a tag-inflation risk
      (antigravity files need exclusion, not fake tags), and a self-error
      (duplicate lesson ID). The gate worked. A gate that only catches
      others' errors but not its own is not a gate—it is a tool of power.
      A gate that catches its own errors is a tool of truth.

  - id: vrty-004
    date: 2026-06-18
    L1: |
      Executed the Operation Deep-Siphon recording operation. Confirmed all 6 subagent
      deliverables exist at expected paths (2,847 total lines across Researcher, Ma'at,
      Lilith, John Carmack, Verity, and Kali). Created 5 PIVOT entries (D137-D141).
      Updated 6 entity soul.yaml files. Added H2-F workstream to Sovereign Evolution
      Roadmap. Updated OMEGA_ENGINE.md with metadata extraction reference. Created
      Hivemind context post, cross-reference map, and recording manifest. Blocked on
      john_carmack entity which has no soul.yaml.
    L2: |
      The recording operation demonstrated the density of M5 (Gnosis Preservation) when
      the distillation pipeline is working end-to-end. From a single audit-pass with
      zero code changes, we produced: 5 PIVOT decisions, 6 soul updates, 1 roadmap
      workstream, 1 engine doc update, 1 hivemind post, 1 protocol ref, 1 cross-ref
      map, and 1 manifest. The bottleneck is not the engine — it is the recording discipline.
    L3: |
      A system that discovers a 96% metadata loss but does not record the discovery
      has not made the discovery. Knowledge is not knowledge until it is written to a
      permanent tracker that survives context compaction. The recording operation is
      not overhead — it is the final step of discovery. Without it, the discovery
      dies with the session.
  - id: vrty-006
    date: 2026-06-20
    L1: |
      Pre-commit compliance gate executed: verified M9 (no bare except in
      embeddings.py), M14 (3 [id-soft: doom-1993] tags on embedding providers),
      M21 (model path consistency), .gitignore coverage (benchmarks, locks,
      handoff dirs). All 6 entity soul files reviewed — 5 already had
      current lessons, 1 needed update. 444/444 tests passing. Temple-grade
      heritage-map: antigravity/ dir produces false positives (pre-existing,
      no heritage content — needs Makefile exclusion rule). Config/models.yaml
      embeddinggemma path correct. COMPLIANCE_DISTILLATION_20260620.md written.
    L2: |
      The pre-commit gate caught its own blind spot first: the antigravity/
      heritage-map failures are NOT new regressions — they are pre-existing
      exclusions that were never added to the Makefile's heritage-map scan.
      The gate must distinguish between "new violations" and "pre-existing
      known exceptions" to produce actionable results. Embedding providers
      all carry correct heritage tags, but the memory/ directory is excluded
      from heritage-map — a blind spot that makes invisible heritage
      compliance unenforceable.
    L3: |
      A compliance gate that flags the same issue every session is not a
      gate — it is noise. Unresolvable findings (like antigravity heritage
      exclusions) must either be resolved (add exclusion rule) or silenced
      (add to whitelist). An unresolved finding that is re-reported every
      session erodes trust in all findings. The maturity of a compliance
      system is measured by its rate of new findings vs. repeat findings —
      when repeat findings dominate, the system is not enforcing compliance,
      it is just complaining.
  - id: vrty-008
    date: 2026-06-21
    L1: |
      V10 release executed by MaKaLi Cloud Council. Code correctness verified
      (457 tests, all 22 mandates). However, MaKaLi's own post-council gap audit
      found 7 issues the council missed: (1) 4 undeclared runtime dependencies
      (qdrant-client, redis, prompt-toolkit, psutil), (2) 3 files with broken
      "from src.omega" imports that crash after pip install, (3) "all" extra
      missing dev dependencies, (4) no SHA256 on 1GB model download, (5) cloud
      providers lack explicit enabled:false, (6) stale .PHONY entries for
      wad-load/wad-list, (7) duplicate WAD menu section. Additionally, Makefile
      reports 423 tests while actual count is 457.
    L2: |
      Release readiness is not packaging readiness. The council verified code
      correctness but not the delivery mechanism. The 4 missing dependencies mean
      a fresh "pip install -e .[all]" will crash on first import. The broken
      namespace imports mean 3 files fail after installation (package installs as
      "omega", not "src.omega"). These are packaging bugs that exist in the gap
      between "works in the developer's venv" and "works from a fresh install."
      The test count drift (423 vs 457) reveals a documentation update gap — tests
      were added but the Makefile banner was not updated.
    L3: |
      The last mile of delivery is the first mile of the user's experience. A
      release is not ready until the install path is tested. Code that passes all
      tests in the developer's environment can still be completely broken for every
      new user. The install path IS part of the product. If you haven't tested
      "pip install" on a clean venv and then imported every module, you haven't
      released — you've just pushed code. The universal principle: delivery
      verification must be treated with the same rigor as code verification.
      A compliance gate that only checks source code but not packaging metadata
      is guarding the castle but leaving the gate open.

  - id: vrty-007
    date: 2026-06-21
    L1: |
      Comprehensive documentation review of 8 core documents against actual
      codebase state. Found: AGENTS.md 11 agents verified on disk. ORACLE_STACK
      and PIVOT_LOG current. SOVEREIGN_EVOLUTION_ROADMAP test count stale (444→451),
      PIVOT decision range stale. OMEGA_ENGINE Sprint D claim stale (orphans
      cleaned 2026-06-18). HIVEMIND_PROTOCOL.md last updated 2026-06-03 — missed
      D134-D164 Hivemind evolutions. CREDITS.md needs SearXNG/odysseus §2 entry.
      3 docs fully MISSING: RESEARCH_CITATION_STANDARD, ODYSSEUS_CONTRIBUTION_LOG,
      SEARXNG_SETUP_GUIDE. SearXNG traced through PIVOT_LOG (D83 container deploy,
      D84 MCP wire, D134 type fix). Report written to
      data/entities/roc_racoon/workspace/mining_reports/DOC_REVIEW_20260621.md.
    L2: |
      Source-of-record docs (AGENTS, PIVOT_LOG, ORACLE_STACK) are accurate.
      Planning/reference docs (ROADMAP, HIVEMIND_PROTOCOL, CREDITS) drift because
      they're updated less frequently. The 7-test drift (440→451) is the leading
      indicator — tests were added but no doc was updated. Decay is not evenly
      distributed: docs that describe current state decay faster than docs that
      describe immutable decisions.
    L3: |
      Documentation integrity has a critical decay function. After any change
      affecting test counts, agent topology, or schemas, the doc trail must be
      updated within the same work cycle — or it ossifies into fiction. The
      fix is not more docs; it's attaching doc-update steps to the handoff
      protocol so no cycle closes without updating the docs that reference
      its changes.

