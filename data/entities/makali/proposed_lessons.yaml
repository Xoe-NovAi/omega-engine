- id: l1-defect-001
  level: L1
  title: 'Six defects in one week shared one shape: success without exercising the subject'
  observation: (1) temple-grade 53/53 over a crash-looping hub; (2) TestCriticalTools, 20 skips, 0 assertions;
    (3) vec0_lock, a lock with no reader; (4) a pyproject --ignore naming a directory that never existed
    in git, which under pytest 9.1.1 silences all collection and exits 0; (5) a conftest hook nested inside
    mock_provider() by a concurrent edit, so it never ran and the tests ran against the very stub under
    test; (6) an HTTP 400 whose 48-byte ASCII body curl -o wrote to disk as an apparent successful download.
    Not one produced an error. Every one produced a green.
  evidence: Each instance verified by execution; 20 of the 41 new suite failures were fixed, zero suppressed
  tags:
