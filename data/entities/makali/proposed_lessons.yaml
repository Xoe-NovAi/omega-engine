- id: l1-remote-001
  level: L1
  title: The 8019 exchange channel was declared verified on a loopback test
  observation: 'I told GE-N1 to use port 8019 after testing it from 127.0.0.1. A peer''s plain-HTTP path
    to the tailnet IP returns 400, and the 48-byte ASCII body is written to disk by curl -o as a file
    indistinguishable from a download. A receiver skipping the manifest writes a 48-byte zip, believes
    the transfer worked, and fails later at unzip, far from the cause. Separately, the origin wrote no
    access log at all, so a successful pull and a failed pull were indistinguishable: the channel was
    UNTESTABLE, not working. N0->N1 was later proven end-to-end by GE-N1 (24/24 manifest, VNR2 all pass,
    parity byte-identical). N1->N0 has never been built.'
  evidence: Carmack, three client paths with byte counts and hashes; a real 48-byte ASCII file on disk
  tags:
  - m30
