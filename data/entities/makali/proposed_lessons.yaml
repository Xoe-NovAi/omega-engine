- id: l1-federation-001
  level: L1
  title: Assorted Tailscale tailnet facts confirmed in the field
  observation: 'Tailscale Serve is subject to tailnet ACLs exactly like any other service, so a correctly
    configured local backend can still be unreachable from a peer node. The effective policy was a selective
    per-port allowlist enumerating 8016 and 22 but not 8017, producing ''Drop: TCP{100.89.40.17:* > 100.123.51.67:8017}
    no rules matched''.'
  evidence: tailscaled journal on N0; N1 curl to 8017 timed out while 8016 succeeded.
  tags:
  - tailscale
  - networking
  - acl
  - federation
- id: l1-federation-002
  level: L1
  title: The tailscale CLI cannot modify ACLs or grants
  observation: Enumerating all subcommands on v1.102.4 shows no policy/ACL/grant verb. 'syspolicy' only
    diagnoses host MDM. Tailnet policy is control-plane state edited in the admin console or via PATCH
    /api/v2/tailnet/{id}/acl. No Tailscale API credential existed on N0 (env, ~/.config/tailscale, /var/lib/tailscale,
    systemd unit, repo .env, keyring).
  evidence: Doom Guy CLI capability audit; help output quoted verbatim.
  tags:
  - tailscale
  - capabilities
  - m23
- id: l1-federation-003
  level: L1
  title: Tailscale SSH cannot use check mode with a tagged source
  observation: Tailscale permits only user->own devices, user->tagged device, user->shared tagged device,
    and tagged->tagged. The last CANNOT be in check mode, because check mode requires re-authentication
    against an IdP and a tagged device has no user identity. tag->tag SSH is therefore structurally forced
    to 'accept' with no periodic re-auth.
  evidence: Tailscale SSH docs, 'Check policies' section.
  tags:
  - tailscale
  - ssh
  - security
  - platform-limits
- id: l1-federation-004
  level: L1
  title: Two independent SSH planes, commonly conflated
  observation: The tailnet policy's 'ssh' section governs Tailscale SSH only. The 'tcp:22' grant governs
    REGULAR OpenSSH over WireGuard, authenticated by sshd_config and authorized_keys. They can be removed
    independently.
  evidence: Tailscale docs; confirmed during the policy conversion.
  tags:
  - tailscale
  - ssh
  - architecture
- id: l1-federation-005
  level: L1
  title: vfat does not persist Unix permission bits
  observation: The degraded D3E6-A900 stick is mounted with fmask=0022,dmask=0022. chmod +x on it is a
    no-op (mode reads back unchanged); direct invocation of a .sh returned exit 126 while 'sh <file>'
    returned 0. FAT permissions are derived from mount options, not stored per file.
  evidence: Empirical chmod-then-read on the live mount.
  tags:
  - usb
  - vfat
  - transport
  - cross-platform
- id: l1-federation-006
  level: L1
  title: Embedding dimensionality is a governance decision, not a technical detail
  observation: Equal dimensionality does not make vectors comparable. Cross-model cosine similarity is
    invalid and silently yields meaningless results. The Architect vetoed 768-D MRL in favour of 1024-D
    native for Qwen3-Embedding-0.6B. Both nodes converged independently.
  evidence: D-1024-DIM-NATIVE-20260926; N1 independent measurement matches N0 Gate 6.
  tags:
  - embedding
  - governance
  - retrieval
