- "- \"L1: 2026-09-17 — CI workflows now enforce M24 Venv Sovereignty: .venv created and $GITHUB_WORKSPACE/.venv/bin prepended to $GITHUB_PATH in both ci.yml and test.yml. All pip, pytest, flake8, ruff, reuse, make commands now execute strictly through the venv. This guarantees Mandate 24 compliance in CI (never mutate runner-level Python).\n  L2: GitHub Actions steps are separate shells — without explicit venv activation via $GITHUB_PATH, commands default to the global runner Python. The Makefile's PYTHON ?= .venv/bin/python fallback only works if .venv exists.\n  L3: M24 is not a local-only mandate. It must be enforced in every execution environment, including CI. The pattern: python -m venv .venv; echo \"$GITHUB_WORKSPACE/.venv/bin\" >> $GITHUB_PATH; then all subsequent steps use venv tools.\""
- "- \"L1: 2026-09-17 — scripts/ci_check_docs.sh fixed to use git ls-files instead of find for docs/research docs/decisions. In CI (and on release/debut-v1.6.0 branch), research docs are git-ignored per D-565 — only tracked markdown files exist. The script now: (1) uses git ls-files when in a git repo, (2) handles spaces in filenames via mapfile, (3) skips PIVOT_LOG* ledger files (not research docs). Result: passes in CI and locally.\n  L2: Documentation lint must match the actual tracked files in the branch. On debut branch, docs/research/*.md are untracked (git rm --cached per PUBLIC_ALLOWLIST.txt) — only docs/decisions/PIVOT_LOG.md is tracked. A find-based script fails on missing files; a git ls-files script passes.\n  L3: CI scripts must be branch-aware. The debut branch has a different file topology than main. Scripts that assume a fixed directory structure will break when the allowlist changes.\""
- "- \"L1: 2026-09-17 — .github/workflows/ci.yml fixed: added ruff and reuse to pip install step, removed redundant 'Install REUSE tool' step. make check-mandates now has ruff available (M23 gate requires it). Also: pip install -e \".[cli,dev]\" installs dev extras (ruff, scikit-learn, textual) matching test.yml.\n  L2: The CI failure 'No module named ruff' was a dependency declaration bug — ci.yml installed pip install -e . (no dev extras) while test.yml used pip install -e \".[cli,dev]\". Both workflows must declare identical dev dependencies for mandate gates to pass.\n  L3: Workflow parity is a mandate gate. If test.yml and ci.yml install different dependency sets, one will pass and the other fail — not because of code, but because of declaration drift. Keep them in sync.\""
