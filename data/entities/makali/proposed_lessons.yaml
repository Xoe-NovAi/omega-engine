- "L1: 2026-09-16 — PR cleanup sprint: full-suite pytest collected 0 tests for weeks; individual files passed. Root cause was THREE sys.modules pollution sources in test files (stale omega.library MagicMock in a1-a5, spec_from_file_location bare names, missing mcp.server.transport_security mock) PLUS a global pytest.mark.anyio in conftest that made every sync test run in an async loop.
  L2: Test isolation is a shared-resource problem: sys.modules is process-global, env vars are process-global, and a global pytestmark changes execution context for ALL tests. Any test that mutates these without restore breaks every subsequent test in the suite — and the failure manifests far from the cause (ModuleNotFoundError in unrelated files).
  L3: When a full suite fails to collect but individual files pass, suspect sys.modules/env/global-mark pollution FIRST. Grep for sys.modules[ mutations, spec_from_file_location with bare names, and global pytestmark. Never mock a package that actually exists (stale mock = shadow). Restore or use qualified names."
- "L1: 2026-09-16 — gitleaks-action@v2 broke in CI with 'Unexpected input(s) args' + Node v24 crash; replaced with direct CLI download + --config .gitleaks.toml. Also: CI pytest failed on undeclared deps (pathspec, json_repair) and hard imports (llama_cpp, warp_proxy_pool) that work locally because the dev venv has everything.
  L2: CI is the honest environment: it installs only declared extras. Any module-level import of an optional dep (llama_cpp, warp_proxy_pool) or undeclared test dep (pathspec, json_repair) fails CI but passes locally — the local venv masks missing declarations. GitHub Actions also uses bash -e: a command exiting non-zero aborts before the if-check that was supposed to handle it.
  L3: CI failures are declaration/portability bugs, not code bugs: (1) every optional import needs try/except or importorskip; (2) every test-only import needs a pyproject dev dep; (3) every workflow step capturing an expected non-zero exit needs set +e/status capture; (4) pin third-party actions or expect schema breaks (gitleaks-action args input)."
