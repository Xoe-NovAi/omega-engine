- id: l1-redis-001
  level: L1
  title: Redis survived three sweeps because the sweeps were not sweeps
  observation: 'The container, quadlet, and volume were removed, then the docker-compose service was found
    with restart: unless-stopped and a hardcoded password duplicated four times and injected into three
    other services, then Dockerfile.iris was found with redis>=7.0.0 in its pip list, then pyproject.toml
    extras were found declaring redis==7.4.1, then config/systemd/omega-youtube-worker.service was found
    carrying After=redis.service — meaning that if any redis.service existed on the host and the unit
    was enabled, systemd would have started it with no gate voting. The live re-creation vector was closed
    only by the last finding.'
  evidence: Carmack's own contract test caught the pyproject declaration; Doom Guy caught docker-compose
    and Dockerfile.iris
