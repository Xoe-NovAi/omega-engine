- "- \"L1: 2026-09-19 — Search pipeline degradation resolved: SearXNG CAPTCHA engines (duckduckgo, google) isolated and replaced with resilient cluster (bing, brave, startpage, marginalia, qwant, wikipedia, github, arxiv); search_providers.py and searxng-mcp updated with defensive typing for suggestions/answers; SkepticalVerifier local NLI model calls decoupled via verification.enabled: false in search.yaml to eliminate 300% CPU runaway loops and request timeouts. Both omega-hub_library_web_search and omega-hub_sovereign_search verified returning <1.5s.\n  L2: Intermediate background verification that blindly invokes local models during engine development creates fatal latency traps and runaway CPU loops. Small models have constrained context and slow CPU execution; the development environment must explicitly decouple runtime tools from local model readiness.\n  L3: Operational decoupling is a sovereignty requirement. Never allow unverified or experimental local inference loops to block or degrade core engine tooling. Development-phase runtime paths must be sub-second, deterministic, and decoupled from local weights until explicitly benched.\""
- "- \"L1: 2026-09-20 — Tailscale hostname vs DNSName dichotomy: Renaming a machine in the Admin Console updates its MagicDNS DNSName (e.g. n1.tail51f14a.ts.net) but leaves the client-side advertised HostName untouched if set during 'tailscale up'. To synchronize HostName and DNSName without breaking credentials, execute 'tailscale set --hostname=<name>' on the node.\n  L2: Tailscale decouples the node's local advertised hostname from the tailnet MagicDNS name. When inspecting 'tailscale status --json', HostName reflects the local client's setting, while DNSName reflects the coordination server's authoritative DNS record. Use 'tailscale set --hostname' for non-disruptive synchronization.\n  L3: Identity hygiene requires consistency across both local and coordinate planes. Decoupled hostnames create confusion across logs, metrics, and federation tools. Always align the local advertised hostname with the sovereign MagicDNS designation.\""
- "- \"L1: 2026-09-20 — FastMCP Streamable-HTTP wire protocol specification: The modern Model Context Protocol transport runs exclusively over POST /mcp and strictly requires 'Accept: application/json, text/event-stream'. GET requests or missing accept headers return HTTP 406 Not Acceptable. Subsequent JSON-RPC requests require the 'mcp-session-id' header returned during initialization; omitting it returns HTTP 400 Bad Request.\n  L2: Streamable HTTP supersedes the legacy HTTP+SSE split. In FastMCP / Python MCP SDK v2, the server operates on a single endpoint handling both request-scoped SSE streams and JSON-RPC payloads. Clients must treat session IDs as mandatory state tokens across turns.\n  L3: Protocol compliance is non-negotiable in sovereign federation. Cross-node agent tool calling cannot rely on loose HTTP assumptions. The agent layer must adhere strictly to JSON-RPC 2.0 streaming contracts with explicit session state management.\""
- "- \"L1: 2026-09-20 — Pure NFSv4.2 elimination of legacy RPCbind (port 111): Modern, secure NFSv4.2 operates exclusively over TCP port 2049, eliminating port 111 (rpcbind/portmapper) and mountd. Traditional discovery tools like 'showmount -e' and 'rpcinfo -p' fail or time out because they target port 111, while direct 'mount -t nfs4 <host>:/ <mountpoint>' succeeds instantly.\n  L2: Security and firewall policies for NFSv4 in WireGuard meshes should strictly permit only port 2049. Treating 'showmount' failures as an NFS outage is a false diagnostic trap caused by legacy NFSv2/v3 assumptions. Test NFSv4 directly via socket connection on 2049 or direct mount of the fsid=0 pseudo-filesystem.\n  L3: Strip legacy attack surfaces completely. A sovereign federation network only exposes load-bearing application ports. Pure NFSv4 over WireGuard achieves zero-telemetry, zero-egress distributed storage without legacy RPC baggage.\""
- "- \"L1: 2026-09-21 — Three-model forensic review (Flash → Pro → Sonnet 4.6) converged on identical S0 findings: three independent model passes independently flagged identical credential leaks and tracking violations. This is de facto consensus proof — the probability of false positive convergence approaches zero.\n  L2: Multi-model adversarial review (MMAR) is a new verification primitive (M29). When models with different training data, attention patterns, and failure modes converge, the finding is verified. This is not redundancy — it is cross-validation.\n  L3: Institutionalize MMAR as a mandate gate (M29) for debut-track changes. Tiered: T1 (mandatory) for security-adjacent files, T2 (recommended) for coordination/docs, T3 (single-model) for entity-only artifacts. The three-model review IS the verification; consensus IS the proof.\""
