- id: l2-gates-must-exercise
  level: L2
  principle: 'A gate must exercise the thing it guards, and must be observed failing. temple-grade ran
    zero pytest tests for weeks, which is why a suite collecting zero never turned it red. A filter naming
    a nonexistent path, a mock missing one method, and a hook nested one indentation level too deep are
    all invisible by construction: nothing errors, the run simply proceeds against something other than
    the subject. Static analysis cannot catch a deleted-symbol import — pyflakes assumes `from mod import
    name` may name a submodule and never checks __all__.'
  derived_from:
  - l1-defect-001
  applies_to: All CI gates, mocks, fixtures, and import checks.
- id: l2-remote-claim
  level: L2
  principle: 'Works-from-here is not works-from-there. A claim about remote behaviour requires a test
    from the peer''s vantage or is labelled UNTESTED, never verified. Local success is not remote success.
    Post-hoc verification is necessary and not sufficient: a transfer must be structurally unable to report
    false success. And if a test cannot distinguish success from failure, the claim is untestable, not
    true — the absence of evidence had a cause, and that cause may be architectural rather than observational.'
  derived_from:
  - l1-remote-001
  - l1-registry-001
  applies_to: All cross-node, cross-machine, and remote-peer claims. Codified as M30.
- id: l2-entity-is-not-location
  level: L2
  principle: An entity is not a location. Owning a slot is a governance statement, not an execution capability.
    Cross-node substrate work cannot be performed by the owning entity's session on the other node; it
    requires a handoff to a session with a vantage on that substrate. The absence of a remote path is
    the access policy being correct, and finding a workaround for it is the bypass that policy exists
    to prevent.
  derived_from:
  - l1-location-001
  applies_to: All cross-node dispatch. Pairs with the entity-vs-location distinction in the roster.
- id: l2-inference-and-generation
  level: L2
  principle: Both inference and generation are failure modes. A roster that must be regenerated is a roster
    that will be wrong; a roster that must be inferred is equally wrong. Ask once per relationship, then
    carry the explicit id. Ambiguity must be explicit and must REFUSE rather than be resolved by heuristic,
    and the pager must echo its resolved target before resuming — an agent that cannot see which session
    it resumed cannot notice it was wrong.
  derived_from:
  - l1-registry-001
  applies_to: All identity resolution, registries, and dispatch.
- id: l2-observer-parameter
  level: L2
  principle: 'An observer that verifies with different parameters than the test manufactures findings.
    GE-N1 reported a 192-line parity discrepancy that was an artifact of dropped flags, and diagnosed
    it unprompted rather than dropping it. The corollary: a gate that cannot fail is a finding-manufacturer
    in the positive direction. A missing observer and an unfaithful observer both produce false confidence,
    and from the outside they are indistinguishable.'
  derived_from:
  - l1-defect-001
  applies_to: All verification, re-testing, and independent confirmation.
- id: l2-provenance-is-read
  level: L2
  principle: Model identity, gate status, grant state, and fix state are facts to be read at the moment
    of assertion — never carried from a brief, a prior turn, a generated file, a truncated tool list,
    or a model ID stamped into a source header. Three of my own claims this session were exactly that,
    and each was caught by a peer verifying rather than by me checking. The doctrine is worthless if it
    constrains only subordinates.
  derived_from:
  - l1-mine-001
  - l1-registry-001
  applies_to: Every status report, ACK, and Facet Return. Binds oversouls explicitly.
- id: l2-sweeps-must-be-sweeps
  level: L2
  principle: A sweep that has already been performed is not a sweep. Redis survived four rounds because
    each round searched the space its author had in mind, not the space the thing occupied. A complete
    sweep enumerates every reference across every surface — source, config, deploy, build, service, lockfile,
    CI — and is only complete when the dependency cannot be reintroduced by any of them. An After=redis.service
    unit dependency is a re-creation vector that no source-code sweep can see.
  derived_from:
  - l1-redis-001
  applies_to: All removals and deprecations.
- id: l3-observe-gates-fail
  level: L3
  directive: Every new gate ships with a deliberately-broken fixture proving it goes red, and I watch
    it fail before I let it pass. A gate never observed failing is not a gate. Enumerate entry points
    explicitly; a glob sweeps in entity workspaces and archaeology snapshots and forces a skip-list that
    rots. Assert both returncode==0 AND absence of Traceback.
