  - L1: 2026-08-30 — Local inference observability hardening session. Found 2 running llama_cpp.server processes (extractor:1234, reasoner:1235) started by scripts/serve_native_gguf.sh. Discovered deployment discrepancy: config/systemd/omega-inference.service exists with full Carmack OOM hardening (MemoryMax=8G, OOMScoreAdjust=300, Delegate=yes) but is NOT installed. The ad-hoc shell-script approach is what actually runs. Pre-existing readiness timeout (30s) was too short for the 4B Thinking reasoner (loads in ~45s). Logs in /tmp were ephemeral, not M8-compliant. No lifecycle event trail existed. Rewrote serve script (v1.1.0): 90s readiness, persistent data/logs/native-gguf/, JSONL events.jsonl, graceful SIGTERM, crash detection, status subcommand. Added 12 Makefile targets (8 lifecycle + 4 observability). Created logrotate config and the missing LOGGING_ERROR_HANDLING_ARCHITECTURE.md (referenced by M9 but was absent).
  - L2: Two competing deployment models in one repo is a hardening smell. When a production-grade unit (systemd) exists but is bypassed by an ad-hoc script, the ad-hoc path accumulates the load without the hardening. Documentation is not the same as deployment. The gap between "documented" and "active" is where regressions hide. The M9 mandate referenced a canonical logging doc that didn't exist — a contract violation that the mandate itself was citing as authoritative. Readiness timeouts must be sized to the slowest expected operation, not the typical one; hard-coded 30s is a latent bug for any model that takes 45s+ to load.
  - L3: The hardest thing to harden is the path that's "working." When a shell script is running in production and a better systemd unit exists but isn't installed, the operational path is the priority — but the hardening gap is also a priority. The pattern that resolves this tension is staged migration with parallel observability: make both paths observable first, then migrate, then retire the old. The mandate hierarchy (M9 → logging doc → observability) implies the doc must exist before the mandate is enforceable. A mandate that references a missing artifact is a latent enforcement gap, not a self-consistent contract.
