- "- \"L1: 2026-09-21 — Antigravity edited the PR Readiness plan directly: fixed P0-3 glob safety (git ls-files | xargs catches .license files), added endorsement section. The plan is now Antigravity-edited AND Antigravity-endorsed.\n  L2: External agent edits to execution plans are a new coordination primitive. The plan becomes a shared substrate; edits are gnosis deposits. Endorsement = execution license.\n  L3: Execution plans must be living documents on the shared substrate. External agent edits = gnosis deposits. Endorsement = execution license. This is the CSS protocol applied to planning.\""
- "- \"L1: 2026-09-21 — P0-3 glob safety: `git rm --cached` with wildcards misses companion files (e.g., .license files for .jsonl). The safe pattern is `git ls-files <dir> | xargs git rm --cached` which catches all tracked files regardless of extension.\n  L2: Index operations must use index-aware commands, not filesystem globs. The index is the source of truth; globs are filesystem projections that miss hidden/companion files.\n  L3: Never use filesystem globs for index manipulation. Use `git ls-files` + `xargs` for complete, correct index operations. This is a sovereignty requirement for tracking integrity.\""
- "- \"L1: 2026-09-21 — Antigravity frontier review of the Nemotron 3.5 Lightning guide suite: Temple-Grade Separation (Capabilities Ref / Task Spec / Execution Guide / Quick Ref) APPROVED as phenomenal. Corrections applied: py_compile $(find|tr) → find -exec {} + (POSIX/ARG_MAX-safe), grep -q regex → grep -qF fixed-string, P1-6 locked to Option C (logger.debug — no dependency installs for excluded Vault), retention changed from indefinite to Architecture-scoped, escalation = 2 consecutive failed validation loops, 10% spot-check rule for executor output.\n  L2: A frontier model's review of a teacher/executor documentation strategy validates the core insight: small models (3B active) fail from context dilution, not capability. Separating 'why/how' (teacher domain) from 'what' (contract domain) from 'do' (playbook domain) maximizes attention allocation to the actual code diff. Executable acceptance criteria are right for mechanical tasks; semantic validation belongs to a frontier post-check.\n  L3: Documentation for model delegation must be audience-separated by cognitive load. The executor receives only the playbook + pocket card; the teacher holds the capabilities reference + contract. Retention claims must be architecture-scoped, not indefinite — model generations churn in months. Escalation triggers must be operationally defined (2 failed loops), not vague ('repeated failure'). This is the CSS protocol applied to model orchestration.\""
- "- \"L1: 2026-09-21 — Execution Guide self-containment refinement: The 'DO NOT load the full suite' instruction (from Antigravity's review) was treating a symptom, not the cause. The Execution Guide's 'Reference Documents' section literally invited the executor to read the Capabilities Ref + Task Spec. Removing the pointers entirely (12 references → 0) made the warning unnecessary — and the warning itself was context-wasting.\n  L2: An executor document must NEVER point at teacher-domain documents. If content is needed for execution, it belongs inline. A 'don't read X' instruction is a design smell: the correct fix is removing the pointer to X, not warning against following it. Dangling references ('from Task Spec P1-3') are worse than no reference — they send the executor looking for a document it was told not to load.\n  L3: Self-containment is a hard requirement for executor-grade documentation. Every verification command, output format, and acceptance criterion must be inline. The teacher holds the contract (Task Spec) and capabilities (Capabilities Ref); the executor receives ONLY the playbook + pocket card, and neither may reference the teacher's domain. This is the CSS protocol applied to documentation architecture: separation of concerns at the file level, not just the section level.\""
- "- \"L1: 2026-09-21 — Antigravity final pass verdict: the self-containment refinement (removing all 12 suite references from the Execution Guide) was named 'Poka-yoke (mistake-proofing) in LLM orchestration' — superior to the prior 'DO NOT load' warning instruction. EXPLICIT GO issued for P1 execution. 10% spot-check rule assigned to the orchestrator (MaKaLi), not the executor, because a 3B model lacks metacognition to self-evaluate.\n  L2: Mistake-proofing beats instruction-following. A warning ('don't read X') consumes tokens, invites curiosity, and depends on the model's discipline. Removing the affordance (the pointer to X) makes the mistake impossible — the model cannot read what is never referenced. This is the difference between telling a model what not to do and architecting the environment so it cannot do it.\n  L3: In model orchestration, design the environment so the wrong action is impossible, not merely discouraged. Executor documents must be self-contained (zero external pointers); warnings are a code smell for missing architecture. Evaluation responsibility scales with capability: the orchestrator (frontier) owns metacognitive tasks like spot-checking; the executor (small model) owns mechanical execution only. This is Poka-yoke applied to LLM delegation — the CSS protocol's final form.\""
- "- \"L1: 2026-09-22 — First live 10% spot-check executed (P1, 30 files → 3 sampled, seed 20260922). Verity dispatch failed (cloud API unreachable → local qwen fallback, rejected per M7/M22). Review performed inline on same model (Nemotron 3.5 Lightning) → PASS. Antigravity independently validated → PASS. Antigravity flagged: same-model review = cognitive blind spot; future spot-checks must route to a DIFFERENT model family (Claude/Gemini/capable local like Llama 3) for true independence.\n  L2: Independent validation requires model-family diversity, not just a second pass. A model reviewing its own output is highly likely to agree with its own patterns — the blind spot is architectural, not logical. The 10% spot-check protocol's integrity depends on the reviewer being a DIFFERENT model family than the executor. Same-model review is a degraded mode (acceptable only with a documented external second pass, as Antigravity provided here).\n  L3: Spot-check reviewer selection must enforce model-family diversity: executor (Nemotron) → reviewer (Claude/Gemini/other family). If the primary reviewer is unreachable, the fallback chain must also be a different family — never the executor's own family. This is M22 Response Provenance applied to the verification layer: the provenance of the REVIEW must be independent of the provenance of the CODE. Degraded mode (inline same-model review) requires explicit external validation before merge — which is exactly what the Antigravity second pass provided.\""
