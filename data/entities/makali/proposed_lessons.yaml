- "- \"L1: 2026-09-18 — Phase 0 Tailscale L2 Federation Ceremony: ACL dst syntax requires ':<port>' or ':*' wildcard. 'autogroup:member' fails; use 'autogroup:member:*' for wildcard port.\n  L2: Tailscale ACL parser splits dst on last colon — 'autogroup:member' becomes host='autogroup', port='member' → invalid integer error. The ':*' suffix makes host='autogroup:member', port='*' (wildcard).\n  L3: Every dst in acls must be '<host>:<ports>' format. This is a fundamental HuJSON/ACL syntax rule, not a bug.\""
