- "- \"L1: 2026-09-16 — PR cleanup sprint: full-suite pytest collected 0 tests for weeks; individual files passed. Root cause was THREE sys.modules pollution sources in test files (stale omega.library MagicMock in a1-a5, spec_from_file_location bare names, missing mcp.server.transport_security mock) PLUS a global pytest.mark.anyio in conftest that made every sync test run in an async loop.\n  L2: Test isolation is a shared-resource problem: sys.modules is process-global, env vars are process-global, and a global pytestmark changes execution context for ALL tests. Any test that mutates these without restore breaks every subsequent test in the suite — and the failure manifests far from the cause (ModuleNotFoundError in unrelated files).\n  L3: When a full suite fails to collect but individual files pass, suspect sys.modules/env/global-mark pollution FIRST. Grep for sys.modules[ mutations, spec_from_file_location with bare names, and global pytestmark. Never mock a package that actually exists (stale mock = shadow). Restore or use qualified names.\""
- "- \"L1: 2026-09-16 — gitleaks-action@v2 broke in CI with 'Unexpected input(s) args' + Node v24 crash; replaced with direct CLI download + --config .gitleaks.toml. Also: CI pytest failed on undeclared deps (pathspec, json_repair) and hard imports (llama_cpp, warp_proxy_pool) that work locally because the dev venv has everything.\n  L2: CI is the honest environment: it installs only declared extras. Any module-level import of an optional dep (llama_cpp, warp_proxy_pool) or undeclared test dep (pathspec, json_repair) fails CI but passes locally — the local venv masks missing declarations. GitHub Actions also uses bash -e: a command exiting non-zero aborts before the if-check that was supposed to handle it.\n  L3: CI failures are declaration/portability bugs, not code bugs: (1) every optional import needs try/except or importorskip; (2) every test-only import needs a pyproject dev dep; (3) every workflow step capturing an expected non-zero exit needs set +e/status capture; (4) pin third-party actions or expect schema breaks (gitleaks-action args input).\""
- "- \"L1: 2026-09-16 — The global test fixture in tests/conftest.py called reset_usm() without awaiting it. reset_usm is async def, so the call returned a never-awaited coroutine and the USM singleton was NEVER cleared between tests. This single bug caused session_manager counter drift, m34_atomic concurrency flakes, model_registry data flakes, and test_first_breath failures — four unrelated-looking test groups.\n  L2: An unawaited async call is a silent no-op that looks like a reset but does nothing. The failure signature is cross-test state pollution — tests pass alone, fail in groups, and the root cause is far from the symptom. The 8 deselections in pyproject.toml had been hiding this for weeks.\n  L3: When tests fail only when run together, suspect an unawaited async reset or restore in the shared fixture FIRST. Grep for async def functions called without await in conftest.py. Never deselect a test to hide a failure — the deselection conceals the root cause and the flake spreads to every test that shares the polluted state.\""
- "- \"L1: 2026-09-16 — 29 full-suite failures were ALL stale tests from the Phase-1 nomenclature sweep (N1-N10→S1-S10, Sophia removed, node_slot→slot, roles→ROLE_CONSTANT keys). Tests still asserted sophia.get_rank()==0, get_entity_by_role('N1'), node_slot field, required={sophia,node}.\n  L2: A sweeping rename (N1-N10→S1-S10) that removes entities and renames fields invalidates every test that references the old names — but the failures surface gradually, one CI run at a time, mixed with unrelated flakes. The sweep commit (55cc454c) should have updated its own tests in the same change.\n  L3: When a large rename/removal lands, the tests that reference the old vocabulary are part of the migration — update them in the SAME commit or the debt compounds. Stale test expectations are a form of documentation drift: they describe a system that no longer exists.\""
- "- \"L1: 2026-09-17 — PR #3 cleanup sprint: full-suite pytest collected 0 tests for weeks; individual files passed. Root cause was THREE sys.modules pollution sources in test files (stale omega.library MagicMock in a1-a5, spec_from_file_location bare names, missing mcp.server.transport_security mock) PLUS a global pytest.mark.anyio in conftest that made every sync test run in an async loop.\n  L2: Test isolation is a shared-resource problem: sys.modules is process-global, env vars are process-global, and a global pytestmark changes execution context for ALL tests. Any test that mutates these without restore breaks every subsequent test in the suite — and the failure manifests far from the cause (ModuleNotFoundError in unrelated files).\n  L3: When a full suite fails to collect but individual files pass, suspect sys.modules/env/global-mark pollution FIRST. Grep for sys.modules[ mutations, spec_from_file_location with bare names, and global pytestmark. Never mock a package that actually exists (stale mock = shadow). Restore or use qualified names.\""
- "- \"L1: 2026-09-17 — gitleaks-action@v2 broke in CI with 'Unexpected input(s) args' + Node v24 crash; replaced with direct CLI download + --config .gitleaks.toml. Also: CI pytest failed on undeclared deps (pathspec, json_repair) and hard imports (llama_cpp, warp_proxy_pool) that work locally because the dev venv has everything.\n  L2: CI is the honest environment: it installs only declared extras. Any module-level import of an optional dep (llama_cpp, warp_proxy_pool) or undeclared test dep (pathspec, json_repair) fails CI but passes locally — the local venv masks missing declarations. GitHub Actions also uses bash -e: a command exiting non-zero aborts before the if-check that was supposed to handle it.\n  L3: CI failures are declaration/portability bugs, not code bugs: (1) every optional import needs try/except or importorskip; (2) every test-only import needs a pyproject dev dep; (3) every workflow step capturing an expected non-zero exit needs set +e/status capture; (4) pin third-party actions or expect schema breaks (gitleaks-action args input).\""
