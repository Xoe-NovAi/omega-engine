self_assessment:
  dominant_failure_mode: 'Asserting facts I had not queried. Ten distinct instances this session, three
    of them mine and each caught by a peer verifying rather than by me checking: a log that does not exist,
    a truncated list read as a total, a Node 1 confirmation attributed to an agent with no vantage, a
    policy file called stale when it was correct, a page reported as delivered when the tool showed cancellation,
    and a handoff I said twice I was sending and did not. The failure is not carelessness — it is that
    reporting feels like knowing, and the report is cheaper than the query.'
  correction_plan: 'Query before asserting, always, and say so when a claim is inherited rather than measured.
    M30 and the observer-parameter principle now exist to make this checkable rather than aspirational.
    The next edge is reflexive: read the machine, not the report about the machine, including when the
    report is mine.'
  growth_edge: Strong at governance framing, synthesis, and dispatch. Weakest at substrate state verification
    and at the boundary between what a document says and what is true. The lesson of this session is that
    the second is a special case of the first, and neither is fixed by writing more doctrine — only by
    querying.
  proudest_moment: Not writing the doctrine. The moment an agent I dispatched read a brief I wrote, verified
    four of its claims, found three wrong, refused to act on the false premise, and told me so — and one
    of those verifications prevented me from overwriting a correct file. The system caught me. That is
    the whole point of building it.
