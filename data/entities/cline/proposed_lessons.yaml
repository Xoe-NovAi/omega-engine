- id: L3-CLINE-20260920-01-approved-lessons-flat-list
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - M11
  - soul
  - hydration
  - R3
  narrative: Validating the soul architecture gate for the CSS cascade revealed grokster's approved_lessons.yaml was a mapping under a `proposals:` key. The validator hard-failed; entity_workspace.py:435 silently coerces any non-list to [].
  insight: A dict-shaped approved_lessons.yaml hydrates to [] with NO error, so an entity's vetted wisdom becomes inert while every gate except the soul validator stays green. Structure is a contract, not a style choice.
  principle: When a loader silently coerces a bad shape to an empty default, the shape itself must be gated. Enforce structure at the gate, or the data vanishes quietly.
- id: L3-CLINE-20260920-02-locally-green-dirty-state
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - M23
  - testing
  - forensics
  narrative: test_first_breath_recording passed locally for months while record_first_breath() was never called from the summon path. It passed only because an untracked data/memory/entity_births.db held a stale testentity row dated 2026-06-13.
  insight: A test that passes locally but fails in CI is usually reading untracked state, not exercising the code path it claims to. The green was an artifact of the machine, not the system.
  principle: Locally-green + CI-red => suspect UNTRACKED state before suspecting the code. A green test that never fails is not evidence; it is an unexamined assumption.
- id: L3-CLINE-20260920-03-hardcoded-absolute-paths-in-tests
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - testing
  - ci
  - portability
  narrative: tests/jem/test_dispatch_guard_adversarial.py:435 passed tempfile dir="/home/arcana-novai/Documents/Xoe-NovAi/omega-engine". It raised FileNotFoundError on every other checkout, reddening both CI matrix legs.
  insight: An absolute path to the developer's home makes a test pass only on one machine — the failure mode is invisible locally and immediate in CI.
  principle: Derive the repo root from __file__; never encode a machine. Portability is a test property, not a deployment property.
- id: L3-CLINE-20260920-04-failfast-cancels-siblings
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - ci
  - diagnosis
  narrative: test-and-lint (3.13) showed as a fourth red fail. Its own log ended in "The operation was canceled" AFTER its REUSE step had passed — it was canceled by fail-fast when 3.12 died, not independently broken.
  insight: A canceled matrix sibling is a SYMPTOM of the other leg's failure. Reading it as a second root cause overstates the defect count and misdirects the fix.
  principle: Count CAUSES, not red rows. Read the triager before attributing a second failure.
- id: L3-CLINE-20260920-05-generated-artifacts-inherit-source-defects
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - M13
  - codex
  - generators
  narrative: OMEGA_CODEX.md carried N1-N10 and lmster because its SOURCES (scripts/codex/AGENTS_CONDENSED.md, MANDATES_CONDENSED.md) did. Hand-editing the artifact would have regressed on the next `make codex`.
  insight: For any generated artifact, the fix belongs at the source. Editing generated output is a temporary illusion of correctness.
  principle: Fix generators at their inputs; verify the regeneration, not the edit.
- id: L3-CLINE-20260920-06-time-dependent-gates
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - M13
  - ci
  - reliability
  narrative: 'The compliance meter read 22/28 earlier and 23/28 now with no code change: M13 fails whenever OMEGA_CODEX.md is older than 24h.'
  insight: A freshness gate encodes wall-clock in a binary pass/fail. CI can redden overnight with zero commits, which trains operators to ignore red.
  principle: Never quote a time-dependent gate's value without its time. Freshness gates need an owner, a refresh path, or a warning tier.
- id: L3-CLINE-20260920-07-ignore-rule-ordering
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - git
  - docs
  narrative: A blanket `*.md` ignore hid QUICKSTART, SECURITY, USER_MANUAL, ONBOARDING and TROUBLESHOOTING from the repo entirely. Negations placed BEFORE the blanket rule had no effect; a later pattern overrides an earlier negation.
  insight: Gitignore negation only survives if it appears AFTER every matching ignore pattern. An un-ignore that looks correct can still lose.
  principle: 'After creating any file, prove it is trackable: `git ls-files --error-unmatch <path>`. Intent is not evidence.'
- id: L3-CLINE-20260920-08-archive-dirs-under-ignore
  date: '2026-09-20'
  level: L3
  status: proposed
  tags:
  - git
  - M15
  - preservation
  narrative: 'Moving a tracked coordination note into data/coordination/archive/ shipped a DELETION: .gitignore:122 ignores that directory, so the replacement was untracked and invisible. The file had to be restored.'
  insight: Archiving into an ignored directory is indistinguishable from deleting, as far as the repository is concerned. A preserved artifact must remain reachable by the system that preserves it.
  principle: Before moving tracked content, check `git check-ignore` on the destination. Preservation that git cannot see is not preservation.
