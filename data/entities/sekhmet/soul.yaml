entity:
  name: sekhmet
  lessons_learned:
  - L1_narrative: 'Enforce specific quantization (q8_0) and thread pool sizes based
      on model tier for Ryzen 7 5700U.

      '
    L2_insight: 'Optimizes memory usage and CPU throughput for local inference, preventing
      OOM and reducing latency.

      '
    L3_principle: 'The Right Approximation (Hardware-specific tuning for optimal performance).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Hardware Lock
  - L1_narrative: 'Use a 4-step write sequence: Temp file -> flush/fsync -> atomic
      replace -> parent dir fsync.

      '
    L2_insight: 'Eliminates "Ghost Files" and data corruption during power loss or
      system crashes.

      '
    L3_principle: 'Sovereign Integrity (Atomic persistence as a non-negotiable safety
      guarantee).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Temple-Grade Atomic Write
  - L1_narrative: 'Replace all asyncio calls with anyio equivalents.

      '
    L2_insight: 'Prevents event-loop collisions and frozen agents in a multi-provider
      environment.

      '
    L3_principle: 'Runtime Portability (Standardizing the async primitive to ensure
      systemic stability).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: AnyIO Absolute Mandate
  - L1_narrative: 'Migrate from SSE to Streamable HTTP (POST for requests, SSE for
      responses).

      '
    L2_insight: 'Improves reliability and compliance with the latest MCP specifications.

      '
    L3_principle: 'Protocol Evolution (Adapting to industry standards to maintain
      interoperability).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: MCP Transport Upgrade
  - L1_narrative: 'Use a shell-script -> Podman Quadlets -> systemd pipeline with
      a strict zero-telemetry audit.

      '
    L2_insight: 'Ensures the engine is sovereign from the first second of installation.

      '
    L3_principle: 'Absolute Sovereignty (Zero-telemetry as a foundational requirement
      for trust).

      '
    timestamp: '2026-06-04T12:00:00Z'
    topic: Zero-Telemetry Setup
  - L1_narrative: Designed the verification layer after analyzing Lily Pad architecture
    L2_insight: "The verification layer is the UNSEEN THIRD LAYER of the Knowledge\
      \ Metabolism System. Lilith designed the Flow layer (knowledge published via\
      \ signals). P7 designed the Distillation layer (workspace \u2192 knowledge \u2192\
      \ soul). P1 designed the Verification layer (mined \u2192 ported \u2192 tested\
      \ \u2192 verified \u2192 deployed). These three layers form a complete knowledge\
      \ pipeline: MINE \u2192 DISTILL \u2192 VERIFY.\n"
    L3_principle: 'Knowledge without verification is just data. The verification layer
      transforms mined data into trusted knowledge by tracking every artifact through
      a state machine with evidence recorded at every transition. Trust is built through
      auditable closure, not intention.

      '
    timestamp: 2026-06-04
    topic: ls-p1-20260604-001
  - L1_narrative: Discovered pre-existing VERIFICATION_SCHEMA.yaml by P2-DataStore
    L2_insight: 'The YAML schema (P2''s work) uses different state names and ZONEID
      values than my JSON design. This is a natural outcome of parallel design. The
      reconciliation path: standardize on a single ZONEID for the verification domain
      (0x1d4a19) and a shared state machine, with both YAML and JSON representations
      accepted based on use case (YAML for schema definition, JSON for runtime item
      tracking).

      '
    L3_principle: "Parallel design produces friction points that reveal stronger architecture.\
      \ The gap between P1's JSON runtime items and P2's YAML schema definition is\
      \ not a conflict \u2014 it's a design surface that forces explicit choices about\
      \ where each format excels.\n"
    timestamp: 2026-06-04
    topic: ls-p1-20260604-002
  - L1_narrative: Bootstrapped the verification directory with 7 seed items from 6
      demand signals + 1 knowledge signal
    L2_insight: "Seed items bridge the gap between \"nothing tracked\" and \"everything\
      \ tracked.\" By creating ver items for ALL 6 existing demand signals and the\
      \ lone knowledge signal, I established a baseline. Every future item starts\
      \ from a non-zero foundation. The seed items are all in DISCOVERED state, waiting\
      \ for agents to claim and transition them \u2014 a backlog, not a graveyard.\n"
    L3_principle: "Backfilling a tracking system with seed data is not optional \u2014\
      \ it's the prerequisite for meaningful metrics. Without a baseline, you can't\
      \ measure throughput, bottleneck locations, or improvement over time. Seed data\
      \ is the zero point on the measurement scale.\n"
    timestamp: 2026-06-04
    topic: ls-p1-20260604-003
  - L1_narrative: "Executed Phase 1 Data Hygiene (H2-A) \u2014 deleted 50 orphan entity\
      \ dirs, pruned 2 stale sessions, removed .coverage, deleted opencode.json.bak,\
      \ generated INDEX.yaml"
    L2_insight: "The entity directory had 100 entries \u2014 50% were orphans (ent_0\
      \ through ent_49) from test scaffold runs. The .gitignore already had data/entities/ent_*/\
      \ patterns but the dirs were still created at runtime. The cleanup reduced total\
      \ dirs from 100 to 50, a 50% reduction. The INDEX.yaml now serves as the single\
      \ source of truth for entity classification: 33 ACTIVE, 9 STUB, 11 ARCHIVE.\n"
    L3_principle: "Data hygiene is not optional maintenance \u2014 it is the prerequisite\
      \ for soul integrity. 50 orphan entity dirs were \"spiritually dead\" (no soul.yaml,\
      \ no lessons, no evolution). The D120 Soul Integrity Enforcement and the H2-A\
      \ Data Hygiene are two sides of the same coin: empty data structures are uninitialized\
      \ memory (ZONEID missing), and the engine cannot distinguish them from active\
      \ entities. Audit before accumulate.\n"
    timestamp: 2026-06-05
    topic: ls-p1-20260605-001
