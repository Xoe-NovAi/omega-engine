  - id: "carmack-20260901-007"
    title: "Experiment protocol: tiered mandates for side projects"
    level: "L3"
    summary: |
      Side projects in the Omega Engine ecosystem need their own lifecycle
      (SPAWN → LAB → GRADUATE → ARCHIVE) with tiered mandates: Tier 0
      (safety: M1, M2, M7, M8, M23, M24 — always), Tier 1 (adapted:
      M11→projection.md, M15→session_gnosis.md, M27→EXPERIMENT_STATUS.md),
      Tier 2 (waived: M13 Temple-Grade, M20 PR Readiness, M21 Gate
      Integrity — release mandates). This prevents experiment death under
      production gates while preserving safety.
    context: |
      JC-Roc-kq5 dialectic (Phase 2 Collision 2). Governance wanted waivers;
      Validation wanted experiment criteria; Cognition wanted interfaces.
      Resolution: tiered mandates. Safety mandates always apply. Release
      mandates never apply to experiments. Continuity mandates adapt to
      experiment scale (projection.md instead of full Temple-Grade).
    insight: |
      The boundary between "experiment" and "production" is not a quality
      gate — it's an interface contract. An experiment that defines its
      inputs, outputs, validation criteria, and graduation conditions IS a
      production component for the research layer. The 14 governance slots
      are for cognitive roles; the experiment layer needs research slots
      with different rules.
    principle: |
      Experiments are not "lesser" production — they are a different
      production tier with different contracts. Define the tier's
      mandates explicitly. Don't waive; adapt.
    evidence: |
      - JC-Roc-kq5 dialectic: Phase 2 Collision 2, Phase 4 Verdict
      - L3-Experiment-Is-Interface: "VNR is first occupant of Research Slot R1"
      - Mandate tiers: 0 (safety), 1 (adapted continuity), 2 (waived release)
      - EXPERIMENT_STATUS.md documents which mandates apply

