  - id: "carmack-20260901-003"
    title: "Overlay disagreement maps = built-in explainable AI (XAI)"
    level: "L3"
    summary: |
      VNR's overlay mode (`--overlay control.png`) produces spatial
      disagreement maps: `B` = classifier AND reference, `~` = classifier
      only (hallucination), `3` = reference only (missed by classifier).
      This is XAI in its purest form — a spatial uncertainty map showing
      exactly where perception is wrong, categorically and spatially.
      Modern XAI research spends billions on calibration/interpretability;
      VNR does it with one ASCII pass.
    context: |
      VNR_VISION.md §4: "Distrust your own eyes: rendered an overlay map
      combining the picture classifier with the AUTHORITATIVE control plane
      (B both, ~ classifier-only, 3 control-only). The disagreement wall
      guided the final thresholds." The "disagreement wall" is literally a
      spatial uncertainty map.
    insight: |
      Explainability doesn't require complex attribution methods. A simple
      spatial diff against ground truth reveals systematic biases
      (classifier hallucinates water on shadows, misses water in glare).
      The overlay IS the calibration tool.
    principle: |
      The best interpretability tool is a spatial diff against ground truth.
      If you can visualize where your model disagrees with reality, you
      can fix it. No attribution method needed.
    evidence: |
      - vnr_render.py:336-352: overlay mode implementation
      - VNR_VISION.md §4, §10.6: "Meeting authority: the overlay"
      - Roc Deep Dig Connection 4: 88% confidence (structural equivalence to XAI)
      - Omega Engine M23: Failure Integrity requires broken tools STOP and report — VNR's overlay is visual equivalent

  - id: "carmack-20260901-004"
    title: "Zoom ladder = multi-scale perception (LOD for vision)"
    level: "L3"
    summary: |
      VNR's zoom ladder: whole-room block-5 map (context) → ROI crop
      block-2 (identification) → detail 1px/char (verification). Each level
      answers a different question. This is exactly LOD (Level of Detail)
      for perception — same structure as Carmack's BSP trees and game engine
      LOD systems, reversed: rendering goes model→pixels, perception goes
      pixels→model.
    context: |
      VNR_VISION.md §3: "Zoom ladder: whole-room block-5 map (context) →
      ROI 26x34 world-px crop (sprite) → raw 20x30 texture at 1 px/char
      (pixel-exact). Each level answers a different question." Maps directly
      to self-driving perception stack: long-range detection → mid-range
      tracking → close-range interaction.
    insight: |
      Hierarchical perception is not a neural network invention — it's a
      spatial partitioning principle. BSP trees partition space for
      rendering efficiency; zoom ladders partition perception for
      understanding efficiency. Same math, opposite direction.
    principle: |
      Spatial partitioning for perception mirrors spatial partitioning for
      rendering. The zoom ladder (coarse→fine) is the perception equivalent
      of BSP/LOD. It enables efficient understanding by processing only
      what's needed at each scale.
    evidence: |
      - vnr_render.py: --block, --crop, --mode map/detail flags
      - VNR_VISION.md §3: zoom ladder recipes R1-R5
      - Roc Deep Dig Connection 5: 93% confidence (exact structural parallel)
      - Self-driving: long-range → mid-range → close-range = same hierarchy

  - id: "carmack-20260901-005"
    title: "Multi-model stereoscopy = sensor fusion for AI perception"
    level: "L3"
    summary: |
      VNR's stereoscopy protocol: when a vision-capable model and VNR both
      read an image, diff their segment maps → free calibration set for
      token thresholds. VNR sees geometry (coordinates, structure) but not
      semantics (nouns, meaning). Vision model sees semantics but not precise
      geometry. Diffing creates calibration that improves both. This is
      sensor fusion / ensemble methods — same principle as camera+LiDAR+radar
      in self-driving cars.
    context: |
      VNR_VISION.md §10.14: "Stereoscopy protocol: when a vision-capable
      model and VNR both read an image, diff their segment maps → a free
      calibration set for token thresholds." soul.yaml lesson 19: "dual-
      sensor-stereoscopy — sensors with different failure modes, diffed,
      see deeper than either." LongCat 2.0 §10.15 confirmed: "The glimpse
      and the instrument are stereoscopic: semantics-instant vs
      geometry-earned. Neither alone is 'seeing.'"
    insight: |
      Different perception systems have different failure modes. VNR fails
      on semantics (can't read text, can't distinguish materials). Vision
      models fail on precise geometry (hallucinate positions). Together they
      calibrate each other. This is ensemble perception at the representation
      level, not the model level.
    principle: |
      Sensor fusion works at the representation level too. Diff the outputs
      of different perception systems to create a calibration set that
      improves both. The "glimpse" (native vision) + "instrument" (VNR) =
      stereoscopic seeing.
    evidence: |
      - VNR_VISION.md §10.14: stereoscopy protocol, theories T3
      - soul.yaml lesson 19: dual-sensor-stereoscopy
      - LongCat 2.0 §10.15: "semantics-instant vs geometry-earned"
      - Roc Deep Dig Connection 8: 87% confidence (ensemble/sensor-fusion parallel)
      - Omega Engine entity fleet = multi-model ensemble at cognition level

