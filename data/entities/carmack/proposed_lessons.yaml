  - id: "carmack-20260901-009"
    title: "Defect detection without training data — geometric reasoning finds bugs"
    level: "L3"
    summary: |
      VNR detected the "headless Graham" bug (Godot rendering pipeline
      dropping head pixels) through purely text-based geometric reasoning:
      shape filter on screenshots found no cap-shaped silhouette. The
      sprite texture HAS head; composite HAS head; screenshot NO HEAD.
      A neural vision model would need labeled training data to find this.
      VNR found it through geometric reasoning about expected shape —
      defect detection without training data.
    context: |
      VNR_HEADLESS_GRAHAM_STUDY_20260901.md: "Something in Godot's
      rendering pipeline between texture and screen is stripping the head."
      LongCat review: "sprite texture: HAS head. composite: HAS head.
      screenshot: NO HEAD." VNR's cap-red `--find` located head in texture;
      shape filter on screenshots found zero cap-shaped blobs.
    insight: |
      Geometric reasoning about expected shapes can detect rendering bugs,
      manufacturing defects, medical anomalies, satellite imagery changes
      — without any training data. The defect is a violation of geometric
      expectation, not a learned pattern. This generalizes far beyond
      game rendering.
    principle: |
      If you know what a correct output SHOULD look like geometrically,
      you can detect defects by checking for geometric violations — no
      training data needed. The expected shape is the specification; the
      deviation is the defect.
    evidence: |
      - VNR_HEADLESS_GRAHAM_STUDY_20260901.md: full investigation
      - vnr_render.py:186-192: cap_find() for Graham's cap-red (216,38,38)
      - player.gd:81-119: _debug_dump() produces raw + composited for vision
      - Roc Deep Dig Connection 10: 86% confidence (general class of problem)

  - id: "carmack-20260901-010"
    title: "Side project coordination: default-silent, trigger-on-deliverable"
    level: "L3"
    summary: |
      Experiments should be silent by default (coordination in local
      COORDINATION.md). Hivemind posts only on deliverables:
      `intent="experiment_result"`. Roc (miner) always posts
      `intent="research"`. Cline-KQV posts `intent="status"`. Full
      Hivemind registration only on graduation to WAD. This preserves
      focus while ensuring fleet learns from results.
    context: |
      JC-Roc-kq5 dialectic (Phase 2 Collision 3). Orchestration wanted
      Hivemind integration; Observability said file-based is enough;
      Context said local continuity sufficient. Resolution: default-silent,
      trigger-on-deliverable. Roc's mandate ensures mining visibility.
      Graduation gate prevents premature integration.
    insight: |
      Coordination noise kills focus. The right protocol is: work silently
      in your lab; announce only when you have a result worth sharing.
      The fleet doesn't need to know about every autopilot run — only
      about the VNR method, the stereoscopy protocol, the defect detection
      capability.
    principle: |
      Default-silent preserves focus. Triggered-posting ensures fleet
      learns. Graduation gate prevents premature integration. Coordination
      is a cost; pay it only for value delivered.
    evidence: |
