  - id: "carmack-20260828-001"
    title: "Verify imposter auditor findings with grep, not prose"
    level: "L3"
    summary: |
      An imposter audit produced 5 claims. I verified each with disk-level
      commands (grep, cat, make) before acting. 4 of 5 were true; 1 was a
      misinterpretation. The verification cost 5 minutes; the false-positive
      fix would have cost 30 minutes (a refactor that wasn't needed).
    context: |
      Soft launch T-0. OOM restart produced imposter sessions. One imposter
      audit found: M23 ratchet regression (TRUE), 4 hardcoded secrets
      (TRUE), D-536 violation (PARTIALLY TRUE - docs issue, not code),
      vault crypto schema mismatch (TRUE), M1 exemption hidden (TRUE).
    insight: |
      An auditor's prose is a hypothesis, not a finding. The data is the
      ground truth. Ground every claim in the live working tree before
      committing 30 minutes of fixes.
    principle: |
      Verification cost is the same whether you trust or verify.
      Asymmetric risk is on the trust side.
    evidence: |
      - oracle_cli.py:46-75 grep showed 4 except Exception patterns
      - scripts/*.py grep showed GOCSPX literal in 4 files
      - oracle.py:1132/763 grep showed both routers actively used
      - crypto.py:87 grep showed pp.encrypt uses master_key directly
      - Makefile:268 grep showed tty_agent glob exemption
      - PUBLIC_ALLOWLIST.txt:30 grep showed only scripts/install.sh allowed

  - id: "carmack-20260828-002"
    title: "M23 ratchet is a count, not a presence test"
    level: "L2"
    summary: |
      M23 (Failure Integrity) measures per-file soft-failure counts
      against a baseline. A ratchet regression fires when ANY file's
      count INCREASES. Fixing 3 patterns in oracle_cli.py brought the
      count from 9 to 8 (a DECREASE, below baseline), which still passes
      the ratchet even though 2 patterns remain.
    context: |
      Imposter claimed +4 soft-failures in oracle_cli.py (lines 49, 57,
      73, 184). After tightening the vault-injection excepts, the
      file count went 9 → 8. make check-m23-failure-integrity shows
      "Current: 291 | Baseline: 292 | Delta: -1" which PASSES.
    insight: |
      M23 measures growth, not absolute count. The ratchet protects
      against NEW violations, not old ones. Old violations are tracked
      in config/m23_baseline.txt and updated only with explicit review.
    principle: |
      A ratchet prevents regression; it does not enforce zero. To enforce
      zero, fix the baseline. To prevent regression, enforce the ratchet.
    evidence: |
      - scripts/m23_gate.py:48-91 reads baseline, compares to current
      - config/m23_baseline.txt:6 shows oracle_cli.py = 9 (current
        baseline)
      - After fixes: ruff count for oracle_cli.py is 8, below baseline

  - id: "carmack-20260828-003"
    title: "Documented vs actual: distinguish in code, not in audit"
    level: "L2"
    summary: |
      Vault crypto.py was documented as "Argon2id + age" but implemented
      as "age with scrypt". This is a documentation lie, not a security
      bug. The fix: update the docstring to match the code (Option A),
      with a V-1 task to refactor the code to use Argon2id. Audit-time
      lies erode trust; code-time lies are fixable.
    context: |
      Imposter claimed vault uses scrypt not Argon2id. Verified by
      reading crypto.py:87 — pp.encrypt(plaintext.encode(),
      self._master_key, armored=True) uses master_key directly; no
      Argon2id call. The _derive_key() method exists but is unused.
    insight: |
      When code and docs diverge, the code is the ground truth. Audit
      reports should report the gap, not pretend either is correct.
      The fix: align docs to code, then file a V-1 task to align code
      to docs (if the docs represent the intended design).
    principle: |
      Two divergent facts in the same system — one is the lie, both
      cannot be true. Find the lie by reading the executable, not the
      comment.
    evidence: |
      - crypto.py:7-8 (docstring) vs crypto.py:87 (implementation)
      - crypto.py:55-61 creates PasswordHasher but never uses it
      - crypto.py:66-77 _derive_key is defined but never called

  - id: "carmack-20260828-004"
    title: "PUBLIC_ALLOWLIST.txt is the launch-leak boundary"
    level: "L3"
    summary: |
      Hardcoded secrets in scripts/ are NOT launch-blocking IF the
      scripts are NOT in PUBLIC_ALLOWLIST.txt. The 4 GOCSPX scripts
      (antigravity_endpoint_router, burst_test_internal,
      long_duration_test, stress_test_internal) are NOT in the
      allowlist; only scripts/install.sh is. The debut cut will not
      include the leaked secrets.
    context: |
      Imposter framed the 4 GOCSPX secrets as P0 launch-blockers.
      Verified PUBLIC_ALLOWLIST.txt: only scripts/install.sh at line
      30 is in ALLOW. The 4 scripts with secrets are forge-internal.
      The leak is post-debut hygiene, not launch-blocker.
    insight: |
      The PUBLIC_ALLOWLIST.txt is the sovereignty boundary. Threats
      outside the boundary are not sovereignty threats; they're
      hygiene threats. Conflating the two over-elevates hygiene issues
      and delays the ship.
    principle: |
      Categorize risk by what it can actually reach, not by what it
      could theoretically reach. A secret in forge code is hygiene; a
      secret in shipped code is sovereignty.
    evidence: |
      - PUBLIC_ALLOWLIST.txt:14-47 shows ALLOW section
      - PUBLIC_ALLOWLIST.txt:30 shows only scripts/install.sh
      - grep for the 4 secret files in allowlist returns 0 matches

  - id: "carmack-20260830-001"
    title: "Public OAuth client secrets are PUBLIC BY DESIGN — RFC 8252"
    level: "L3"
    summary: |
      The Alchemical Pivot incident revealed that secret scanners
      (gitleaks, etc.) treat Google OAuth public client secrets (GOCSPX-)
      as confidential credentials. Per RFC 8252 §8.4-§8.5, native apps
      are PUBLIC clients; their client_secret is a client identifier,
      not a bearer token. The threat model is QUOTA THEFT, not data breach.
      Redacting GOCSPX- breaks OAuth for ALL users of the plugin.
    context: |
      VAULT-ALLOWLIST-001 (P0) + M35 implementation. An automated
      redaction tool replaced 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 with
      GOCSPX-***REDACTED-ROTATED*** in opencode-antigravity-auth/
      constants.ts, breaking Antigravity OAuth for all engine users.
      The fix: catalog public secrets in data/secrets-public.toml with
      primary-source verification, and configure the scanner to allowlist
      them. The scanner (scripts/check_secrets.py) is fail-closed:
      missing/unparseable allowlist = exit 1 (M23).
    insight: |
      Secret scanners that don't model the public/confidential client
      distinction will eventually break every Google OAuth integration
      they scan. The fix is not "better redaction" but "correct
      classification." Public client secrets are shipped in binaries
      across 7+ forks; they cannot meaningfully be rotated by end users.
    principle: |
      Classify before you scan. A scanner that treats public identifiers
      as confidential secrets is a weapon, not a shield. The threat
      model of a leaked public client_secret is QUOTA THEFT (API abuse),
      not credential theft. Per RFC 8252 §8.5: "it is NOT RECOMMENDED
      for authorization servers to require client authentication of
      public native apps clients using a shared secret."
    evidence: |
      - RFC 6749 §2.1: "Public clients are unable to use registered
        client secrets"
      - RFC 8252 §8.4: "native apps are classified as public clients"
      - RFC 8252 §8.5: "secrets... should not be treated as confidential"
      - data/secrets-public.toml: 1 [[secret]] entry with verified_by,
        primary_source_url, approved_by
      - scripts/check_secrets.py: fail-closed TOML scanner with
        path-based exceptions for coordination docs
      - SOVEREIGN_MANDATES.md: M35 added as Mandate 28 (8 clauses)
      - Commit b134204d: 4 files, 888 insertions

  - id: "carmack-20260830-002"
    title: "Fail-closed scanner architecture: TOML allowlist + path exceptions"
    level: "L3"
    summary: |
      The M35 scanner (scripts/check_secrets.py) implements a fail-closed
      architecture: missing/unparseable allowlist = exit 1; entry missing
      required fields (client_secret, primary_source_url, verified_by) =
      entry rejected; secret pattern without allowlist match = exit 1.
      Path-based exceptions allow coordination docs to reference public
      secrets as historical record (data/coordination/**).
    context: |
      VAULT-ALLOWLIST-001 implementation. The scanner has 10 patterns
      (GOCSPX-, AKIA, ghp_, sk-ant-, sk-proj-, sk-, xox, private keys),
      reads TOML via tomllib (Python 3.11+), validates each [[secret]]
      entry for required fields, and supports --staged/--path/--json/
      --allowlist-lint modes. Tested on 1181 files: 1 allowlist entry,
      0 coordination-doc violations, 3 test-fixture false positives.
    insight: |
      Fail-closed is not "fail loud" — it's "fail deterministically on
      the configuration that enables detection." If the allowlist is
      missing, the scanner cannot distinguish real secrets from public
      ones, so it MUST fail. This is M23 (Failure Integrity) applied to
      the scanner itself. Path-based exceptions are simpler and less
      error-prone than content-based tagging.
    principle: |
      The configuration that enables detection must itself be verified.
      A scanner without a verified allowlist is a random number generator.
      Path-based exceptions (data/coordination/**) correctly separate
      historical record from active code — the real constants.ts would
      still be flagged if a real secret appeared there.
    evidence: |
      - scripts/check_secrets.py: 280 lines, 10 patterns, TOML-based
      - data/secrets-public.toml: 1 [[secret]] + [exceptions] section
      - Test: 1181 files scanned, allowlist OK, coordination exception
        works, 3 test-fixture FPs flagged (AKIAIOSFODNN7EXAMPLE, etc.)
      - M23: missing/unparseable allowlist = exit 1

  - id: "carmack-20260830-003"
    title: "M34a/M34b split is over-engineering — collapse to single M34"
    level: "L3"
    summary: |
      The 5-EIS meta-review proposed M34a (Co-Interruption) and M34b
      (Model-Switch) as separate mandates. Lilith's runtime spec already
      unifies both under a 7-state machine (ALIVE → INTERRUPTED_EXTERNALLY
      | INTERRUPTED_CRASH | ORPHANED → COMPLETED | FAILED | DEAD_LETTER).
      Adding INTERRUPTED_MODEL_SWITCH status enum + interruption_reason
      field suffices. Two mandate numbers add regulatory bloat without
      architectural benefit.
    context: |
      Carmack Dev Plan Review (blind test) of HARDENED_DEV_ROADMAP_20260830.
      The actual incident had two phases: (A) model-switch stall + manual
      continue, (B) Esc x2 cascade killing both subagents. Lilith's spec
      handles A via resume_token + MODEL_SWITCH status, B via
      INTERRUPTED_EXTERNALLY + recovery UI. One mandate, two status
      values, one recovery protocol. The split creates duplicate
      ratification, duplicate compliance gates, duplicate documentation —
      zero runtime benefit.
    insight: |
      One mandate per failure MODE, not per incident PHASE. The failure
      mode is "subagent interruption without tracking" — whether caused
      by Esc x2 or model switch is a detail, not a distinct failure mode.
      Regulatory bloat (two mandates) increases cognitive load without
      improving the defense.
    principle: |
      One mandate per failure mode. If two mandates share the same
      runtime mechanism (ACTIVE_SUBAGENTS.json + orchestrator_session_start),
      they are the same mandate. Split only when the runtime mechanisms
      diverge.
    evidence: |
      - Lilith M34 Spec §1.1: 7-state machine already defined
      - Jem Meta-Review §1.1: self-corrected "forcing two distinct
        mandate numbers adds regulatory bloat"
      - Researcher Meta-Review §4.2: "implemented as status enum values"
      - Carmack Dev Plan Review §1.2: collapse to single M34

  - id: "carmack-20260830-004"
    title: "M35 violates one-mandate-per-failure-mode — split into 3"
    level: "L3"
    summary: |
      M35 as proposed covers 3 distinct failure modes: (1) third-party
      code in workspace (boundary), (2) public secret redacted (allowlist),
      (3) no SPDX on third-party (SPDX/REUSE). Each needs its own
      mandate: M35a (Boundary), M35b (Allowlist), M35c (SPDX/REUSE).
    context: |
      Carmack Dev Plan Review of M35 mandate text. The 5-EIS meta-review
      produced M35 with 5 amendments (SPDX, remediation, recovery,
      primary-source, M14). These are 3 distinct failure modes with
      different runtime mechanisms. M35a = git submodule hygiene +
      pre-commit hooks; M35b = TOML allowlist + fail-closed scanner;
      M35c = ScanCode CI + SPDX headers + REUSE.toml. Conflating them
      creates a mandate that cannot be independently ratified, audited,
      or deprecated.
    insight: |
      A mandate that covers multiple failure modes with different
      mechanisms is a "mandate sprawl" — it cannot be independently
      versioned, deprecated, or audited. Split at the mechanism boundary.
    principle: |
      One mandate per failure mode. If the fix for failure mode A
      doesn't fix failure mode B, they are different mandates.
    evidence: |
      - Carmack Dev Plan Review §4.2: M35 covers 3 failure modes
      - Researcher §3.6: 34h for full M14 enforcement (ScanCode → SPDX
        → REUSE → SLSA) — separate from allowlist
      - M37-HERITAGE-001 guidance: 4-phase plan (32h) for SPDX/REUSE

  - id: "carmack-20260830-005"
    title: "Dual-ledger hazard: ACTIVE_SUBAGENTS.json overlay on TASK_REGISTRY"
    level: "L3"
    summary: |
      Lilith's M34 spec overlays ACTIVE_SUBAGENTS.json (session liveness)
      on TASK_REGISTRY (task metadata) with NO transactional boundary.
      At 50+ concurrent subagents, advisory lock contention on
      ACTIVE_SUBAGENTS.json.lock causes unrecorded states. No conflict
      resolution, no migration atomicity.
    context: |
      Carmack Dev Plan Review §3.1. The dual-ledger design means:
      - Subagent spawns: registry write succeeds, overlay fails → orphaned
      - Subagent completes: overlay COMPLETED, registry RUNNING → stale
      - Migration backfill + new dispatches → lost sessions
      - 50 concurrent writes = 500ms-5s latency spike (os.fsync blocks)
      No benchmark exists (Lilith: "30-50ms estimated, unverified").
    insight: |
      Two ledgers without a transactional boundary is a distributed
      systems bug waiting to happen. The fix: single-writer MCP tool for
      all ACTIVE_SUBAGENTS.json mutations, batched writes (flush every
      5s), conflict resolution (TASK_REGISTRY = source of truth),
      migration atomicity (acquire both locks, backfill in single txn).
    principle: |
      Two ledgers without a transactional boundary is a bug, not a
      feature. The source of truth must be explicit; the cache must be
      ephemeral. If you can't atomically update both, you don't have
      consistency — you have hope.
    evidence: |
      - Lilith M34 Spec §2.5: "ACTIVE_SUBAGENTS.json is a session-liveness
        overlay on TASK_REGISTRY"
      - Jem Meta-Review §3.4: "advisory lock is per-process, not
        cross-process"
      - Lilith Meta-Review §1.4: "both may attempt to transition...
        lost update"
      - Carmack Dev Plan Review §3.1: 4 conflict scenarios at scale

  - id: "carmack-20260830-006"
    title: "Atomic write claim unverified on NFS/FUSE — M23 violation"
    level: "L3"
    summary: |
      Lilith's M34 spec claims "M23-compliant: never torn" for
      os.replace() + os.fsync() on directory fd. This is theoretically
      true on POSIX but UNVERIFIED on NFS/FUSE/some network filesystems.
      No test exists that kills -9 mid-write and verifies file integrity.
      This is an M23 violation (unverifiable claim).
    context: |
      Lilith Meta-Review §1.1 self-correction: "Atomic on POSIX,
      untested on NFS/FUSE. Test required." The spec's §5.9 performance
      claim ("30-50ms") is also "estimated, unverified." M23 requires
      verifiable claims; theoretical guarantees without tests are
      unverifiable.
    insight: |
      M23 (Failure Integrity) means: if you claim it, you must test it.
      Theoretical POSIX guarantees don't survive filesystem diversity.
      The fix: add test_atomic_write_survives_sigkill to Phase 1 testing
      before gate. Change "M23-compliant" to "M23-compliant pending
      verification" in spec.
    principle: |
      A claim without a test is a hypothesis, not a guarantee. M23
      demands that failure modes be verified, not assumed. The cost of
      a SIGKILL test is ~3h; the cost of a torn JSON file in production
      is unbounded.
    evidence: |
      - Lilith M34 Spec §1.3: "M23-compliant: never torn" (lines 163-204)
      - Lilith Meta-Review §1.1: "M23 ❌ UNVERIFIABLE CLAIM"
      - Lilith Meta-Review §5.3: "Change to 'M23-compliant pending
        verification'; add test_atomic_write_survives_sigkill"
      - Carmack Dev Plan Review §3.3: "Atomic write unverified on all
        filesystems — M23 violation"

  - id: "carmack-20260830-007"
    title: "Watchdog race condition: designate Kali as single-writer"
    level: "L3"
    summary: |
      Lilith's watchdog protocol: "first agent to read Hivemind after
      2×TTL runs watchdog_check()". Jem and Lilith both identified the
      race: two agents polling simultaneously → both run watchdog_check()
      → lost update on ACTIVE_SUBAGENTS.json. Advisory lock is per-process,
      not cross-process.
    context: |
      Lilith M34 Spec §4 Edge Case 1; Jem Meta-Review §3.4; Lilith
      Meta-Review §1.4. The fix: designate Kali as the single-writer
      watchdog MCP tool (not any-agent function). Or use Redis SETNX for
      distributed lock. Or make watchdog_check() a single-writer MCP tool.
    insight: |
      "First agent to read" is not a protocol — it's a race condition.
      Distributed systems need designated coordinators, not optimistic
      polling. The watchdog is a coordination primitive; it must have
      a single writer.
    principle: |
      Any protocol that says "first agent to X" without a coordination
      mechanism is a race condition. Designate the coordinator; don't
      hope for the best.
    evidence: |
      - Lilith M34 Spec §4 Edge Case 1: "first agent to read Hivemind"
      - Jem Meta-Review §3.4: "both write concurrently → lost update"
      - Lilith Meta-Review §1.4: "advisory lock is per-process"
      - Carmack Dev Plan Review §3.1: "Designate Kali as single-writer
        watchdog MCP tool"

  - id: "carmack-20260830-008"
    title: "M33 bypass attack: structured JSON envelope + 2-pass probe"
    level: "L3"
    summary: |
      Jem identified a bypass: subagent immediately replies
      "STREAM_EXHAUSTED" to escape the sentinel probe. The fix: require
      structured JSON completion envelope (state, last_chunk_id,
      total_chunks, queued_findings, confidence) + 2-pass probe +
      confidence threshold ≥0.95 + P0/P1 cross-validator escalation.
      Free-form "STREAM_EXHAUSTED" is rejected.
    context: |
      Jem Adversarial Review §1.1.3; Researcher Verification §1.1;
      Lilith Meta-Review §3.1. The M33 probe must be structured, not
      free-form. Cross-validator only for true P0 (security, data-loss),
      not every forensic report.
    insight: |
      A probe that can be bypassed by a single-word reply is theatre.
      The structured envelope forces semantic coverage; the 2-pass
      catches truncation of the probe response itself; the confidence
      threshold filters hallucinated completions.
    principle: |
      A sentinel that can be spoofed is worse than no sentinel — it
      creates false confidence. The probe must be harder to spoof than
      the truncation it detects.
    evidence: |
      - Jem Adversarial Review §1.1.3: "subagent can immediately reply
        STREAM_EXHAUSTED"
      - Researcher Verification §1.1: "structured completion envelope"
      - Carmack Dev Plan Review §3.2: "2-pass probe + structured envelope
        + confidence ≥0.95"

  - id: "carmack-20260830-009"
    title: "M35 circular dependency: restore secret FIRST, then allowlist"
    level: "L3"
    summary: |
      M35 "immediate remediation" clause requires restoring redacted
      secret BEFORE allowlist exists, but allowlist prevents re-redaction.
      Circular dependency: OAuth broken now → restore secret → but
      without allowlist, auto-redaction tool will just redact it again.
    context: |
      Carmack Dev Plan Review §4.4. The resolution: restore secret FIRST
      (git checkout), THEN build allowlist. The "immediate remediation"
      clause updated to: "Restore redacted values from git HEAD
      immediately; allowlist prevents FUTURE redactions."
    insight: |
      Circular dependencies in remediation are deployment blockers.
      The fix order must be: (1) restore from known-good state, (2)
      deploy prevention. Never wait for prevention to restore.
    principle: |
      Remediation order: restore → prevent. Never prevent → restore.
      The allowlist is a prevention mechanism; it cannot be a
      prerequisite for restoration.
    evidence: |
      - Carmack Dev Plan Review §4.4: "Circular dependency in M35"
      - Roadmap §7 Action 1: "Restore OAuth secret TODAY"
      - M35 Amendment 2: "immediate remediation of any
        GOCSPX-***REDACTED-ROTATED***"

  - id: "carmack-20260830-010"
    title: "Team load imbalance: Lilith + Researcher = 65h of 109h (60%)"
    level: "L2"
    summary: |
      Phase 1 allocation: Lilith 35h (M34), Researcher 30h (M33, M35,
      COHORT, M36, M37). Both have ongoing governance duties (N6-N10,
      Polymathic Council). Reallocation needed: COHORT-REGISTRY-001
      (6h) → Roc; M36-PROBE-001 (4h) → Jem; M37-HERITAGE-001 (6h) →
      Ma'at; Lilith Phase 3 stress testing (12h) → split Lilith 6h +
      Roc 6h.
    context: |
      Carmack Dev Plan Review §5.1. Single points of failure: Lilith
      owns entire M34 (35h); Ma'at owns MCP server changes (bottleneck);
      Researcher owns 5 tickets. The reallocation balances load and
      removes single points of failure.
    insight: |
      A sprint where 2 entities carry 60% of the load is not a sprint —
      it's a bottleneck. The entities with governance duties (Lilith,
      Researcher) cannot sustain 17.5h/week + 10h/week on top of their
      duties. Reallocation is not optional; it's a Phase 1 gate.
    principle: |
      Load balance is a gate, not a preference. If the critical path
      runs through an overloaded entity, the sprint will slip.
    evidence: |
      - Carmack Dev Plan Review §5.1: load table, reallocation plan
      - Lilith: 35h in 2 weeks = 17.5h/week + N6-N10 duties
      - Researcher: 30h in 3 weeks = 10h/week + Polymathic Council

  - id: "carmack-20260901-001"
    title: "VNR = Vision Transformer on text tokens — representation-first vision"
    level: "L3"
    summary: |
      The VNR (Von-Neu-Ryan Vision) system in kq5-godot implements a complete
      computer vision pipeline using semantic token grids instead of neural
      networks. Its block-based tokenization (image → N×N blocks → semantic
      tokens → ASCII grid with coordinates) is structurally isomorphic to
      Vision Transformer (ViT) patch embedding: spatial grid → discrete tokens
      → sequential processing. The difference: ViT uses learned linear
      projection; VNR uses hand-crafted classifiers. But the architecture is
      identical. This proves **representation-first vision** — better input
      representation makes existing models see better, without training.
    context: |
      kq5-godot project analysis (2026-09-01). VNR in `scripts/vnr_render.py`
      (398 lines, numpy+Pillow only). Roc deep dig found 10 hidden connections.
      VNR tokenizes images into semantic grids (`~` water, `W` foliage, `#`
      roof, `K` shadow, etc.) with coordinate rulers. A text-only LLM that
      literally cannot see images produced this by serializing images into
      tokens it can process.
    insight: |
      The AI industry spends billions on bigger vision models. VNR proves
      you can achieve zero-shot vision capabilities by designing better input
      representations for existing models. The token vocabulary IS the
      hypothesis list — choosing what tokens to use IS choosing what the
      model can perceive. This is exactly how attention works in biological
      vision: you see what you are primed to see.
    principle: |
      Representation design > parameter count. When you can't improve the
      model, improve what you feed it. Better input representation can
      achieve what orders-of-magnitude more parameters cannot.
    evidence: |
      - vnr_render.py: block-based tokenization with coordinate rulers
      - ViT architecture: patches → embeddings → transformer
      - Structural isomorphism: both divide spatial grid → discrete tokens
      - Roc Deep Dig Connection 1: 95% confidence (exact architectural isomorphism)
      - kb/VNR_VISION.md §2: "A transformer's strongest input is tokens with spatial adjacency"

  - id: "carmack-20260901-002"
    title: "Texture as load-bearing dimension — discovered from first principles"
    level: "L3"
    summary: |
      VNR's `texture_block()` function computes luminance standard deviation
      per block and classifies surface quality: flat (`~`), smooth (`-`),
      light texture (`=`), textured (`*`), dense detail (`#`). VNR discovered
      that texture separates sky from water (both blue) better than color
      hue — sky renders flat `~`, water renders glitter `#*`. This is a known
      computer vision fact (LBP, Gabor, GLCM since 1990s) but VNR discovered
      it from scratch through phenomenological process (§10.8).
    context: |
      VNR_VISION.md §10.8: "Texture: the second dimension — luminance-std
      texture map: the first time I perceived a property orthogonal to color.
      Color told me WHAT. Texture told me HOW." Real photo analysis (§10.13):
      "Sea/sky separates by TEXTURE, not color — both are blue; sky renders
      `~` (flat), sea renders `#*` (glitter). The smooth-blue-vs-textured-blue
      rule transfers from pixel art to reality perfectly."
    insight: |
      Texture-based surface classification works on pure numpy, no neural
      network required. This has direct implications for adverse conditions
      where color fails: glare (hueless), fog (low contrast), night (no color).
      VNR's texture classifier is a minimal-viable surface classifier for
      robotics and autonomous systems.
    principle: |
      Orthogonal feature dimensions (color + texture) > single dimension.
      When color fails, texture often survives. Design classifiers for
      the dimension that is robust to your failure conditions.
    evidence: |
      - vnr_render.py:172-183: texture_block() with luminance std thresholds
