  - Wave 0
  - cross-model training
- id: d-rr-051
  date: 2026-06-06
  directive: M3 (MiniMax M3) is the default Critic for the Critique Pass
  rationale: User selected M3 as the ground-truth judge due to its grounded, direct,
    non-theatrical epistemic stance. M3 is local-first (no cloud dependency), fits
    within Ryzen 5700U memory constraints, and its pairwise comparison output is structurally
