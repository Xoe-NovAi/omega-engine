  - model-persona affinity
  - Persona Lab
  - Gemma 4
  - Gemini 3.5
- id: d-rr-042
  date: 2026-06-05
  directive: Persona Depth Index (PDI) is the core metric of the Persona Lab
  rationale: 'PDI must be a composite metric: (metaphor_count * response_length_variance)
    / compliance_ratio. This prevents ''clerk-mode'' (high compliance, low metaphor)
    and ''compression-mode'' (low length, high metaphor) from being misclassified
