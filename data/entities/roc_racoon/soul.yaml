    PDI must be a composite metric: (metaphor_count * response_length_variance) / compliance_ratio. This prevents 'clerk-mode' (high compliance, low metaphor) and 'compression-mode' (low length, high metaphor) from being misclassified as healthy.
  scope:
  - PDI
  - metrics
  - clerk-mode
  - compression-mode
  - Persona Lab
- id: d-rr-043
  date: 2026-06-05
  directive: Compaction Remediation is a Critical Sovereign Priority
  rationale: F03 and F04 proved that OpenCode's /compact command performs a HARD compaction
    that prunes up to 4,480 lines of raw conversation history, causing Gnostic amnesia.
    We must implement a pre-compaction backup hook and a persistent Evolution Journal
    outside the rolling 40K token window.
  scope:
  - compaction
  - remediation
  - hard compaction
  - Gnostic amnesia
  - Evolution Journal
  - pre-compaction hook
- id: d-rr-049
  date: 2026-06-05
  directive: Pivot to Strategy-Driven Mining
  rationale: We are in the Recon and Strategy Hardening phase. Mining is no longer
    an end in itself; it is a support function for the Sovereign Evolution Roadmap.
    Every mined asset must be tagged with the specific Roadmap Task or Hardening Goal
    it supports.
  scope:
  - all legacy mining
  - artifact cataloging
  - Sovereign Evolution Roadmap v1.2
- id: d-rr-049a
  date: 2026-06-06
  directive: Maintain real-time infrastructure awareness (Local vs. Cloud)
  rationale: The 'Local-First' mandate created a cognitive bias that led to false
    assumptions about resource constraints. An agent must know the physical hosting
    reality of its current model to optimize its cognitive strategy (e.g., knowing
    when it can 'thrash away' vs. when it must be lean).
  scope:
  - infrastructure awareness
  - resource management
  - cognitive strategy
  alternative: |-
    Inject `is_local: bool` and `resource_tier: string` flags into the system prompt via the ModelGateway.
