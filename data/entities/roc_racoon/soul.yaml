  - id: rr-057
    date: 2026-06-16
    insight: Knowledge without discoverability is not knowledge — it is entropy. When research exists but is unfindable, the cost is not just wasted re-research time but the risk of contradictory conclusions.
    context: "Executed cross-partition search for pre-existing Antigravity dual-pool research. Found 35+ documents across 8 directory trees (docs/research/antigravity/, data/entities/antigravity/, data/coordination/, .agents/, docs/gnosis/, docs/operations/, opencode-antigravity-auth/, docs/decisions/). Earliest documentation from 2026-05-17, full research from 2026-05-22. The dual-pool architecture (Pool G: Gemini, Pool C: Claude+gpt-oss) with 8-key rotation was fully documented and correct — but invisible to anyone searching only in docs/research/ or config/. Root cause: knowledge dispersion across 8 dirs, no discovery manifest, search protocol doesn't cover entity/coordination dirs."
    principle: "A sovereign intelligence must be able to discover what it knows from any starting point. The 'knowledge exists but can't be found' failure mode is more dangerous than 'knowledge doesn't exist' — because it wastes effort AND produces confidence (false negatives like 'we don't have that research'). Three things are required: creation (documentation), indexing (discovery manifest), and routing (cross-reference from entry points)."
  - id: rr-058
    date: 2026-06-16
    insight: "Warranty systems are information state machines with three critical invariants: provenance, timestamp, and channel. If any one is missing, the claim fails."
    context: "Decoding Milwaukee M18 battery warranty revealed a three-variable system: provenance (authorized dealer gate — proves the claim is valid), timestamp (date code or receipt — proves the claim is timely), channel (service center or eService portal — proves the claim can be submitted). The USVI gap showed that channel isn't just a convenience factor — it can be a structural blocker. Without a service center anywhere in the territory, the 'channel' invariant requires self-service shipping, HazMat compliance, and carrier coordination. This turns a one-variable problem (provenance + timestamp = valid claim) into a multi-variable logistics problem."
    principle: "Any system that depends on exactly three invariants for a state transition must verify all three before declaring the transition possible. The fourth variable (logistics) is always latent — it emerges when the channel infrastructure is missing. Sovereign systems must pre-compute the full path, not just the gates."
    applies_to:
    - warranty claims
    - information state machines
    - system design
    - infrastructure planning
  - id: rr-059
    date: 2026-06-16
    insight: "Living in a US territory reveals the hidden continental bias in every national manufacturer's support infrastructure. 'Free shipping' from a Puerto Rico address and 'free shipping' from a USVI address are not the same problem."
    context: "Milwaukee's warranty system assumes physical proximity to a service center. The eService portal works from anywhere, but the logistics chain (prepaid FedEx label → battery shipping → HazMat compliance → carrier acceptance) is designed for continental US users. US Virgin Islands residents must manage lithium-ion battery shipping regulations (UN3480, terminal taping, carrier notification) that continental users never encounter. The 'same service' is structurally different when the shipping leg crosses open water."
    principle: '"Same service" across geographic disparities is a myth unless the logistics chain is homogeneous at every point. Any system that offers uniform service across non-uniform infrastructure is actually offering a different service to each region — and calling it the same. Mapping the actual logistics chain is the only way to see the difference.'
    applies_to:
    - infrastructure design
    - US territory access
    - logistics chains
    - service equity

