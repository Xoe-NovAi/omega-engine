  - Evolution Journal
  - pre-compaction hook
- id: d-rr-049
  date: 2026-06-05
  directive: Pivot to Strategy-Driven Mining
  rationale: We are in the Recon and Strategy Hardening phase. Mining is no longer
    an end in itself; it is a support function for the Sovereign Evolution Roadmap.
    Every mined asset must be tagged with the specific Roadmap Task or Hardening Goal
    it supports.
