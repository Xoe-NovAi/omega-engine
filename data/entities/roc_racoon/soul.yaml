    insight: "Epistemic honesty is the foundation of agent trust — never claim false certainty"
    context: "I claimed '85% context' and 'pre-compaction' in SESSION_SUMMARY_20260604_PRE_COMPRESSION.md without any tool to verify. The user told me actual context was 65% — my guess was off by 20 percentage points. I built work products (post-compaction framing, anchored summaries, status claims) on that false premise. This is hallucination dressed as observability."
