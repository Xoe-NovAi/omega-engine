- id: d-rr-055
  date: 2026-06-18
  directive: Implement and run the RECURRING_FORENSIC_HEALTH_PROTOCOL as an ongoing
    system-health process
  rationale: 'Model behavioral fingerprinting is not a one-time audit. Models change
    (drift), new models join the fleet, access channels evolve, and the complementarity
    matrix must be continuously validated. A recurring protocol ensures: (1) systematic
    extraction at defined intervals, (2) drift detection between runs, (3) statistical
    saturation gates to prevent analysis paralysis, (4) auto-generated health reports
    pushed to Hivemind. The protocol at mining_reports/RECURRING_FORENSIC_HEALTH_PROTOCOL.md
    defines the full SOP including trigger conditions, extraction windows, stop conditions,
    and deliverable templates.'
  scope:
  - forensic protocol
  - recurring extraction
  - system health
  - drift detection
  - Hivemind integration
- id: d-rr-056
  date: 2026-06-18
  directive: Every behavioral observation MUST include D9 (thinking_level) and D10
    (access_channel) attribution
  rationale: 'Both dimensions are critical for valid fingerprinting. D9 because a
    model in Direct mode looks like a different entity than the same model in CoT
    mode. D10 because access channel effects (CLI vs WebUI vs API) dominate model
    identity effects (FOCI 2026, GateScope 2026). Without both, findings are structurally
    ambiguous and the complementarity matrix is invalid. The forensics.db schema now
    includes both columns. The extraction script must populate them (default: unknown)
    and the analysis phase must filter by both dimensions.'
  scope:
  - D9 thinking_level
  - D10 access_channel
  - forensic schema
  - behavioral observation
  - extraction scripts
  - analysis filtering
- id: d-rr-057
  date: 2026-06-18
  directive: Kill heuristic classifiers in extraction phase. Store raw evidence. Classify
    in analysis phase.
  rationale: 'The pilot proved that regex-based heuristic classifiers in the extraction
    phase produce 96% bias (default fallback maps everything to "strength"). This
    corrupts the findings before analysis begins. Correct pattern: (1) extraction
    phase stores only raw evidence + source metadata + exact model attribution, (2)
    classification happens in the analysis phase using better tools (embedding comparison,
    LLM-as-judge, statistical clustering), (3) the extraction script is a data pipeline,
    not an analysis engine. Per Kali''s destroy list directive.'
  scope:
  - extraction methodology
  - classifier design
  - phase separation
  - pipeline architecture
  - Kali directive
- id: d-rr-058
  date: 2026-07-18
  directive: LLOC/HLOC nomenclature retired in favor of Meditate/MC/HMC
  rationale: 'The terms LLOC (Low Level Octave Council) and HLOC (High Level Octave Council)
    were legacy Gemini CLI terminology that collided with "LOC" (Lines of Code) and no longer
    reflected the architecture. Adopted three-tier nomenclature: Meditate (single-inference,
    cognitive-only, multi-persona — formerly LLOC), Mastermind Council (MC) (multi-subagent,
    same session, same model — formerly HLOC), Hivemind Mastermind Council (HMC) (multi-session,
    multi-model, Hivemind-coordinated — new concept). Code artifacts: lloc/ → meditate/,
    lloc-harness skill → meditate-harness skill. Per user directive: "LLOC is now /meditate.
    HLOC is now the Mastermind Council (MC). HMC is when 2+ Omegaminds from different chat
    sessions collaborate via the Hivemind." Ratified by D269.'
  scope:
  - nomenclature
  - terminology
  - Meditate command
  - Mastermind Council
  - Hivemind Mastermind Council
