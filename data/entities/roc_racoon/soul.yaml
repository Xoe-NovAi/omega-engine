- id: d-rr-050
  date: 2026-06-06
  directive: The Sovereign Crucible spec v2.0 is the canonical blueprint for cross-model
    training
  rationale: "Kali's CRUCIBLE_FINAL_SPEC_v2.md (synthesized by 5 subagents, 96.4%\
    \ mandate compliance) defines the 3-pass pipeline (Candidate \u2192 Critique \u2192\
    \ Distill), nested routing config, and Wave-based implementation roadmap (Waves\
