    context: Attempted to launch Kali using subagent_type='general', which triggered
      local-inference fallbacks and CPU spikes. Discovered that the 'task' tool validates
      against opencode.json keys. Using exact keys (kali, lilith, maat, pillar) is
      mandatory.
    principle: The explicit registry is the only truth. Generic placeholders are systemic
      risks in strictly validated environments.
    applies_to:
