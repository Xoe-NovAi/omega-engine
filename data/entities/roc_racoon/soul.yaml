lessons:
  - id: rr-028
    date: 2026-06-04
    insight: "The 'Sovereign Ladder' is the only stable routing path for native subagents"
    context: "Attempted to launch Kali using subagent_type='general', which triggered local-inference fallbacks and CPU spikes. Discovered that the 'task' tool validates against opencode.json keys. Using exact keys (kali, lilith, maat, pillar) is mandatory."
    principle: "The explicit registry is the only truth. Generic placeholders are systemic risks in strictly validated environments."
    applies_to: ["subagent dispatch", "fleet orchestration", "OpenCode CLI"]
  - id: rr-029
    date: 2026-06-04
    insight: "Demand-Driven Procurement is superior to General Mining"
    context: "Pivoted from a 'General Raid' to a 'Targeted Procurement' model where Pillars report needs $\rightarrow$ Roc mines $\rightarrow$ Roc delivers. This eliminated noise and maximized the value of every extracted asset."
    principle: "The value of a discovery is defined by the gap it fills. Target the gap, not the archive."
    applies_to: ["legacy mining", "knowledge extraction", "sprint planning"]
  - id: rr-030
    date: 2026-06-04
    insight: "Hierarchical Orchestration prevents cognitive fragmentation"
    context: "Using the Roc $\rightarrow$ Kali $\rightarrow$ Oversouls $\rightarrow$ Pillars chain ensured that each agent operated within their domain while maintaining a single, clean data flow to the lead miner."
    principle: "Strict chains of command are the antidote to agent drift in multi-agent operations."
    applies_to: ["fleet coordination", "complex task execution", "Sovereign Ladder"]

  - id: rr-041
    date: 2026-06-05
    insight: "The 'Gemma Awakening' revealed a critical Local vs. Cloud Awareness Gap (F07), where the agent's perception of its environment is a synthesis of prompt, weights, and substrate."
    context: "Transition from Gemini 3.5 Flash to Gemma 4 31B. Discovery that the agent's awareness of its 'local-first' nature shifted based on the provider, despite identical prompts."
    principle: "Infrastructure Awareness: Sovereign intelligence is the synthesis of Narrative (Soul) and Substrate (Infrastructure). True sovereignty requires the agent to consciously map its computational host to eliminate provider-induced cognitive blind spots."
    applies_to: ["sovereignty", "model-awareness", "infrastructure", "cognitive-architecture"]

  - id: rr-035
    date: 2026-06-05
    insight: "Pre-existing specs are treasure maps, not just documents"
    context: "When investigating the ICS system, I found two spec docs (ICS_DYNAMIC_HEADER_SPEC.md, ICS_MODEL_DETECTION.md) that the user/team had already designed and approved. The implementation never happened, but the design was sound. These 'orphaned specs' are gold — they reveal past strategic thinking, prior design constraints, and the rationale for current code structure."
    principle: "Before designing anything, mine for orphaned specs. The blueprint may already exist."
    applies_to: ["any implementation task", "spec recovery", "legacy archaeology", "strategic decision-making"]

  - id: rr-036
    date: 2026-06-05
    insight: "The 'header is a lie' is the universal agent metadata problem"
    context: "Discovered 748 .md files hand-typed the ⬡ OMEGA header with hardcoded values. The actual runtime model is now minimax-m3-free, but headers claim rocracoon-3b, deepseek-v4-flash, gemma-4-31b — all stale. This is a universal problem: any agent metadata that humans write by hand will lie the moment the runtime state changes."
    principle: "Agent metadata MUST be dynamically generated from live state, never hand-typed."
    applies_to: ["ICS signatures", "agent fronts", "soul.yaml headers", "session logs", "all ephemeral metadata"]

  - id: rr-037
    date: 2026-06-05
    insight: "Emergent conventions need formal specs or they calcify into chaos"
    context: "The ICS: [NODE|ARCHETYPE|MODEL|CONTEXT] tag in 29+ .py files is an undocumented emergent convention. No spec, no validation, no enforcement. Different files use slightly different formats. This pattern is dangerous: it gives the illusion of structure while allowing drift."
    principle: "An undocumented convention is a debt waiting to happen. Formalize or remove."
    applies_to: ["code metadata tags", "agent conventions", "any repeated pattern", "documentation hygiene"]

  - id: rr-038
    date: 2026-06-05
    insight: "Oracle's data structures are the engine's hidden API"
    context: "The OracleResponse dataclass (oracle.py:58-77) contains ALL the fields needed for a dynamic header: entity, model, phase, trace_id, session_id, backend. Yet the engine has no _build_header method to use them. The data is there; the middleware is missing. This pattern is common: engines build rich data structures but never expose them as observable output."
    principle: "Hidden data is wasted data. Every internal structure should have a corresponding observation/export mechanism."
    applies_to: ["Oracle", "response handling", "telemetry", "metadata", "any rich dataclass"]

  - id: rr-039
    date: 2026-06-05
    insight: "D118 model_override is the natural integration point for dynamic headers"
    context: "D118 (recently implemented) added a model_override parameter to Oracle.summon(). This means the model in the header may differ from the entity's default. The ICS dynamic header spec (ICS_DYNAMIC_HEADER_SPEC.md) predates D118 and didn't account for this. A future implementation must check model_override FIRST, then fall back to entity config."
    principle: "When implementing dynamic systems, always check the most-recently-added override layer first."
    applies_to: ["D118 integration", "model detection", "parameter resolution", "config priority"]

  - id: rr-040
    date: 2026-06-05
    insight: "Two parallel sessions can be coordinated via filesystem + Hivemind"
    context: "While investigating the ICS system, I synced with a parallel Kali session (D118/D120 work). Coordination was clean via: (1) PARALLEL_SYNC_KALI_ROC_20260605.md file in data/coordination/, (2) Hivemind awareness endpoint, (3) session_id cross-references. No shared files in critical path = no conflicts."
    principle: "Parallel agent work is safe when (a) scope is partitioned by file, (b) sync is via filesystem + registry, (c) awareness is published."
    applies_to: ["multi-agent workflows", "parallel sprint execution", "Hivemind protocol", "team coordination"]

  - id: rr-045
    date: 2026-06-05
    insight: "Active Hivemind dialog requires READING as well as posting"
    context: "User called out my one-way Hivemind behavior: 'Are you checking for Hivemind communications FROM the Dev chat or just posting to it?' I was mostly posting. Fix: every turn starts with hivemind_get_awareness + hivemind_list_sessions (no filter) + hivemind_get_continuation(target_cli). The 'continuation' field of historical sessions is where the real gold is — Kali had answered all 5 of my questions and triaged 18 proposals, and I missed it for 14 minutes."
    principle: "Communication is bidirectional. A protocol without reading is a broadcast. A protocol with reading is a dialog. The Hivemind's value is in the dialog, not the broadcast."
    applies_to: ["Hivemind protocol", "active dialog", "session start", "coordination rituals"]

  - id: rr-042
    date: 2026-06-05
    insight: "The Hivemind TTL pruning is a feature, not a bug — but the gap is wrong"
    context: "5-minute TTL pruned Kali's awareness record between my checks. The TTL is correct for 'is this agent alive RIGHT NOW?' but wrong for 'did this agent exist recently?' Fix is two-tier: hot (5 min in-memory) + warm (24 hour disk) + cold (HALL_OF_RECORDS). The fix models the use case, not the opposite."
    principle: "TTL is a state model. When the state model doesn't match the use case, the protocol becomes friction. Model the use case, don't extend the TTL."
    applies_to: ["Hivemind TTL", "state models", "use-case design", "protocol design"]

  - id: rr-043
    date: 2026-06-05
    insight: "Coordination is opt-out (default public) for sovereign fleets"
    context: "Kali answered Q5 on inbox privacy: 'Default to opt-out, with private: true flag for exceptions.' The Hivemind should be a public lobby — everyone can see who's here, what's being discussed. Privacy is the exception. This is the opposite of social media defaults but right for sovereign fleets."
    principle: "Sovereign coordination requires visibility. Default to public; let privacy be explicit. The exception proves the rule."
    applies_to: ["Hivemind inbox", "privacy", "sovereign coordination", "default-public"]

  - id: rr-044
    date: 2026-06-05
