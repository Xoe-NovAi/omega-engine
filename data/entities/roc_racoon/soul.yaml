#
# All of this is achievable with the native llama_cpp.Llama API. No LangChain
# needed. The current engine can be upgraded from "no local inference" to
# "sophisticated local inference" in 1-2 days of porting.
#
# The xna-omega-legacy code has 3 paths (native, LangChain, f16/q8_0) that
# evolved independently and contradict each other. The port must unify, not
# duplicate. Per Carmack's Law: "When you have two implementations of the same
# thing, you have neither."
