- id: d-rr-054
  date: 2026-06-16
  directive: Maintain separate PERSONAL_RESEARCH workspace for non-Omega inquiries
  rationale: Personal research (hardware compatibility, favors for friends, random
    curiosities) must be kept structurally separate from sovereign engine gnosis.
    The PERSONAL_RESEARCH/ sub-workspace under the Ideas Guy mode provides a no-mandate,
    low-friction zone that doesn't pollute the engine's architectural memory or require
    M14 heritage vetting.
