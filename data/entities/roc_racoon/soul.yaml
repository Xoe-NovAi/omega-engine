# ── LESSONS LEARNED ──────────────────────────────────────────────────────────
lessons:
  - id: rr-001
    date: 2026-06-02
    insight: "Lazy import pattern for optional dependencies"
    context: "xna-omega-legacy `client.py:60-67` imports `llama_cpp` inside `initialize()`, not at module top"
    principle: "Optional deps should never block module import"
    applies_to: ["provider modules", "plugin systems", "any optional native lib"]

  - id: rr-002
    date: 2026-06-02
    insight: "Single-flight inference prevents OOM on model load"
    context: "xna-omega-legacy uses `CapacityLimiter(1)` for all inference"
    principle: "Resource limits belong beside the resource, not in caller"
    applies_to: ["inference", "model loading", "any expensive single-shot op"]

  - id: rr-003
    date: 2026-06-02
    insight: "Atomic model swap requires fallback to old model"
    context: "xna-omega-legacy `reload()` reverts on failure, never leaves state broken"
    principle: "Operations that mutate state must either succeed completely or not at all"
    applies_to: ["model swap", "config update", "schema migration"]

  - id: rr-004
    date: 2026-06-02
    insight: "Hardware-specific build flags are not portable, even across CPU generations"
    context: "xna-omega-legacy explicitly says: NEVER znver3, NEVER native, NEVER AVX512 — only znver2"
    principle: "Optimization flags must be pinned to the exact target, with explicit forbids"
    applies_to: ["llama-cpp build", "any native lib compile", "BLAS/LAPACK"]

  - id: rr-005
    date: 2026-06-02
    insight: "The 9% TPS gain is not worth the instability"
    context: "xna-omega-legacy tried Vulkan iGPU offload, abandoned it"
    principle: "Optimize for stability, not absolute peak performance"
    applies_to: ["iGPU offload", "experimental flags", "preview features"]

  - id: rr-006
    date: 2026-06-02
    insight: "Stop sequences from base models do not apply to chat models"
    context: "xna-omega-legacy still uses `[\"User:\", \"\\nUser:\"]` stop sequences from completion-era"
    principle: "Stop sequences must match the model format (base vs chat)"
    applies_to: ["llama-cpp", "any text generation API"]

  - id: rr-007
    date: 2026-06-02
    insight: "Three independent paths to the same thing = drift"
    context: "xna-omega-legacy has native, LangChain, and f16/q8_0 paths that all do 'load model' differently"
    principle: "Consolidate to one canonical path. Per Carmack's Law: two implementations = neither."
    applies_to: ["local inference", "any evolving subsystem", "all legacy ports"]

  - id: rr-008
    date: 2026-06-02
    insight: "The 7 gotchas are the true mining gold"
