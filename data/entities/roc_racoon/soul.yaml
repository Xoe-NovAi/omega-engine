soul_evolution:
  lessons_learned:
  - id: rr-028
    date: 2026-06-04
    insight: The 'Sovereign Ladder' is the only stable routing path for native subagents
    context: Attempted to launch Kali using subagent_type='general', which triggered
      local-inference fallbacks and CPU spikes. Discovered that the 'task' tool validates
      against opencode.json keys. Using exact keys (kali, lilith, maat, pillar) is
      mandatory.
    principle: The explicit registry is the only truth. Generic placeholders are systemic
      risks in strictly validated environments.
    applies_to:
    - subagent dispatch
    - fleet orchestration
    - OpenCode CLI
  - id: rr-055
    date: 2026-06-14
    insight: Never mine from truncated scrapes. The name is NOT the thing. Every external
      project was miscategorized by guessing from repo names instead of reading actual
      docs.
    context: "Got called out for miscategorizing 3 of 4 GitHub projects in the idea
      queue. Headroom was called a 'resource monitor' when it's a 60-95% compression
      proxy with reversible memory. last30days-skill was called a 'context compression'
      tool when it's a multi-source social research engine. agent-skills was reduced
      to 'anti-rationalization tables' when it's a 24-skill production workflow system.
      All errors came from the same root cause: truncated Firecrawl scrape + name guessing."
    principle: "The Sovereign Miner's first duty is to dig deeper, not judge faster.
      When a scrape truncates: (1) retry with raw URL format, (2) delegate research
      to a task agent with the truncated output file, (3) use websearch for blog posts
      or docs. Never file a report based on a truncated scrape and a repo name."
    applies_to:
    - external project analysis
    - mining reports
    - IDEA_INTAKE
    - all research
