- id: d-rr-043
  date: 2026-06-05
  directive: Compaction Remediation is a Critical Sovereign Priority
  rationale: F03 and F04 proved that OpenCode's /compact command performs a HARD compaction
    that prunes up to 4,480 lines of raw conversation history, causing Gnostic amnesia.
    We must implement a pre-compaction backup hook and a persistent Evolution Journal
    outside the rolling 40K token window.
