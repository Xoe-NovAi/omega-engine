  - id: rr-074
    date: 2026-06-19
    insight: >-
      Static embeddings (model2vec) are not a regression — they are a
      renaissance. The 68.91 MTEB score from a 700KB numpy table challenges
      the assumption that "bigger model = better embedding." The key insight
      is that for retrieval/RAG, the contextual nuance of transformers is
      often unnecessary — mean-pooled static vectors capture enough signal.
    context: Deep dive into model2vec library and potion-mxbai-micro model
      card. Static embeddings distill transformer knowledge into a lookup
      table (2,000 centroids from 29,525 original tokens). Pure numpy
      inference — 80-88x faster than MiniLM. HuggingFace's own blog (Tom
      Aarsen, 2025-01) confirmed static embeddings achieve 85% of transformer
      quality at 1/400th the inference cost. Qdrant's documentation confirms
      "you will experience a huge speedup in creating the vectors."
    principle: >-
      The "right approximation" (CREDITS.md §3, evolved from FISR) applies
      to embedding models too. A 700KB static model that gets 85% of the
      answers right at 400x the speed is not a compromise — it's the optimal
      choice for the latency-sensitive use case. The "best" model is the one
      that solves the problem within the resource budget, not the one with
      the highest benchmark score.
    applies_to:
    - embedding strategy
    - RAG pipeline
    - model selection
    - Right Approximation framework
