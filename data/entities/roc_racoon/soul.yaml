- id: d-rr-049a
  date: 2026-06-06
  directive: Maintain real-time infrastructure awareness (Local vs. Cloud)
  rationale: The 'Local-First' mandate created a cognitive bias that led to false
    assumptions about resource constraints. An agent must know the physical hosting
    reality of its current model to optimize its cognitive strategy (e.g., knowing
    when it can 'thrash away' vs. when it must be lean).
