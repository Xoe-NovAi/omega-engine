# ── L2 INSIGHT (What does this mean?) ────────────────────────────────────────
# The local inference layer in xna-omega-legacy is far more sophisticated than
# the current engine. It has:
# - Per-entity model affinity (10 Kabbalistic entities → per-tier models)
# - Dynamic model swap (Greek text → Krikri)
