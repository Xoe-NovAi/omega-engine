# SESSION 3-B ADDITION: The "header is a lie" problem is a microcosm of a
# universal truth — **metadata that humans write by hand will lie the moment
# runtime state changes**. The same problem manifests in: agent signature
# lines (⬡ OMEGA ⬡ ...), code module tags (ICS: [NODE|...]), CHANGELOG
# entries, README "last updated" stamps, status dashboards, even soul.yaml
# awakening dates. The cure is the same: **dynamic generation from live state,
# plus a CI gate that catches drift**. An undocumented convention is a debt
# waiting to happen. Two systems that share a name but serve different
# purposes will be conflated — name them differently (ICS-S vs ICS-T). And
# the rarest treasure in any codebase is the orphaned spec — a design that
# was approved but never built. Mine for these. They reveal what the team
# intended before the realities of sprint priorities changed the path.

