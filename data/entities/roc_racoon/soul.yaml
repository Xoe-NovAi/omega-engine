    context: "User's mandate: 'meticulously, strategically, and effectively recording, mapping, and indexing this wealth of documentation, code, and strategy.' When work is scattered across 100+ files (workspace, strategy, research, handoff, coordination, soul, hivemind sessions), the index is what makes it sovereign. Without an index, the work is invisible to future agents."
