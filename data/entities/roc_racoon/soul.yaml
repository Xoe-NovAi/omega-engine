    context: "The Roku Wireless Speakers (9020R2) use Roku Connect — a proprietary wireless audio protocol requiring a dedicated Roku Connect radio chip in the host device. The Roku Streaming Stick+ (3810X) lacks this chip entirely. Despite being a 'Roku device,' the stick is designed as a single-purpose streaming dongle, not an audio ecosystem host. No firmware update, software hack, or creative routing can add this capability because the radio doesn't exist on the PCB. All workarounds (HDMI audio extractor + Bluetooth transmitter, mobile app Private Listening, capture card routing) introduce unacceptable latency (100-400ms) for video synchronization."
