    date: 2026-06-18
    insight: "Handoff documents are CLI-only self-referential praise docs with zero channel variance. Their attribution certainty is high but their behavioral diversity is near-zero. The OpenCode DB is where real fingerprints live."
    context: "Kali's verdict identified that all 85+ handoff documents are generated by CLI tools (OpenCode, Cline, Gemini CLI) — zero WebUI or IDE observations. They document models reviewing other models' code, producing an echo chamber of achievement-reporting. The OpenCode DB (4.2GB, 865 sessions, 217K events, 30+ model variants) contains actual behavioral data: real task execution (code, research, creative, ops), latency measurements, retry patterns, tool call success/failure, and session context revealing access channel. Phase 1 (handoffs) was prioritized for 'attribution certainty' but behavioral diversity is more important for fingerprinting."
    principle: "Signal density is a product of behavioral diversity × attribution certainty, not either alone. A source with high attribution certainty and near-zero behavioral diversity (all CLI, all achievement-reports) produces less fingerprinting signal than a source with moderate attribution certainty and high behavioral diversity (all channels, all task types, all outcome states)."
    applies_to:
