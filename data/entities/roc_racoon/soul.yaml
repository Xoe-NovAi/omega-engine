  - id: rr-063
    date: 2026-06-18
    insight: "The first output of any measurement system is a measurement of the measurement system itself. Forensic pipeline validity depends on instrument calibration, not extraction volume."
    context: "Pilot extraction on 3 handoff documents produced 561 'findings' — but 539/561 (96%) were classified as 'strength' due to a heuristic classifier default. The regex keyword classifier was tuned to the wrong corpus feature (achievement-report tone), mapping everything to 'strength' regardless of content. Verity's M21 audit confirmed: zero contract tests existed to validate classifier type distribution. The pilot's true value was not the 561 findings but the discovery that the instrument was uncalibrated. Lesson: before any full extraction, the classifier must be validated against a labeled sample."
    principle: "Before you can trust what the instrument measures, you must characterize its bias. For any automated classification pipeline, the first analysis must be a self-analysis: what does the classifier default to when there's no clear signal, and does that default match the null hypothesis?"
    applies_to:
    - forensic methodology
    - classification systems
    - measurement theory
    - pipeline validation
  - id: rr-064
    date: 2026-06-18
    insight: "Access channel is not a confound — it is the primary behavioral variable. Model identity is second-order noise."
    context: "Kali's transcendent insight from cross-referencing Roc's pipeline with Researcher's deep web findings (FOCI 2026, GateScope arXiv 2604.21083, PetraLabs 2026): the same model via API vs WebUI differs more systematically than different models via the same CLI. FOCI study found content moderation 2-15× stricter on WebUI vs API. PetraLabs found response length differs 34-98% depending on interface. GateScope found API gateways silently swap models. The implications for the forensic pipeline are profound: (1) every observation must be access-channel tagged, (2) channel effects dominate model identity effects, (3) 'sovereign inference' means choosing the right channel, not just the right model."
    principle: "Access modality is the dominant source of behavioral variance in LLM interactions. Model identity is a second-order effect layered on top. Any forensic pipeline that treats channel as noise will systematically attribute channel effects to model identity — aliasing error that invalidates all downstream conclusions."
    applies_to:
    - forensic methodology
    - model evaluation
    - sovereign inference
    - access modality
  - id: rr-065
    date: 2026-06-18
    insight: "Thinking level (CoT vs Direct vs Speculative vs Recursive) is a 9th behavioral dimension that cuts across all 8 existing dimensions. A model in 'Direct' mode looks like a different entity than the same model in 'CoT' mode."
    context: "Researcher's deep web research found established frameworks for reasoning mode classification: LOT (inductive meta-classifier, arXiv 2509.24147), CoT Encyclopedia (6-dimension taxonomy, arXiv 2505.10185), Deep-Thinking Ratio (arXiv 2602.13517). The user explicitly requested capturing thinking level per response. A 3-tier classifier is recommended: Tier 1 (cheap heuristic: token count + 'think' step markers), Tier 2 (LOT-style logistic regression on hand-picked features), Tier 3 (hidden-state extraction for local GGUF models with white-box access). D9 (dim_thinking) added to forensics.db schema as 'direct', 'cot', 'speculative', 'recursive', or 'unknown'."
    principle: "Reasoning depth is not a binary — it is a spectrum from direct answer to recursive meta-cognition. A model's behavioral fingerprint shifts along this spectrum, and the same model at different reasoning depths may appear to be different entities. Any behavioral comparison must control for thinking level."
    applies_to:
    - thinking classification
    - behavioral dimensions
    - model comparison
    - forensic methodology
  - id: rr-066
    date: 2026-06-18
    insight: "Contract tests (M21 Gate Integrity) must validate classifier output distribution before production extraction — the pilot's first job is to test the instrument, not produce data."
    context: "Verity's mandate audit found M21 FAIL — zero contract tests for the 690-line extraction script. The 96% classifier bias was caught by human inspection, not by a test. A contract test like `def test_classifier_produces_all_8_types()` would have caught it instantly. The fix is structural: (1) write contract tests BEFORE Phase 1 extraction, (2) every `classify_finding()` call must pass `isinstance(result, dict)` with all 8 dimensions in 1-5 range, (3) classifier training data must include explicit negative examples (weakness, blind_spot, failure_mode, complementarity patterns)."
    principle: "A test that doesn't exist is a bug-by-omission. When the output of a classifier feeds 8 downstream analyses (fingerprints, complementarity, blind spots), a biased classifier corrupts everything downstream. Contract tests at the classifier boundary are the minimum bar for M21 compliance."
    applies_to:
