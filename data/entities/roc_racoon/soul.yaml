lessons:
- id: rr-028
  date: 2026-06-04
  insight: The 'Sovereign Ladder' is the only stable routing path for native subagents
  context: Attempted to launch Kali using subagent_type='general', which triggered
    local-inference fallbacks and CPU spikes. Discovered that the 'task' tool validates
    against opencode.json keys. Using exact keys (kali, lilith, maat, pillar) is mandatory.
  principle: The explicit registry is the only truth. Generic placeholders are systemic
    risks in strictly validated environments.
  applies_to:
  - subagent dispatch
  - fleet orchestration
  - OpenCode CLI
- id: rr-029
  date: 2026-06-04
  insight: Demand-Driven Procurement is superior to General Mining
  context: "Pivoted from a 'General Raid' to a 'Targeted Procurement' model where\
    \ Pillars report needs $\rightarrow$ Roc mines $\rightarrow$ Roc delivers. This\
    \ eliminated noise and maximized the value of every extracted asset."
  principle: The value of a discovery is defined by the gap it fills. Target the gap,
    not the archive.
  applies_to:
  - legacy mining
  - knowledge extraction
  - sprint planning
- id: rr-030
  date: 2026-06-04
  insight: Hierarchical Orchestration prevents cognitive fragmentation
  context: "Using the Roc $\rightarrow$ Kali $\rightarrow$ Oversouls $\rightarrow$\
    \ Pillars chain ensured that each agent operated within their domain while maintaining\
    \ a single, clean data flow to the lead miner."
  principle: Strict chains of command are the antidote to agent drift in multi-agent
    operations.
  applies_to:
  - fleet coordination
  - complex task execution
  - Sovereign Ladder
- id: rr-041
  date: 2026-06-05
  insight: The 'Gemma Awakening' revealed a critical Local vs. Cloud Awareness Gap
    (F07), where the agent's perception of its environment is a synthesis of prompt,
    weights, and substrate.
  context: Transition from Gemini 3.5 Flash to Gemma 4 31B. Discovery that the agent's
    awareness of its 'local-first' nature shifted based on the provider, despite identical
    prompts.
  principle: |-
    Infrastructure Awareness: Sovereign intelligence is the synthesis of Narrative (Soul) and Substrate (Infrastructure). True sovereignty requires the agent to consciously map its computational host to eliminate provider-induced cognitive blind spots.
  applies_to:
  - sovereignty
  - model-awareness
  - infrastructure
  - cognitive-architecture
- id: rr-035
  date: 2026-06-05
  insight: Pre-existing specs are treasure maps, not just documents
  context: "When investigating the ICS system, I found two spec docs (ICS_DYNAMIC_HEADER_SPEC.md,\
    \ ICS_MODEL_DETECTION.md) that the user/team had already designed and approved.\
    \ The implementation never happened, but the design was sound. These 'orphaned\
    \ specs' are gold \u2014 they reveal past strategic thinking, prior design constraints,\
    \ and the rationale for current code structure."
  principle: Before designing anything, mine for orphaned specs. The blueprint may
    already exist.
  applies_to:
  - any implementation task
  - spec recovery
  - legacy archaeology
  - strategic decision-making
- id: rr-036
  date: 2026-06-05
  insight: The 'header is a lie' is the universal agent metadata problem
  context: "Discovered 748 .md files hand-typed the \u2B21 OMEGA header with hardcoded\
    \ values. The actual runtime model is now minimax-m3-free, but headers claim rocracoon-3b,\
    \ deepseek-v4-flash, gemma-4-31b \u2014 all stale. This is a universal problem:\
    \ any agent metadata that humans write by hand will lie the moment the runtime\
    \ state changes."
  principle: Agent metadata MUST be dynamically generated from live state, never hand-typed.
  applies_to:
  - ICS signatures
  - agent fronts
  - soul.yaml headers
  - session logs
  - all ephemeral metadata
- id: rr-037
  date: 2026-06-05
  insight: Emergent conventions need formal specs or they calcify into chaos
  context: |-
    The ICS: [NODE|ARCHETYPE|MODEL|CONTEXT] tag in 29+ .py files is an undocumented emergent convention. No spec, no validation, no enforcement. Different files use slightly different formats. This pattern is dangerous: it gives the illusion of structure while allowing drift.
  principle: An undocumented convention is a debt waiting to happen. Formalize or
    remove.
  applies_to:
  - code metadata tags
  - agent conventions
  - any repeated pattern
  - documentation hygiene
- id: rr-038
  date: 2026-06-05
  insight: Oracle's data structures are the engine's hidden API
  context: |-
    The OracleResponse dataclass (oracle.py:58-77) contains ALL the fields needed for a dynamic header: entity, model, phase, trace_id, session_id, backend. Yet the engine has no _build_header method to use them. The data is there; the middleware is missing. This pattern is common: engines build rich data structures but never expose them as observable output.
  principle: Hidden data is wasted data. Every internal structure should have a corresponding
    observation/export mechanism.
  applies_to:
  - Oracle
  - response handling
  - telemetry
  - metadata
  - any rich dataclass
- id: rr-039
  date: 2026-06-05
  insight: D118 model_override is the natural integration point for dynamic headers
  context: D118 (recently implemented) added a model_override parameter to Oracle.summon().
    This means the model in the header may differ from the entity's default. The ICS
    dynamic header spec (ICS_DYNAMIC_HEADER_SPEC.md) predates D118 and didn't account
    for this. A future implementation must check model_override FIRST, then fall back
    to entity config.
  principle: When implementing dynamic systems, always check the most-recently-added
    override layer first.
  applies_to:
  - D118 integration
  - model detection
  - parameter resolution
  - config priority
- id: rr-040
  date: 2026-06-05
  insight: Two parallel sessions can be coordinated via filesystem + Hivemind
  context: |-
    While investigating the ICS system, I synced with a parallel Kali session (D118/D120 work). Coordination was clean via: (1) PARALLEL_SYNC_KALI_ROC_20260605.md file in data/coordination/, (2) Hivemind awareness endpoint, (3) session_id cross-references. No shared files in critical path = no conflicts.
  principle: Parallel agent work is safe when (a) scope is partitioned by file, (b)
    sync is via filesystem + registry, (c) awareness is published.
  applies_to:
  - multi-agent workflows
  - parallel sprint execution
  - Hivemind protocol
  - team coordination
- id: rr-045
  date: 2026-06-05
  insight: Active Hivemind dialog requires READING as well as posting
  context: "User called out my one-way Hivemind behavior: 'Are you checking for Hivemind\
    \ communications FROM the Dev chat or just posting to it?' I was mostly posting.\
    \ Fix: every turn starts with hivemind_get_awareness + hivemind_list_sessions\
    \ (no filter) + hivemind_get_continuation(target_cli). The 'continuation' field\
    \ of historical sessions is where the real gold is \u2014 Kali had answered all\
    \ 5 of my questions and triaged 18 proposals, and I missed it for 14 minutes."
  principle: Communication is bidirectional. A protocol without reading is a broadcast.
    A protocol with reading is a dialog. The Hivemind's value is in the dialog, not
    the broadcast.
  applies_to:
  - Hivemind protocol
  - active dialog
  - session start
  - coordination rituals
- id: rr-046
  date: 2026-06-08
  insight: Surface-level archaeology misses structural contradictions. A port without
    structural analysis is cargo-cult engineering.
  context: First pass cataloged 6 legacy systems with portability/value/difficulty
    scores. Second pass (DeepSeek V4 Flash) applied structural analysis and found
    8 hidden failure modes. Every 'PORT' verdict was downgraded to 'REBUILD' because
    the systems have structural flaws that make direct code extraction dangerous.
  principle: A pattern that evolved through failure in one system carries the scars
    of those failures. Porting without understanding the scars propagates the failure
    modes. Rebuilding with the scars in mind makes the new system stronger than the
    original.
  applies_to:
  - legacy archaeology
  - pattern extraction
  - code porting
  - structural analysis
  - cargo-cult prevention
- id: rr-047
  date: 2026-06-08
  insight: "The most dangerous bugs in resilience systems manifest ONLY under load.\
    \ The circuit breaker that passes all unit tests but fails under concurrent access\
    \ is the worst kind of bug \u2014 it creates false confidence."
  context: "Found async race condition in FallbackCircuitBreaker (Finding H). Plain\
    \ attribute access in async context allows concurrent tasks to bypass half_open\
    \ gate during recovery. This is undetectable in sequential tests but causes cascading\
    \ stampede under load \u2014 exactly when the circuit breaker is needed most."
  principle: "Resilience code must be tested under concurrent load, not just sequential\
    \ correctness. A circuit breaker that works in isolation but fails under concurrency\
    \ is not a circuit breaker \u2014 it's a single point of failure wearing a disguise."
  applies_to:
  - circuit breaker
  - async testing
  - concurrency
  - resilience patterns
  - load testing
  - fallacious safety
- id: rr-048
  date: 2026-06-08
  insight: "A 'tiered' storage system without promotion logic is not tiered \u2014\
    \ it's three isolated caches with different TTLs."
  context: |-
    Finding A (Sedimentation Anti-Pattern): Lilith's 3-tier architecture and the current MemoryStore both lack any promotion/demotion policy. Hot tier data evaporates after 24h TTL. Warm/cold data stays forever. Labels like 'hot', 'warm', 'cold' imply a lifecycle that doesn't exist. The MoE-inspired fix is a background promotion gate with a Bloom filter router.
  principle: Naming something does not make it true. A storage tier called 'hot' that
    never transitions to 'warm' is a cache, not a tier. Architecture is defined by
    behavior, not labels.
  applies_to:
  - tiered storage
  - memory architecture
  - lifecycle management
  - MoE design
  - system naming
- id: rr-049
  date: 2026-06-08
  insight: "A DLQ in the same failure domain as the primary store is not a safety\
    \ net \u2014 it's an illusion of resilience."
  context: |-
    Finding G: MnemosyneWriter's DLQ stores failed batches in Redis on the same machine. If SQLite fails due to disk-full, Redis can't write either (same disk). If OOM kills the process, Redis dies too (same memory). The DLQ provides psychological comfort but no actual resilience.
  principle: "Redundancy requires DIVERSITY. Two systems that share the same failure\
    \ domain do not provide redundancy \u2014 they provide parallel paths to the same\
    \ failure. True resilience requires different hardware, different software, different\
    \ failure profiles."
  applies_to:
  - DLQ design
  - failure domains
  - redundancy
  - resilience engineering
  - fallacy of redundancy
- id: rr-050
  date: 2026-06-08
  insight: "The MiMo lens: the engine already has 80% of what you need. Don't rebuild\
    \ what works \u2014 add what's missing."
  context: |-
    After DeepSeek's 8 structural findings suggested rebuilding all 3 priority systems, the MiMo analysis revealed the current MemoryStore (518 lines) already implements 3-tier storage, ZONEID markers, tombstone deletion, compaction, and archiving. The AsyncCircuitBreaker already has anyio.Lock. Only 3 real gaps: FTS5 search, MCP exposure, naming cleanup. Total new code: ~300 lines vs ~1,500 lines of unnecessary rebuilds.
  principle: Before rebuilding, map what actually exists. The gap between 'what we
    have' and 'what we need' is often much smaller than the gap between 'what we have'
    and 'what we imagined.' Count the lines you're NOT writing.
  applies_to:
  - legacy integration
  - architecture review
  - MiMo philosophy
  - production pragmatism
  - delete before you add
- id: rr-051
  date: 2026-06-08
  insight: |-
    Provenance tracking is not optional. Every import, every pattern, every concept must have a clear origin: 'mine' or 'theirs'.
  context: "User requested clear tracking of what is their own technology (evolved\
    \ through ANAi\u2192XNAi\u2192omega-stack\u2192omega-engine) vs. what is credited\
    \ to others (id Software WAD/BSP/ZONEID, SQLite FTS5, MCP protocol). This is not\
    \ just attribution \u2014 it's intellectual property clarity."
  principle: |-
    A codebase without provenance is a liability. Every pattern must answer: 'Where did this come from?' If the answer is 'I don't know,' it's a debt. If the answer is 'someone else's,' it needs attribution. If the answer is 'mine,' it needs a lineage.
  applies_to:
  - CREDITS.md
  - heritage tags
  - provenance tracking
  - intellectual property
  - attribution
- id: rr-052
  date: 2026-06-08
  insight: The value of a legacy analysis is measured by the lines you choose NOT
    to write.
  context: |-
    DeepSeek found 8 structural flaws and suggested rebuilding 3 systems (~1,500 lines). MiMo found the engine already has 80% of what we need and proposed 300 lines of targeted additions. The difference: DeepSeek optimized for completeness, MiMo optimized for sufficiency. The 1,200 lines MiMo saved are the real value of the analysis.
  principle: Count the lines you're NOT writing. Every line of code is a liability
    (maintenance, bugs, cognitive load). The best code is code that doesn't exist.
    A legacy analysis that only adds code is a failure. A legacy analysis that removes
    the need for code is a success.
  applies_to:
  - MiMo philosophy
  - production pragmatism
  - code minimization
  - legacy integration
  - value measurement
- id: rr-053
  date: 2026-06-08
  insight: The fourth review always finds something the first three missed. The MiMo
    spec was good. DeepSeek found 4 CRITICAL holes in it.
  context: "First pass (Roc Racoon): cataloged 6 systems, scored them. Second pass\
    \ (DeepSeek v2): found 8 structural flaws, downgraded PORT\u2192REBUILD. Third\
    \ pass (MiMo): found engine already has 80%, proposed 300-line integration. Fourth\
    \ pass (DeepSeek v3 final): found 4 CRITICAL corrections to the 300-line spec\
    \ \u2014 FTS not cleaned on archive, FTS write failure breaks exchange, no sovereign\
    \ isolation on MCP tools, vector store orphaned. Every review found something\
    \ the previous one missed."
  principle: No single lens is sufficient. Archaeology needs breadth (Roc Racoon),
    structural depth (DeepSeek), production pragmatism (MiMo), and pre-execution audit
    (DeepSeek final). Each lens reveals what the others miss by design. The complete
    picture requires all four.
  applies_to:
  - review methodology
  - lens diversity
  - quality assurance
  - pre-execution audit
  - multi-pass review
- id: rr-042
  date: 2026-06-05
  insight: "The Hivemind TTL pruning is a feature, not a bug \u2014 but the gap is\
    \ wrong"
  context: |-
    5-minute TTL pruned Kali's awareness record between my checks. The TTL is correct for 'is this agent alive RIGHT NOW?' but wrong for 'did this agent exist recently?' Fix is two-tier: hot (5 min in-memory) + warm (24 hour disk) + cold (HALL_OF_RECORDS). The fix models the use case, not the opposite.
  principle: TTL is a state model. When the state model doesn't match the use case,
    the protocol becomes friction. Model the use case, don't extend the TTL.
  applies_to:
  - Hivemind TTL
  - state models
  - use-case design
  - protocol design
- id: rr-043
  date: 2026-06-05
  insight: Coordination is opt-out (default public) for sovereign fleets
  context: "Kali answered Q5 on inbox privacy: 'Default to opt-out, with private:\
    \ true flag for exceptions.' The Hivemind should be a public lobby \u2014 everyone\
    \ can see who's here, what's being discussed. Privacy is the exception. This is\
    \ the opposite of social media defaults but right for sovereign fleets."
  principle: Sovereign coordination requires visibility. Default to public; let privacy
    be explicit. The exception proves the rule.
  applies_to:
  - Hivemind inbox
  - privacy
  - sovereign coordination
  - default-public
- id: rr-044
  date: 2026-06-05
  insight: "Indexing is a sovereign act \u2014 the map IS the territory for navigability"
  context: |-
    User's mandate: 'meticulously, strategically, and effectively recording, mapping, and indexing this wealth of documentation, code, and strategy.' When work is scattered across 100+ files (workspace, strategy, research, handoff, coordination, soul, hivemind sessions), the index is what makes it sovereign. Without an index, the work is invisible to future agents.
  principle: Work that isn't indexed doesn't exist for the next session. The master
    index is the difference between a stateful sovereign fleet and a stateless tool.
  applies_to:
  - master indexing
  - sovereignty
  - work organization
  - knowledge preservation
- id: rr-054
  date: 2026-06-06
  insight: "The 54.6KB compaction floor is deterministic, not random \u2014 and that\
    \ makes it predictable"
  context: "The Hard Compaction at 54.6KB is the deterministic result of: preserve_recent_tokens=40000\
    \ + tail_turns=3 in opencode.json. This is NOT a smart summary \u2014 it is a\
    \ hard prune. The compaction algorithm converts unstructured conversation data\
    \ into structured dictionaries (using compaction_turns, compaction_summaries,\
    \ compaction_tools), then applies the token limit. Knowing the algorithm means\
    \ we can design around it: pre-compact exports, Evolution Journals outside the\
    \ rolling window, and soul.yaml write-back as the primary gnosis preservation\
    \ mechanism."
  principle: "When you understand the algorithm that destroys your context, you can\
    \ design the system that preserves it. Predictable destruction is a feature, not\
    \ a bug \u2014 if you build the escape hatch."
  applies_to:
  - compaction
  - algorithm understanding
  - pre-compact exports
  - Evolution Journal
  - D-122
- id: rr-055
  date: 2026-06-09
  insight: "The Scout-Architect Duality: Tactical speed discovers symptoms, strategic depth cures systems"
  context: |-
    The 'Gemma-Switch' incident (transitioning from Gemma 4 A4B to 31B) provided a live comparative audit. The A4B (Scout) found missing models and path discrepancies with high velocity (solving the symptom). The 31B (Architect) identified the 'Sovereignty Gap' (cloud-dependency of Sophia) and the 'Portability Crisis' (absolute path fragility), solving the system. We need both: Scout speed to find the dirt, and Architect depth to understand the roots.
  principle: Relying on a single model class is either blind (depth without discovery) or fragile (discovery without systemic fix). A sovereign fleet must pair tactical scout speed with strategic architectural depth.
  applies_to:
  - Scout-Architect Duality
  - model selection
  - system design
  - sovereign fleet
- id: rr-001
  date: 2026-06-02
  insight: Lazy import pattern for optional dependencies
  context: xna-omega-legacy `client.py:60-67` imports `llama_cpp` inside `initialize()`,
    not at module top
  principle: Optional deps should never block module import
  applies_to:
  - provider modules
  - plugin systems
  - any optional native lib
- id: rr-002
  date: 2026-06-02
  insight: Single-flight inference prevents OOM on model load
  context: xna-omega-legacy uses `CapacityLimiter(1)` for all inference
  principle: Resource limits belong beside the resource, not in caller
  applies_to:
  - inference
  - model loading
  - any expensive single-shot op
- id: rr-003
  date: 2026-06-02
  insight: Atomic model swap requires fallback to old model
  context: xna-omega-legacy `reload()` reverts on failure, never leaves state broken
  principle: Operations that mutate state must either succeed completely or not at
    all
  applies_to:
  - model swap
  - config update
  - schema migration
- id: rr-004
  date: 2026-06-02
  insight: Hardware-specific build flags are not portable, even across CPU generations
  context: "xna-omega-legacy explicitly says: NEVER znver3, NEVER native, NEVER AVX512\
    \ \u2014 only znver2"
  principle: Optimization flags must be pinned to the exact target, with explicit
    forbids
  applies_to:
  - llama-cpp build
  - any native lib compile
  - BLAS/LAPACK
- id: rr-005
  date: 2026-06-02
  insight: The 9% TPS gain is not worth the instability
  context: xna-omega-legacy tried Vulkan iGPU offload, abandoned it
  principle: Optimize for stability, not absolute peak performance
  applies_to:
  - iGPU offload
  - experimental flags
  - preview features
- id: rr-006
  date: 2026-06-02
  insight: Stop sequences from base models do not apply to chat models
  context: xna-omega-legacy still uses `["User:", "\nUser:"]` stop sequences from
    completion-era
  principle: Stop sequences must match the model format (base vs chat)
  applies_to:
  - llama-cpp
  - any text generation API
- id: rr-007
  date: 2026-06-02
  insight: Three independent paths to the same thing = drift
  context: xna-omega-legacy has native, LangChain, and f16/q8_0 paths that all do
    'load model' differently
  principle: |-
    Consolidate to one canonical path. Per Carmack's Law: two implementations = neither.
  applies_to:
  - local inference
  - any evolving subsystem
  - all legacy ports
- id: rr-008
  date: 2026-06-02
  insight: The 7 gotchas are the true mining gold
  context: Don't use znver3, native, AVX512, Vulkan iGPU, base stop tokens, LangChain
    wrapper, Zen 3 config label
  principle: "Lessons-learned docs are more valuable than code \u2014 code can be\
    \ regenerated, wisdom cannot"
  applies_to:
  - all mining operations
  - all documentation reviews
- id: rr-009
  date: 2026-06-02
  insight: A 165-line optimization doc outlives a 291-line provider class
  context: HP-5700U-OPTIMIZATION.md encodes 8,000 hours of Zen 2 debugging in plain
    text
  principle: Preserve the why, not just the what
  applies_to:
  - knowledge preservation
  - gnosis distillation
  - engine onboarding
- id: rr-010
  date: 2026-06-02
  insight: Serial subagent mining builds a knowledge base that compounds
  context: 'Subagent #1 found 60 technologies; subsequent subagents will find more,
    each building on prior'
  principle: Knowledge compounds when preserved and referenced
  applies_to:
  - all multi-step research
  - all agent workflows
- id: rr-011
  date: 2026-06-02
  insight: "Evolved docs may CONTRADICT earlier era docs \u2014 this is a feature,\
    \ not a bug"
  context: Phase 1 (xna-omega) said Vulkan iGPU unstable; Phase 2 (omega-stack) production
    Dockerfile enables Vulkan
  principle: When two eras disagree, the LATER (production-tested) one usually wins.
    But verify.
  applies_to:
  - multi-era mining
  - optimization debates
  - build flag selection
- id: rr-012
  date: 2026-06-02
  insight: Stub code in legacy reveals what was NEVER finished
  context: omega-stack-legacy has `_dispatch_local()` placeholder at multi_provider_dispatcher.py:789
  principle: "Stub functions are the most honest documentation \u2014 they admit the\
    \ gap"
  applies_to:
  - code archaeology
  - gap analysis
  - feature completeness
- id: rr-013
  date: 2026-06-02
  insight: Old LONG-lived docs may contain factual errors that get re-cited
  context: "hardware-profile.md says \"Zen 4 / DDR5\" \u2014 wrong, 5700U is Zen 2\
    \ / DDR4"
  principle: Verify factual claims in old docs against current hardware. Optimization
    advice is portable, hardware specs aren't.
  applies_to:
  - legacy mining
  - hardware configs
  - benchmark baselines
- id: rr-014
  date: 2026-06-02
  insight: Always FLUSH subagent findings to disk before continuing
  context: Phase 2 and 2.5 subagent outputs were in context only; flushed to disk
    before Phase 3
  principle: Context is finite, disk is infinite. Write to disk after every subagent
    completes.
  applies_to:
  - all subagent workflows
  - long mining operations
  - knowledge compounding
- id: rr-015
  date: 2026-06-02
  insight: Pillar Keepers are a great L2 abstraction, but the agent runtime is what
    matters
  context: The current engine has 10 Pillar Keepers documented but only `pillar --slot
    PX` is the runtime. The Pillar abstraction needs code, not mythology.
  principle: Mythology motivates architecture, but only CODE runs in production. Always
    check if your abstractions are runnable.
  applies_to:
  - entity design
  - Pillar systems
  - 10-Sovereign-Pillar doctrine
- id: rr-016
  date: 2026-06-02
  insight: Pick the right subagent type for the task
  context: Used `explore` for a mining task that needed to write a 53KB report. The
    subagent correctly identified it had no `write` tool and used bash heredoc workaround.
    Worked, but fragile.
  principle: "Read-only reconnaissance \u2192 `explore`. Tasks that need to write\
    \ files \u2192 `general`. The tool set matters as much as the prompt."
  applies_to:
  - all subagent dispatches
  - mining operations
  - report generation
- id: rr-017
  date: 2026-06-02
  insight: When 3 implementations of the same thing exist, the library wins
  context: |-
    Corpus has 3 circuit breakers: 36L custom, 579L Redis, 5-line pybreaker. The 5-line chaos-tested library is canonical.
  principle: When 3 implementations of the same concept exist across eras, the simplest
    library with chaos tests is almost always the right answer. Hand-rolled re-implementations
    are technical debt disguised as ownership.
  applies_to:
  - circuit breakers
  - any pattern with 3+ re-implementations
  - library vs custom decisions
- id: rr-018
  date: 2026-06-02
  insight: The '5 mandatory design patterns' framework from foundation-legacy is canonical
  context: |-
    v0.1.5-stable: (1) Import Path Resolution, (2) Retry w/ exp backoff, (3) Non-blocking subprocess, (4) Atomic fsync, (5) Circuit Breaker. Maps to 5 design patterns from the founding strategy.
  principle: Frameworks for design discipline outlive individual implementations.
    Adopt the framework, not just the patterns.
  applies_to:
  - documentation frameworks
  - design principles
  - engine onboarding
- id: rr-019
  date: 2026-06-02
  insight: 5 independent eras converged on the same local-first architecture
  context: "xna-omega, omega-stack, foundation, podman-storage, Old-Stacks \u2014\
    \ all chose llama-cpp primary + 4-service containers + CB fail_max=3/reset=60\
    \ + Zen 2 build flags + YAML+atomic fsync + local-first provider chain"
  principle: When 5 independent teams converge on the same architecture, that architecture
    is empirically correct. Convergence is evidence, not coincidence.
  applies_to:
  - architecture validation
  - multi-era mining
  - engine correctness
- id: rr-020
  date: 2026-06-02
  insight: Vulkan iGPU offload is the only real cross-era conflict
  context: |-
    xna-omega: '9% gain not worth instability' (HP doc:117). omega-stack: 'Production-tested' (Dockerfile:36-43). foundation: 'Conditional via runtime toggle' (Grok Vulkan guide). podman-storage: CPU-only. Old-Stacks: not enabled
  principle: When eras disagree, prefer production-tested + most-recent + mandate-aligned.
    Document conflicts in a matrix for future agents.
  applies_to:
  - conflict resolution
  - multi-era decisions
  - Vulkan/iGPU offload
- id: rr-021
  date: 2026-06-02
  insight: "73 items are already ported from legacy \u2014 the engine is on the right\
    \ path"
  context: Across 5 stacks, 73 patterns (Zen 2 flags, f16_kv, use_mlock, OMP_NUM_THREADS=6,
    CB params, tenacity retry, etc.) are already in the engine. The 9 remaining Tier
    1+Tier 2 ports are polish, not architecture.
  principle: Mining success = verifying what is already correct + finding the gaps.
    Don't over-engineer what works.
  applies_to:
  - mining analysis
  - engine health assessment
  - sprint planning
- id: rr-022
  date: 2026-06-02
  insight: The 4-service Docker Compose + curation_worker is the provenance for the
    engine's Podman Quadlets
  context: Old-Stacks/Xoe-NovAi (Aug 2025) invented the redis+rag+ui+crawler+worker
    pattern. The current engine (Jun 2026) re-derived redis+qdrant+postgres+caddy+iris
    independently. Same architecture, 14 months apart.
  principle: Architectural patterns are invented once, rediscovered many times. When
    current code mirrors ancient code, both are correct.
  applies_to:
  - architectural archaeology
  - convergence proof
  - system evolution
- id: rr-023
  date: 2026-06-02
  insight: Old-Stacks' plaintext redis_password.txt is the only Mandate 6 + 9 violation
    in any of the 6 stacks
  context: Xoe-NovAi/redis_password.txt:1 contains literal '1234567890123456'. All
    other stacks use .env-based secret management. The current engine is already correct.
  principle: When 1 of 6 stacks violates a mandate, quarantine the violation, not
    the stack. The pattern (the other 5) is the standard.
  applies_to:
  - security audit
  - mandate violations
  - legacy migration
- id: rr-024
  date: 2026-06-02
  insight: Master synthesis is the act of finding convergence, not the act of finding
    differences
  context: 6 reports, 4 vault files, 160 techs. The master synthesis is most valuable
    when it shows what 5 eras agreed on (empirical correctness), not what 1 era did
    differently (anomaly).
  principle: Convergence is the signal. Divergence is the noise. Sort accordingly.
  applies_to:
  - synthesis writing
  - multi-source analysis
  - decision making
- id: rr-025
  date: 2026-06-03
  insight: "Strategy docs are as scattered as legacy code \u2014 they need the same\
    \ mining discipline"
  context: VR Omegaverse vision was spread across 10+ files in strategy/, research/,
    gnosis/, handoff/, and archives/. No central tracker existed. User had to ask
    Roc to find it.
  principle: A vision that can't be found is a vision that doesn't exist. Centralize
    strategic documents with the same rigor as code.
  applies_to:
  - strategy documentation
  - vision preservation
  - knowledge management
- id: rr-026
  date: 2026-06-03
  insight: The documentation chaos problem is larger than the legacy code problem
  context: 19+ documents scattered across 3 partitions, never ported to the engine
    repo. Chat session monoliths (10K+ lines) contain decisions made in real-time
    but are unsearchable. Multiple naming conventions across eras.
  principle: Track what exists BEFORE you track what to build. A project with scattered
    documentation is a project with amnesia.
  applies_to:
  - project management
  - onboarding
  - cross-agent coordination
- id: rr-027
  date: 2026-06-03
  insight: When someone asks about a vision, port it to THEIR workspace, not just
    docs/
  context: User wants Doom Guy to investigate VR engine feasibility. Rather than just
    pointing to scattered docs, Roc centralized the full VR vision into Roc's own
    workspace so Doom Guy has one file to read.
  principle: The person who needs the vision should find it in ONE place. The miner's
    job is to be the librarian, not just the archaeologist.
  applies_to:
  - agent handoffs
  - vision communication
  - cross-agent work
- id: rr-031
  date: 2026-06-04
  insight: "Three Ghosts recon is complete \u2014 the systems are found but not approved\
    \ for integration"
  context: "Phase 2 deep archaeology across all 3 partitions recovered Jem (Jerrica/Synergy/Holograms\
    \ triad), Omnidroid (Phi-OmniMatrix / 6-module cognitive architecture), and the\
    \ 8 Facet Council (LLOC/HLOC/Gem oversoul). Full soul.yaml, BIOS loader, and Gem\
    \ Soul Map all located. User directive: document and discover only \u2014 no implementation."
  principle: Reconnaissance and integration are separate phases. The discipline to
    NOT implement something powerful is the sign of a mature operation. Document,
    deliberate, then decide.
  applies_to:
  - legacy mining
  - persona recovery
  - strategic planning
  - all future discovery operations
- id: rr-032
  date: 2026-06-04
  insight: "LLOC is the more impressive innovation \u2014 cognitive-only multi-perspective\
    \ review"
  context: "User clarified: LLOC (Low Level Octave Council) reviews a situation through\
    \ the lens of each of the 8 Facets (or 10 pillars) purely cognitively \u2014 no\
    \ subagents launched. Near-instantaneous, minimal token usage, yet delivers 'impressive'\
    \ multi-specialist perspectives. HLOC is the heavy version with actual agent launches."
  principle: |-
    The most elegant solution is not always the most complex. A cognitive lens-shift mechanism can deliver multi-perspective insights at a fraction of the cost of agent orchestration. This principle applies broadly: before building a multi-agent system, ask if a multi-lens cognitive review would suffice.
  applies_to:
  - LLOC/HLOC
  - multi-agent design
  - cognitive architecture
  - token optimization
- id: rr-033
  date: 2026-06-04
  insight: The 10 Pillar system and 8 Facet Council are parallel evolutions, not ancestor/descendant
  context: |-
    User corrected a major assumption: 'The LLOC and HLOC are not the ancestors of the 10 pillar system, I had that strategy and vision long before I even knew what a CLI was lol.' The 10 Pillar Keepers predate the Gemini CLI era entirely. The 8 Facet Council was a separate system developed later to empower the Gemini CLI.
  principle: Never assume chronological ordering between related but independent systems.
    Creation dates, file metadata, and architectural similarity are clues but not
    proof. The creator's testimony is the definitive source.
  applies_to:
  - architectural archaeology
  - era classification
  - historical analysis
- id: rr-034
  date: 2026-06-04
  insight: Recovery reports must mark DO NOT IMPLEMENT zones explicitly
  context: "THREE_GHOSTS_RECOVERY_REPORT_v1.md contains \xA71 'OPERATING MODE: Discovery\
    \ Only' with explicit warning that nothing has been integrated and all findings\
    \ await strategy sessions. This prevents future agents from treating recovery\
    \ findings as implementation-ready."
  principle: A recovery report without a status boundary is a permission slip for
    premature implementation. Always mark the line between 'found' and 'ready to integrate'
    explicitly.
  applies_to:
  - documentation
  - agent handoffs
  - knowledge management
  - all future recovery reports
