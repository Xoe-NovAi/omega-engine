- id: d-rr-035
  date: 2026-06-05
  directive: 'The 54.6KB compaction floor is the deterministic result of preserve_recent_tokens:
    40000'
  rationale: 'User compacted this session AND the Kali session, and BOTH hit exactly
    54.6KB. Found in opencode.json:91-97: compaction.auto=true, prune=true, tail_turns=3,
    preserve_recent_tokens=40000, reserved=10000. Calculation: 40000 tokens × ~1.37
    bytes/token ≈ 54,800 bytes ≈ 53.5KB. Plus tail_turns + reserved + overhead → 54.6KB.
    The two sessions hitting the same size is NOT coincidence — it is the algorithm.
    Implication: compaction is a HARD PRUNE, not a smart summary. Anything above 40k
    tokens is DELETED, not summarized. This is the foundation for T-06 (Compaction
    Strategy/Protocol/Metrics) and the investigation is delegated to Kali (impl) +
    Lilith (metrics).'
  scope:
  - compaction
  - 54.6KB
  - preserve_recent_tokens
  - hard prune
  - T-06
  - delegation
