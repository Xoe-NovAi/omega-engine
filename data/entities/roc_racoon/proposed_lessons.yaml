  L2_insight: "The CompactionHarvester already existed but only tracked metadata (counts,\
    \ timing). The gap was capturing the actual summary TEXT content. The sidecar\
    \ pattern (polling DB) is more reliable than plugin hooks because it works with\
    \ both V1 and V2 OpenCode, requires no OpenCode modification, and uses the DB\
    \ as source of truth. The entity-partitioned vector store (sqlite-vec) enables\
    \ per-entity RAG retrieval of compaction summaries. The SESSION_ENTITY_MAP.yaml\
    \ provides the session\u2192entity routing that OpenCode doesn't natively provide."
  L3_principle: "Sidecar polling beats plugin hooks for capture reliability \u2014\
    \ it works across V1/V2, requires no upstream changes, and uses the DB as the\
    \ single source of truth. Entity-partitioned vector storage enables per-entity\
    \ RAG on compaction history. The session\u2192entity mapping is the missing link\
    \ that OpenCode doesn't provide natively."
