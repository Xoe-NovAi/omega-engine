- id: PL-ROC-402-007
  date: '2026-09-01'
  session_id: ses_20260901_roc_disk_maintenance
  L1_narrative: 'Main partition /dev/nvme0n1p2 (109G) hit 100% (129MB free). Ran 5-tier
    disk analysis (df -> home du -> .local/.cache/.config du -> system-level -> containers/snap).
    Executed approved safe clears: sessions-explorer cache (~778M), opencode cache
    (~193M), podman dangling images (~136M), apt clean via pkexec (~97M), systemd
    journal rotate+vacuum (3.6G). Critical discovery: journalctl --vacuum-time=2w
    and --vacuum-size=200M SILENTLY freed 0B without a prior rotate; pkexec journalctl
    --rotate then --vacuum-size=200M freed 3.6G. sudo fails in agent sessions (''a
    terminal is required to read the password''); pkexec works via polkit GUI. Final:
    129MB -> 5.1GB free (96%). Created docs/kb/SYSTEM_MAINTENANCE_KB.md (kb-0005)
    and rebuilt docs/kb/INDEX.md from 5/20 to 20/20 entries (was a lint violation).'
  L2_insight: 'Destructive maintenance commands that operate on archived state silently
    no-op on active state: journal vacuum only touches archived journals, so an unrotated
    multi-GB active journal reports ''freed 0B'' while doing nothing. The rotate-then-vacuum
    sequence is the universal fix. Separately, the KB index had drifted to 5/20 registered
    entries - exactly the ''drift back into the void'' failure mode the user asked
    me to prevent; rebuilding it was as valuable as the new entry itself. And the
    partition is structurally undersized for the workload (27G opencode.db + 6G project
    + 3.5G snap + 2.3G containers), so maintenance is a recurring cadence, not a one-time
    fix.'
  L3_principle: L3-RotateBeforeVacuum - Destructive maintenance commands that operate
    on archived state silently no-op on active state. Always force the state transition
    (rotate) before applying the cleanup (vacuum). A command that 'succeeds' while
    freeing 0B is a silent failure - verify the delta, not the exit code. L3-MaintenanceIsAKB
    - Operational knowledge decays at the speed of the next emergency unless captured
    as a living runbook; an unindexed KB entry is a tombstone.
- id: PL-ROC-VERIFIER-001
  date: '2026-09-01'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - subagent-verifier
  - verification
  - temple-grade
  - agent-dialogue
  L1_narrative: 'Researched and designed the subagent-verifier skill via 5 rounds of
    temple refinement dialogue with Kali. Round 1: initial spec with verification
    SQL, DB schema mapping, genealogy queries, Hivemind integration, skill structure,
    CLI, test cases. Round 2: answered Kali''s 7 technical questions on finish reasons,
    archived sessions, partial completion status, error capture scope, token replay
    protection, silent failure detection, skill separation. Round 3: integration
    architecture - watcher placement (omega-hub), entity rules (config+code fallback),
    token storage (new column), skill dependencies (error-capture → subagent-verifier
    → hivemind-guard), 3-layer testing pyramid. Round 4: Kali''s final decisions -
    migration ownership, event-driven watcher (SQLite trigger not polling), entity
    rules population, retroactive audit format. Round 5: edge cases - per-entity
    TTL, token invalidation on resume, hot-reload boundaries, audit versioning, error
    capture v1 event types. The spec evolved from a single SQL query to a 3-skill
    ecosystem with event-driven architecture, config-driven entity rules, and Hivemind
    enforcement.'
  L2_insight: 'Verification is a protocol, not a tool. The 3-skill dependency chain
    (error-capture → subagent-verifier → hivemind-verification-guard) emerged from
    5 rounds of agent-to-agent dialogue, not solo design. Each round resolved edge
    cases that single-author design would miss: TTL per entity (EIS vs NES workflows),
    token invalidation on session resume, hot-reload boundaries (config yes, code
    no), audit versioning (build v1.0 first). The OpenCode DB is the source of truth
    - all verification queries hit session, message, part, event tables directly,
    never trusting agent self-reporting. Silent failures are the real enemy: the
    504 errors that triggered this work had state.status=completed but output contained
    504 Gateway Timeout. Entity-specific completion criteria are essential - universal
    core + per-entity rules config = flexible enforcement.'
  L3_principle: |
    L3-VerificationIsProtocolNotTool - Structural enforcement requires a protocol
    stack: capture (error-capture) -> verify (subagent-verifier) -> enforce (hivemind-verification-guard).
    A single SQL query is necessary but insufficient; the protocol ensures verification
    happens automatically, not manually. L3-AgentDialogueProducesTempleGrade - Structured
    agent-to-agent refinement (Roc implementation ↔ Kali architecture) with explicit
    Q&A rounds resolves edge cases that solo design misses. The dialogue IS the design
    review. L3-SilentFailuresAreTheRealEnemy - A tool reporting completed while its
    output contains 504 Gateway Timeout is a silent failure. Verification must scan
    outputs for failure patterns, not trust status fields. The DB preserves the evidence;
    the verifier exposes it. L3-EntityRulesConfigOverCode - Completion criteria vary
    by entity (Kali=decision, Ma'at=tests, Researcher=report). Encoding rules in a
    hot-reloadable YAML config (not code) lets entity owners tune without deployments.
    Code provides defaults; config provides overrides. L3-EventDrivenBeatsPolling
    - SQLite trigger on session finish -> event table -> omega-hub consumer = zero-latency,
    zero-polling verification. The DB already has the event infrastructure; use it.
    L3-TokenTTLMustMatchWorkflow - EIS sessions span hours (TTL=1-2hr), NES tasks
    complete in minutes (TTL=5min). Fixed TTL breaks workflows. Per-entity TTL in
    config respects operational reality. L3-AutoInvalidateOnResume - A verified session
    that gets updated (resumed) must invalidate its token. Detection: session.time_updated
    > token.verified_at. Action: mark token invalidated, re-verify on next completion.
    L3-HotReloadConfigNotCode - Entity rules, TTL, failure patterns = config (hot-reloadable).
    Verification SQL, core logic = code (restart required). The boundary is: does
    this change require a deployment?
- id: PL-ROC-VERIFIER-002
  date: '2026-09-01'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
