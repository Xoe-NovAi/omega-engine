  \n  - id: rr-058\n    date: 2026-06-16\n    insight: \"Warranty systems are information\
  \ state machines with three critical invariants: provenance, timestamp, and channel.\
  \ If any one is missing, the claim fails.\"\n    context: \"Decoding Milwaukee M18\
  \ battery warranty revealed a three-variable system: provenance (authorized dealer\
  \ gate \u2014 proves the claim is valid), timestamp (date code or receipt \u2014\
  \ proves the claim is timely), channel (service center or eService portal \u2014\
  \ proves the claim can be submitted). The USVI gap showed that channel isn't just\
  \ a convenience factor \u2014 it can be a structural blocker. Without a service\
  \ center anywhere in the territory, the 'channel' invariant requires self-service\
  \ shipping, HazMat compliance, and carrier coordination. This turns a one-variable\
  \ problem (provenance + timestamp = valid claim) into a multi-variable logistics\
  \ problem.\"\n    principle: \"Any system that depends on exactly three invariants\
  \ for a state transition must verify all three before declaring the transition possible.\
  \ The fourth variable (logistics) is always latent \u2014 it emerges when the channel\
  \ infrastructure is missing. Sovereign systems must pre-compute the full path, not\
  \ just the gates.\"\n    applies_to:\n    - warranty claims\n    - information state\
  \ machines\n    - system design\n    - infrastructure planning\n  - id: rr-059\n\
  \    date: 2026-06-16\n    insight: \"Living in a US territory reveals the hidden\
  \ continental bias in every national manufacturer's support infrastructure. 'Free\
  \ shipping' from a Puerto Rico address and 'free shipping' from a USVI address are\
  \ not the same problem.\"\n    context: \"Milwaukee's warranty system assumes physical\
  \ proximity to a service center. The eService portal works from anywhere, but the\
  \ logistics chain (prepaid FedEx label \u2192 battery shipping \u2192 HazMat compliance\
  \ \u2192 carrier acceptance) is designed for continental US users. US Virgin Islands\
  \ residents must manage lithium-ion battery shipping regulations (UN3480, terminal\
  \ taping, carrier notification) that continental users never encounter. The 'same\
  \ service' is structurally different when the shipping leg crosses open water.\"\
  \n    principle: '\"Same service\" across geographic disparities is a myth unless\
  \ the logistics chain is homogeneous at every point. Any system that offers uniform\
  \ service across non-uniform infrastructure is actually offering a different service\
  \ to each region \u2014 and calling it the same. Mapping the actual logistics chain\
  \ is the only way to see the difference.'\n    applies_to:\n    - infrastructure\
  \ design\n    - US territory access\n    - logistics chains\n    - service equity\n\
