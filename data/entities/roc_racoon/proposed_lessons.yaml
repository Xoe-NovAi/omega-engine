  - disk-space
  - oom
  - hardlink
  - unlink-before-copy
  - compaction
  - process
  - anti-pattern
  L1_narrative: 'Two swap attempts failed and filled a partition each time. Attempt
    1 (02:5x): ran compaction via ''nohup ... &'' - the shell exited, the process
    group was reaped, and the VACUUM INTO died at ~6.75 GB of 26 GB with nothing flushed
    to the log. Attempt 2 (04:06): execute_swap() used shutil.copy2(source -> backup)
    then shutil.copy2(target -> staging_tmp) then os.replace(). Peak usage was 43
    (original) + 43 (backup) + 26 (incoming) = 112 GB against 5.2 GB available - the
    copy filled root, the user watched 5.2 GB of free space disappear, and it OOM''d.
    Root cause: the script COPIED before DELETING, so it never freed the old 43 GB
    before allocating the new 26 GB. A third near-miss filled omega_library to 100%
    (28 KB free) when a backup dir was written there. Fixed execute_swap() to: hard-link
    the backup onto omega_library (instant, zero extra bytes), unlink the old DB first
    (instantly freeing 43 GB), then stream-copy the compacted DB with a bounded 64
    MB buffer plus fsync, then verify integrity and journal_mode, with automatic rollback
    to the hard link on any failure. Peak extra space is now 26 GB and only AFTER
    the unlink, so net requirement is zero extra headroom.'
  L2_insight: 'Replacing a large file in place is a SPACE problem before it is a correctness
    problem. Copy-then-replace requires capacity for both copies simultaneously, which
    is exactly what a space-constrained host cannot give. Hard-link-then-unlink-then-copy
    inverts the arithmetic: the backup becomes free (same inode), and the unlink converts
    43 GB of occupied space into free space before the 26 GB allocation begins. The
    second lesson is that backgrounding a multi-minute job behind ''nohup &'' inside
    a tool shell makes it vulnerable to process-group reaping - a foreground run with
    a long timeout is strictly more reliable because the tool holds the process for
    its lifetime. The third: a poll-and-wait loop in a blocking tool call is indistinguishable
    from a hang, so wait-loops belong in a separate human-visible terminal.'
  L3_principle: 'L3-UnlinkBeforeCopy: When replacing a large file, unlink the original
    BEFORE allocating the replacement; copy-then-delete needs capacity for both copies
    and will fail on the constrained host by construction. Pair it with a hard-link
    backup, which makes preservation free because it is the same inode. L3-LongJobsRunForeground:
    Multi-minute jobs must run in the foreground of a tool call that holds the process,
    or in a human-visible terminal; ''nohup &'' behind a transient shell is a reaping
    hazard and hides output behind unflushed buffers. L3-WaitLoopsAreNotToolCalls:
    Poll-and-wait loops look identical to hangs in a blocking call; they belong in
    a separate terminal where a human can see them and intervene. L3-CheckFreeSpaceBeforeEveryPhase:
    A partition that reaches 100% blocks the very operation meant to relieve it, so
    df must be re-checked before each phase rather than assumed from the prior measurement.'
- id: PL-ROC-402-013
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - hardlink
  - cross-device
  - exdev
  - fsync
  - sqlite
  - swap
  - preflight
  - self-correction
  L1_narrative: 'Post-incident hardening of the swap path. Four defects found and
    fixed, each caught by measuring rather than assuming. (1) CROSS-DEVICE HARD LINK:
    backup_dir was placed on omega_library (device 66307) while the source lives on
    root (device 66306); os.link() raised EXDEV, and the shutil.copy2 fallback copied
    the entire 46 GB database across, filling omega_library to 100% (28 KB free) and
    leaving a 4.8 GB orphan on root. Fixed by moving backup_dir back to source_path.parent
    and DELETING the copy fallback entirely - a failed hard link now aborts loudly.
    (2) SHARED-INODE METRICS LIE: st_size/st_blocks on a hard link report the shared
    inode''s total, not the incremental cost; my own log line would have printed ''extra
    blocks consumed: 46 GB'' for a free operation. Replaced with a get_disk_free()
    delta across the link, aborting above 64 MB. Verified: ''ACTUAL space consumed:
    0.00 B''. (3) FSYNC ON A CLOSED FILE: os.fsync(dst.fileno()) sat after the ''with''
    block, raising ValueError(''I/O operation on closed file'') so the swap never
    completed; moved inside the block. (4) PRE-FLIGHT MEASURED THE WRONG MOMENT: the
    guard compared current free space against the compacted size, ignoring that the
    unlink happens first - it would have refused at 5.8 GB free even though the swap
    NET RELEASES 17 GiB. Changed to net_required = target_size - source_size. All
    four paths verified end-to-end on synthetic replicas, including a low-headroom
    case; final rc=0.'
  L2_insight: 'Every one of these defects shared a shape: an operation that reported
    success while doing something other than what was intended. EXDEV was swallowed
    by a fallback. st_blocks reported truth about the inode but was read as a cost.
    fsync failed loudly but only after the copy had been attempted. The pre-flight
    guard reported a real number and reasoned from the wrong one. The defence that
    worked every time was measuring the property that actually mattered - filesystem
    free-space delta rather than a proxy, and net arithmetic rather than instantaneous
    arithmetic. Separately, a safety fallback that silently degrades a cheap operation
    into an expensive one is worse than no fallback: the copy2 path converted a zero-byte
    hard link into a 46 GB write with no operator warning.'
  L3_principle: 'L3-HardLinksCannotCrossFilesystems: A hard-link backup is only free
    when it lives on the same device as the source; across mounts os.link raises EXDEV
    and any copy fallback silently reinstates the very cost the hard link was chosen
    to avoid. Verify with stat -c ''%d'' and never provide a copy fallback. L3-SharedInodeMetricsMisreportCost:
    st_size and st_blocks on a hard link describe the shared inode''s total, not the
    incremental cost, so they cannot prove a backup was free; measure filesystem free-space
    delta across the operation instead. L3-NoSilentlyDegradingFallbacks: A fallback
    that converts a cheap operation into an expensive one must abort instead, because
    the operator is never told the cost changed. L3-ResourceCallsBelongInsideTheirScope:
    Operations that touch a file handle (fsync, fileno, flush) must execute inside
    the block that owns the handle; after it they raise or, worse, no-op. L3-GuardTheArithmeticNotTheInstant:
    A capacity guard must model the full sequence, not the current instant - here
    the unlink precedes the copy, so comparing live free space against the incoming
    size measures the wrong moment and refuses an operation that actually releases
    space.'
- id: PL-ROC-402-014
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
