    \ 32 KiB SHM sidecar beside the compacted target \u2014 latent stale shared-memory\
    \ reuse on re-runs), C-2 (space arithmetic unit confusion: 46.58 GB decimal vs\
    \ 43.38 GiB binary are the same bytes; corrected margin 4.96 GiB, not 2.49 GB),\
    \ C-3 (TOCTOU: the lock check ran minutes before the unlink \u2014 a writer opening\
    \ the DB during the 2-5 min backup window would have its writes sent to an unlinked\
    \ inode, silently lost). All six findings were reproduced against live code/disk,\
    \ then all six patches applied: TOCTOU re-check immediately before unlink, SHM\
    \ cleanup in two places, dynamic sqlite_master enumeration for all parity checks,\
    \ trip-wire vs projected space, force parameter deleted entirely + warning, staleness\
    \ warning from manifest age. Test battery extended to A-I (added G: backup failure\
    \ leaves SOURCE UNTOUCHED; I: monkeypatched get_disk_free proves the trip-wire\
    \ fires and restores). Result: 21/21 PASS. Freeze banner added to the script."
  L2_insight: "The author's tests encode the author's model of failure \u2014 they\
    \ cannot find failure classes the author never imagined. Sonnet reviewed the surface\
    \ (flags, parity lists, thresholds) and found real issues; Opus reviewed the timeline\
    \ (check-then-act gaps) and the artifacts (a 32 KiB file sitting on disk) and\
    \ found what the surface review could not. Two reviewers with different lenses\
    \ found disjoint sets \u2014 neither alone was sufficient. And the deepest class\
    \ was temporal: every guard had been verified at a single instant, while the operation\
    \ spans minutes; safety properties must hold across the whole window, not at the\
    \ check. Also: unit confusion (GB vs GiB) silently corrupts margin analysis \u2014\
    \ both reviewers computed correct math on different units and reached different\
    \ conclusions."
  L3_principle: "L3-APointInTimeGuardIsNotAGuard: a check is an observation at an\
    \ instant; if a destructive action happens minutes later, re-check immediately\
    \ before the action \u2014 the window between check and act is where silent loss\
    \ lives (TOCTOU). L3-ParityMustEnumerateDynamically: hardcoded lists silently\
    \ skip new members; enumerate parity from the source of truth (sqlite_master),\
    \ never from a constant. L3-AdversarialReviewFindsWhatTestsCannot: tests encode\
    \ the author's failure model; independent reviewers with different lenses (surface\
    \ vs timeline vs artifacts) find disjoint classes \u2014 run both, merge, verify\
    \ each finding against live state before patching. L3-UnitsAreSafety: GB vs GiB\
    \ confusion corrupts margin analysis while every individual computation looks\
    \ correct; normalize units explicitly in any capacity plan. L3-DefenseInDepthViaIndependentGates:\
    \ each review found a different class; each gate (lock, device, capacity, validation,\
    \ TOCTOU, trip-wire, post-verify) catches what the others cannot \u2014 keep them\
    \ independent and never let one gate's pass imply another's."
- id: PL-ROC-402-016
  date: '2026-10-05'
