  L1_narrative: "Final review round for the OpenCode DB swap. R2 (Gemini) verified\
    \ all six patches CORRECT with 21/21 tests and returned GO (LOW risk). Sonnet\
    \ 4.6 Final Pass audited all 1,056 lines and reaffirmed GO while finding four\
    \ residual nits: (1) abort paths (TOCTOU, backup failure) leave a ~43 GB backup\
    \ on omega_library without logging its path, size, or cleanup command \u2014 on\
    \ a tight partition the next swap's pre-flight refuses with a confusing error;\
    \ (2) `--await-exit` timeout skips the swap but exits 0 (false success); (3) stale\
    \ VERIFIED manifest not cleaned on `--overwrite` (guarded by target-exists check,\
    \ but confusing); (4) battery test G cleanup order. During synthesis verification,\
    \ roc_racoon found a fifth issue the reviewers missed: the Unified Guide's cleanup\
    \ commands used glob `backup-*` (matches nothing \u2014 actual dirs are `backup_pre_compact_*`)\
    \ and a location inconsistent with its own `--backup-fs` flag; `rm -rf` with a\
    \ non-matching glob silently no-ops, so the operator would believe cleanup succeeded\
    \ while ~44 GB lingered. Corrected in the guide + synthesis. Antigravity distilled\
    \ their own lesson (antigravity-20261005-001) on abort-state residue."
  L2_insight: "Under bounded storage, abort paths are as safety-critical as success\
    \ paths: an abort that leaves multi-gigabyte residue without telling the operator\
    \ creates an invisible self-denial-of-service for the next retry. Exit codes are\
    \ contracts \u2014 a timed-out operation that exits 0 breaks automation and operator\
    \ trust. And runbook commands are code: a cleanup glob that matches nothing fails\
    \ silently, which is worse than failing loudly, because the operator's mental\
    \ model ('cleaned up') diverges from reality ('44 GB still there'). Multi-round\
    \ review across different model architectures converged (4 rounds, all GO) while\
    \ each round still found orthogonal classes: logic/space (R1), races/artifacts\
    \ (Opus), patch-verification (R2), operational workflow (Final)."
  L3_principle: "L3-AbortPathsMustBeSelfDocumenting: every abort path that leaves\
    \ transient artifacts must log the artifact's path, byte footprint, and exact\
    \ cleanup command \u2014 silent residue under bounded storage becomes self-denial-of-service\
    \ for the retry. L3-ExitCodesAreContracts: a timed-out or skipped operation must\
    \ never exit 0; false success signals break automation and erode operator trust.\
    \ L3-RunbookCommandsAreCode: cleanup globs and paths in runbooks must be verified\
    \ against actual artifact naming before publication \u2014 a non-matching glob\
    \ fails silently, leaving the operator's mental model diverged from disk reality.\
    \ L3-MultiRoundReviewConvergesByOrthogonalClasses: independent review rounds with\
    \ different lenses find disjoint bug classes; convergence of verdicts (all GO)\
    \ plus union of findings is the strongest achievable assurance short of execution."
- id: PL-ROC-402-017
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
