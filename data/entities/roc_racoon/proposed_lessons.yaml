    The systemd unit is a future-proofing artifact that activates when deployment graduates from interactive development to
    production workloads. The gap investigation report correctly identifies this as a deployment decision, not a missing implementation.
    Same pattern applies to: zswap-config.wad, notebooklm systemd service, NVMe swapfile, cgroup memory limits — all intentionally
    deferred pending production transition or external dependencies.'
  L3_principle: A documented-but-not-active subsystem is not a bug — it is a deliberate stage-gate between development velocity
    and production resilience. The systemd unit is a future-proofing artifact that activates when deployment graduates from
    interactive development to production workloads. The gap investigation report correctly identifies this as a deployment
