  L2_insight: FastMCP's DNS-rebinding protection is opt-in for loopback but mandatory
    for non-loopback binds. When binding to 0.0.0.0, you MUST explicitly configure
    allowed_hosts with wildcard port patterns because clients send Host headers with
    explicit ports. The wildcard pattern "host:*" matches any port. This is not a
    bug -- it is the correct security posture for LAN-exposed MCP servers.
  L3_principle: L3-LANBindingRequiresExplicitDNSRebindingAllowlist - When binding
    MCP server to 0.0.0.0 (non-loopback), you MUST explicitly configure TransportSecuritySettings
    allowed_hosts with wildcard port patterns (host:*). Default localhost-only allowlist
    rejects legitimate LAN traffic. L3-WildcardPortPatternIsMandatory - Clients send
