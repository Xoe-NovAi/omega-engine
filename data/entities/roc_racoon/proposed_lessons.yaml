proposals:
  - lesson_id: roc-20260629-001
    l1: "Discovered that ANAi/XNAi era security patterns (validate_safe_input, sanitize_content, TDPGate/TaintedData) were never ported to Omega Engine — this is the second instance of legacy security patterns dying in the reclamation gap (Chainlit heritage was the first)."
    l2: "Security patterns are the most fragile artifacts during stack reclamation. They must be ported BEFORE functional patterns, not after."
    l3: "Security infrastructure rots fastest in the reclamation gap — port it first."
    domain: "legacy_reclamation"
    tags: ["security", "porting", "legacy_minding"]

  - lesson_id: roc-20260629-002
    l1: "The AAIF spec (draft-schemacommons-aaif-00) referenced in KGC-001 and P7_MAPPING_SPEC does not exist at the IETF. It is a fabricated standard. The real standards are Google A2A v1.0 and IETF draft-klrc-aiagent-auth-02."
    l2: "Any standard reference must be verified at the source (IETF datatracker, GitHub org, standards body). If it can't be fetched, assume fabrication."
    l3: "Standards must be falsifiable — trust verifiable foundations."
    domain: "cognitive_integrity"
    tags: ["a2a", "m17", "hallucination_detection"]

  - lesson_id: roc-20260629-003
    l1: "GenerateResult.latency_ms defaults to 0.0 but is never populated on the success path — 100% of successful inferences report 0.0 latency. This is a broken contract."
    l2: "Every dataclass field with a non-None default must be populated on all code paths. If a field has a default that is never changed, it's a design smell."
    l3: "Default values lie — every contract field must be exercised by a contract test that verifies real data on all paths (M21 Gate Integrity)."
    domain: "code_quality"
    tags: ["m21", "m22", "contract_testing", "observability"]
