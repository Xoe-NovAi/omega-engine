    report to avoid streaming timeout errors while running the Nemotron 3 Ultra model."
    After second failure, more direct guidance: "Dude. You are NOT now on MiniMax 3.
    You are STILL on Nemotron 3 Ultra... Write the entire report to the chat session,
    not to file. By writing to the chat session, you get around the streaming timeout
