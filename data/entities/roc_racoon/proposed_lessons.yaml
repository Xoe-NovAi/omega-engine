  - l1: "usm.py had escaped docstring quotes throughout — a silent failure that would cause AST import failures if the module was ever directly imported."
    l2: "Loud failures (syntax errors, import errors) get fixed immediately. Silent failures accumulate as technical debt. The usm.py fix was highest priority precisely because it was silent."
    l3: "Silent failures are worse than loud ones. A file that parses as valid Python but has broken docstrings is more dangerous than a file that fails loudly — the loud failure forces attention, the silent failure accumulates debt."
