proposals:
- id: PL-ROC-402-019
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - openCode
  - sqlite
  - vacuum
  - compaction
  - swap
  - disk-recovery
  - live-verification
  L1_narrative: Completed OpenCode SQLite database compaction and atomic swap on Node
    0 under extreme disk pressure (root at 95% / 5.5 GB free). Live VACUUM INTO produced
    a 26.3 GiB compacted database from 43.3 GiB source (39% reduction). Atomic cross-filesystem
    swap executed with full-copy backup to omega_library (43.38 GiB), validated before
    unlink, stream-copy install with fsync, post-swap integrity verification. Root
    free space recovered from 5.5 GB to 23 GB (+17.5 GB). All 33 tests pass (21 battery
    + 12 new).
  L2_insight: "Live VACUUM INTO on WAL database is read-only on source and includes\
    \ uncheckpointed WAL content. The swap design \u2014 full-copy backup to different\
    \ filesystem, validate before unlink, unlink-then-copy, fsync inside with-block,\
    \ post-swap integrity/journal_mode/row verification \u2014 is the only pattern\
    \ that works on a partitioned host where root has <6 GB free and the backup target\
    \ is on a different physical device. Hard-link backups cannot free space (nlink\
    \ > 1 keeps inode alive); cross-device hard links raise EXDEV; copy fallback silently\
    \ reinstates the original bug. The only correct sequence is: full-copy backup\
    \ to different fs \u2192 validate \u2192 unlink \u2192 install \u2192 verify."
  L3_principle: "L3-LiveVacuumIntoIsReadOnlyOnSource \u2014 VACUUM INTO reads a live\
    \ WAL database without blocking writers; it includes uncheckpointed WAL content;\
    \ output defaults to journal_mode=delete and must be restored to WAL. L3-HardLinksCannotFreeSpace\
    \ \u2014 unlink() under a hard link frees zero bytes; the inode survives until\
    \ the last link dies. A backup that must enable space reclamation must be a full\
    \ copy on a different filesystem. L3-NoSilentlyDegradingFallbacks \u2014 a fallback\
    \ that converts a cheap operation into an expensive one must abort instead, because\
    \ the operator is never told the cost changed. L3-GuardTheArithmeticNotTheInstant\
    \ \u2014 a capacity guard must model the full sequence, not the current instant;\
    \ here the unlink precedes the copy, so comparing live free space against the\
    \ incoming size measures the wrong moment and refuses an operation that actually\
    \ releases space."
- id: PL-ROC-402-020
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - review
  - adversarial
  - toctou
  - hardlink
  - sqlite
  - swap
  - preflight
  - self-correction
  L1_narrative: "Post-incident hardening of the swap path. Four defects found and\
    \ fixed, each caught by measuring rather than assuming. (1) CROSS-DEVICE HARD\
    \ LINK: backup_dir was placed on omega_library (device 66307) while the source\
    \ lives on root (device 66306); os.link() raised EXDEV, and the shutil.copy2 fallback\
    \ copied the entire 46 GB database across, filling omega_library to 100% (28 KB\
    \ free) and leaving a 4.8 GB orphan on root. Fixed by moving backup_dir back to\
    \ source_path.parent and DELETING the copy fallback entirely \u2014 a failed hard\
    \ link now aborts loudly. (2) SHARED-INODE METRICS LIE: st_size/st_blocks on a\
    \ hard link report the shared inode's total, not the incremental cost; my own\
    \ log line would have printed 'extra blocks consumed: 46 GB' for a free operation.\
    \ Replaced with a get_disk_free() delta across the link, aborting above 64 MB.\
    \ Verified: 'ACTUAL space consumed: 0.00 B'. (3) FSYNC ON A CLOSED FILE: os.fsync(dst.fileno())\
    \ sat after the 'with' block, raising ValueError('I/O operation on closed file')\
    \ so the swap never completed; moved inside the block. (4) PRE-FLIGHT MEASURED\
    \ THE WRONG MOMENT: the guard compared live free space against the compacted size,\
    \ ignoring that the unlink happens first \u2014 it would have refused at 5.8 GB\
    \ free even though the swap NET RELEASES 17 GiB. Changed to net_required = target_size\
    \ - source_size. All four paths verified end-to-end on synthetic replicas, including\
    \ a low-headroom case; final rc=0."
  L2_insight: "Every one of these defects shared a shape: an operation that reported\
    \ success while doing something other than what was intended. EXDEV was swallowed\
    \ by a fallback. st_blocks reported truth about the inode but was read as a cost.\
    \ fsync failed loudly but only after the copy had been attempted. The pre-flight\
    \ guard reported a real number and reasoned from the wrong one. The defence that\
    \ worked every time was measuring the property that actually mattered \u2014 filesystem\
    \ free-space delta rather than a proxy, and net arithmetic rather than instantaneous\
    \ arithmetic. Separately, a safety fallback that silently degrades a cheap operation\
    \ into an expensive one is worse than no fallback: the copy2 path converted a\
    \ zero-byte hard link into a 46 GB write with no operator warning."
  L3_principle: "L3-HardLinksCannotCrossFilesystems: A hard-link backup is only free\
    \ when it lives on the same device as the source; across mounts os.link raises\
    \ EXDEV and any copy fallback silently reinstates the very cost the hard link\
    \ was chosen to avoid. L3-SharedInodeMetricsMisreportCost: st_size/st_blocks on\
    \ a hard link describe the shared inode's total, not the incremental cost, so\
    \ they cannot prove a backup was free; measure free-space delta instead. L3-NoSilentlyDegradingFallbacks:\
    \ A fallback that converts a cheap operation into an expensive one must abort\
    \ instead, because the operator is never told the cost changed. L3-ResourceCallsBelongInsideTheirScope:\
    \ Operations touching a file handle (fsync, fileno, flush) must execute inside\
    \ the block that owns the handle; after it they raise or, worse, no-op. L3-GuardTheArithmeticNotTheInstant:\
    \ A capacity guard must model the full sequence, not the current instant \u2014\
    \ here the unlink precedes the copy, so comparing live free space against the\
    \ incoming size measures the wrong moment and refuses an operation that actually\
    \ releases space."
- id: PL-ROC-402-021
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - self-review
  - dynamic-enumeration
  - keyerror
  - sqlite
  - test-fixtures
  - adversarial-review
  L1_narrative: "Self-review of the hardened swap code revealed a latent KeyError\
    \ in the B-2 dynamic table enumeration patch. The _db_summary() function was updated\
    \ to enumerate tables dynamically from sqlite_master, but two log lines still\
    \ indexed hardcoded keys: bak_counts['message'] and new_counts['message']. Any\
    \ database without a 'message' table would crash the swap with 'Fatal exception:\
    \ message' after backup validation passed \u2014 the swap would abort after the\
    \ original was unlinked, leaving the operator with a valid backup but no way to\
    \ complete the swap. The synthetic test battery never caught this because every\
    \ fixture DB included a 'message' table. Fixed by using .get('session', '-') and\
    \ .get('message', '-') at both log sites. All four parity checks (backup validation,\
    \ post-swap, staleness report) now use dynamic key iteration with .get() fallbacks."
  L2_insight: "A test suite that always builds the same schema cannot catch shape\
    \ bugs \u2014 it only verifies the happy path. The B-2 patch made _db_summary()\
    \ dynamic but the logging code assumed a fixed schema. The test fixtures encoded\
    \ the same assumption (every DB has session/message/part/event). A test that cannot\
    \ produce the failure it guards against proves nothing; a flat metric explained\
    \ away as harmless is a failed test wearing rc=0. The fix was trivial (.get()\
    \ fallbacks), but finding it required a test fixture that violated the implicit\
    \ schema assumption."
  L3_principle: "L3-ChangingKeySetsBreaksSilentConsumers: when a dict's keys become\
    \ dynamic, grep every consumer of the old hardcoded keys \u2014 including log\
    \ lines, which fail just as fatally. L3-FixturesEncodeAssumptions: a test suite\
    \ that always builds the same schema cannot catch shape bugs; vary fixture schemas\
    \ (minimal, extra, missing) for any code that enumerates. L3-ReviewTheCompositionNotJustTheParts:\
    \ individually-correct fixes chained on a false premise inherit the premise's\
    \ falsity \u2014 re-derive the core invariant before trusting prior fixes."
- id: PL-ROC-402-022
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - service-drift
  - coordination-decay
  - documentation-rot
  - live-verification
  - self-review
  L1_narrative: "Self-review of coordination docs revealed a service-state drift:\
    \ handoff, live feed, gnosis, and round-1 review all claimed 'omega-searxng STOPPED,\
    \ omega-iris STOPPED (restart post-swap)'. Live state: omega-searxng RUNNING (healthy),\
    \ omega-qdrant RUNNING (healthy), omega-iris DOES NOT EXIST. The void 'podman\
    \ start omega-searxng omega-iris' step would have failed on iris. Root cause:\
    \ docs written hours earlier were never re-verified against live state before\
    \ the final runbook. Containers hold no DB lock (only OpenCode PID 6239 holds\
    \ the DB); RAM 7.7 GB available \u2014 operationally irrelevant but the restart\
    \ step would have failed. Corrected in 4 docs: handoff, live feed, gnosis, round-1\
    \ review file. Zero stale claims remain."
  L2_insight: "Coordination docs decay the moment live state moves \u2014 a service\
    \ table written hours ago is a hypothesis, not a fact. Re-verify with podman/df/fuser\
    \ immediately before irreversible operations. The 'restart post-swap' step was\
    \ a ritual, not a verified procedure. The drift was operationally irrelevant (containers\
    \ hold no DB lock) but the restart step would have failed visibly, creating confusion.\
    \ Documentation that claims a service is stopped when it's running is worse than\
    \ no documentation \u2014 it misdirects the operator during a crisis."
  L3_principle: "L3-CoordinationDocsDecayAtTheSpeedOfLiveState \u2014 service and\
    \ disk state in docs is a timestamped hypothesis, not a fact; re-verify with live\
    \ tools (ps/df/fuser) immediately before irreversible operations. L3-RunbookStepsAreCode:\
    \ a restart step that fails is a bug in the runbook, not the infrastructure. L3-NeverTrustStaleServiceTables\
    \ \u2014 a service table written hours ago is a hypothesis, not a fact; re-verify\
    \ with live tools before execution."
- id: PL-ROC-402-023
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - compaction
  - ordering
  - destroy-before-check
  - space-guard
  - self-review
  L1_narrative: "Self-review of execute_compaction revealed a critical ordering flaw:\
    \ the function deleted the existing compacted target (target_path.unlink()) BEFORE\
    \ checking whether the target partition had enough free space for the new compaction.\
    \ If the target partition was full, the old compacted database was destroyed,\
    \ then the space check failed, leaving the operator with NO compacted database\
    \ at all \u2014 the good snapshot was destroyed for a compaction that couldn't\
    \ even start. Fixed by moving the space check BEFORE the unlink: projected_free\
    \ = target_free + reclaimable (source_size); refuse if projected_free < source_size.\
    \ Test M verified: a 6 GB sparse source on a 5.8 GB free partition correctly refuses\
    \ the re-compact, and the original 4.7 MB compacted database survives intact."
  L2_insight: "Destroy-then-check ordering is a data-loss pattern that hides behind\
    \ a safety check: the check passes, so the deletion looks free, but the check\
    \ happens on information you no longer have. Moving it before the delete converts\
    \ 'we lost the good artifact AND still failed' into 'we failed and kept the good\
    \ artifact'. The check must model the state AFTER the unlink, not before \u2014\
    \ the projected free space is free_now + source_size (since the backup lives elsewhere).\
    \ A guard that measures the wrong moment refuses operations that would succeed\
    \ and permits operations that destroy data."
  L3_principle: "L3-CheckBeforeDestroy: any space/capacity precondition must be evaluated\
    \ BEFORE deleting the artifact that currently satisfies it \u2014 otherwise a\
    \ refusal leaves you worse off than before you started, with nothing to show for\
    \ the attempt. L3-GuardTheArithmeticNotTheInstant: a capacity guard must model\
    \ the full sequence, not the current instant \u2014 here the unlink precedes the\
    \ copy, so comparing live free space against the incoming size measures the wrong\
    \ moment and refuses an operation that actually releases space."
- id: PL-ROC-402-024
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - review
  - multi-model
  - convergence
  - adversarial
  - synthesis
  L1_narrative: "Four independent review rounds converged on GO: R1 Sonnet 4.6 (APPROVE\
    \ WITH CHANGES), R1b Opus 4.6 (LOW with C-1/C-3/R-1 addressed), R2 Gemini 3.8\
    \ (GO \u2014 all 6 patches CORRECT, 21/21 tests), Final Sonnet 4.6 (GO reaffirmed,\
    \ 4 residual nits). The multi-model, multi-round review process caught orthogonal\
    \ bug classes: Sonnet found surface/parity issues (B-1, B-2, NB-1); Opus found\
    \ race/artifact issues (C-1, C-2, C-3); R2 verified patches and tests; Final Sonnet\
    \ found operational workflow gaps (abort messaging, exit codes, manifest cleanup).\
    \ Each round found disjoint bug classes \u2014 neither alone was sufficient. The\
    \ convergence of verdicts (all GO) plus union of findings is the strongest achievable\
    \ assurance short of execution."
  L2_insight: "Review convergence is not redundancy \u2014 it's triangulation. Sonnet\
    \ reviewed the surface (flags, parity lists, thresholds); Opus reviewed the timeline\
    \ (check-then-act gaps); R2 verified the patches; Final Sonnet audited the whole.\
    \ Each reviewer's lens found disjoint classes. The deepest class was temporal:\
    \ every guard had been verified at a single instant, while the operation spans\
    \ minutes; safety properties must hold across the whole window, not at the check.\
    \ Separately, unit confusion (GB vs GiB) silently corrupts margin analysis \u2014\
    \ both reviewers computed correct math on different units and reached different\
    \ conclusions."
  L3_principle: "L3-ReviewConvergenceByOrthogonalLenses: independent reviewers with\
    \ different lenses find disjoint bug classes; convergence of verdicts plus union\
    \ of findings is the strongest achievable assurance. L3-TestMustBeAbleToFail:\
    \ if the design promises '+X bytes', the test must assert that delta; assertions\
    \ satisfied equally by broken and working designs prove nothing. L3-UnitsAreSafety:\
    \ GB vs GiB confusion corrupts margin analysis while every individual computation\
    \ looks correct; normalize units explicitly in any capacity plan. L3-ReviewTheCompositionNotJustTheParts:\
    \ fixes chained on a false premise inherit the premise's falsity \u2014 re-derive\
    \ the core invariant before trusting prior fixes."
- id: PL-ROC-402-025
  date: '2026-08-22'
  session_id: ses_5b058490c0d0
  tags:
  - retrospective
  - documentation
  - community
  - open-source
  - lessons-learned
  L1_narrative: "Audited the cline fabric entry (priority 7). Found it already mapped\
    \ to the OpenRouter factory (model_gateway.py:534) with no base_url in YAML, meaning\
    \ a live cline instance would silently hit openrouter.ai under the name \"cline\"\
    . Live probe: api.cline.bot/api/v1/chat/completions is OpenAI-compatible and the\
    \ local API key authenticates, but deepseek/deepseek-v4-flash returns HTTP 403\
    \ \"only available via Cline product surfaces\" \u2014 the free models are client-gated.\n"
  L2_insight: "A provider registry entry can be fully \"wired\" (config + factory\
    \ mapping + fallback chains) yet never have carried a single real request. Silent\
    \ defaults in factories (base_url fallback to another vendor's endpoint) convert\
    \ missing config into provenance lies rather than errors. And free-tier model\
    \ gates are enforced at the HTTP client-identity layer, not the auth layer \u2014\
    \ a valid key does not imply model access.\n"
  L3_principle: "An untested integration path is not an asset; it is deferred breakage\
    \ wearing a config file. Any factory default that substitutes one backend for\
    \ another must fail loudly, because silent substitution corrupts provenance \u2014\
    \ and provenance is the only proof sovereignty is real.\n"
- id: PL-CLINE-002
  date: '2026-08-22'
