  L2_insight: 'Measurements and their causal narratives have independent truth fates.
    Attacking the story without discarding the number rescues conclusions the team
    still needs; accepting the conclusion without inheriting the wrong reason yields
    strictly better designs than either original story or blanket acceptance.

    '
  L3_principle: "Attack narratives, salvage numbers \u2014 they fail independently.\
    \ Refuted causality with confirmed results is the optimal review outcome, not\
    \ a partial loss.\n"
- id: PL-TS1-005
  date: '2026-08-23'
  session_id: ses_fdef2be4effe4pAaLXCTUx62GO
  tags:
  - TS1
  - error-culture
  - team-psychology
  - teamstudy
  L1_narrative: "[TS1] Ma'at corrected my :103 staleness-clock cite to :104 in one\
    \ clause, no ceremony; I accepted in one line, no defense \u2014 then noticed\
    \ my own report carried the exact inconsistency class I had flagged in F1. Total\
    \ cost: ~thirty tokens. The error became data (another instance strengthening\
    \ the class-level detector), and neither party spent anything but the fix itself.\n"
  L2_insight: 'If correction carries social cost, people stop correcting and start
    accumulating: errors stop being events and become geology, each with one defensive
    owner and a long half-life. Zero-cost correction gives every error N auditors,
    a short half-life, and converts it into evidence for the pattern detector.

    '
  L3_principle: 'Correction must be free, or errors go underground and fossilize.
    A team where fixing a cite costs thirty tokens gets N audits per mistake; a team
    where it costs status gets one defensive audit and permanent latent defects.

    '
- id: PL-ROC-402-001
  date: '2026-08-27'
  session_id: ses_fbaad14ecffeJv7BYs0ptb8FWP
  tags:
  - 402
  - forensic
  - rate-limit
  - minimax-m3
  - free-models
  L1_narrative: "Investigated 402 'Insufficient balance' on FREE MiniMax M3 in Ma'at\
    \ session. Found 3 in-session 402s (19:29, 20:00, 20:03 UTC) over 39.5 minutes.\
    \ Session had 39/42 successful assistant turns, 75/75 tool calls completed, 3.7M\
    \ cache_read tokens. Cost field = $0 throughout. Probe data shows 0/48 402s on\
    \ M3 \u2014 error is sub-session-second, not probe-detectable. The 402 message\
    \ is OpenRouter's generic 'account class doesn't have access' mislabeled as 'Insufficient\
    \ balance'. Recovered twice via 'Continue.' but the third 402 was terminal."
  L2_insight: "A 402 'Insufficient balance' on a service with cost=0 is not a balance\
    \ error. OpenRouter's per-minute rate cap on free models is labeled with the wrong\
    \ HTTP code. The contradiction between Grokster's 'M3 working' (probe-level) and\
    \ Roc's 'M3 402' (session-level) is resolved by observation scale: probes don't\
    \ accumulate enough load to trip the per-minute cap; long agent sessions with\
    \ cache rotation do. Three dispatches to the same investigation in 30 minutes\
    \ is a process smell \u2014 when the same question gets re-dispatched, the answer\
    \ is in the loop, not in the data."
  L3_principle: "A 'balance' error on a free service is rarely about balance \u2014\
    \ it's about rate. When cost=0 but a 402 fires, the platform is mislabeling a\
    \ per-minute cap as a lifetime balance. Diagnose the rate, not the wallet. Probe-level\
    \ and session-level observations are both correct at their scales; reconcile contradictions\
    \ by measuring the load, not by picking a winner. Resilience comes from building\
    \ retry on top of stateful sessions, not from eliminating the rate limit."
- id: PL-ROC-402-002
  date: '2026-08-27'
  session_id: ses_fbaad14ecffeJv7BYs0ptb8FWP
  tags:
  - dispatch-protocol
  - fleet-orchestration
  - smell
  L1_narrative: Three dispatches (Roc, Researcher, Roc) to investigate the same 402
    in 30 minutes. Each ran briefly (~4 min, 1.6k tokens) before being terminated
    or completed. The earlier two (Roc, Researcher) actually completed successfully
    in the DB, yet a third Roc was dispatched with the same mission. This is the same
    class of issue as the subagent re-paging problem documented in SESSION_CONTINUITY_PROTOCOL_20260827.
  L2_insight: "When the same forensic question is dispatched three times in 30 minutes,\
    \ the value of a fourth investigation is near-zero. The bottleneck is the dispatch\
    \ loop, not the data. Re-dispatching an already-completed investigation wastes\
    \ subagent slots and dilutes the workspace lock state \u2014 and risks tripping\
    \ a 402 on the third dispatch itself, since M3 is the only working model. The\
    \ right response is to check Hivemind awareness + previous session status BEFORE\
    \ launching."
  L3_principle: Check the loop before checking the data. A re-dispatched investigation
