  L1_narrative: Implemented Compaction Capture sidecar (scripts/compaction_capture.py)
    that polls OpenCode SQLite DB for parts with summary=true, routes summary text
    to active entity workspace, auto-digests into sqlite-vec with entity_name partition,
    and creates raw anchor + SCA metadata. The sidecar polls opencode.db every 5s
    in read-only mode, filters for assistant parts with summary=true, routes to entity
    workspace via SESSION_ENTITY_MAP.yaml, and upserts to sqlite-vec with entity_name
