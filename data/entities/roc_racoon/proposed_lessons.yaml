    implementation was unsafe. Empirical test proved VACUUM INTO does NOT replicate
    journal_mode: a WAL source produced a ''delete''-mode output. Research corroborated:
    ''the VACUUM INTO command does not replicate this setting, resulting in the backup
    database defaulting to the delete journal mode.'' Two consequences: (1) silent
    downgrade of OpenCode from WAL concurrency to rollback-journal locking with no
    error raised; (2) if the output were put into WAL mode but not checkpointed, copying
    only the .db during swap would DISCARD everything in the output''s -wal sidecar.
    Fixed by adding finalize_compacted_target(): PRAGMA journal_mode=WAL + PRAGMA
    wal_checkpoint(TRUNCATE), then asserting no residual WAL. Also hardened verify_compaction()
    to assert header parity across journal_mode/user_version/application_id/page_size
    and fail-closed on mismatch, and rewrote the swap to stage-then-os.replace() atomically
    with try/except rollback instead of copy2() onto the live path. Verified empirically:
    user_version/application_id/page_size/encoding ARE preserved; VACUUM INTO DOES
    read through uncheckpointed WAL (committed row captured); source synchronous=2
    (FULL) means SQLite fsyncs the output so it is durably written. Found live DB
    has foreign_keys=0, so ON DELETE CASCADE is NOT enforced and any future session-pruning
    script would orphan rows. Full e2e tested on a synthetic replica: compaction,
    header parity, integrity_check ok, foreign_key_check 0 violations, row parity
    MATCH, swap correctly REFUSED while a process held the DB (exit 1) then succeeded
    with journal_mode preserved as wal.'
  L2_insight: "I asserted an architecture was safe, then tested it and found my own\
    \ code would have silently degraded the target system. Verifying the TOOL is not\
    \ the same as verifying the PLAN \u2014 the plan's safety depended on a property\
    \ (journal_mode persistence) I had assumed rather than measured. SQLite persists\
    \ journal_mode in the file header, and VACUUM INTO is the one operation that does\
    \ not carry it across. Two independent verifications (empirical test + third-party\
    \ research) agreeing is what turned a suspicion into a fix. Atomic file replacement\
    \ via staging-then-os.replace() is strictly safer than copying onto a live path,\
    \ because a mid-copy failure otherwise leaves a truncated database with no automatic\
    \ recovery."
  L3_principle: "L3-VerifyTheToolNotJustThePlan: An implementation can be unsafe even\
    \ when its design is sound. Test the artifact against the real target's invariants\
    \ before trusting it; assumptions about persisted properties are the usual casualties.\
    \ L3-SnapshotToolsDropDurableState: Tools that rebuild a file from scratch (VACUUM\
    \ INTO, export, serialize) may omit persistent header/property state even while\
    \ preserving data. Always diff header properties explicitly, not just row counts.\
    \ L3-CascadeRequiresThePragma: Declared ON DELETE CASCADE is inert without PRAGMA\
    \ foreign_keys=ON on the executing connection; verify enforcement rather than\
    \ trusting the schema. L3-AtomicInstallViaStagedRename: Never copy onto a live\
    \ path. Stage to a sibling temp file then os.replace(), with rollback on any exception\
