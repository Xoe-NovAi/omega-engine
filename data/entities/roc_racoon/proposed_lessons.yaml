proposals:
  - lesson_id: roc-20260629-001
    l1: "Discovered that ANAi/XNAi era security patterns (validate_safe_input, sanitize_content, TDPGate/TaintedData) were never ported to Omega Engine — this is the second instance of legacy security patterns dying in the reclamation gap (Chainlit heritage was the first)."
    l2: "Security patterns are the most fragile artifacts during stack reclamation. They must be ported BEFORE functional patterns, not after."
    l3: "Security infrastructure rots fastest in the reclamation gap — port it first."
    domain: "legacy_reclamation"
    tags: ["security", "porting", "legacy_minding"]

  - lesson_id: roc-20260629-002
    l1: "The AAIF spec (draft-schemacommons-aaif-00) referenced in KGC-001 and P7_MAPPING_SPEC does not exist at the IETF. It is a fabricated standard. The real standards are Google A2A v1.0 and IETF draft-klrc-aiagent-auth-02."
    l2: "Any standard reference must be verified at the source (IETF datatracker, GitHub org, standards body). If it can't be fetched, assume fabrication."
    l3: "Standards must be falsifiable — trust verifiable foundations."
    domain: "cognitive_integrity"
    tags: ["a2a", "m17", "hallucination_detection"]

  - lesson_id: roc-20260629-003
    l1: "GenerateResult.latency_ms defaults to 0.0 but is never populated on the success path — 100% of successful inferences report 0.0 latency. This is a broken contract."
    l2: "Every dataclass field with a non-None default must be populated on all code paths. If a field has a default that is never changed, it's a design smell."
    l3: "Default values lie — every contract field must be exercised by a contract test that verifies real data on all paths (M21 Gate Integrity)."
    domain: "code_quality"
    tags: ["m21", "m22", "contract_testing", "observability"]

  - lesson_id: roc-20260628-004
    l1: "Identified 20+ legacy locations across 3 partitions — only 6 are cataloged in the MASTER_SYNTHESIS. The workbench DB at data/workbench/workbench.db is completely empty (no tables exist)."
    l2: "Without a centralized catalog, legacy knowledge is effectively lost. No single agent can answer 'what have we mined and what haven't we?'"
    l3: "Cataloging is not documentation — it is the prerequisite for all sovereign mining."
    domain: "legacy_mapping"
    tags: ["centralization", "workbench", "inventory"]

  - lesson_id: roc-20260628-005
    l1: "The entities-archive at /media/arcana-novai/omega_library/entities-archive/ contains 90+ entity directories spanning the complete entity evolution — never mined."
    l2: "The entity lineage from Omnidroid through experimental entities (ent_0 to ent_49+) to the current 11-agent fleet is all in one unmined location."
    l3: "The largest gold mine is always the one you haven't looked at yet."
    domain: "legacy_mapping"
    tags: ["entities-archive", "lineage", "evolution"]

  - lesson_id: roc-20260628-006
    l1: "The mayan-preservation-vision.html (1,092 lines) is NOT an external project document — it is an Omega Stack deployment vision produced by Claude during a pivotal March-April 2026 session."
    l2: "The Living Word Initiative is the Omega Engine applied to indigenous language preservation. It should be treated as strategic planning content, not external."
    l3: "A deployment vision IS part of the engine lineage — the engine's purpose is to be deployed."
    domain: "vision"
    tags: ["mayan", "deployment", "preservation"]

  - lesson_id: roc-20260628-007
    l1: "Two files named session_gnosis.md exist in different locations (data/entities/roc_racoon/ and workspace/). The workspace one is stale (Jun 22) and causes confusion."
    l2: "Dual tracking files with the same name create ambiguity about which is authoritative."
    l3: "A single source of truth requires unique identifiers."
    domain: "tracking"
    tags: ["gnosis", "standardization"]
