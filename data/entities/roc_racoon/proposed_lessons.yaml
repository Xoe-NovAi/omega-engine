    \ so a hard-link backup cannot create the headroom the operation needs; verify\
    \ reclamation with a free-space delta, not with the plan. L3-AValidatedCopyIsTheOnlyRealBackup:\
    \ a backup must be a separate copy on a different filesystem, checked (size, read-only\
