    \ an alias, and an unverified copy is a hope. L3-TestMustBeAbleToFail: if the\
    \ design promises 'this operation frees X bytes', the test must assert that delta;\
    \ assertions satisfied equally by the broken and the working design prove nothing,\
    \ and a flat metric explained away as harmless is a failed test wearing rc=0.\
    \ L3-ReviewTheCompositionNotJustTheParts: individually-correct fixes chained on\
    \ a false premise inherit the premise's falsity \u2014 re-derive the core invariant\
    \ before trusting prior fixes. L3-FailurePathsNeedAdversarialReviewToo: rollback\
    \ and --force code paths are where data-loss bugs hide (rename across filesystems,\
    \ override past a lock), because happy-path tests never exercise them \u2014 inject\
    \ failures deliberately or they stay untested until they matter. L3-NoOverrideForSilentLoss:\
    \ a guard whose bypass causes invisible data destruction must have no force flag\
    \ at all \u2014 deny the operation, never soften it."
