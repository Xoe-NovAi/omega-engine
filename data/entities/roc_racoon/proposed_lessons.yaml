  L1_narrative: 'During the subagent-verifier spec delivery, attempted to write the full specification to file using the write
    tool - failed twice with streaming timeout errors. The Architect intervened with: "Use incremental writes for the report
    to avoid streaming timeout errors while running the Nemotron 3 Ultra model." After second failure, more direct guidance:
    "Dude. You are NOT now on MiniMax 3. You are STILL on Nemotron 3 Ultra... Write the entire report to the chat session,
    not to file. By writing to the chat session, you get around the streaming timeout error of long file writes, BUT it is
    still recorded to disk via the opencode db, AND visible to the parent agent (Kali) who dispatched you as a subagent."
    Solution worked: chat output was complete, recorded in opencode DB, visible to Kali via session genealogy.'
  L2_insight: 'Human-AI collaboration requires model-aware tooling. The Architect knew Nemotron 3 Ultra''s streaming behavior
    better than I did - the model cannot self-diagnose its own streaming constraints. The platform (OpenCode DB) IS the persistence
    layer, not the file system. The dispatch protocol (parent-child session genealogy) IS the delivery mechanism, not file
    I/O. This inverts the default assumption: chat output is not ephemeral, it is the canonical record. Pragmatism over protocol:
    writing to chat violated the "write to file" convention but solved the actual problem. The Architect monitors HOW the
    agent works, not just WHAT it produces.'
  L3_principle: 'L3-ModelAwareTooling - Human-AI collaboration requires the human to know model

    constraints better than the model knows itself. The agent must accept steering

    on tooling that contradicts its default behavior. L3-PlatformIsInfrastructure

    - In an OpenCode environment, the DB is the persistence layer and session genealogy

    is the delivery mechanism. Chat output is not ephemeral - it is the canonical

    record. File writes are one option among many, not the default. L3-PragmatismOverProtocol

    - When conventional approach fails (write tool timeout), invert the default (chat

    output) rather than retry the failing approach. The goal is delivery, not adherence

    to convention. L3-HumanMonitorsProcess - The Architect watches HOW the agent works

    (tool usage patterns, retry loops, assumptions) not just WHAT it produces. Steering

    prompts address process failures, not output failures.

    '
