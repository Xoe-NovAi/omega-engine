    \ a hard link shares the inode, so `source_path.unlink()` while a backup link\
    \ exists frees ZERO bytes (measured: 6847.24 \u2192 6847.24 MB; only unlinking\
    \ the LAST link freed 50 MB). The previous swap design \u2014 hard-link the DB\
    \ to a backup on the same filesystem, unlink the original, copy the compacted\
    \ DB in \u2014 would therefore have left root at 5.8 GB free and died ENOSPC when\
    \ the 26.25 GiB copy hit the ceiling. My own test had printed 'free 6911.1 \u2192\
    \ 6911.1 MiB (net \xB10.0 MiB recovered)' and I had explained the flat delta away\
    \ as 'the test DB is small' \u2014 the flat delta was the proof of failure, present\
    \ on screen. Three earlier fixes (backup location, free-space-delta measurement,\
    \ net_required arithmetic) were individually correct but built on the false premise\
    \ that unlink reclaims the bytes. Also found: rollback used Path.rename() which\
    \ raises EXDEV across filesystems; --force could bypass the lock-holder check\
    \ (unlink under a live writer sends its writes to an unlinked inode \u2014 invisible\
    \ loss); the backup was never validated before the original was destroyed; directories\
    \ were never fsync'd. Rewrote execute_swap as copy-verified-backup on a DIFFERENT\
    \ filesystem: guards (no lock override, device+capacity, projected space) \u2192\
    \ verify target \u2192 capture counts \u2192 full copy db+wal+shm \u2192 VALIDATE\
    \ (byte size, read-only quick_check, row counts) \u2192 unlink \u2192 install\
    \ with fsync \u2192 post-verify integrity/journal_mode/rows \u2192 restore BY\
    \ COPY on any failure, plus a runtime trip-wire that restores if the unlink does\
    \ not actually free the projected bytes. Six tests green including the production\
    \ direction (root 66306 \u2192 omega 66307) and a chaos-hook restore; all artifacts\
    \ cleaned, real DB byte-identical."
  L2_insight: "Four correct fixes were assembled around one false premise and produced\
    \ a confidently-wrong system \u2014 reviewing the parts is not reviewing the whole.\
    \ The tell was in my own test output (net \xB10.0 MiB recovered) and I rationalized\
    \ it instead of interrogating it: a test whose assertions are satisfied by both\
    \ the working and the broken design is not a test, it is confirmation. Equally:\
    \ preservation and reclamation are antagonistic goals \u2014 the backup's job\
    \ is to keep bytes alive, the unlink's job is to release them, and any mechanism\
    \ that serves both (a shared inode) silently serves neither. Safety properties\
    \ must be verified while the protected asset still exists, and failure paths (rollback,\
    \ force-override) deserve the same adversarial attention as the success path \u2014\
    \ rollback-by-rename and --force-past-lock were both latent data-loss bugs sitting\
