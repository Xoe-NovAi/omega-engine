  - test-coverage
  L1_narrative: "Final self-review before execution. Found and fixed a real bug: the\
    \ B-2 patch made _db_summary() enumerate tables dynamically, but two log lines\
    \ still indexed hardcoded keys (bak_counts['message']) \u2014 any database without\
    \ a message table crashed the swap with `Fatal exception: 'message'` after backup\
    \ validation passed. Caught only because the NF-3 test used a minimal single-table\
    \ DB; the full battery always builds session+message+ tables. Fixed with .get()\
    \ fallbacks, re-tested 21/21. Separately found coordination drift: handoff claimed\
    \ searxng/iris STOPPED, but live state is searxng+qdrant RUNNING and iris nonexistent\
    \ \u2014 corrected in four docs. Verified the drift is operationally irrelevant\
    \ (containers hold no DB lock; RAM sufficient). Live DB quick_check ok (4 min),\
    \ byte-identical."
  L2_insight: "Changing a data structure's key set (hardcoded \u2192 dynamic) breaks\
    \ every consumer that assumed the old keys \u2014 the log lines were not part\
    \ of the parity logic, so the B-2 patch missed them. Test fixtures encode assumptions\
    \ too: a battery that always builds the same schema cannot catch schema-shape\
    \ bugs. And coordination docs decay the moment live state moves \u2014 a service\
    \ table written hours ago is a hypothesis, not a fact; re-verify with podman/df/fuser\
    \ before execution, and treat 'restart post-swap' steps as suspect until confirmed."
  L3_principle: "L3-ChangingKeySetsBreaksSilentConsumers: when a dict's keys become\
    \ dynamic, grep every consumer of the old hardcoded keys \u2014 including log\
    \ lines, which fail just as fatally. L3-FixturesEncodeAssumptions: a test suite\
    \ that always builds the same shape cannot catch shape bugs; vary fixture schemas\
    \ (minimal, extra, missing) for any code that enumerates. L3-CoordinationDocsDecay:\
    \ service and disk state in docs is a timestamped hypothesis \u2014 re-verify\
    \ live (ps/df/fuser) immediately before irreversible operations, and never trust\
    \ a restart step for a resource that may no longer exist."
- id: PL-ROC-402-018
  date: '2026-10-05'
  session_id: ses_ff78b71ebffeDNuypPTT1RL3hH
  tags:
  - ordering
  - destroy-before-check
  - abort-paths
  - exit-codes
  - manifest
  - phase0
  - self-review
  L1_narrative: "User directive: 'if it makes it better, add the patches' \u2014 applied\
    \ Phase 0 (Issues 1-3): (1) every abort path now calls _log_residue() printing\
    \ the retained artifact's path, byte footprint, and exact rm -rf command (test\
    \ J verified all four elements); (2) --await-exit timeout now sets success=False\
    \ so it exits 1 instead of falsely signalling a completed swap (test K monkeypatched\
    \ wait_for_opencode_exit->False and asserted exit code 1); (3) --overwrite now\
    \ deletes the stale manifest alongside the db and sidecars, so a crashed VACUUM\
    \ INTO can no longer leave an old VERIFIED manifest that the next swap would trust\
    \ (test L). Two additional hardening fixes from the same pass: a B-2-followup\
    \ KeyError (log lines indexed hardcoded 'message'/'session' keys while the dict\
    \ had become dynamic) fixed with .get() fallbacks; and an ordering flaw where\
    \ execute_compaction deleted the good snapshot BEFORE the space check, so a refused\
    \ re-compact left the operator with nothing \u2014 the check now runs first and\
    \ refuses with the snapshot untouched (test M proved the good snapshot survives).\
    \ Totals: battery A-I 21/21, new J/K/L/M 12/12."
  L2_insight: "Destroy-then-check ordering is a data-loss pattern that hides behind\
    \ a safety check: the check passes, so the deletion looks free, but the check\
    \ happens on information you no longer have. Moving it before the delete converts\
    \ 'we lost the good artifact AND still failed' into 'we failed and kept the good\
    \ artifact'. Similarly, an abort that leaves residue without naming it is not\
    \ a safe abort \u2014 it is a deferred failure that surfaces later as an unrelated-looking\
    \ error in the next run. And a status flag that survives a skipped operation is\
    \ worse than no flag: the operator believes the work happened."
  L3_principle: "L3-CheckBeforeDestroy: any space/capacity precondition must be evaluated\
    \ before deleting the artifact that currently satisfies it \u2014 otherwise a\
    \ refusal leaves you worse off than before you started, with nothing to show for\
    \ the attempt. L3-AnAbortMustNameItsResidue: every failure path that leaves artifacts\
    \ on disk must report their path, size, and cleanup command; unnamed residue converts\
    \ the next run into a diagnostic hunt through unrelated-looking errors. L3-AFlagThatOutlivesItsWorkIsFalseEvidence:\
    \ a success indicator that is not reset when the work is skipped will be read\
    \ as proof of completion \u2014 reset it explicitly on every early exit."
