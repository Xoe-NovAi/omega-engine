  L1_narrative: 'UFW active with DEFAULT_INPUT_POLICY="DROP" silently dropped all
    inbound LAN traffic to port 8016, causing ECONNREFUSED/timeouts on ASUS Node 1.
    omega-hub was healthy on 127.0.0.1:8016 and 0.0.0.0:8016, but LAN clients could
    not connect. Root cause: no UFW rule for port 8016. Fix: sudo ufw allow 8016/tcp.
    This is a classic silent-failure pattern -- the service reports healthy, local
    tests pass, but remote clients see nothing.'
  L2_insight: A service binding to 0.0.0.0 with local health checks passing does not
    guarantee LAN accessibility when a host firewall has a default-deny policy. The
    service, the bind address, and the firewall must all align. UFW DROP policy means
    packets vanish without ICMP rejection -- clients see timeout, not connection refused.
    Always verify from a remote LAN client, not just localhost.
  L3_principle: L3-ServiceBindDoesNotImplyFirewallOpen - Binding to 0.0.0.0 and passing
    localhost health checks does not prove LAN accessibility when host firewall has
    default-deny. Verify from a remote LAN client. L3-SilentDropIsWorseThanRefusal
    - UFW DROP policy causes client timeouts (no ICMP), making diagnosis harder than
    explicit REJECT. Default-deny firewalls require explicit allow rules for every
    exposed service port.
