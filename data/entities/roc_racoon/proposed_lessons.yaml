    worked: chat output was complete, recorded in opencode DB, visible to Kali via
    session genealogy.'
  L2_insight: 'Human-AI collaboration requires model-aware tooling. The Architect
    knew Nemotron 3 Ultra''s streaming behavior better than I did - the model cannot
