- l1: "Cookie Rotation ≠ API Key Rotation: Web Grok (8 accounts) needs 24-48h cookie expiry rotation (Pattern F OAuthManager.refresh_credentials). CLI Grok (8 accounts) needs 90-day API key rotation (Pattern D KeyRotationManager). Service accounts need on-demand rotation (Pattern E EncryptedStorage.rotate_keys). Three distinct rotation policies, one FleetOrchestrator."
  l2: "The rotation interval is determined by the auth mechanism, not the provider. OAuth cookies expire in 24-48h (Google session policy). API keys last 90 days (industry standard). Service accounts rotate on demand. The FleetOrchestrator must enforce all three policies simultaneously for the 16-account fleet."
  l3: "L3-Rotation-Policy-By-Auth-Mechanism: Rotation interval is a property of the authentication mechanism, not the provider. OAuth cookies = 24-48h. API keys = 90 days. Service accounts = on-demand. FleetOrchestrator enforces all three policies simultaneously. This is why the 16-account schema separates cli (api_key) from web (cookie) auth_method."
