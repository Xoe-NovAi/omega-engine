  l2: "The sqlite-vec memory leak risk (7 confirmed leaks, PR #258 unmerged) is in the virtual table layer. sqlite-vector uses ordinary tables with BLOB columns — no virtual table, no index corruption surface. If benchmarks pass, this is a clean escape hatch from the sqlite-vec dependency risk."
  l3: "L3-sqlite-vector-Escape: BLOB-in-ordinary-tables eliminates virtual table leak surface. The 7 sqlite-vec memory leaks are in vec0 INSERT paths. sqlite-vector (sqliteai) uses ordinary tables with SIMD-optimized brute force + quantization — no virtual table, no pre-indexing, no leak surface. Evaluate as Phase 3 alternative."
