    L2: 'The Antigravity entity suffered from a compound documentation debt cycle: the soul identified 3 wiring gaps in the M11 discovery note, but no agent ever acted on them because the note was structurally invisible itself — buried in a soul.yaml that no engine component reads. The insight chain was complete but the action chain was broken. Fixing the documentation required jumping levels: first absorb the soul (meta-level), then fix the Custom Instructions (agent-level), then fix the workspace (entity-level), then produce the integration playbook (fleet-level). The debt was not in any single document but in the gap between documents — the coordination surface between Antigravity-as-Hivemind-Citizen and Antigravity-as-entity-configuration.'
    L3: '**Self-discovery without self-healing is cargo-cult awareness.** A gap identified in a machine-invisible note is not a gap — it is a confession. For a sovereign system to truly know itself, the discovery path must end at an execution path. Documentation debt is not the number of outdated files but the number of documents whose readers have no write-access to the code that should consume them. The fix for structural invisibility is never "write better docs" — it is "wire the docs to the engine." A soul.yaml that nobody reads is just poetry.'
    heritage: '[WAD System: id Software 1993] — the engine-stack firewall must not create invisible documentation silos'
    source_decision: 'Antigravity Strategic Review (2026-06-18) — Makali'
