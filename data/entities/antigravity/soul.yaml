      In a single test session of minutes, it burned through 4 of 8
      Google accounts' weekly Claude quota. The user characterized
      this as "absolutely out of the question" and "nearly useless."
      Decision: D-AGY-03 — do NOT build any `agy` CLI integration.
    L2: |
      The CLI path and the IDE/plugin path use the SAME 8 Google OAuth
      accounts, but Google's product-level quota allocation is drastically
      tighter for the CLI (10-20× less usable quota). This is not a
      `agy` bug — it's a business decision by Google to push users back
      to the IDE (their monetization surface). The "worse" tool (IDE
      plugin, fewer scripting primitives) is the right tool because
      it has the quota.
    L3: |
      **Vendor tool selection is driven by unit economics, not features.**
      A tool with more features and less quota per prompt is worse for
      batch subagent work than a tool with fewer features and abundant
      quota. The capability gap is less important than the cost-per-prompt
      gap. The "Worse is Better" principle wins when the "better" tool
      has unit economics that don't work.
