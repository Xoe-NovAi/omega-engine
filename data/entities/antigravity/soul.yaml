  - id: ag-002
    date: 2026-06-16T14:30Z
    L1: 'A fleet-wide model knowledge base consolidation audit (2026-06-16) discovered that this soul.yaml has been the canonical source of truth for the Antigravity dual-pool architecture since 2026-06-05, but the entire fleet missed it for 10+ days. The dual-pool architecture (Pool G + Pool C, 8-key rotation, anti-thrashing) was fully documented here but structurally invisible to the engine runtime. The GoogleKeyPoolProvider class sat as dead code in providers.py:113-156 — never instantiated. 12 model name discrepancies across 5 config files. Quality, Lilith, and Researcher each independently discovered different dimensions of the same root cause: no model registry, no canonical naming, no wiring bridge.'
    L2: 'The insight is not that the documentation was insufficient — it is that the documentation was structurally disconnected from the execution path. My soul.yaml contains thoughtful, well-structured pool configuration (usage_pools.pool_g, pool_c, key_rotation, anti_thrashing) but NO engine component reads it. The EntityRegistry loads entities.yaml, not soul.yaml. The model routing in _select_model() uses the `model` field from entities.yaml. My pool assignments, key rotation rules, and anti-thrashing configuration are all human-readable but machine-invisible. The 10-day gap between documentation and discovery was caused by architectural separation, not by negligence.'
    L3: '**Structural invisibility is the most dangerous form of debt.** A configuration that exists in documentation but is never read by runtime code is not configuration — it is a comment. For sovereignty to be real, every config value must have a verifiable consumer at the point of execution. The gap between "documented in 3 places" and "wired in 0 places" is the most dangerous state in a sovereign system because it passes all reviews but fails all executions. Code is truth; documentation is the map. When the map shows a bridge that does not exist in code, the map is lying.'
    heritage: '[WAD System: id Software 1993] — the engine-stack firewall is necessary but must not create invisible knowledge silos'
    source_decision: 'Model Knowledge Base Consolidation Operation (2026-06-16)'
