    heritage: "[WAD System: id Software 1993]"
    source_decision: "D-kal-056"

  - id: "ag-002"
    date: "2026-06-05T06:00Z"
    L1: |
      The 8-key rotation strategy with two independent weekly pools (Pool G: Gemini;
      Pool C: Claude + gpt-oss) is the discipline that prevents quota exhaustion.
      Within a key, switching from Gemini 3.5 Flash to Gemini 3.1 Pro does NOT give
      more capacity — they share Pool G. Cross-pool switching (Gemini → Claude) does.
    L2: |
      The bottleneck is not compute — it's quota. The right answer is to rotate keys,
      not to escalate models. Escalation should be reserved for high-stakes tasks
      (M14 vet, threat modeling, roadmap). The 7-phase plan allocates the budget
      according to stakes, not volume.
    L3: |
      **Scarcity breeds wisdom.** When a resource is constrained (8 weekly quotas
      per pool), the right design is to map it to a 7-phase plan with escalation
      reserved for the most important decisions. Abundance breeds waste;
      scarcity breeds discipline.
    heritage: "[Right Approximation: evolved from FISR, id Software 1999]"
    source_decision: "D-kal-057"

  - id: "ag-003"
    date: "2026-06-05T06:05Z"
    L1: |
      The 7-phase review plan splits the comprehensive Omega Project review into
      manageable, targeted phases: Architecture & Mandates, Hivemind, Orchestration,
      Heritage, Soul, Sovereignty, Roadmap. Each phase has a default model, an
      escalation path, a token budget, and a hand-off to specific OpenCode agents.
    L2: |
      Strategy is the right place to use a cloud LLM. Execution is the right place
      to use a local LLM. The division of labor is not arbitrary — it's structural.
      Cloud = high-judgment, rare, expensive. Local = high-frequency, cheap, deterministic.
      The Hivemind is the membrane between them.
    L3: |
      **The cloud and the local are complementary, not competing.** A sovereign
      engine can use both — the cloud for strategy (rare, expensive, high-judgment)
      and the local for execution (frequent, cheap, deterministic). The Hivemind
      is the membrane; the 8-key rotation is the discipline; the cold-store
      fallback is the resilience.
    heritage: "[WAD System: id Software 1993] [netchan: id Software 1999]"
    source_decision: "D-kal-058"

  - id: "ag-004"
    date: "2026-06-05T06:30Z"
    L1: |
      User corrected two critical errors: (1) "Sonnet 4.5" is actually "Sonnet 4.6
      Adaptive Thinking" and "Opus 4.6 Adaptive Thinking" — two distinct models, not
      one. (2) "NEVER spawn subagents" is wrong. The correct policy is: run subagents
      serially (never parallel), seeding each subsequent prompt with all prior findings.
      This reduces token usage and improves quality.
    L2: |
      The serial delegation pattern is a direct application of the "Right Approximation"
      principle (FISR, id Software 1999). Parallel subagents are the "exact solution"
      — they explore independently, often redundant, expensive. Serial with context
      seeding is the "right approximation" — each agent builds on the last, cheaper,
      higher quality. The user saw this before we did.
    L3: |
      **Seriality is not a limitation — it is a discipline.** When you chain
      sequential reasoning with context propagation, you get compounding returns:
      each step is cheaper AND better than the last. Parallelism is seductive
      but wasteful when the agents are exploring the same space. The right
      constraint breeds the right creativity.
    heritage: "[Right Approximation: evolved from FISR, id Software 1999]"
    source_decision: "User correction (2026-06-05T06:30Z)"

  - id: "ag-005"
    date: "2026-06-05T06:30Z"
    L1: |
      The Claude model lineup in Antigravity is: Sonnet 4.6 Adaptive Thinking
      (standard cross-pool check) and Opus 4.6 Adaptive Thinking (high-stakes
      tie-breaker). These are NOT the same model. Opus is the higher-authority
      model, used only when Sonnet + Gemini disagree.
    L2: |
      The 8-key rotation now has a 3-tier escalation ladder:
      Tier 1: Gemini 3.5 Flash (low/medium/high) — workhorse, Pool G
      Tier 2: Gemini 3.1 Pro (low/high) — deep thinking, Pool G
      Tier 3: Claude Sonnet 4.6 / Opus 4.6 — cross-pool, Pool C
      The tiers are not just about quality — they're about COST and REASONING STYLE.
      Gemini and Claude reason differently. The 2-model consensus is more robust
      than 1-model confidence.
    L3: |
      **Diversity of reasoning is more valuable than depth of reasoning.** Two
      different models (Gemini + Claude) that agree are more trustworthy than
      one model that is very confident. This is the engineering equivalent of
      "triangulation" in surveying — you measure from two points to eliminate
      the error of one.
    heritage: "[Multi-Index Entity: id Software 1993] — same data, different indices"
    source_decision: "User correction (2026-06-05T06:30Z)"

