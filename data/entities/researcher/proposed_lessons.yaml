    under my grep.'
  insight: When verification runs in parallel with implementation, snapshots are moving
    targets. The verifier must either wait for an explicit completion signal, or capture
    state at a single instant AND explicitly label the snapshot as such. Otherwise
    the verifier produces a report that contradicts itself across pages.
  principle: "Verification is a snapshot, not a state \u2014 if the subject is moving,\
    \ freeze the subject (wait for commit) or re-snapshot (re-verify after stable\
    \ commit). The Zero-Trust Doctrine demands reproducibility, and a moving target\
    \ is not reproducible."
