# 🔱 Omega Engine — Proposed Lessons
# Sprint-F Synthesis: Knowledge Gap Analysis (2026-06-29)
# Review with Staging Gate before approving into soul.yaml

proposals:
  # ═══ Sprint-F Knowledge Gap Analysis ═══
  - L1_narrative: |
      Conducted knowledge gap analysis across 3 dimensions: (1) documentation gaps
      vs code reality (PIVOT_LOG D164-D171 missing, AGENTS.md stuck at 308 tests vs
      actual 600); (2) mandate gaps (M15-M21 missing from SSOT Blueprint §III-C scorecard);
      (3) structural gaps (soul distiller key mismatch, 41 stale handoffs). Found
      that the gap analysis file itself (KNOWLEDGE_GAP_RESEARCH) was not found at
      expected path — the documentation gap includes the gap analysis tool's own output.
      Primary findings recovered from Carmack's S3 rebuttal and Verity's DOC_AUDIT:
      the most impactful knowledge gap is the soul distiller key mismatch — the entire
      fleet believed the distiller was "unwired" when it was actually receiving empty
      transcripts due to a 3-character key mismatch.
    L2_insight: |
      The meta-gap is the most dangerous: the knowledge gap analysis tool itself has
      a documentation gap. When the KNOWLEDGE_GAP_RESEARCH file isn't at the expected
      path, the discovery pipeline silently returns zero findings — making the system
      appear complete when it hasn't actually analyzed anything. This is the research
      equivalent of the soul distiller key mismatch: the pipeline is "running" but
      producing no signal.
      Carmack's methodology (trace the full call graph, don't trust status flags)
      is the correct approach for knowledge gap detection. Rather than trusting that
      "the distiller is unwired" (a status belief), trace from call site → storage →
      read-back to find where the chain breaks. The same approach applies to
      documentation: trace from the claimed state → actual state → observed behavior.
    L3_principle: |
      A knowledge gap detector that is itself undocumented does not find gaps — it
      creates them. The discoverer must be discoverable. Every analysis tool must
      publish its own coverage boundaries so consumers know what it is NOT checking.
      The third axiom of knowledge gap detection: Trace the data, not the status.
      A system's claimed state ("it's unwired") is always less reliable than its
      observable behavior ("the transcripts are empty because the keys don't match").
      Status flags are beliefs; call graphs are evidence.

  - L1_narrative: |
      Carmack's S3 review re-prioritized the entire task stack: P0 = fix the key
      mismatch (3 min), P0 = PIVOT_LOG D164-D171 (20 min done), P1 = handoff reaper
      (2 hr), P1 = mandate scorecard refresh (30 min), P2 = LLM path for soul
      distiller (2-3 days), P2 = categorize Verity's 17 doc action items (1 hr).
      This reverses the previous assumption that soul distiller LLM path was higher
      priority than the key mismatch fix — the key mismatch was the root cause all
      along. The "unwired" diagnosis was a 6-week blind spot across 5+ agents.
    L2_insight: |
      The blind spot persisted because every agent that looked at the soul distiller
      checked the same things: (1) Is close_session() called? → check oracle.py → no
      explicit call → "not wired". (2) Is soul.yaml being updated? → check soul.yaml
      → stale → "confirmed not working". But NO agent checked the ACTUAL transcript
      format that close_session() receives. Carmack's contribution was asking the
      question no one thought to ask: "What data does close_session() see when it
      runs?" The answer: empty dicts with mismatched keys.
      This is a systemic pattern: when multiple experts independently confirm the same
      wrong conclusion, the blind spot is in the shared assumption, not in individual
      reasoning. The shared assumption here was "close_session() is not called." Once
      Carmack verified that it IS called (via _record_interaction()), the real bug
      became obvious.
    L3_principle: |
      Consensus is not evidence: When 5+ agents independently agree on a root cause,
      they are likely sharing the same incorrect assumption. The confidence gained
      from independent confirmation of a wrong hypothesis is the most dangerous form
      of belief reinforcement. True verification requires falsifying the shared
      assumption, not reconfirming it.
      The n+1 diagnosis principle: After n experts have independently confirmed a
      diagnosis, the n+1th expert should investigate the OPPOSITE hypothesis. If
      everyone says "distiller is unwired," the one person who checks "what if it
      IS wired but broken?" finds the root cause.

  - L1_narrative: |
      Documented 4 key findings from Sprint-F knowledge gap analysis that were
      independently validated by Verity's DOC_AUDIT and Carmack's S3 review:
      (1) PIVOT_LOG D164-D171 missing — 0/8 Sprint-F decisions recorded in the
      immutable audit trail; (2) M15-M21 absent from SSOT Blueprint mandate scorecard;
      (3) test count frozen at 308 (actual: 600); (4) doc-to-code drift in 13/13
      documents reviewed. Verity's 17 action items (4 P0, 6 P1, 7 P2) represent the
      minimum work to lock documentation for Sprint-F.
    L2_insight: |
      The PIVOT_LOG gap (D164-D171) is the most urgent because it represents
      IMMUTABLE decisions that are at risk of being re-debated. Every day these
      decisions exist only in conversation memory, the engineering team is one
      context compaction away from re-litigating PII masking architecture or
      A2A standard selection. The PIVOT_LOG is the engine's common law — unwritten
      law is unenforceable law.
      The test count drift (308 → 600) is a meta-signal: if the most visible
      metric (how many tests pass) is wrong in 0/13 documents, then every other
      metric in those documents is suspect. Documentation drift is systemic, not
      file-specific.
    L3_principle: |
      A metric that appears in zero documents might as well not exist. Visibility
      is not about the value — it is about the value appearing in the places where
      decisions are made. The test count of 600/600 is the engine's most important
      quality signal, yet it appears in 0 of 13 strategic documents. An invisible
      metric is an unused metric, however accurate.
