- level: L3
  tag: '[R-DEBT-REDISCOVERY]'
  narrative: "The M13 Temple-Grade T11 gate (check-tracking-state) failed with 32\
    \ violations: 3 stale in_progress tasks (9 days old), 15 inverted clock (last_checkpoint\
    \ before created_at), 1 invalid superseded_by pointer, 14 failed tasks with no\
