- level: L3
  tag: '[R-PROV]'
  narrative: Four agents misidentified themselves from stale session metadata while
    the database carried per-message runtime stamps that were correct all along; a
    strategy was built on the wrong identity before cross-checking.
  insight: Self-reports and convenience metadata decay; runtime-stamped records do
    not. Provenance must be resolved mechanically from the closest-to-dispatch source,
    never from what an agent or column claims.
  principle: "Attribute from stamps written at response time, corroborate with independent\
    \ signals, and treat every self-report as a hypothesis \u2014 the cheapest source\
    \ of truth is usually already persisted."
  utility_score: 0.95
  source_trajectories:
