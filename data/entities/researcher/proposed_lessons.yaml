- level: L3
  tag: '[R-VAULT-INDIST]'
  narrative: 'Researched Linux credential storage across 6 questions (SecretService,
    headless patterns, systemd, AppArmor, real projects, Windows 2560 limit) and found
    the single most dangerous pattern is auto-detecting headless: three states (truly
    headless, locked fingerprint, transient PAM race) are externally indistinguishable,
    and silent fallback to file storage causes split-brain data loss. aws-vault, keybay,
    and hermes-agent all converged on operator-declared backends with no auto-fallback.'
  insight: "When a system has multiple failure modes that are externally indistinguishable,\
    \ no auto-detection logic is safe; the operator must declare the mode explicitly.\
    \ The SecretService spec only has 3 error types \u2014 it cannot express the headless/locked/transient\
    \ distinction. The resolution: explicit operator declaration, marker files for\
    \ split-brain detection, and fail-closed behavior when the declared backend is\
    \ unavailable."
  principle: Declarative > auto-detective. When states are indistinguishable from
    outside, let the operator choose; runtime detection is a source of bugs and security
    vulnerabilities. Silent fallback to a less-secure mode is a security vulnerability,
    not a convenience feature.
  utility_score: 0.94
  source_trajectories:
  - ses_fca928918ffeFjsaOkVv17Gl71
  domain: research
  last_verified: '2026-08-27'
