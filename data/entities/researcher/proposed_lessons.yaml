  narrative: 'Resolved the 19 call sites (not 6 as the deep-code analysis reported — verified via grep that included files in cli/, integrations/, library/, observability/, oracle/, skills/, teachers/, tools/, workers/) by introducing a 30-LOC thin shim at src/omega/vault_shim/__init__.py. The shim translates vault.get_credential(provider, key_id) to os.environ.get(f"{provider.upper()}_{key_id.upper()}"). The shim is forward-compatible: the post-debut V-1 vault can drop in behind it without changing any of the 19 call sites. The shim lives in src/omega/vault_shim/ to avoid the PUBLIC_ALLOWLIST.txt exclusion on src/omega/vault/.'
