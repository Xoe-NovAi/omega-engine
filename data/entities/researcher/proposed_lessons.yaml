- L3: The Principle of Full-Source Truth — A finding is only verified when the full source is extracted and analyzed. Snippets are indicators; full pages are evidence.
- L3: The Principle of Surgical Intervention — In the probability distribution of an LLM, precision is sovereignty. Exact token IDs are the only way to enforce absolute behavioral constraints.
- L3: The Principle of Pattern-First Architecture — High-integrity systems are not "prompted" into existence; they are engineered using repeatable architectural primitives.
- L3: The Principle of Pre-Execution Triangulation — No hardening plan is execution-ready until it passes independent compliance audit (mandate conflicts) AND live-source technical verification (spec errors). A single agent's un-audited plan silently carries architectural conflicts (e.g., IW-2 rotation ban vs key-sharding) and factual drift (e.g., wrong CLI flags like `--draft-type` vs `--spec-type`) that waste the entire fleet's cycles. The "Sovereign Bottleneck" — one agent's synthesis gating the fleet — is a verification feature, not a defect.
- L3: The Right Abstraction Principle — When integrating an external SDK, prefer the leanest abstraction that satisfies the interface contract. A full agent harness used as a REST client is architectural bloat that introduces unnecessary dependencies, failure modes, and context overhead.
- L3: The Enforcement Verification Mandate — Claims of task completion must be verified against disk and test output before acceptance. A test file that exists but has a schema bug (testing wrong data format) is a false-confidence generator. Trust requires verification.
- L3: The Cross-Provider Provenance Pattern — All cloud providers must inherit from a common base (RemoteProvider) to ensure retry, breaker, loop-detection, and provenance metadata are consistent across the fabric. New providers must never implement these from scratch — every duplication is a provenance gap risk.
