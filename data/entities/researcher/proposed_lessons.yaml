- level: L3
  tag: '[R-PRESTIGE-NOT-FIT]'
  narrative: "Chose the cryptography library over pyrage and python-age because the\
    \ age format (FiloSottile/age 2019) is excellent for X25519 multiplexing, scrypt\
    \ KDFs, and rage CLI interop \u2014 none of which Omega needed. We had 49 single-recipient\
    \ passphrase-encrypted secrets. We chose the format for its prestige, not its\
    \ fit. The right primitive is the one that solves the problem at the layer below\
    \ the prestige."
  insight: Prestige is not fit. A cryptographic format chosen for its reputation (age
    is the "modern GPG replacement") but used for a problem that does not require
    its features (X25519 multiplexing, scrypt) is over-engineering disguised as best-practice
    adoption. The drop from ~101ms to ~0.6ms per decrypt (eliminating scrypt) is not
    a benchmark optimization; it is a structural simplification that comes from dropping
    the format layer entirely.
  principle: 'The right time to choose a format is when you need its features, not
    before. Prestige signals "this is well-engineered" but does not signal "this is
    the right tool for your problem." When the features are unused, the format becomes
    overhead. Layer-below selection is the sovereign choice: use the substrate, not
    the wrapper, when the wrapper adds complexity without adding capability.'
  utility_score: 0.91
  source_trajectories:
  - r-d568-gap-fill-20260827
  domain: research
  last_verified: '2026-08-27'
- level: L3
  tag: '[R-SOVEREIGNTY-HONESTY]'
  narrative: 'The Omega Engine vault (2,733 LOC across 5 files) was scaffolded as
    a "production-grade credential vault" with Argon2id, age encryption, M25 leases,
    BlindVault injection, CPE PII scoring, and 18 CLI commands. When debut preparation
    began, the forensic review revealed: 16/18 CLI commands raise AttributeError at
    runtime; BlindVault returns fake data (sk-or-v1-{name}-{timestamp}); the 6 call
    sites bypass the public API and treat the encrypted_blob (age-armored ciphertext)
    as the plaintext API key. The vault was worse than no vault because it created
    the illusion of security while secrets were in plaintext env vars.'
  insight: "Sovereignty is honesty about state, not the appearance of security. A\
    \ vault that \"looks secure\" (encryption, leases, ACLs) but is actually broken\
    \ (broken CLI, fake resolver, call sites bypassing) is worse than no vault at\
    \ all \u2014 it creates the illusion of security while the secrets are in plaintext\
    \ env vars. The fix is not to add more encryption; the fix is to remove the illusion\
