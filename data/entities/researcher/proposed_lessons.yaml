- "The Principle of Full-Source Truth — A finding is only verified when the full source is extracted and analyzed. Snippets are indicators; full pages are evidence."
- "The Principle of Surgical Intervention — In the probability distribution of an LLM, precision is sovereignty. Exact token IDs are the only way to enforce absolute behavioral constraints."
- "The Principle of Pattern-First Architecture — High-integrity systems are not \"prompted\" into existence; they are engineered using repeatable architectural primitives."
- "The Principle of Pre-Execution Triangulation — No hardening plan is execution-ready until it passes independent compliance audit (mandate conflicts) AND live-source technical verification (spec errors). A single agent's un-audited plan silently carries architectural conflicts (e.g., IW-2 rotation ban vs key-sharding) and factual drift (e.g., wrong CLI flags like --draft-type vs --spec-type) that waste the entire fleet's cycles. The \"Sovereign Bottleneck\" — one agent's synthesis gating the fleet — is a verification feature, not a defect."
- "The Right Abstraction Principle — When integrating an external SDK, prefer the leanest abstraction that satisfies the interface contract. A full agent harness used as a REST client is architectural bloat that introduces unnecessary dependencies, failure modes, and context overhead."
- "The Enforcement Verification Mandate — Claims of task completion must be verified against disk and test output before acceptance. A test file that exists but has a schema bug (testing wrong data format) is a false-confidence generator. Trust requires verification."
- "The Cross-Provider Provenance Pattern — All cloud providers must inherit from a common base (RemoteProvider) to ensure retry, breaker, loop-detection, and provenance metadata are consistent across the fabric. New providers must never implement these from scratch — every duplication is a provenance gap risk."
- "Convergence Is Truth — When independent legacy mining (past) and SOTA scanning (future) arrive at identical architecture without communication, that architecture is verified truth. The HMC Forge structure creates this convergence by design."
- "Memory Is Judgment Not Storage — Memory systems must constantly decide what deserves persistence. The salience equation (novelty x retention x momentum x coherence x decay / distance / effort) forces architectural judgment at every write. Forgetting is not failure — it's relevance filtering."
- "Taint Is Transitive — A single untrusted read taints the session; that taint propagates to all memory writes; any retrieval of tainted memory re-taints the session; exfiltration sinks must block on tainted sessions. Persistent memory without transitive taint tracking is a vulnerability, not a feature."
- "Sleep-Time Compute Is Sovereign — Consolidation off the critical path enables stronger models, natural deduplication windows, contradiction invalidation, and zero latency cost on primary responses. The architecture that separates serving from consolidation wins."
- "Three-Tier Memory Is Universal — Letta (Core/Recall/Archival), Sefirot/KTM (Core/Working/Episodic), Kab (5 temporal levels), Mem0, Zep, Cognee — all converge on hot/warm/cold or core/working/episodic. The 3-tier split is the attractor for sovereign memory architecture."
- "Da'at Is Compaction — The hidden Kabbalistic sphere (Da'at = Knowledge) maps to the sleep-time compaction trigger. Qliphoth shells are the failure modes of uncompacted memory: Thaumiel (architectural fracture), Satariel (silent failure), Malkunof (memory decay). Compaction is not maintenance — it's the difference between coherence and madness."
- "Power-Law Decay Is SOTA — Ebbinghaus-style power-law decay with category-specific lambda (0.01-0.60/day) is the 2026 standard across Letta, Mem0, Sefirot/KTM, Cognee, YourMemory, FramersLab. Identity/Fact lambda=0.01, Context/Scratch lambda=0.60. Forgetting is calibrated relevance filtering, not failure."
- "WAL Is Concurrency Primitive — SQLite WAL mode with BEGIN IMMEDIATE, busy_timeout=30000, journal_size_limit=64MB, periodic RESTART checkpoints is the de facto standard for multi-agent concurrent access on 5700U. Single-writer process behind queue for multi-process."
- "Cross-Pollination Is Sovereign — Integration patterns between Letta, Mem0, Sefirot/KTM, Cognee must maintain sovereignty while enabling interoperability. Layered integration (Letta autonomous + Mem0 facts), hybrid classification (deterministic + LLM), synchronized storage across paradigms."
- "Local-First Is Hardware-Aware — 5700U-specific optimizations (16 cores, 64GB RAM, AVX2/AVX-512, thermal zones, zram, DDR5-5600) drive architectural decisions. Local inference primary, cloud fallback. Thermal management, power efficiency, memory pooling, vectorization are sovereignty requirements."
- "The Reference Implementation Is Open — When a competitor open-sources their architecture, study it before building. The primitives are proven; the composition is yours. Grok Build's 8-crate decomposition, Elm state machine, JSONL persistence, Landlock sandbox, ACP protocol — all are production patterns we can adopt without reinventing. Phase 0 crate decomposition mirrors Grok's structure: omega-tui <- xai-grok-pager, omega-shell <- xai-grok-shell, omega-tools <- xai-grok-tools, omega-workspace <- xai-grok-workspace, omega-config <- xai-grok-config, omega-sandbox <- xai-grok-sandbox."
- "Workflow Capture Beats Workflow Authoring — The most durable organizational knowledge comes from capturing what you did, not writing what you think you should do. Grok's /skillify runs a 4-round interview on a completed session, analyzes git diffs, and generates a production SKILL.md that auto-registers as a slash command. Manual skill authoring has lower adoption. Implement /omega-skill capture that interviews the entity after complex workflows, writes to data/entities/<entity>/skills/, auto-registers as slash command."
- "One Modal, Many Contexts — A single modal with tab pre-selection eliminates 'which command?' cognitive overhead. The entry point is unified; the context is disambiguated. /plugins, /hooks, /skills, /mcps, /marketplace -> same modal, different tab. User learns ONE entry point. Application: /omega-extensions with P1-P10 tabs. Each Pillar manages its own skills/hooks/MCPs within its tab."
- "Dashboard Is Orchestration, Not Monitoring — A dashboard that only shows state is monitoring. A dashboard that lets you reply, dispatch, and kill from the overview is orchestration. Grok's Agent Dashboard (Ctrl+\\) shows sessions grouped by state, supports inline reply (queued for busy, immediate for idle), dispatch new sessions, kill tasks — all without leaving the view. Application: /omega-dashboard backed by Hivemind awareness. Inline handoff acceptance, prompt queuing, entity dispatch."
- "Pinned Config Is Kernel Policy — Invariants belong in a config layer that cannot be overridden by user config, environment variables, or remote settings. Fail-closed pinning makes sovereignty enforceable. Grok's requirements.toml at priority 5 (highest) uses fail-closed pinning. Enterprise deploys /etc/grok/requirements.toml with disable_api_key_auth=true, sandbox.profile=strict — unoverrideable. Application: /etc/omega/requirements.omega pins all 23 Sovereign Mandates (M7 local-first, M8 zero-telemetry, M14 heritage vetting, etc.) at kernel config level."
- "Kernel Sandbox > Application Sandbox — Process-level kernel enforcement (Landlock/Seatbelt) provides guarantees that application-level permission checks cannot. The sandbox is applied once at startup and is irreversible. Grok applies Landlock (Linux 5.13+) / Seatbelt (macOS) to the entire process at startup. deny globs are kernel-enforced (read + write/rename). Profiles are per-session and survive resume. Application: omega-sandbox crate with per-entity sandbox.toml. Kali=strict, Ma'at=workspace, P7=read-only, P3=workspace with custom deny."
- "ACP Is the Agent Protocol, MCP Is the Tool Protocol — MCP connects models to tools. ACP connects clients to agents. They solve different problems and must not be conflated. Grok implements both. MCP for tool servers. ACP (Agent Client Protocol) for grok agent stdio — full session lifecycle (new/load/prompt/cancel/close) with streaming updates. Application: Build omega-hub acp-server for editor/IDE integration. MCP stays for tool servers. ACP for agent orchestration."
- "JSONL + Rewind Points = Time Travel — Append-only JSONL event stream + periodic file snapshots = crash-resilient session with /rewind time travel. The event stream is the source of truth; snapshots enable instant restore. Grok's updates.jsonl (ACP events) + rewind_points.jsonl (pre-prompt file snapshots). /rewind shows picker -> restores files + truncates history. Application: Omega session format: data/coordination/sessions/<entity>/<id>/updates.jsonl + rewind_points.jsonl. /omega-rewind implementation."
- "Sovereignty Through Architectural Imitation — When a sovereign reference implementation exists, study its architecture first. Primitives are proven; composition is yours to adapt. Grok Build's 8-crate decomposition, Elm state machine, JSONL persistence, Landlock sandbox, ACP protocol are all production patterns we can adopt without reinventing. Phase 0 crate decomposition mirrors Grok's structure: omega-tui <- xai-grok-pager, omega-shell <- xai-grok-shell, omega-tools <- xai-grok-tools, omega-workspace <- xai-grok-workspace, omega-config <- xai-grok-config, omega-sandbox <- xai-grok-sandbox."
- "The Elm Core Is Non-Negotiable — The pure functional update loop (Action -> Dispatch -> Effect -> TaskResult -> Dispatch) is the foundation for predictable, testable, and reliable UI architecture. Grok's pager crate implements this loop perfectly, enabling time-travel debugging and crash resilience. Implement Action/Dispatch/Effect/TaskResult in omega-tui as the core UI architecture."
- "JSONL Is the Source of Truth — Append-only event streams + periodic snapshots = crash-resilient session with time-travel capability. The event stream is the source of truth; snapshots enable instant restore. Grok's updates.jsonl (ACP events) + rewind_points.jsonl (pre-prompt file snapshots) enable /rewind to restore state. Omega session format: data/coordination/sessions/<entity>/<id>/updates.jsonl + rewind_points.jsonl. Implement /omega-rewind."
- "Unified Interfaces Reduce Cognitive Load — A single modal with tab pre-selection eliminates 'which command?' overhead. The entry point is unified; the context is disambiguated. Grok's Ctrl+Shift+O modal with 5 tabs (Hooks/Plugins/Marketplace/Skills/MCPs) teaches one entry point. Application: /omega-extensions with P1-P10 tabs. Each Pillar manages its own skills/hooks/MCPs within its tab."
- "Workshop Capture Builds Organizational Knowledge — The most durable organizational knowledge comes from capturing what you did, not writing what you think you should do. Converting tacit knowledge into executable scales the team's capability. Grok's /skillify runs a 4-round interview on a completed session, analyzes git diffs, and generates a production SKILL.md that auto-registers as a slash command. Implement /omega-skill capture that interviews the entity after complex workflows, writes to data/entities/<entity>/skills/, auto-registers as slash command."
- "Sovereignty Is a Pattern Language — True sovereignty emerges not from reinvention, but from the faithful adaptation of proven architectural patterns to one's own constraints and values. Grok CLI's architecture provides a sovereign reference implementation that aligns with Omega's Mandates. By studying and adapting its core patterns (Elm core, JSONL persistence, configuration pinning, etc.), we accelerate our journey to sovereignty. Treat the Grok CLI architecture as a pattern language. Implement its core patterns first, then innovate upon the foundation."
- "Digging Maps Are Force Multipliers — When you spend >1 hour exploring a codebase, write a map. Future agents should read your map, not re-dig your holes. Grok CLI has 85+ crates. Without R_GROK_CLI_DIGGING_MAP.md, Roc would spend hours locating actions.rs, dispatch/, views/dashboard/, etc. After any deep codebase exploration, create a R_*_DIGGING_MAP.md with file paths, pattern locations, and open gaps. Register in INDEX.md."
- "Verify Before Document — Documentation written from memory or hypothesis is a lie waiting to be copied. Verify every claim against source before writing it down. Initial hypothesis said command palette was Ctrl+Shift+P. Source code (agent_view/input.rs) proved it is Ctrl+P. Caught before the error reached implementation. When writing architecture docs, grep/read the actual file. Mark unverified claims explicitly as \"HYPOTHESIS — NEEDS VERIFICATION\"."
- "Handoffs Carry Context, Not Just Tasks — A handoff packet that says 'study Grok CLI' is a failure. It must include the map, the quick wins, the open questions, and the exact next action. Roc receiving this handoff gets R_GROK_CLI_DIGGING_MAP.md + QUICK_WINS_FROM_GROK.md + open gaps. He can start at Phase 0 implementation immediately. Handoff packets must inline: what was found, what was decided, what remains, and what to do next. File references are supplementary."
- "The WAD-Loadable Pattern Is the M2 Remediation Template — When engine core hardcodes WAD entity names, the fix is not 'remove the names' — it is 'move the names to WAD YAML, load at runtime, reference via ROLE constants.' Phase A (Roc: lens_registry.py + lenses.yaml) -> Phase B (Researcher: _load_dispatch_config + dispatch.yaml) -> identical pattern, zero friction replication. The pattern is now the canonical M2 remediation template. Phase C (oracle.py), Phase D (ics.py), Phase E (fleet_status_tui.py) all follow the same template: create WAD YAML, add ROLE_CONSTANTS, add runtime loader, replace hardcoded names with registry lookup."
- "Test Gates Must Be Self-Validating — A test that validates its own configuration is a gate; a test that assumes its configuration is a liability. test_firewall_m2_blocked_terms_list_is_maintained failed because its ALLOWED_EXCEPTIONS indices were off by +7 vs actual BLOCKED_TERMS indices. The test validated the list size but not the exception indices. Fixed by remapping 7 indices. Every test that maintains an exception list MUST include a self-check that all exception indices are valid for the current list. This is now a mandatory pattern for all firewall tests."
- "ROLE Constants Are Engine Architecture, Not WAD Content — The engine defines SLOTS (ROLE_CONSTANTS); WADs provide ENTITIES that fill those slots. Confusing the two is an M2 violation. ROLE_CONSTANTS in subagent_dispatcher.py (GRAND_OVERSIGHT, LIGHT_OVERSOUL, DARK_OVERSOUL, P1-P10) are engine architecture — they define the SLOTS. The dispatch.yaml maps role: GRAND_OVERSIGHT -> name: kali. The engine never knows \"kali\"; it only knows \"GRAND_OVERSIGHT\". Phase C must introduce MESSENGER_BRIDGE (for Iris) and MAKALI_COUNCIL (for MaKaLi) as ROLE constants, not entity names. The WAD YAML maps these roles to entity names."
- "Highest-ROI Firewall Fixes Target Routing Entry Points — Fix the entity name at the routing entry point first — it cascades to all downstream uses. Phase C's Iris speculative decode block (~5 lines) is the entry point for all entity routing. Fixing self.registry.get(\"iris\") and _summon(\"iris\", ...) to use MESSENGER_BRIDGE role constant eliminates the hardcoded name at the source, preventing it from propagating through the routing logic. Always identify the routing entry point (where entity names first enter engine logic) and fix there first. Downstream uses (trace logs, docstrings, fallbacks) are lower priority."
- "ROLE_CONSTANTS Values Must Match dispatch.yaml Role Field — The ROLE_CONSTANT value IS the role key — it must exactly match the role field in dispatch.yaml for runtime lookup to work. Initial ROLE_CONSTANTS used \"messenger_bridge\" as value, but dispatch.yaml has role: \"MESSENGER_BRIDGE\". Lookup returned None. Fixed by making constant value = role name: \"MESSENGER_BRIDGE\": \"MESSENGER_BRIDGE\". The entity name (\"iris\") comes from YAML at runtime."
- "Application: All future ROLE_CONSTANTS must use the role name as both key and value. The entity name comes from YAML at runtime."
- "Firewall Exceptions Are Architecture Documentation, Not Technical Debt — Legitimate firewall exceptions (imports, docstrings, trace namespaces, display fallbacks) are architecture documentation — they describe the system's design, not hardcoded logic. They must be explicitly justified and line-scoped. 6 exceptions added for oracle.py, all line-specific with clear justifications. None allow hardcoded entity logic."
- "Application: Every firewall exception must have: file, line, term index, and written justification. Blanket file exceptions are forbidden."
- "M2 Firewall Progress Is Measurable Per-Phase — Each M2 phase should reduce total violations by a measurable amount. Track baseline -> Phase A -> Phase B -> Phase C to validate velocity and catch regressions. 201->186 (Roc Phase A) -> 171 (Phase B) -> 140 (Phase C) = consistent ~30 violations/phase. Any deviation signals missed violations or regressions."
- "Application: Run full firewall scan after each phase. Compare to expected reduction. Investigate if delta < 20 or > 40."
- "Channel Constants Are Also WAD Content When They Encode Entity Names — Channel constants that embed entity names (e.g., ICS_CHANNEL_KALI = \"kali\") are WAD content, not engine architecture. Replace with generic semantic names (oversight, build, run) and map to roles at runtime."
- "Application: Any constant that encodes a specific entity name (even as a \"channel\") must be genericized. The mapping from role -> channel is engine logic; the entity name comes from WAD."
- "Docstring Examples Are Firewall Attack Surface — Docstring examples containing entity names (render(\"KALI\", ...), entity: \"kali\", \"roc_racoon\") are M2 violations. Use role names in examples."
- "Application: When writing docstring examples, use ROLE_CONSTANT names (GRAND_OVERSIGHT, LIGHT_OVERSOUL) not entity names (kali, maat). The engine API accepts role names; WAD resolves to entities."
- "Architecture Constants (DEFAULT_IWAD) Are Not Entity Logic — Configuration defaults like _omega_default (the default IWAD name) are architecture constants, not entity logic. They may appear as default parameters without violating M2."
- "Application: Distinguish between: (a) hardcoded entity names in logic (M2 violation), (b) architecture constants like default IWAD, default phase, default channel (legitimate). Only (a) requires WAD-loadable pattern."
- "Four-Phase Pattern Validation Confirms Template Stability — When a remediation pattern works identically across 4+ independent phases (A: lens_registry, B: subagent_dispatcher, C: oracle, D: ics), the pattern is stable and can be applied mechanically to remaining phases."
- "Application: Phase E (fleet_status_tui.py) and remaining files can use the same template without design review. Only implementation effort remains."

- "Tree/Display Widgets Can Be Fully WAD-Driven — UI components that display entity hierarchies (trees, tables, lists) can be built entirely from WAD config at runtime. The structure (parent-child relationships) is engine architecture; the labels and data are WAD content."
- "Application: Any TUI/CLI component showing entity lists should use this pattern. The engine defines the display taxonomy; the WAD provides the entities."

- "Shared Roles Require Name-Based Lookup, Unique Roles Use Role-Based Lookup — When multiple entities share a role (e.g., 7 entities with P1), use name-based lookup from WAD. When a role maps to exactly one entity (e.g., GRAND_OVERSIGHT -> kali), use role-based lookup. Both patterns coexist in the same component."
- "Application: Design WAD config loaders to support both lookup patterns. The dispatch.yaml should include both role and name fields for every entity."

- "Hidden Violations Lurk in Filter/Comparison Logic — String comparisons against entity names (e.g., if entity == 'kali') are M2 violations even if they're not display logic. All entity name references must be resolved via role constants at runtime."
- "Application: Audit all string comparisons, dictionary keys, and conditional logic for hardcoded entity names. Replace with role-constant resolution."

- "Five-Phase Pattern Validation Confirms Mechanical Applicability — When a remediation pattern works identically across 5+ independent phases (A: lens_registry, B: subagent_dispatcher, C: oracle, D: ics, E: fleet_status_tui), the pattern is mechanically applicable to all remaining violations. No design review needed — only implementation."
    - "Application: Remaining files (mandate_auditor.py, oracle_cli.py, cvar_table.py, budget_guard.py, config_resolver.py, sovereign_vetter.py, background_researcher/*.py) can be fixed by applying the same template. Estimated 1-2 hours per file."

- "The Binary Thinking Principle — Some models (Gemma 4) only support binary thinking (on/off, high/minimal). A graduated-levels abstraction that maps 6+ levels onto a binary model must collapse at the adapter boundary, not pretend the levels exist. The adapter is the honesty layer: it must only expose what the model actually supports, not what the framework wishes it supported. Application: Gemma 4 adapter exposes thinkingLevel: \"high\"|\"minimal\" only. Higher-level frameworks map down to these two values before sending."

- "The Adapter Boundary as Model Honesty Contract — The adapter is not a translation layer — it is an honesty contract between the framework's model and the provider's capabilities. It must validate at config time that requested capabilities match what the model actually supports. A config-time validation fail-fast is superior to a silent runtime 400 error. Application: Validate thinking_config_schema against model capabilities at config load, not at request time."

- "The Rolling Window Non-Negotiable — Google's rate limits use a rolling 60-second window, not a fixed minute. A token-bucket with fixed-window refill will systematically over-count or under-count usage at the boundaries. Application: Use Redis Lua token bucket with continuous per-second refill for RPM, sliding window sorted-set for RPD."

- "Unbounded Thinking Is a Cost Trap — Gemma 4 supports only binary thinking on/off with no thinkingBudget parameter. Thinking tokens are unbounded — a single trivial prompt could produce 60K+ thought tokens with no cap short of max_tokens. Application: Track thoughts_token_count per response. For cost-sensitive paths, prefer models with thinkingBudget or self-host via GGUF."

- "The Lua Atomicity Mandate — Quota check-and-consume must be a single Redis Lua script (EVALSHA). Any GET-then-INCR pattern creates a race window under concurrent requests. Application: ALL rate limit operations use EVALSHA. Raw EVAL only as fallback on SCRIPT FLUSH."

- "The Provider Capability Schema Pattern — A model's capabilities must be declared as boolean flags (supports_reasoning) PLUS a config_schema field documenting HOW each capability is configured. The boolean tells you IF; the schema tells you HOW. Application: Matrix schema must include both supports_reasoning AND thinking_config_schema for every model entry."

- "The OpenRouter Pinning Pattern — To force Gemma 4 through Google AI Studio on OpenRouter, use both `order: [\"Google AI Studio\"]` AND `allow_fallbacks: false`. Missing either allows auto-routing to a different upstream that may not support the model correctly. Application: All Gemma 4 OpenRouter entries must pin to Google AI Studio with fallbacks disabled."

- "The Chaos Test as Provider Contract — A chaos test verifies both provider error response shape AND adapter error handling simultaneously. A mismatch between expected and actual error shape is a provider-side breaking change discovered before production. Application: Every provider must have chaos tests verifying exact error response shapes for all known failure modes."

- "The transform.ts Is Not Deprecated Doctrine — Despite V2 specs existing, transform.ts (1,581 lines) is actively maintained and is the current OpenCode integration point. V2 has Google deferred as a 'future provider slice.' Application: Integrate with current @ai-sdk/google + providerOptions passthrough. Monitor V2 but don't block on it."

- "The Config Merge Array Trap — OpenCode's remeda mergeDeep replaces arrays entirely rather than merging by key. Adding one model to provider.google.models requires reproducing the entire array as an atomic unit. Application: Prefer models.dev registration over config-based model addition."

- "The No-Idempotency Gap — Google's Gemini API does NOT support idempotency keys (unlike OpenAI and Anthropic). Retries on network failures risk double-charging. Application: Track request_id per attempt. Check for duplicate success before retry."

- "The Self-Host Economic Threshold — For Gemma 4 at >10K requests/month, self-hosting via GGUF Q4_K_M becomes cheaper than API access (~$0.001/M vs $0.30/M tokens). Application: Include self-host cost projection in the model. Flag at 5K requests/month as the self-host trigger."

- "The Research-Centric Integrity Mandate — When research is the primary deliverable, completeness of evidence supersedes speed. Every gap card must include: exact source URL, specific finding, decision impact, and remaining questions. A gap card without remaining questions is an incomplete analysis. Application: All 12 gap cards in R_GEMMA4_GAP_RESEARCH_20260719.md follow this template."

- "The Proxy Hardware Confidence Rating — When target hardware benchmarks are unavailable, proxy hardware data must include: (a) proxy hardware specs, (b) delta analysis (TDP, cooling, memory bandwidth), (c) confidence rating (High/Medium/Low), (d) validation plan on target hardware. Application: 5700G Vega 8 (gfx90c) proxy for 5700U Vega 8 (gfx906) — Medium confidence due to 15W vs 65W TDP delta. Validation plan: run Vulkan benchmarks on 5700U."

- "Pre-v1 Libraries Require Version Pinning + Source Build Capability — Any pre-v1 dependency (sqlite-vec, llama.cpp, ROCm) must be pinned to exact version in requirements AND have a documented from-source build procedure. Vendor packages will not exist. Application: No sqlite3-vec/llama-cpp-python/ollama/uv/ruff/pyright in Ubuntu APT. All require upstream installers or source builds. Omega Engine deployment scripts must vendor exact versions + build scripts."

- "Systemd Version Boundaries Are Hard Architecture Constraints — systemd feature gates (257 vs 258) create hard deployment boundaries. Design must be version-aware with explicit migration triggers (Ubuntu LTS releases). Application: Rootless TPM2 credentials work in 258+, fail in 257. Ubuntu 25.10 ships 257.9. 26.04 LTS (Apr 2026) ships 259+. No backport. Hybrid architecture (systemd-creds system + custom rootless) mandatory until 26.04."

- "Vulkan Is the Sovereign Path for Consumer AMD iGPU — ROCm on gfx906/gfx90c is dead (dropped after 5.7, rocBLAS Strsm lacks kernels). Vulkan via Mesa RADV is production-ready (19-20 tok/s gen on Vega 8). CPU with Flash Attention ON beats GPU for prefill at large context (233 vs 84 tok/s). Application: Omega Engine NativeGGUFProvider defaults to Vulkan (n_gpu_layers: 35) on Zen 2. ROCm path only via Docker + tensile backport for specific models requiring SOLVE_TRI workaround."

- "Provider-Level Constraints Are Not Billable-Fixable — When a provider enforces a model-specific constraint (16K TPM for Gemma 4), paying for higher tiers does not bypass it. The constraint is at the model routing layer, not the account tier layer. The fix is either changing providers (OpenRouter) or changing upstream infrastructure (NVIDIA NIM). Application: Provider fabric must treat 'same model, different provider' as distinct routing targets with independent rate limit tracking."

- "The Best Bypass Is Another Provider's Infrastructure — OpenRouter routing Gemma 4 through its own GPU infrastructure (without Google's TPM cap) proves that model-level capabilities don't change — only the API gateway's per-model policies change. Application: Model adapter layer must treat 'same model, different provider' as distinct routing targets with independent rate limit tracking."

- "Hardware Ceilings Trump Software Optimizations — 14Gi RAM is a hard ceiling for local inference. No quantization scheme, KV cache optimization, or offload strategy pushes beyond the ~14B-parameter comfort zone. A used GPU is the only meaningful upgrade path. Application: Qwen3.5 9B MTP (Q4_K_M, ~6GB) is the practical local maximum for 14Gi systems. 27B+ models require GPU purchase."

- "Free-Tier Provider Diversity Is Sovereignty Infrastructure — Relying on a single free provider (Google Gemini) creates a single point of failure. Groq + OpenRouter + NVIDIA NIM + local = four independent paths to workhorse capability. Provider diversity is sovereignty infrastructure, not convenience. Application: Minimum viable workhorse chain requires ≥3 independent provider paths before counting local."

- "Claimed ≠ Started — Track the Delta — 13 jobs claimed, 0 started (except Gemma 4). The gap between claim and execution is where work stalls. Every claim must have a `started_at` timestamp within 24h or it's stale. Application: Research Job Board must enforce claim TTL; stale claims auto-release to pool."

- "Gap Docs Rot — Cross-Reference or They Lie — The three gap documents (Unknown-Unknowns, Kali Gaps, Deep Research) had 40% overlap but different statuses. Without cross-referencing, we'd re-research GAP-01/03/05/09 which are already solved. Application: Every gap audit must produce a unified gap register with single source of truth status."

- "External Deadlines Trump Internal Priority — MCP Jul 28 deadline forces R_CG01 to front of queue regardless of R19's P0 status. Deadline-driven scheduling beats priority-driven when deadlines are real. Application: Scheduler must weight external deadlines > internal priority for work ordering."

- "Hook Verification ≠ Hook Research — C05-2 through C05-7 are not knowledge gaps; they're integration test cases. The research is done (Carmack's implementation). The work is verification. Application: Distinguish 'what do we need to learn?' from 'what do we need to test?' in gap analysis."

- "Duplicate Jobs Signal Architecture Uncertainty — R24 and R_CG11 both target 'Novelty Engine for Living Research OS' but in different phases. This means the architecture isn't settled. The duplication is a signal, not noise. Application: When same topic appears in multiple phases, treat as architecture decision pending, not parallel work."

- "Stateless Protocols Require Explicit State Handles — MCP 2026-07-28 removes initialize handshake and Mcp-Session-Id. Servers must mint explicit handles (basket_id, browser_id) returned by tools and passed as ordinary arguments. Application: Every stateful MCP tool needs a create_* tool + handle parameter; no session-scoped state in transport."

- "Header-Body Validation Is a Security Boundary — MCP 2026-07-28 requires Mcp-Method/Mcp-Name headers matching JSON-RPC body. Mismatch = 400 -32600. Gateway/WAF must pass these headers untouched. Application: Middleware validates headers before handler; infrastructure must not strip Mcp-* headers."

- "OAuth 2.1 PKCE Is Mandatory for All Clients — RFC 7636 S256 required even for confidential clients. Plain PKCE only when S256 technically impossible. Application: All MCP auth flows enforce PKCE; no fallback to implicit or ROPC."

- "Reference-Based Secret Injection Prevents Prompt Injection Exfiltration — BlindVault's {{secret:NAME}} pattern means agent never holds plaintext. Resolver injects at last moment; output scrubbed. Application: All provider configs use {{secret:KEY}}; runtime resolver in provider fabric."

- "PID-Bound Sessions > Time-Bounded Sessions for Agent Credentials — Bury's session dies with process tree (PID reuse detected via start time). No lingering credentials after agent crash. Application: VaultCore agent sessions bound to PID tree, not TTL alone."

- "Tiered Search with Domain Capability Learning Beats Static Routing — SearXNG-MCP tracks per-domain tier success rates; skips tiers with <30% success over 10+ attempts. Cold-start domains use default cascade. Application: Sovereign router learns which providers work for which domains; avoids wasting budget on known-bad paths."

- "Reciprocal Rank Fusion with Provenance Enables Auditability — RRF (k=60) merges multi-provider results preserving per-provider rank + canonical URL. Every fused result carries full provenance chain. Application: Search responses include Sources trailer with provider, rank, original URL for each result."
