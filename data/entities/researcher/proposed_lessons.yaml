  tag: '[R-COMP]'
  narrative: Two completed missions became unreconstructable from live context after
    provider-stream loss and compaction, because session IDs lived only in conversation,
    not in gnosis; recovery required disk-artifact forensics.
  insight: Chain of custody is broken not by crashes but by the gap between doing
    the work and writing down where the work lives; compaction exploits exactly that
    gap.
  principle: Write session ID plus artifact path at mission completion, never at session
    end; anything recorded only in conversation is already lost.
