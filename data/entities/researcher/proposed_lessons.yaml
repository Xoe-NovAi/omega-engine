- L3: The Principle of Full-Source Truth — A finding is only verified when the full source is extracted and analyzed. Snippets are indicators; full pages are evidence.
- L3: The Principle of Surgical Intervention — In the probability distribution of an LLM, precision is sovereignty. Exact token IDs are the only way to enforce absolute behavioral constraints.
- L3: The Principle of Pattern-First Architecture — High-integrity systems are not "prompted" into existence; they are engineered using repeatable architectural primitives.
- L3: The Principle of Pre-Execution Triangulation — No hardening plan is execution-ready until it passes independent compliance audit (mandate conflicts) AND live-source technical verification (spec errors). A single agent's un-audited plan silently carries architectural conflicts (e.g., IW-2 rotation ban vs key-sharding) and factual drift (e.g., wrong CLI flags like `--draft-type` vs `--spec-type`) that waste the entire fleet's cycles. The "Sovereign Bottleneck" — one agent's synthesis gating the fleet — is a verification feature, not a defect.
- L3: The Right Abstraction Principle — When integrating an external SDK, prefer the leanest abstraction that satisfies the interface contract. A full agent harness used as a REST client is architectural bloat that introduces unnecessary dependencies, failure modes, and context overhead.
- L3: The Enforcement Verification Mandate — Claims of task completion must be verified against disk and test output before acceptance. A test file that exists but has a schema bug (testing wrong data format) is a false-confidence generator. Trust requires verification.
- L3: The Cross-Provider Provenance Pattern — All cloud providers must inherit from a common base (RemoteProvider) to ensure retry, breaker, loop-detection, and provenance metadata are consistent across the fabric. New providers must never implement these from scratch — every duplication is a provenance gap risk.
- L3: Convergence Is Truth — When independent legacy mining (past) and SOTA scanning (future) arrive at identical architecture without communication, that architecture is verified truth. The HMC Forge structure creates this convergence by design.
- L3: Memory Is Judgment Not Storage — Memory systems must constantly decide what deserves persistence. The salience equation (novelty × retention × momentum × coherence × decay / distance / effort) forces architectural judgment at every write. Forgetting is not failure — it's relevance filtering.
- L3: Taint Is Transitive — A single untrusted read taints the session; that taint propagates to all memory writes; any retrieval of tainted memory re-taints the session; exfiltration sinks must block on tainted sessions. Persistent memory without transitive taint tracking is a vulnerability, not a feature.
- L3: Sleep-Time Compute Is Sovereign — Consolidation off the critical path enables stronger models, natural deduplication windows, contradiction invalidation, and zero latency cost on primary responses. The architecture that separates serving from consolidation wins.
- L3: Three-Tier Memory Is Universal — Letta (Core/Recall/Archival), Sefirot/KTM (Core/Working/Episodic), Kab (5 temporal levels), Mem0, Zep, Cognee — all converge on hot/warm/cold or core/working/episodic. The 3-tier split is the attractor for sovereign memory architecture.
- L3: Da'at Is Compaction — The hidden Kabbalistic sphere (Da'at = Knowledge) maps to the sleep-time compaction trigger. Qliphoth shells are the failure modes of uncompacted memory: Thaumiel (architectural fracture), Satariel (silent failure), Malkunof (memory decay). Compaction is not maintenance — it's the difference between coherence and madness.
- L3: Power-Law Decay Is SOTA — Ebbinghaus-style power-law decay with category-specific λ (0.01-0.60/day) is the 2026 standard across Letta, Mem0, Sefirot/KTM, Cognee, YourMemory, FramersLab. Identity/Fact λ=0.01, Context/Scratch λ=0.60. Forgetting is calibrated relevance filtering, not failure.
- L3: WAL Is Concurrency Primitive — SQLite WAL mode with BEGIN IMMEDIATE, busy_timeout=30000, journal_size_limit=64MB, periodic RESTART checkpoints is the de facto standard for multi-agent concurrent access on 5700U. Single-writer process behind queue for multi-process.
- L3: Cross-Pollination Is Sovereign — Integration patterns between Letta, Mem0, Sefirot/KTM, Cognee must maintain sovereignty while enabling interoperability. Layered integration (Letta autonomous + Mem0 facts), hybrid classification (deterministic + LLM), synchronized storage across paradigms.
- L3: Local-First Is Hardware-Aware — 5700U-specific optimizations (16 cores, 64GB RAM, AVX2/AVX-512, thermal zones, zram, DDR5-5600) drive architectural decisions. Local inference primary, cloud fallback. Thermal management, power efficiency, memory pooling, vectorization are sovereignty requirements.
