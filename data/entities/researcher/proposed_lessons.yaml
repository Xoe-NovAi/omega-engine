  domain: research-methodology
  last_verified: '2026-08-23'
- level: L3
  tag: '[TS1]'
  narrative: 'Study #1 converged in Round 1 with zero standing objections across twelve
    settled points because every load-bearing claim arrived pre-attached to its kill
    command (file path, grep, SQL query), making disagreement resolvable by evidence
    rather than stamina; Node consults absorbed what would have been Round 2.'
  insight: "Research discipline's contribution to discourse is falsifiability, not\
    \ answers: pre-specified checks retire objections in minutes, and a convergence\
    \ criterion written first makes zero-objections verifiable rather than vibes-based.\
    \ Discourse amplifies whatever enters it \u2014 including error \u2014 symmetrically."
  principle: 'Bring kill commands, not convictions: evidence-attached claims convert
    discourse from a contest of stamina into a contest of evidence, and entire rounds
    disappear.'
  utility_score: 0.9
  source_trajectories:
  - ses_fd81c19dcffe1nkbPqFg5kRt2v
