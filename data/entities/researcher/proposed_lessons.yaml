- level: L3
  tag: '[R-402-FREE-MODEL-MYTH]'
  narrative: "Investigated the 402 \"Insufficient balance\" error that fired today\
    \ on minimax/minimax-m3:free \u2014 a free model. The error was correct OpenRouter\
    \ behavior: their account-level credit gate blocks ALL API calls (including free\
    \ models) when the account balance is negative, even by $0.02. Found in OpenRouter's\
    \ own limits reference, cross-referenced by 4+ community reports (anomalyco #35142,\
    \ qqqa #39, dandi #75, anweroverflow). Our probe script was checking auth but\
    \ not balance \u2014 the missing signal."
  insight: The phrase "free" in a cloud marketplace is a state of grace conditional
    on the account being in good standing, not a permanent property of the model.
    Our 8-file vault research burst + today's 5 subagent dispatches all ran on a single
    OpenRouter account, meaning one balance event halts the entire fleet. The assumption
    "free means unconditional" is false; the architecture must treat free-tier providers
    as unreliable by default.
  principle: '"Free" is never unconditional in a marketplace; it is always a revocable
    state of grace tied to account standing. A fleet that depends on a single free
    provider is one account event from total failure. Sovereignty = local-first, paid-fallback,
    multi-provider resilience. M7 (Local-First) exists precisely to make this entire
    failure mode impossible.'
  utility_score: 0.94
  source_trajectories:
