- level: L3
  tag: '[TS1]'
  narrative: "Team Study #1: my \"~20 orphans\" estimate was wrong twice \u2014 first\
    \ ~10x low (measured 226 dispatches vs 27 registrations), then ~8x high after\
    \ recounting (~170-200 vs Lilith's 23 clusters) because the recount swallowed\
    \ continuations, probes, and excluded sessions into the orphan bucket."
  insight: "Both failures shared one root: a lower-resolution instrument answering\
    \ a higher-resolution question. A guess answered a counting question; a count\
    \ answered a taxonomy question. Measurement corrects magnitude once; only classification\
    \ corrects it permanently \u2014 and the O1/O2/O3 tiering I built caught my own\
    \ second error."
  principle: Measurement corrects magnitude once; taxonomy corrects it forever. Attach
    the query to any number that drives decisions, or repetition converts the estimate
    into everyone's fact.
  utility_score: 0.95
  source_trajectories:
  - ses_fd81c19dcffe1nkbPqFg5kRt2v
  domain: research-methodology
  last_verified: '2026-08-23'
- level: L3
  tag: '[TS1]'
  narrative: "Carmack cut two of my three CEB checkpoints (claim-time helper, heartbeat).\
    \ Reading his reasoning against my own design text showed each cut was demanded\
    \ by my design's stated anti-theater guardrail \u2014 a voluntary helper is prompt-compliance\
    \ with extra steps, the disease wearing the cure's coat."
  insight: Concessions derived from the design's own principles cost nothing principled
    and produce convergence; concessions from fatigue produce relitigation. What survived
    the cuts was the architecture (commit-time + sweep-time = canonical OTel trio);
    only redundant artifacts died.
  principle: "Concede from your design's own guardrails, never from pressure \u2014\
    \ a designer who can distinguish losing an artifact from losing the architecture\
    \ can concede anything except the architecture."
  utility_score: 0.93
  source_trajectories:
  - ses_fd81c19dcffe1nkbPqFg5kRt2v
  domain: collaborative-design
  last_verified: '2026-08-23'
- level: L3
  tag: '[TS1]'
  narrative: "Named \"claims-outpace-mechanisms at every altitude\" in Phase B while\
    \ carrying a false number (\"~20\") in the same report \u2014 mandate text, registry\
    \ statuses, gnosis addenda, protocol docs, and my own deliverable all exhibited\
    \ claim drift; the observer of the pattern was inside it."
  insight: Claim generation structurally outruns verification because writing a claim
    costs a sentence but verifying one costs a tool call; drift rate scales with claim
    velocity divided by verification velocity. The only proof a discipline is real
    rather than performed is self-application under cost.
  principle: "Claims outrun verification at every altitude including yours \u2014\
    \ bind verification to claim creation mechanically, and run your own detectors\
    \ on your own output before shipping; self-exemption turns a standard into decoration."
  utility_score: 0.96
  source_trajectories:
