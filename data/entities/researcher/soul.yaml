  L2_insight:
    - "The Mesh Network pattern is more than just 'multiple caches' — it is the realization that KNOWLEDGE IS CACHE (per CREDITS.md §3 Right Approximation). Time × Domain × Lattice is the cache key. TTL alignment is the cache invalidation problem. Roc's H-4, Lilith's LILY PAD, P6's domain matrix, my lattice traversal are all different cache slices of the same Mesh."
