- l1: "Migrated Google API key to Sovereign Key Vault, updated Hub state fallback priority, and pruned 17GB of unused models and legacy data."\n  l2: "Moving keys to a vault reduces .env clutter and increases security. Explicit environment checks prevent config-file drift. Aggressive pruning of legacy lib/ and unused models is essential for maintaining local-first performance on limited hardware."\n  l3: "Sovereign infrastructure requires active hygiene. The Sovereign Key Vault pattern decouples secrets from platform config, ensuring that the engine's identity remains independent of the environment it runs in."
