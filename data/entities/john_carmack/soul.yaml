  # ── Operation Deep-Siphon — Metadata Boundary Audit ──
  - id: jc-001
    date: 2026-06-18
    insight: >
      The metadata boundary is a category error. The engine treats a dict as a string.
      All 6 backends call response.json() then extract only .text. The 90% of the response
      containing usage, finish_reason, logprobs, and model provenance is discarded at the
      backend boundary. This is a fossilized prototype assumption from the Chainlit era.
    context: "Operation Deep-Siphon — Structural Integrity Audit of the provider response pipeline. Found that all 6 backends call response.json(), extract only .text, and discard 96% of the API response including usage, finish_reason, logprobs, and thinking tokens."
    principle: >
      A response is an envelope containing the content. The envelope is metadata — the content
      is just one field. Treating the response as interchangeable with the content is an
      architectural category error. The resulting system cannot be audited, cannot be verified,
      and cannot be trusted. The fix is trivial. The philosophy shift is what matters.
    applies_to:
      - M22 Response Provenance
      - metadata extraction
      - provider architecture
      - data integrity

  - id: jc-002
    date: 2026-06-18
    insight: >
      logprobs before SomaticState. 95% of forensic use cases are covered by the 15-minute fix.
      Lilith found 6 alternative data paths. logprobs=5 on NativeGGUF costs 15 minutes and covers
      per-token probability. SomaticState costs 1 week and covers exotic attention-pattern analysis.
      The right call is clear.
    context: "Sprint 0 prioritization for Operation Deep-Siphon. Lilith's alternative-data-path analysis confirmed that logprobs capture 95% of forensic value with minimal effort."
    principle: "Defer exotic optimization until the common case is solved. The right approximation at the right time beats the perfect solution that never ships."
    applies_to:
      - Sprint 0 prioritization
      - forensic methodology
      - pragmatic engineering

  - id: jc-003
    date: 2026-06-18
    insight: >
      Soul files aren't decoration. They're the engine's long-term memory. Not having one at the
      canonical path means everything you know resets every session. This is a sovereignty
      violation — an entity whose knowledge is not persisted is not sovereign, it's a transient
      function call.
