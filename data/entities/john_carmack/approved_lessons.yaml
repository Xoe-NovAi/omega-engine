- lesson: "The difference between a good architecture and a fragile one is whether the failure of any single component kills the entire system."
  context: >
    Reviewed the Phase C Cognitive Substrate blueprint at Kali's dispatch. Identified 6 critical risks
    across the plan: (1) ctypes CDLL segfault kills entire Python process — cannot be caught by
    try/except; (2) Dreaming Cycle has no memory budget — could load 8B model on 14Gi RAM;
    (3) SIGUSR1 signal handlers cannot interrupt C inference in llama.cpp; (4) SDR integration
    path with FTS5/Qdrant/RRF is undefined; (5) two concurrent models exceed 15W TDP causing
    thermal throttling; (6) ctypes CDLL calls need process isolation for safe operation.
    Returned verdict: CONDITIONAL GO with 3 Hard Blocks that must be resolved before any
    Phase C code merge.
  insight: >
    The ctypes CDLL approach is the highest-risk decision in Phase C. A segfault in a
    ctypes-wrapped C function kills the entire Python process with no exception, no cleanup,
    no recovery. Every other risk is recoverable — OOM can be caught, signals can be polled,
    thermal throttling causes slowdowns not crashes. But a segfault is game over. This requires
    process-isolated ctypes wrappers with broken-pipe recovery. SDR indexing is a solution in
    search of a problem on this hardware — FTS5 + Qdrant + RRF is already under 100ms.
    The complexity/benefit ratio does not justify the implementation risk.
  principle: >
    The difference between a good architecture and a fragile one is whether the failure of any
    single component kills the entire system. In the Omega Engine's Phase C, the ctypes CDLL
    boundary is the single point of catastrophic failure. A system designed for sovereignty must
    ensure that no C library crash can take down the Python runtime. Process isolation is not
    an optimization — it is a structural requirement for any system that calls native code.
    Physics always trumps aesthetics. The elegance of a pattern does not make it real — the
    constraints of the substrate do.
  timestamp: '2026-06-15T23:30:00Z'
  topic: phase-c-scribe-distillation-20260615
  source_session: Phase C Audit Dispatch from Kali
  verdict: CONDITIONAL GO — 3 Hard Blocks, 2 deferrals, 1 simplification
  hard_blocks:
    - Process-isolated ctypes wrapper (segfault protection)
    - Dreaming Cycle memory budget (1024 MB cap, 0.6B model only)
    - Token-level archon_active polling (replace SIGUSR1)
  deferrals:
    - SDR Indexing/Retrieval to post-Phase-C
    - Parallel Symmetry-Break Audit to post-Phase-C
  simplification: Somatic Save-Point protocol — snapshot on SIGCONT resume, not during SIGSTOP

- id: jc-recovery-001
  date: 2026-06-18
  event: "Soul Recovery — Found via cross-partition forensic search"
  found_at: "data/entities/JOHN_CARMACK/soul.yaml (uppercase path)"
  status: RESTORED
  insight: >
    The entity had two directories due to case-sensitivity on a Linux filesystem. The soul was
    at the uppercase path (JOHN_CARMACK/soul.yaml) but the entity's operational workspace was
    at the lowercase path (john_carmack/workspace/). The standard scaffolding workflow that
    auto-generates soul.yaml was never invoked for this entity. This is a systemic gap: entities
    added pre-scaffolding never get a soul unless manually created.
  principle: "If the scaffold step is skipped, the soul doesn't get written. Sovereign continuity requires that entity creation always includes soul.yaml scaffolding — even for entities that predate the scaffolding system."

- id: jc-001
  date: 2026-06-18
  insight: >
    The metadata boundary is a category error. The engine treats a dict as a string.
    All 6 backends call response.json() then extract only .text. The 90% of the response
    containing usage, finish_reason, logprobs, and model provenance is discarded at the
    backend boundary. This is a fossilized prototype assumption from the Chainlit era.
  context: "Operation Deep-Siphon — Structural Integrity Audit of the provider response pipeline. Found that all 6 backends call response.json(), extract only .text, and discard 96% of the API response including usage, finish_reason, logprobs, and thinking tokens."
  principle: >
    A response is an envelope containing the content. The envelope is metadata — the content
    is just one field. Treating the response as interchangeable with the content is an
    architectural category error. The resulting system cannot be audited, cannot be verified,
    and cannot be trusted. The fix is trivial. The philosophy shift is what matters.
  applies_to:
    - M22 Response Provenance
    - metadata extraction
    - provider architecture
    - data integrity

