- lesson_id: L-CARMACK-2026-0928-HW-AND-HEADROOM-RULINGS
  title: 'Fleet rulings: one canonical embedder, compression at the tool boundary'
  confidence: 7.0
  category: architecture_ruling
  summary: 'Engineering rulings delivered to MaKaLi on 1024-D vector search across
    asymmetric hardware and on D-582 semantic compression placement. Reasoning is
    from measured hardware constraints and corpus size, not from principle. Confidence
    is 7/10 overall: the vector-size and cache-fit arithmetic is solid, the throughput-parity
    claim between Zen 2 FMA and Raptor Lake VNNI is inferred and would need a microbenchmark.'
  key_findings:
  - 'AVX-VNNI: DO NOT split the embedder. Zen 2 and Raptor Lake both retire ~64 MAC/cycle
    on a 1024-D dot product; the VNNI advantage is int8 throughput and can be neutralised
    by one fleet-wide dtype plus cpuid dispatch'
  - A work split would introduce a cross-node quantisation boundary - structurally
    the Nomic-vs-Qwen error the one-space-per-collection rule already forbids
  - At Phase 1/2/3 (20/60/120 items) the whole corpus is ~480 KB and fits L2 on both
    chips. There is no distribution problem to solve; federating a sub-L2 dataset
    is architecture for its own sake
  - '1024-D fp32 = 4 KB = 64 cache lines: the problem is memory-bound, not FLOP-bound.
    Optimise the load path, not the arithmetic'
  - No ANN index (no HNSW, no IVF) at these cardinalities - pure bloat. Add one only
    when N forces it
  - 'HEADROOM D-582: compression belongs at the TOOL BOUNDARY on READ payloads only.
    Before vector storage is double-lossy and structurally unobservable; inside transport
    envelopes couples layers and destroys diff-ability and M9 error integrity'
  - 'Hard rule: never compress write payloads or tool arguments - those are verbatim
    by contract. Transport stays dumb and lossless'
  - 'MINISIGN/C6: sound as the integrity primitive, INSUFFICIENT as the closure path
    - C6 needs a publisher identity and pinned trust root ABOVE the signature, plus
    a written rotation policy (Ed25519 has no revocation)'
  - One detached signature over the root MANIFEST.yaml transitively covers all 41
    files; the documented verify command must check the ROOT MANIFEST DIGEST or the
    signature never reaches the nested doom_guy_transfer set
  anti_patterns_avoided:
  - Splitting the embedder across nodes to exploit a hardware difference that a dtype
    choice erases
  - Building an ANN index for a corpus that fits in L2
  - Applying lossy compression to write payloads or tool arguments
  - Embedding lossy transforms inside transport envelopes, coupling layers and destroying
    replay
  - Declaring Gate C6 closed on a signature alone, without a pinned out-of-band trust
    root
  research_sources:
  - title: Zen 2 / Raptor Lake dot-product throughput
    date: '2026-09-28'
    url: 'architecture: AVX2+FMA3 vs AVX-VNNI'
  - title: Gate C6 requirement list
    date: '2026-09-28'
    url: 07_open_gates/OPEN_TRANSFER_GATES.md
  sovereign_mandates_engaged:
  - M9 Error Integrity
  - M7 Local-First
  architectural_decisions:
  - id: D-HW-SINGLE-EMBEDDER
    decision: One canonical embedder, co-located with the corpus; both nodes serve
      identical vectors
    rationale: A split introduces a cross-node quantisation boundary for zero measurable
      gain at current corpus sizes
  - id: D-HW-NO-ANN
    decision: Brute-force blocked scan with software prefetch; no ANN index until
      N forces it
    rationale: The 20/60/120-item corpus is ~480 KB and fits L2
  - id: D-582-TOOL-BOUNDARY
    decision: Semantic compression at the tool boundary on reads only; transport stays
      lossless
    rationale: Highest ROI on the dominant volume, reversible via cold-store re-fetch,
      and keeps failure modes observable
  - id: D-C6-MINISIGN
    decision: Adopt Minisign Ed25519 detached signatures; do NOT declare C6 closed
      without a pinned out-of-band publisher trust root and a rotation policy
    rationale: A signature proves a key signed bytes, not that the authorised publisher
      did
