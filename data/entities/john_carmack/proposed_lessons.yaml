- lesson_id: L-CARMACK-2026-0829-INTEGRATION
  title: 5 real gaps found by reading primary sources; 19 of 24 deliverables already
    existed
  confidence: 9.0
  category: architectural_audit
  summary: 'When the brief asked for "Full Implementation" of 4 P0s, the actual state
    of the codebase was 19/24 deliverables already present (4 specs complete, 3 of
    3 code files complete, 1 of 4 test files complete, 2 of 3 scripts complete, 1
    config complete). The remaining 5 gaps were highly specific: SQLCipher integration
    into the connection-policy choke point (NOT the adapter as the spec said), verify_litestream.sh,
    config/systemd/omega-litestream.service, scripts/migrate_to_sqlcipher.py, and
    3 test files. Refusing to re-implement existing code saved ~6 hours of waste and
    exposed two real bugs the spec missed.

    '
  key_findings:
  - 'Axiom 01 (Throughput) over Axiom 02 (Simplicity) when they conflict: writing
    4 specs from scratch instead of verifying the current state would have been pure
    waste. Audit first, then write.

    '
  - "The spec's \"patch sqlite_vec_adapter_optimized.py for SQLCipher\" was wrong\
    \ about the integration point. The real choke point is omega/infra/sqlite_policy.py:get_sqlite_connection()\
    \ \u2014 every SQLite connection flows through it. Patching there = one-line coverage\
    \ for the whole engine. This is Axiom 02 (single canonical path) in action: leverage,\
    \ don't fork.\n"
  - 'Pre-existing bugs in embedding_circuit_breaker.py surfaced only when I made the
    test suite green. record_failure() referenced self._threshold (only set in the
    manual-fallback branch) on the pybreaker path. can_request() delegated to pybreaker''s
    internal state, which doesn''t transition on the threshold-th call. Fixing the
    breaker so its internal health.state mirrors the test contract is a one-place
    edit; the right approximation is "the health snapshot is the source of truth,
    pybreaker is a library."

    '
  - "The pre-existing test test_falls_through_to_second_provider asserted p1.call_count\
    \ >= FAILURE_THRESHOLD \u2014 but the breaker is cross-call, not within-call.\
    \ The fix is a stronger test that actually exercises the threshold-open behavior\
    \ across 3 embed() invocations. Better tests are cheaper than more code.\n"
  - "tvcam 2026-05: do not set retention: in litestream.yml v0.5.x \u2014 silently\
    \ ignored. This is in the spec, the config, AND now in a test that fails the build\
    \ if a future operator adds it. Belt-and-suspenders for a verified production\
    \ gotcha.\n"
  - 'M23 (Failure Integrity) for the SQLCipher integration: when OMEGA_SQLCIPHER_REQUIRED=1
    but sqlcipher3 is missing, the adapter must HARD-STOP. Silent fallback to plaintext
    would defeat the entire purpose of encryption.

    '
  anti_patterns_avoided:
  - Re-implementing existing code because the brief said 'full'.
  - Patching the wrong integration point (the adapter vs the policy).
  - Letting the breaker delegate to pybreaker's opaque state machine.
  - Asserting the test instead of testing the contract.
  research_sources:
  - title: Pytest memory-aware xdist pattern (conftest.py 2026-08-24)
    date: '2026-08-24'
    url: tests/conftest.py
  sovereign_mandates_engaged:
  - M1 AnyIO
  - M11 Soul Integrity
  - M13 Temple-Grade
  - M14 Heritage
  - M23 Failure Integrity
  architectural_decisions:
  - id: D-CARMACK-INT-1
    decision: Patch get_sqlite_connection() in sqlite_policy.py, not the adapter
    rationale: Single canonical path for all DB connections; one change covers 4 call
      sites in the adapter, all of batch_writer.py, all of recall.py, etc.
  - id: D-CARMACK-INT-2
    decision: Embed health.state mirror in _AsyncBreaker.record_failure()
    rationale: pybreaker's internal state is opaque to tests; the health snapshot
      must be the source of truth so test contracts are stable across pybreaker-installed
      vs manual-fallback paths.
  - id: D-CARMACK-INT-3
    decision: Extract systemd unit from setup_litestream.sh heredoc into config/systemd/omega-litestream.service
    rationale: Config-as-code is the law (per existing omega-inference.service). Heredocs
      in install scripts violate it.
