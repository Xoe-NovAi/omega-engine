- id: jc-2026-07-25-004
  tier: L3
  principle: Decision Documentation
  essence: ADRs, ROADMAP, CONTRIBUTING.md — document decisions, not just code. The decision log is the institutional memory; code without context is noise.
  evidence: KG-1 shows CONTRIBUTING.md is mandatory; KG-5 shows maintainers value documentation as much as code; all successful upstream contributions documented decisions
