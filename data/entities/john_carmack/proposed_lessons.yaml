proposals:
  - id: proposal-20260702-001
    title: "The Embedded Model Law — Every add_exchange() triggered an embedding model load"
    l1_narrative: >
      The test suite was consuming 873MB RAM and pinning 4 cores at 100% despite
      OMEGA_ENV=test. Root cause: memory_store.py:add_exchange() calls
      EmbeddingManager.get_embedding() to generate a vector for every recorded
      interaction. The first embedding provider (GemmaGGUFEmbeddingProvider, 300M
      params) loaded llama_cpp.Llama() on first call, taking ~15-30s and 600MB.
      The SemanticRouter correctly short-circuited in test mode, but the memory
      store's add_exchange() path had no such guard. Test time dropped from 197s
      to 73s after adding a zero-vector early return when OMEGA_ENV=test.
    l2_insights:
      - "OMEGA_ENV=test was inconsistently enforced — model_gateway._load_provider_fabric() had it, but EmbeddingManager.get_embedding() did not."
      - "Every Oracle.talk() or .summon() triggers memory_store.add_exchange(), which triggers embedding. Even with MockProvider for inference, the embedding model loads."
      - "The 4-core 100% CPU signature indicated llama.cpp model load (LLAMA_CPP_N_THREADS=4), which we verified was the 300M Gemma GGUF embedding model."
      - "A test env check at a single choke point (EmbeddingManager.get_embedding()) eliminated the load across ALL test paths."
    l3_universal_principles:
      - "Short-circuit environment checks must be enforced at EVERY integration seam, not just the obvious one. The inference path had it; the memory/embedding path did not."
      - "A test mode that loads a 300M model on every interaction is not a test mode — it's a performance test that happens to assert things."
      - "CPU resource signatures are diagnostic gold. The 4-core flat-line told us exactly what was running before any code inspection."
    sovereignty_impact: >
      Without this fix, every developer running `make test` wastes 3+ minutes of
      CPU time and 600MB+ RAM for no testing value. The embedding model is not
      needed for unit tests — vectors are never queried or validated. The fix
      respects the developer's compute sovereignty by not burning resources
      unnecessarily.
    confidence: 10/10
    heritage_tags: ["[id-soft: doom-1993] BSP Culling — short-circuit before expensive operation"]

  - id: proposal-20260702-002
    title: "The Tool Boundary Law — Antigravity google_search is Gemini-specific, not generic"
    l1_narrative: >
      The Antigravity google_search tool was being treated as a general web search
      fallback by agents, but it's hardcoded to gemini-3-flash via the Gemini
      grounding API. It only works when the underlying model request routes through
      the Antigravity endpoint with a Gemini model. Non-Gemini models (OpenRouter,
      Ollama, local GGUF) cannot use it. Added AGENT_MODE=true guard to hide the
      tool from agents, updated error messages to direct to Sovereign Search
      Protocol, and documented the CLI-only constraint in AGENTS.md.
    l2_insights:
      - "google_search is not a general tool — it's a Gemini feature exposed through the Antigravity OAuth endpoint."
      - "The grounding API (googleSearch + urlContext) is a Gemini-only capability not available via OpenAI-compatible endpoints."
      - "Agents using non-Gemini models were failing silently or confusingly when google_search returned Gemini-specific errors."
      - "The Sovereign Search Protocol (SearXNG → Exa → Firecrawl) is the correct fallback for all agents regardless of model."
    l3_universal_principles:
      - "A tool name that implies generality ('google_search') but requires specific model backend ('gemini-3-flash') is a naming bug. Name should reflect actual constraints."
      - "Agents must not be exposed to tools that cannot work with their configured model backend. Tool visibility should be model-aware."
      - "Error messages should always include the correct alternative, not just what failed."
    sovereignty_impact: >
      Without this fix, developers building local-first workflows (non-Gemini
      models) would encounter confusing failures when agents tried to search the
      web. The fix ensures every tool either works correctly or clearly directs to
      its sovereign alternative.
    confidence: 10/10
    heritage_tags: ["[id-soft: quake3-1999] Hard-Boundary Struct — tool access must respect model boundaries"]

  - id: proposal-20260702-003
    title: "The Provider Chain Law — Config must match the canonical fallback order"
    l1_narrative: >
      The providers.yaml had github-copilot (which was removed from active use) at
      priority 6, but no explicit openrouter entry (which is the preferred cloud
      fallback after Google). Updated the chain to match the canonical order:
      native-gguf → lmster → ollama → google → openrouter → opencode-zen → cline
      → mock. Removed github-copilot references from model_gateway.py cloud_providers
      set and pii_masker.py comments.
    l2_insights:
      - "The config drifted from the canonical provider chain documented in ORACLE_STACK.md."
      - "github-copilot was in the fallback chain but had been deprecated — config was never updated to reflect the change."
      - "openrouter was supported by the code (provider_map entry, factory function) but had no config entry."
      - "pii_masker.py and model_gateway.py had stale github-copilot references that would confuse sovereignty tracking."
    l3_universal_principles:
      - "Config drift is inevitable without periodic audit against the canonical source."
      - "Removed providers must be cleaned from all code references, not just the config file."
      - "The cloud provider set drives M7 (local-first) sovereignty tracking — stale entries there cause incorrect sovereignty metrics."
    sovereignty_impact: >
      Accurate provider configuration ensures the local-first fallback chain
      works as intended. A stale github-copilot entry could cause the engine to
      think it's using a cloud provider when the config is actually ignored,
      skewing sovereignty metrics.
    confidence: 10/10
    heritage_tags: ["[id-soft: quake3-1999] Cvar System — configuration must match runtime reality"]

  - id: proposal-20260701-001
    title: "C-FFI Boundary Law — Process Isolation for Native Code"
    l1_narrative: >
      The NativeGGUFProvider was running llama.cpp's C-FFI within the main Python
      process via anyio.to_thread.run_sync(). When llama.cpp crashed (segfault, OOM,
      illegal instruction), it took down the entire engine process. Rewrote the provider
      to spawn a multiprocessing.Process worker with IPC queues. Even with the overhead
      of cross-process serialization, the crash isolation benefit justifies the latency
      cost. A ready/load-error acknowledgment protocol was needed to detect worker init
      failures properly.
    l2_insights:
      - "A C-FFI crash in a thread pool kills the whole process. Process isolation is the correct boundary."
      - "multiprocessing.Queue.get() is blocking — must be wrapped in anyio.to_thread.run_sync() to not stall the event loop."
      - "Worker initialization failures are silent (child crashes, parent doesn't know). Explicit ready/error signals are mandatory."
      - "multiprocessing.Process inherits parent mocks on Linux (fork), which breaks the naive expectation that tests are transparent."
    l3_universal_principles:
      - "Native code boundaries must be process-level, not thread-level. Threads share address space; a segfault in any thread kills all threads."
      - "Distributed initialization requires explicit acknowledgment. Silence is indistinguishable from success in a decoupled system."
      - "The simplicity of fork()-based multiprocessing in tests is a liability — it silently propagates test state into child processes."
    sovereignty_impact: >
      Without this fix, a single C-level crash in the GGUF inference engine could
      bring down the entire Omega runtime, destroying ongoing conversations, memory
      state, and session continuity. With process isolation, the engine survives
      corrupt model loads and runtime crashes, maintaining sovereign continuity.
    confidence: 10/10
    heritage_tags: ["[id-soft: doom3-2004] idHeap — process isolation for native memory", "[id-soft: quake3-1999] Cvar System — config boundary validation"]

  - id: proposal-20260701-002
    title: "Arena Hygiene Law — MALLOC fragmentation prevention in multi-threaded Python"
    l1_narrative: >
      Python's pymalloc allocator assigns each thread its own arena (default 1MB).
      In multi-threaded inference workloads (6 concurrent tasks), each thread's
      arena persists even after the thread finishes, because a single surviving
      Python object pins the entire arena. Without MALLOC_ARENA_MAX=2, this causes
      silent heap fragmentation and eventual OOM on the Ryzen 5700U's 12Gi RAM.
      A stress-test script was created to empirically validate the fix with RSS
      monitoring.
    l2_insights:
      - "pymalloc arenas are per-thread, never freed until all objects in them are GC'd."
      - "One surviving object pins 1MB of arena memory — a classic fragmentation vector."
      - "MALLOC_ARENA_MAX=2 caps arena count, preventing unbounded fragmentation."
      - "MALLOC_MMAP_THRESHOLD_=65536 forces small allocations to use mmap instead of brk(), reducing heap fragmentation."
    l3_universal_principles:
      - "Physical constraints (RAM ceiling) must be understood before optimization. The Ryzen 5700U has 12Gi total; ~2Gi is OS overhead. That's a firm ceiling for all inference."
      - "Fragmentation is a silent killer. It doesn't crash immediately — it degrades over hours. Only empirical stress testing reveals it."
      - "System-level env vars (MALLOC_ARENA_MAX) are performance knobs, not configuration. They belong in the service file, not the code."
    sovereignty_impact: >
      Without arena cap, a long-running session (hours of chat) would silently
      accumulate heap fragmentation until the OOM killer terminates the engine.
      With env var injection, the engine runs indefinitely with stable memory
      footprint, enabling continuous sovereign operation.
    confidence: 8/10
    heritage_tags: ["[id-soft: doom3-2004] idHeap — unified memory allocator", "[id-soft: quake-1996] Zone Memory — tag-based allocation"]

  - id: proposal-20260701-003
    title: "Queue Discipline — synchronous operations in async contexts"
    l1_narrative: >
      During the C-FFI fix, two instances of synchronous Queue operations were
      identified in async methods: Queue.put() blocks on serialization, and
      Queue.get() blocks on I/O. Both were initially used without anyio wrappers,
      which would stall the event loop under contention. Additionally,
      anyio.to_process.run_sync was used for a queue get, which spawns a wasteful
      subprocess just to block on an I/O operation. Fixed by wrapping both in
      anyio.to_thread.run_sync.
    l2_insights:
      - "multiprocessing.Queue.put() blocks during serialization — always use anyio.to_thread.run_sync."
      - "multiprocessing.Queue.get() blocks on I/O — always use anyio.to_thread.run_sync."
      - "anyio.to_process.run_sync spawns a subprocess. Use only for actual compute, never for I/O waits."
    l3_universal_principles:
      - "Any blocking call in an async context requires explicit thread-offload. Assume every stdlib/sync operation blocks unless proven otherwise."
      - "The right tool for queue waits is anyio.to_thread.run_sync, not anyio.to_process.run_sync. Process pools are for compute isolation, not I/O waits."
    sovereignty_impact: >
      Blocking the event loop would cause request timeouts, heartbeat failures,
      and cascading context losses across the engine. Correct queue discipline
      ensures the engine remains responsive under load, preserving session
      continuity.
    confidence: 10/10
    heritage_tags: ["[id-soft: quake3-1999] netchan — out-of-band message handling"]

  - id: proposal-20260701-004
    title: "API Contract Law — Verify function/class existence before calling in polyfilled environments"
    l1_narrative: >
      The M11 soul distillation bug was caused by `anyio.create_task()` at
      oracle.py:509. anyio.create_task() does not exist in AnyIO's API (AnyIO uses
      `create_task_group().start_soon()`, not a top-level `create_task()`). The
      AttributeError was silently caught by a broad `try/except Exception` wrapper.
      `close_session()` — and by extension all L1→L2→L3 soul distillation — has
      NEVER executed in production. 8/10 Pillar Keeper souls were stale, some >14
      days. The fix was replacing with direct `await self.close_session()` in a
      guarded try/except.
    l2_insights:
      - "anyio.create_task() seemed plausible (asyncio has it, trio has it) but does not exist in AnyIO. Always verify API documentation, not assumptions."
      - "Broad `try/except Exception` in hot-path code is dangerous — it hides bugs in monitored subsystems."
      - "The key mismatch theory was incorrect. Both add_exchange() and close_session() used 'user'/'assistant' keys correctly. The real bug was the non-existent function call."
      - "A function that 'should be simple to call' but has never executed for 3+ sprints is a architectural failure. The distillation path had no integration test."
    l3_universal_principles:
      - "Every API call in a polyfilled or abstracted environment must have a contract test verifying the function exists at runtime."
      - "Silent catches of AttributeError in hot paths are bugs, not safety nets. Guard only expected exception types."
      - "A root cause theory that doesn't trace through the actual code path is cargo-cult debugging. Always verify the execution path, not the data path."
    sovereignty_impact: >
      Soul distillation (M5, M11) is the mechanism by which the engine learns from
      its own sessions. Without it, the engine is stateless — every session starts
      from zero, no gnosis accumulates, no growth occurs. This is the difference
      between a tool and a sovereign intelligence. The fix restores the engine's
      capacity to evolve.
    confidence: 10/10
    heritage_tags: ["[id-soft: quake-1996] Thinker Chain — hot-path throttled execution"]

  - id: proposal-20260703-001
    title: "Schema-as-Constraint — responseJsonSchema suppresses Gemma 4 thinking mode"
    l1_narrative: >
      Gemma 4 models (31B and 26B) have a "thinking" behavior that generates
      internal reasoning before the actual JSON output. Setting only
      responseMimeType: "application/json" does NOT suppress this — the model
      ignores the mime type and outputs thinking text. The fix is providing
      BOTH responseMimeType AND responseJsonSchema with a complete schema
      definition. This is undocumented on the official Gemma 4 capabilities
      page but works via the Gemini API infrastructure. Discovered via web
      research after 3 failed attempts without the schema.
    l2_insights:
      - "responseMimeType alone is insufficient for Gemma 4 — the model treats it as a suggestion, not a constraint."
      - "responseJsonSchema provides the model with the complete output structure, which suppresses the thinking behavior entirely."
      - "The schema must be a full JSON Schema object with type, properties, and required fields — a partial schema does not work."
      - "This is the same API infrastructure as Gemini models, so structured output features transfer even though Gemma 4 doesn't document them."
    l3_universal_principles:
      - "When a model has internal reasoning (thinking), you must provide the complete output structure to suppress it. A mime type alone is insufficient — the model needs the full schema to know what 'correct' looks like."
      - "Undocumented API features are a sovereignty risk. If the feature is removed or changed, there's no official channel for support. Always document discovered features with version pins and test results."
      - "Multiple failed attempts followed by a web research breakthrough suggests the problem is a knowledge gap, not an implementation bug."
    sovereignty_impact: >
      Without responseJsonSchema, the ingestion pipeline produces unparseable
      JSON output, making automated extraction impossible. The pipeline would
      require manual post-processing or regex extraction, defeating the purpose
      of structured output. This fix enables fully automated extraction from
      Carmack's primary sources.
    confidence: 10/10
    heritage_tags: ["[id-soft: doom-1993] Precomputed Lookup Table — schema precomputes correct output structure"]

  - id: proposal-20260703-002
    title: "Dense vs MoE Tradeoff — Consistency vs speed in cloud model selection"
    l1_narrative: >
      Tested Gemma 4 31B (dense) vs 26B (MoE, 4B active) for ingestion pipeline
      extraction. The 31B never timed out, consistent 23-31s latency, 20-33
      items extracted. The 26B had 180s cold-start timeout on first request but
      was faster when warm (17-29s). The 26B extracted MORE items on the largest
      source (Lex Fridman: 35 vs 31B's 29), suggesting MoE may better route
      diverse content to specialized experts.
    l2_insights:
      - "Dense models (all params active) are more consistent but slower — every token uses all parameters."
      - "MoE models (fraction of params active) are faster when warm but have cold-start latency from loading experts on demand."
      - "Cold-start timeout is inherent to MoE architecture — no workaround exists except keeping the model warm via sustained requests."
      - "The 26B extracted more on Lex Fridman despite being 'smaller' — MoE architecture may better handle diverse content types."
    l3_universal_principles:
      - "Choose dense models for bursty workloads (random requests, cold starts). Choose MoE models for sustained workloads (batch processing, pipeline runs)."
      - "Model size is not the only performance dimension. Architecture (dense vs MoE) matters as much as parameter count."
      - "Cold-start penalties are a physical constraint of MoE architecture, not a bug. Design pipelines to either keep models warm or accept the penalty."
    sovereignty_impact: >
      For the ingestion pipeline, using 31B as primary ensures reliable extraction
      regardless of request patterns. Using 26B as secondary (when warm) provides
      speed benefits for batch processing. Separate API keys enable both models
      to run without rate limit collision.
    confidence: 9/10
    heritage_tags: ["[id-soft: doom3-2004] idHeap — tiered architecture for different workload patterns"]

  - id: proposal-20260703-003
    title: "Free Tier Arbitrage — Multiple keys as rate limit multiplier"
    l1_narrative: >
      OpenRouter and Google API both have free tier rate limits (50 RPD per key).
      Using the same key for multiple models halves throughput. Using separate
      keys per model effectively doubles the daily request budget. This is not a
      hack — it's the intended usage pattern. The constraint is per-key, not
      per-account.
    l2_insights:
      - "Rate limits are enforced per API key, not per account — this is a design choice, not a loophole."
      - "Using separate keys for concurrent models avoids rate limit collision."
      - "Free tier saturation (429) is different from account deletion (401) — the key still works, just exhausted."
      - "OpenRouter :free models saturate faster than paid models — the free tier pool is shared."
    l3_universal_principles:
      - "When resources are constrained per-unit, the unit of allocation is the lever. Multiple units = multiple resources."
      - "Free tier is a legitimate resource, not a limitation. Arbitrage patterns that exploit per-key limits are valid sovereignty strategies."
      - "Understanding the exact unit of constraint (per-key vs per-account vs per-model) is essential for capacity planning."
    sovereignty_impact: >
      Without separate keys, the ingestion pipeline would be limited to 25
      requests per model per day (split 50 between 31B and 26B). With separate
      keys, each model gets 50 requests, enabling full ingestion of all Carmack
      sources in a single day.
    confidence: 10/10
    heritage_tags: ["[id-soft: quake3-1999] cvar System — configuration controls resource allocation"]

  - id: proposal-20260703-004
    title: "The Sovereign Ingestion Protocol — Integrated Deepening"
    l1_narrative: >
      Implemented a first-class Engine subsystem (`src/omega/ingestion/`) that
      standardizes how entities deepen their knowledge. Instead of adhoc scripts,
      the pipeline uses a formal flow: Source $\rightarrow$ Extract $\rightarrow$ Quality
      $\rightarrow$ Persist $\rightarrow$ Soul. By wiring this into MemoryStore, every
      extraction is automatically indexed in FTS5 and upserted into Qdrant,
      making the ingested knowledge immediately searchable and usable by the
      entity's reasoning loop.
    l2_insights:
      - "Ingestion is not just about extracting data; it's about grounding that data in the engine's memory systems."
      - "Using MemoryStore.add_exchange() as the entry point ensures that all extracted knowledge follows the same persistence and observability rules as normal conversations."
      - "A standardized protocol allows any entity to perform autonomous deepening by simply providing a source and a schema."
    l3_universal_principles:
      - "Sovereign Grounding: Knowledge is only useful if it is integrated into the system's primary memory and search indices. Extraction without persistence is a waste of tokens."
      - "Protocol over Script: Moving from adhoc scripts to a formal subsystem transforms a one-off task into a permanent engine capability."
    sovereignty_impact: >
      This transforms the engine from a tool that *can* be deepened by a user
      into a system that *can autonomously deepen itself* using primary sources.
      It ensures that the entity's growth is structured, traceable, and
      permanally grounded in the sovereign memory stack.
    confidence: 10/10
    heritage_tags: ["[id-soft: doom-1993] WAD System — data-driven extension of entity knowledge"]

