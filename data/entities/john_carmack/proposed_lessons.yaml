  - id: proposal-20260704-002
    title: "Dead Code at WAD Seams — The ormolu pattern hides duplicate execution paths"
    l1_narrative: >
      The _summon() method in oracle.py had a nested _execute_summon() async function
      (wrapped by TimeoutManager) PLUS unreachable dead code after the return statement
      at lines 743-764. The dead code was the ORIGINAL response-construction logic that
      included slots, domains, and sigil formatting. When the TimeoutManager wrapper was
      added, the inner function was created but the original outer code was never removed.
      This created a 'dead copy' — code that compiles, references valid variables (from
      outer scope), but never executes. The dead code was caught by a SyntaxError during
      test import after my edit partially deleted it.
    l2_insights:
      - "The dead code compiled, had valid Python syntax, and referenced variables that
        existed in the enclosing scope — linting tools would not catch it."
      - "The dead code was 22 lines with 3 variable references to res, entity, and
        backend — all of which existed in the parent scope."
      - "The ormolu pattern (two identical things where one is dead) is the Java
        equivalent of having a working method and a dead copy that only differs in one
        detail."
      - "The only reason this was caught is that a partial edit broke the syntax — the
        original dead code was invisible."
    l3_universal_principles:
      - "When you refactor a function to use a wrapper (decorator, context manager,
        inner function), ALWAYS check for code after the return statement. Dead code
        after return is invisible to linters but corrupts the execution model."
      - "The ormolu pattern (duplicate execution paths) is a cognitive tax. Every commit
        that replaces an old pattern with a new one must delete the old code paths."
      - "Type errors at integration seams (missing Path import, wrong context manager)
        are symptoms of code that was written but never executed. They cluster at
        wiring boundaries."
    sovereignty_impact: >
      The missing slots/domains in the inner OracleResponse would have broken entity
