  title: An unmatched pytest --ignore silences all collection and exits 0
  confidence: 10.0
  category: test_infrastructure
  summary: 'pytest tests/ reported ''Ran 0 tests'' and exited SUCCESS for an extended
    period. Three separate reports blamed tests/test_hivemind_redis.py, which had
    already been quarantined. The real cause was pyproject addopts carrying --ignore=data/entities/roc_racoon/workspace/odysseus-dev,
    a path that has never existed in git. Under pytest 9.1.1 an --ignore matching
    nothing suppresses ALL collection. collected went 0 -> 2393 once removed. Separately:
    the ''Ran 0 tests'' line is itself a reporting artifact - tests/conftest.py''s
    pytest_terminal_summary sets tr.sep_title = None, hiding pytest''s real count.
    Counts must come from --json-report.'
  key_findings:
  - 'Falsified both directions: with the phantom --ignore, 0 tests collected; with
    addopts cleared, 46 tests collected from a single file'
  - git log --all --diff-filter=A on the path returns nothing - it never existed
  - Introduced in 68a92cc2 (2026-06-22) and silently lethal ever since
  - conftest pytest_terminal_summary sets tr.sep_title = None, suppressing pytest's
    own count line - the terminal lies about collection size
  - 'After removal: full suite collected 2393, later 2462'
  anti_patterns_avoided:
