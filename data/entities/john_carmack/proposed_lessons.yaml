- lesson_id: L-CARMACK-2026-0829-P0
  title: 4 P0 temple-grade specs for sqlite-vec + spatial hardening
  confidence: 8.5
  category: technical_synthesis
  summary: 'Delivered 4 implementation specs (circuit breaker, vector versioning,
    Litestream backup, SQLCipher encryption) plus 700 LOC of working code and 2 install
    scripts. All grounded in 2026 SOTA citations, not synthesized from thin air.

    '
  key_findings:
  - 'Litestream v0.5.x is the active 2026 standard; LiteFS is in maintenance mode
    (Fly.io 2024). The retention field in 0.5.x is silently ignored - use bucket lifecycle.
    CRITICAL gotcha for operators.

    '
  - 'pysqlcipher3 (rigglemania, PyPI 2023-01) is archived. sqlcipher3 (coleifer) is
    the maintained Python binding. Migration is a pip rename, not a code change.

    '
  - 'Tian Pan 2026-04-28 is the canonical 2026 source for vector versioning: "per-vector
    version tag is the column you forgot." Adds model_version plus content_hash per
    row, supports dual-write migration.

    '
  - 'Circuit breaker MUST be per-provider, not shared (knowledgelib.io 2026-02-24).
    pybreaker 1.2.x with 3-state CLOSED/OPEN/HALF_OPEN is the Python SOTA.

    '
  - 'SovereignFallbackEmbeddingProvider must NEVER be behind a breaker - it is the
    M23 hard-stop that ensures embed() never raises.

    '
  anti_patterns_avoided:
  - Hystrix (Netflix archived 2018) - not used even though classic pattern.
  - Custom from-scratch circuit breaker - would re-invent 689-star lib.
  - Namespace-per-version for vectors - doubles write cost; harder queries.
  - App-level WAL shipping - Litestream sidecar is the right abstraction.
  - Single-source-only encryption key - must support keyring plus env plus 0600 file.
