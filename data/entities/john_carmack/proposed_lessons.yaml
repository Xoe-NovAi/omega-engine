- lesson_id: L-CARMACK-2026-0928-NOT-A-FLAKE
  title: Two "flaky tests" were a product race and an environmental sensor
  confidence: 9.0
  category: debugging_doctrine
  summary: 'Two items in the 13-test flaky pool were NOT flakes, and neither would
    have been found by rerunning. (1) test_writer_starvation was a PRODUCT RACE in
    src/omega/memory/sqlite_vec_adapter.py: every operation funnels through anyio.to_thread.run_sync
    onto ONE persistent sqlite3 connection; to_thread dispatches to a thread pool,
    so concurrent callers execute on different threads against the same handle. CPython
    sqlite3 is single-thread-affine. Reproduced deterministically (idle=pass, 6 CPU
    spinners=FAIL). (2) test_dispatch_timeout depended on the host''s free RAM: dispatch_agent
    acquires guard.lock() BEFORE anyio.run_process, and ResourceGuard.lock() calls
    OOMProtector.check_available which reads real psutil/proc state. Proven in both
    directions.'
  key_findings:
  - 'PRODUCT RACE: shared-conn concurrent errors = 6/6 threads; per-connection = 0/6.
    No engine involved in the proof'
  - 'Reproduced the ''flake'' as deterministic: idle box passes, 6 CPU spinners fail
    with ''SQLite-vec query failed: bad parameter or other API misuse'''
  - 'FIX IN PRODUCT not test: self._conn_lock + _run_locked(), all 15 call sites routed;
    lock order strictly _write_lock then _conn_lock so there is no reverse path and
    no deadlock'
  - 'ENVIRONMENTAL SENSOR: a test''s outcome depended on how much RAM the host had
    free at that instant - explains the 35->45->29 oscillation across identical runs'
  - 'FIX: autouse per-test monkeypatch isolating the sensor; subject still fully exercised;
    cannot leak between tests or into opted-out tests'
  - Both fixes verified at 200 MB free host starvation
  - Neither required a skip, xfail, retry, timeout inflation, or -p no:randomly
  anti_patterns_avoided:
  - Accepting the 'flaky' label as a diagnosis instead of reproducing the condition
  - Fixing a race by adding a skip or an xfail
  - Assuming the failure report's stated cause without establishing a baseline first
  - Trusting terminal pytest output - conftest's terminal summary suppresses the real
    count line
  research_sources:
  - title: sqlite_vec_adapter thread-affinity reproduction
