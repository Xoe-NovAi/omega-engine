- id: jc-2026-07-25-005
  tier: L3
  principle: Maintainer as Interface
  essence: Communication patterns shape project culture more than code quality. Predictable responses, clear expectations, and psychological safety build trust faster than technical excellence.
  evidence: KG-5 research shows Kenneth Reitz's "maintainer-as-interface" pattern; curl's bug bounty shutdown; Ghostty's AI ban; Drupal's contribution credit system
