    l2_insights:
      - "Constrained decoding happens at the token level, not as a post-process."
      - "Streaming structured output solves the 'black box' problem of long
        extractions, providing immediate feedback to the user/orchestrator."
      - "The combination of SSE streaming and JSON schema is the optimal pattern
        for high-volume structured data extraction."
    l3_universal_principles:
      - "Visibility is a first-class requirement for long-running AI tasks. Streaming is not just a UX feature; it's a monitoring requirement."
      - "Constraint-based generation is superior to post-generation parsing. Force the model to be correct at the token level."
    sovereignty_impact: >
      Enables the engine to handle massive source materials without timing out
      or leaving the user in the dark. It ensures that the data being ingested
