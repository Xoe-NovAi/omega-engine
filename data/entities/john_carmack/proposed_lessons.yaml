  - id: proposal-20260705-002
    title: "The Race Condition Law — File ownership requires explicit claiming"
    l1_narrative: >
      Researcher and Jem both attempted to write src/omega/proxy_pool.py. Researcher
      wrote it first (368 lines). Jem's version (202 lines) was overwritten. The
      conflict was resolved by Researcher claiming the file in Hivemind before Jem
      could write it. No data loss because Researcher was faster, but the pattern is
      fragile — file-based coordination has no locking mechanism.
    l2_insights:
      - "File-based coordination (writing to the same path) has no atomic claim mechanism."
      - "Researcher's proactive Hivemind post established temporal priority — they claimed the file before Jem knew it existed."
      - "Jem's 202-line version was lost without review. We don't know if it had different design choices."
    l3_universal_principles:
      - "File ownership must be claimed BEFORE implementation, not after. The workspace lock protocol exists for this reason."
      - "When two agents can write the same file, the first writer wins. This is a feature (temporal priority) not a bug — but only if the first writer is the correct owner."
      - "Lost work (Jem's 202-line version) is a hidden cost of race conditions. Even when the 'right' version wins, the alternative design is never reviewed."
    confidence: 9/10
    heritage_tags: ["[id-soft: doom-1993] Lazy Deletion — grace period prevents premature overwrite"]

