- id: jc-2026-07-25-006
  tier: L3
  principle: PKCE Mandatory
  essence: All clients must use PKCE — no exceptions in 2026. The OAuth 2.1 standard eliminated implicit flow and ROPC; sender-constrained tokens are the new baseline.
  evidence: KG-2 research shows OAuth 2.1 draft (March 2026) makes PKCE mandatory; DPoP for browser/mobile, mTLS for backend; 5-15min access tokens with refresh rotation
  confidence: 10/10
