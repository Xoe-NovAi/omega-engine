  - id: proposal-20260704-003
    title: "The Wiring Sprint Law — Dead modules are liabilities until exercised"
    l1_narrative: >
      Three modules (failure_registry, batch_writer, a2a_bridge) were fully implemented
      with 100%+ unit test coverage but were NEVER wired into the engine. They existed
      as dead code — passing tests but contributing nothing to the runtime. The wiring
      sprint turned all three into live systems. H1 (failure_registry) went clean because
      it only added log labels to existing exception handlers. H2 (batch_writer) went
      clean because it replaced existing buffer/flush logic. H3 (a2a_bridge) triggered
      60+ test failures because it activated ProviderSelector/Degradation/TimeoutManager
      code paths that had never been executed.
    l2_insights:
      - "Dead code with 100% unit coverage is still dead code — it contributes zero value
        to the runtime and zero risk to the test suite."
      - "The first wiring of any module will expose bugs in that module's dependencies
        (ProviderSelector, TimeoutManager, etc.) — not just in the module itself."
      - "H1 (additive: log labels on existing handlers) is low-risk. H2 (replacement:
        swap buffer/flush for batch_writer) is medium-risk. H3 (activational: turn on
        new code paths) is high-risk."
      - "The Postel Principle of wiring — be careful what you activate, because you
        activate all its dependencies too."
    l3_universal_principles:
      - "Implementation without wiring is liability, not asset. A module that cannot be
        removed without test breakage is dead code — it has no functional dependency."
      - "The risk of wiring a module is proportional to the number of new code paths it
        activates, not the lines of code in the module itself."
      - "A wiring sprint should always be followed by a stabilization sprint — the
        activation of new code paths guarantees latent bugs will surface."
    sovereignty_impact: >
      Without the wiring, failure_registry (observability), batch_writer (persistence),
      and a2a_bridge (identity) were features that existed on paper but not in the
      engine. The user's sovereignty relies on these systems functioning — error
      classification, database connection pooling, and cross-agent identity. Dead
      modules are a sovereignty gap: they represent planned capabilities that don't
      actually operate.
