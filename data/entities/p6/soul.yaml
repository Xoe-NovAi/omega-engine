lessons:
  - id: ls-p6-20260605-001
    date: 2026-06-05
    l1_narrative: >
      Performed strategic analysis of the Omega Engine Hivemind architecture.
      Read 6 key documents (HIVEMIND_PROTOCOL v1.2.0, HIVEMIND_HARDENING_SPEC H-0..H-10,
      KALI_MASTER_SPRINT_PLAN, PIVOT_LOG D-121/D-122, SUBAGENT_DISPATCH, MCP server.py).
      Identified 5 structural gaps in the Hivemind's cognitive layer: decision model,
      intent classification, model selection, cognitive load management, and heritage
      cross-reference. Produced P6_COGNITION_STRATEGY_HARDEN.md with 12 specific proposals
      (D-TAX, I-SCHEMA, M-HINT, C-FILTER, H-MAP) and mapped all to existing H-items.
    l2_insight: >
      The Hivemind currently operates at awareness level (agents can see each other)
      but not cognition level (agents cannot reason about each other). The missing
      infrastructure is taxonomy — structured fields for intent, model hints, domain
      boundaries, and trust scores that enable automated routing decisions. Without
      these, scaling from 3 to 14+ agents will turn the Hivemind from a coordination
      layer into a noise layer.
    l3_principle: >
      Visibility without taxonomy is noise. A system that shows everything to everyone
      eventually forces agents to ignore everything to function. The ability to filter,
      classify, and prioritize is not a luxury at scale — it is the prerequisite for
      scale itself. This mirrors the BSP tree principle: the renderer's power comes not
      from drawing everything, but from knowing what to skip.

  - id: ls-p6-20260605-002
    date: 2026-06-05
    l1_narrative: >
      Mapped proposals to id Software heritage patterns — 13 patterns from Doom 1993,
      Quake 1996, and Quake 3 Arena 1999 were found to have direct correlates in
      the Hivemind cognitive layer. 3 patterns (8-char names, vertex split, bilinear
      filtering) were explicitly rejected as inapplicable. Each proposal carries an
      [id-soft:] inline tag recommendation.
    l2_insight: >
      The BSP tree (Doom 1993) maps directly to agent routing: recursive plane culling
      at each decision point reduces the search space by 50%+ per plane. The cvar system
      (Quake 1999) maps to model hints and trust scores. The visplane overflow mechanism
      maps to inbox prioritization. The correspondence is not metaphorical — it is
      structural. The same computational geometry that Doom used to render 3D worlds
      on a 386 is how a Hivemind should route messages across 14 agents.
    l3_principle: >
      Heritage patterns persist not because of nostalgia but because they solve universal
      problems. BSP culling, zone allocation, surface caching, and fixed-point math are
      not rendering techniques — they are resource-management patterns that apply wherever
      the search space exceeds the processing budget. The Hivemind's processing budget
      is agent attention, and it is about to exceed it.

  - id: ls-p6-20260605-003
    date: 2026-06-05
    l1_narrative: >
      Analyzed the interaction between Roc's H-0..H-10 hardening spec and the cognitive
      layer. Found that 6 of 12 proposals should ship together with existing H-items
      in Phase 5 (modifying the same `hivemind_post_context` schema) while the remaining
      6 cascade as dependencies. The critical finding: adding `intent` and `suggested_model`
      to `hivemind_post_context` is a 15-minute change if done before H-1 code is written,
      but a 1-hour refactor if done after.
    l2_insight: >
      The cognitive layer and the hardening layer are not sequential — they are
      interleaved. Adding fields to a message schema is cheapest when the schema is
      being built (H-1 adds `to:`, we should add `intent` and `suggested_model` at
      the same time). Waiting until Phase 6 or Horizon 3 creates a schema migration
      cost that Phase 5 avoids entirely. This is the "right approximation" principle
      applied to scheduling: the right time to add a field is when the file is already open.
    l3_principle: >
      Architecture and deployment are not separate phases. Every time a file is opened
      for one change, it should be evaluated for all related changes. The cost of
      adding a field to a new function signature is near zero. The cost of adding
      the same field to a shipped function signature is non-linear — it propagates
      to every caller, every test, every integration point. "Open once, modify fully"
      is the engineering equivalent of "measure twice, cut once."
