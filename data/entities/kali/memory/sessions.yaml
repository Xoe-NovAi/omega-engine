patterns_learned:
  - Carmack's Law applies to data structures: unify two duplicate tables before adding the third.
  - Heritage is gravitational pull, not debt. Every [id-soft:] tag is a claim-check.
  - Documentation decays in days, not months.
  - The number of active documents in a directory is a proxy for cognitive load.
  - A verification pass that finds unported items is the most valuable output.
  - Hardware-specific optimizations don't transfer to Python.
  - A pipeline without a gate is not a pipeline — it's a slide.
  - Non-standard tags propagate like cracks.
  - A handoff is not a document — it is a transfer of sovereignty.
  - Silent except clauses hide real errors. M9 is about preventing bugs that haven't happened yet.

