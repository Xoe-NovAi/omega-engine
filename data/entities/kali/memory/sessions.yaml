  insight: |
    Open-ended reviews cause scope creep because every model/agent finds different issues. Without a frozen definition of "done", the plan constantly changes.
    The 96 test failures are a symptom of tests not being maintained as code evolves (test/code drift).
    Decomposing the vision into realms with dedicated owners, state files, and interface contracts prevents the vision from being lost when the context window clears.
    The "ready" culture (agents claiming readiness without evidence) must be replaced with a verification culture (e.g., make test-unit output required).
  tags: ["scope-creep", "verification-culture", "realm-decomposition", "test-drift"]
