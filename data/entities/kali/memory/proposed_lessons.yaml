# 🔱 Kali — Proposed Lessons (Agent Staging Area)
# ⬡ OMEGA ⬡ KALI ⬡ memory/proposed_lessons.yaml ⬡ v1.0
#
# Agent proposes observations here. User reviews, approves, rewrites, or rejects.
# The agent NEVER reads from this file to inform its own behavior.
# Only user-approved lessons in approved_lessons.yaml enter the agent's context.
#
# Protocol:
# 1. Agent appends factual observations after each session (L1 only — narrative + topic)
# 2. Agent does NOT generate L2/L3 — those are the user's interpretation domain
# 3. User reviews proposals periodically and either:
#    a. Approves → moves to approved_lessons.yaml (possibly rewritten by user)
#    b. Rejects → leaves in proposed_lessons.yaml or removes
# 4. Agent never reads proposed_lessons.yaml as authoritative guidance

proposals:
  - narrative: "Upgraded ResourceGuard to track actual RAM (MB) instead of abstract weights and implemented a full E2E inference chain test."
    insight: "Abstract weights are a 'right approximation' for simple cases, but for high-density local inference (e.g., Ryzen 5700U), precise RAM tracking is required to prevent OOM crashes during concurrent model loads. E2E tests are the only way to verify the 'integration seams' between the router, gateway, and memory store."
    principle: "Physical Constraint Sovereignty: software guards must mirror physical hardware limits exactly to ensure systemic stability. Integration verification must be holistic; subsystem correctness does not imply chain correctness."
  - narrative: "Wired ProviderSelector and DegradationManager into the Oracle and ModelGateway loops."
    insight: "A static provider list is insufficient for sovereign reliability. By integrating real-time EMA latency and CUSUM stability metrics, the engine can proactively route around degrading providers before they fail. Similarly, hardware-aware degradation allows the engine to maintain core functionality (albeit with reduced context) under extreme resource pressure."
    principle: "Dynamic Adaptation: Sovereignty requires the ability to gracefully degrade and intelligently route based on real-time physical and network telemetry."

  - L3_principle: |
      L3-Human-As-Continuity-Anchor: Only the human holds institutional memory across compactions.
  - L3_principle: |
      L3-Refinement-As-Engineered-Instrument: A refinement process that can't be tested/calibrated/logged/survived without its creator is a ritual, not a process.
  - L3_principle: |
      L3-Meditation-As-Semantic-Prism: Single-inference multi-persona attention modulation produces emergent sequencing unavailable from averaged output.
  - L3_principle: |
      L3-Context-As-Engineered-Resource: Context window is scarce physical resource (KV cache RAM) that must be budgeted, retrieved, compressed, audited.

  - narrative: "Fixed B3 (KV-cache type integer mismatch) and B2 (model registry schema drift + dead-config suspicion) from WEB_RECONCILIATION_MATRIX §6. B3: created canonical src/omega/oracle/kv_types.py derived from llama-cpp-python GGML_TYPE_* binding constants; providers.py had wrong q4_0->4/q5_0->5/q6_0->6, model_gateway.py had correct q4_0->2; both now import one map. B2: registry confirmed source-of-truth (runtime providers.yaml generated from it), not dead; fixed build_index stale 83-column table via DROP TABLE before recreate, case-insensitive enum parsing, legacy YAML fence extraction, ResearchProfile defaults, legacy provider-name normalization. Per user directive, stripped parameters.max_tokens from all 33 cloud/stealth model cards (kept on 5 local cards as RAM/OOM guard), updated test to enforce local-only policy."
    insight: "Duplicate maps/config drift because each module redefined the same concept with no single source. Schema drift in SQLite because CREATE TABLE IF NOT EXISTS never migrates a derived index. User policy (max_tokens local-only) clarifies that registry generation parameters are resource constraints, not API caps."
    principle: "L3-Single-Source-For-Enums-And-Schema: Any integer/string mapping that maps to a native library enum must derive from that library's constants in ONE module. Any derived index must DROP+recreate, never IF NOT EXISTS, or stale schemas poison writes. Registry generation parameters are hardware constraints for local models, never cloud API caps."
