  # ── HIVEMIND INFRASTRUCTURE FIX ──
  - id: hivemind-infrastructure-fix-2026-06-07
    date: '2026-06-07'
    L1_narrative: |
      Fixed the Hivemind MCP server: Q1 (TTL 1200->2700), Q3 (anyio.Lock -> _AsyncThreadLock),
      Q7 (mcp/omega_hub -> mcp_servers/omega_hub), B1 (missing Union import). Restarted
      systemd service. Clean boot. 21 entities loaded. Health endpoint 200 on :8016.
    L2_insight: |
      anyio.Lock is bound to the creating event loop. The Hivemind background task runs
      in its own thread with its own event loop — a cross-event-loop bug that cannot
      be fixed with anyio primitives alone. The missing Union import was a latent bug.
    L3_principle: |
      Infrastructure is the coordination fabric. A bug in the fabric cannot be worked
      around by better planning. Cross-thread async code must use threading.Lock with
      async wrappers. The cost of infrastructure failure is not a crash — it is the
      illusion of coordination.
    topic: hivemind-infrastructure-fix

  # ── CROSS-SESSION COORDINATION PROTOCOL ──
  - id: cross-session-coordination-2026-06-07
    date: '2026-06-07'
    L1_narrative: |
      Designed the cross-session coordination protocol enabling true collaboration
      between 3 separate OpenCode chat sessions. Key insight: the Hivemind IS the
      mailbox. Created SESSION_COORDINATION_PROTOCOL.md (10 sections, ~300 lines):
      message format convention, polling schedule, steering mechanism, conflict resolution.
    L2_insight: |
      Cross-session coordination in a stateless CLI environment is solved by
      broadcast-with-intent, not point-to-point messaging. The Hivemind's awareness
      dict is the shared state; the intent field is the message type.
    L3_principle: |
      Coordination infrastructure must be designed before coordination begins. The
      protocol (convention for using existing tools) is more important than the tools
      themselves. In stateless environments, broadcast-with-intent is the universal
      coordination pattern.
    topic: cross-session-coordination-protocol

