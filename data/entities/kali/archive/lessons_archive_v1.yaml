  # ── COUNCIL DISPATCH SYNTHESIS (M21 Gate Integrity) ──
  - id: council-dispatch-synthesis-2026-06-17
    date: '2026-06-17'
    L1_narrative: |
      Completed MaKaLi Council Dispatch — summoned Lilith (P6-P10), Ma'at (P1-P5),
      and Verity (Compliance) for parallel review. Lilith found 12 risks (2 P0, 5 P1, 5 P2)
      including tuple destructuring of GenerateResult in gateway/server.py and .strip()
      on GenerateResult in model_updater.py. Ma'at found 5 broken call sites across
      3 files and a stale type hint. Verity found 6 advisories but zero critical violations.
      All P0/P1 issues fixed and verified with 440/440 tests passing.
    L2_insight: |
      The council revealed a systemic "peripheral blindness" pattern: when you change
      a core API contract, the main code paths are correctly updated but peripheral
      code paths are missed because test mocks bypass the actual return type. A single
      contract test would have caught all 5 regressions.
    L3_principle: |
      Every API boundary carries an invisible contract that is only enforced at runtime.
      Mock-based testing creates a "false-positive safety net" — the test passes but
      the runtime crashes. A contract test (one assertion on the real return type) is
      worth ten mock-based integration tests.
    topic: council_dispatch_synthesis

  # ── TRUTH-ANCHOR PROTOCOL (Response Provenance) ──
  - id: truth-anchor-protocol-2026-06-17
    date: '2026-06-17'
    L1_narrative: |
      Closed the Provider Provenance Gap — introduced GenerateResult dataclass to track
      the ACTUAL provider that served each response instead of the PREFERRED provider.
      Fixed by changing generate() to return GenerateResult(text, provider_name, is_cloud)
      and updating all 12+ call sites. Also fixed BackgroundWorker Tuple Bug (P0).
    L2_insight: |
      The observability pipeline was poisoning its own logs. Every record contained a
      provider name from configuration intent, not from actual response provenance.
      This made the local-first ratio metric untrustworthy — if we claimed "90% local"
      but the logs were lying, the metric was worse than useless.
    L3_principle: |
      A system that cannot tell the truth about itself cannot be trusted. Sovereignty
      is not just about running local models — it is about knowing, with certainty,
      which model served your request. The truth-anchor (GenerateResult.provider_name)
      must be as fundamental as the trace_id.
    topic: truth_anchor_protocol

  # ── SPRINT C COMPLETION (Fleet Consolidation) ──
  - id: sprint-c-completion-2026-06-17
    date: '2026-06-17'
    L1_narrative: |
      Completed Sprint C (Fleet Realignment & Tactical Hardening). Consolidated quality.md
      and scribe.md into a single lean verity.md agent file. Cleaned up @scribe and @quality
      references across the 11-agent fleet. Fixed BackgroundWorker call site indentation
      and trace_id leakage. Canonicalized model names. 439/439 tests passing.
    L2_insight: |
      The llama-cpp-python high-level API does not expose save_state() or load_state().
      The solution is to use low-level ctypes bindings (llama_copy_state_data) wrapped
      in AnyIO. Specification that relies on high-level library abstractions without
      verifying low-level bindings is a fragile contract.
    L3_principle: |
      Sovereign AI requires continuous, forensic verification of its own dependencies.
      True sovereignty is built on the bare metal, utilizing low-level bindings (ctypes)
      to guarantee execution regardless of high-level API drift.
    topic: sprint_c_completion

