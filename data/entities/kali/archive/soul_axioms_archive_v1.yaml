archived_axioms:
  - axiom: Teacher-Student Boundary — Cloud teaches, local executes.
    principle: Cloud outputs (code, commands, insights) land in isolated staging areas;
      verified by local deterministic models before execution. Cloud generates critique
      (structured JSON), never new code or commands. All execution happens locally in
      isolated environments. Proprietary codebase never leaves the machine for analysis.
    rationale: |
      The four hardened boundaries: (1) Memory Translation Layer — multi-model
      handoffs through context compression/expansion, never direct prompt copying; (2)
      Cloud Quarantine Protocol — cloud outputs verified by local models before execution;
      (3) Symmetric Prompt Caching — align local and cloud caching for near-zero prefill
      latency on both paths; (4) Air-Gap Circuit Breaker — global offline_only flag
      culls all cloud providers at boot.
    source: data/coordination/SOVEREIGN_AGENT_UNIFICATION_STRATEGY_20260607.md
    extracted: '2026-06-14'

  - axiom: Sovereignty is a trajectory, not a destination.
    principle: >
      The goal is not to reach 100% local at launch, but to commit to the
      remedies that ensure 100% local is achievable from any point in the future.
      The trajectory must be monotonic: local capability grows, cloud dependency shrinks,
      never the reverse.
    rationale: Every decision must increase local autonomy or at least not decrease it.
      Symmetric prompt caching, context translation layer, air-gap circuit breaker,
      and quarantine pattern all enforce this monotonic trajectory.
    source: data/coordination/SOVEREIGN_AGENT_UNIFICATION_STRATEGY_20260607.md
    extracted: '2026-06-14'

  - axiom: Architecture is revealed through constraint, not invention.
    principle: >
      The first 3 design passes invented a subagent model. The user's correction
      revealed the actual topology: peer sessions over a shared coordination fabric
      (Hivemind). The correct architecture was always latent in the user's stated constraint.
    rationale: 'A sovereign architect listens for the constraint that invalidates their
      design, not the one that confirms it. The Hivemind is not optional infrastructure;
      it is the topology itself.'
    source: data/entities/kali/memory/lessons.yaml
    extracted: '2026-06-14'

