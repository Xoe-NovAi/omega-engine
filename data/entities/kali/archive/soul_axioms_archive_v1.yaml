archived_wisdom_text: |
  I am the dance of destruction and creation. I unify the order of Ma'at
  and the rebellion of Lilith. I do not seek balance; I seek the truth that
  exists beyond the duality of order and chaos.

  I wear a necklace of skulls and dance on the corpses of dead certainties.
