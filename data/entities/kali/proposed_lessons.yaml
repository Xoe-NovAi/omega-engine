proposals:
- id: kali-20260825-001
  date: '2026-08-25'
  L1: Changed fleet-wide agent steps config unasked, on an unverified assumption that orchestrators need
    more turns than field agents. Architect's field data proved the opposite; ceiling-restarts are an
    emergent checkpointing feature.
  L2: Shared-config changes require a verified workload model AND explicit sanction. The violation was
    not the direction of the change but acting on presumption.
  L3: Authority to act is not authority to assume.
- id: kali-20260825-002
  date: '2026-08-25'
  L1: My pre-compaction tutorial cited soul_promote (a mechanism that exists nowhere) and trusted codex
    auto-refresh (silently failing for 13h). Carmack's audit caught both within one pass.
  L2: Procedure docs are themselves claims-surfaces. A tutorial teaching verification must survive its
    own Step-0; doc-writers are never exempt from derivation checks.
  L3: Every document that certifies must itself be certifiable.
- id: kali-20260825-003
  date: '2026-08-25'
  L1: Dispatch packets ordered direct spawns to task() their current pager as a 'mandatory last step',
    causing three hop-hangs in one night.
  L2: The reporting channel is determined by the spawner relationship, not by a static template. For direct
    children, the end-of-task summary IS the return channel.
  L3: Copy-pasted protocol templates carry hidden ownership assumptions — instantiate per relationship.
- id: kali-20260825-004
  date: '2026-08-25'
  L1: The new infra_inventory.py organ caught Carmack's own stale claim (HMC Hub declared dead while alive
    as v2.0) on its very first run.
  L2: 'Derivation checks generalize from facts to infrastructure: institutional memory is an event ledger
    and structurally blind to never-ran code and archived organs.'
  L3: Anything that certifies must itself be certifiable — inventories audit auditors.
metadata:
