    \ is the Architect's act for HIGH-IMPACT decisions. The specific chat-export pattern\
    \ was Nemotron-3 streaming remediation \u2014 context-specific, not a universal\
    \ law."
  principle: "The verdict proposes; only the Architect disposes \u2014 for high-impact\
    \ decisions. Context-specific workarounds stay context-specific."
- id: kali-20260826-106
  date: '2026-08-26'
  narrative: Cascade verification caught THREE stale V1 status-quo survivors in the
    live command after the D1 hotfix was believed complete.
  insight: A rule change is not done when the primary location is edited; it is done
    when a negation-scan across every artifact finds zero uncorrected encodings.
  principle: 'Fix the map, then sweep the territory: the last encoding of an old rule
    hides where you already looked.'
- id: kali-20260826-107
  date: '2026-08-26'
  narrative: Vision Anchor Perpetual lived in Roc's workspace while claiming team-wide
    authority; Architect ordered relocation before any execution.
  insight: "Authority claims are hollow when the artifact lives inside a single entity's\
    \ scope \u2014 placement IS governance."
  principle: 'Core truth demands core address: a document''s home must match its claimed
    jurisdiction.'
- id: kali-20260826-108
  date: '2026-08-26'
  narrative: 'Grokster''s disk-truth verification (git/ls/grep against every tracker
    claim) revealed tracker lies in BOTH directions: disk ahead of tracker (Ma''at''s
    work landed without sync) AND tracker ahead of disk (P0-1c falsely claimed complete,
    AGENTS.md ghost). The tracking system cannot be trusted without direct disk verification.'
  insight: "Zero-Trust Documentation Doctrine is not optional \u2014 every status\
    \ must be verified by command, not accepted from tracker state. The cost of verification\
    \ is minutes; the cost of trust is weeks of drift."
  principle: Trust no tracker; verify every claim against disk. The map is not the
    territory.
  grokster_verdict: "L3 \u2014 PROMOTE"
  promotion_ready: true
- id: kali-20260826-109
  date: '2026-08-26'
  narrative: "Track B (CI Ph1) is BLOCKED on three pre-conditions (C1 M8 regex, C3\
    \ pre-commit+gitleaks, C4 AGENTS.md reconstruction) that are unowned or ownership-ambiguous.\
    \ The critical path to debut has 5 blocking items with no seated owner. The dependency\
    \ graph has invisible edges \u2014 CI-2/CI-5 blocked on AGENTS.md ghost, but ACTIVE_SPRINT\
    \ shows no dependency."
  insight: "A blocker without an owner is not a task \u2014 it is a structural hole.\
    \ The sprint tracker must surface ownership gaps as first-class items, not bury\
    \ them in status fields."
  principle: Every blocker must have a seated owner. Unowned blockers are the highest-priority
    work.
  grokster_verdict: "L3 \u2014 PROMOTE"
  promotion_ready: true
- id: kali-20260826-110
  date: '2026-08-26'
  narrative: 'The HOLISTIC_ARCHITECTURE_PLAN contradicts itself internally: System
    3 says "zRAM (not zswap)" while System 6 + D-526 say zswap+NVMe. Track D (ZSWAP)
    and Track F (LI/HR) depend on this ruling. The plan documents its own split but
    does not adjudicate it.'
  insight: "A plan that contains contradictory specifications without a decision mechanism\
    \ is not a plan \u2014 it is a wish list. Architectural decisions must be explicit,\
    \ not implicit in section ordering."
  principle: Contradictions in the plan are bugs. The Architect must rule; the plan
    must reflect the ruling.
  grokster_verdict: "L3 \u2014 PROMOTE"
  promotion_ready: true
- id: kali-20260826-111
  date: '2026-08-26'
  narrative: 'Three systemic confidence-manufacturing patterns detected: (1) headroom
    middleware passes tests but returns 0% local savings (passthrough), (2) anti-domain
    guard is a 36-token symbol that discloses but does not prevent, (3) D4 rubric
    reads 0/17 compliance because corpus is empty. All three appear green while being
    non-functional.'
  insight: "Tests that pass while the feature is dead are not tests \u2014 they are\
    \ theater. The fix is truth probes: a probe that FAILS when the feature is non-functional,\
    \ not passes when silent."
  principle: Truth probes > theater. Every track must have a probe that screams at
    zero, not whispers.
  grokster_verdict: "L3 \u2014 PROMOTE"
  promotion_ready: true
- id: kali-20260826-112
  date: '2026-08-26'
  narrative: "Eight expert sessions created for Wave 2 research hold deep context\
    \ that compaction will destroy. The build-packet extraction protocol (research\
    \ \u2192 actionable steps \u2192 single execution plan) preserved the value. Without\
    \ extraction, Wave 2 would page 8 sessions sequentially \u2014 token waste, drift\
    \ risk, loss of nuance."
  insight: "Expert sessions are institutional memory. The extraction protocol (read\
    \ all deliverables \u2192 extract build-packets \u2192 synthesize WAVE{N}_EXECUTION_PLAN.md)\
    \ is the only way to preserve research value across compaction."
  principle: Don't re-research. Page the expert. Build-packets are the contract; execution
    plans are the handoff.
  grokster_verdict: "L2 (L3 on 2nd occurrence) \u2014 DEFER"
  promotion_ready: false
- id: kali-20260826-118
  date: '2026-08-27'
  narrative: "Grokster ROI Discovery (2026-08-25) revealed 5 unowned blockers on the\
    \ critical path to debut PR: C1 M8 regex (now resolved), C4 AGENTS.md ghost, C3\
    \ pre-commit never installed, P0-1d SECURITY_AUDIT residual, release/debut branch\
    \ mechanic. Each was a structural hole \u2014 neither a task (no owner) nor a\
    \ question (no spec). They stalled the entire Track B (CI Ph1) and the publication\
    \ mechanic."
  insight: "A stalled ticket is not a task with missing fields \u2014 it is a structural\
    \ hole with no seat. Re-ownership is a function of expertise-match + session availability\
    \ + zero-claim existing. Mapping 5 unowned blockers to 4 existing sessions (Ma'at,\
    \ Roc, Kali) closed the holes without adding agents, cost, or coordination overhead."
  principle: Re-ownership beats new agents. The cheapest path to unblocking is matching
    existing expertise to existing gaps, not growing the fleet.
  grokster_verdict: "L3 \u2014 PROMOTE (Architect override 2026-08-27)"
  promotion_ready: true
- id: kali-20260826-119
  date: '2026-08-27'
  narrative: "The release/debut branch cut is a CONVERGENCE POINT for 3 parallel tracks.\
    \ At convergence, the internal state-of-truth (ACTIVE_SPRINT.json, WAKE_STATE.json,\
    \ PROJECT_INDEX.md, OMEGA_ENGINE.md) must match disk reality. Grokster ROI Discovery\
    \ proved trackers lie in BOTH directions \u2014 disk ahead of tracker (Ma'at work\
    \ landed without sync) and tracker ahead of disk (P0-1c falsely complete). Cutting\
    \ a branch before truth-sync publishes a lie."
  insight: "External commits demand internal truth-anchor. The cost of a 15-minute\
    \ tracker sync before branch cut is always less than the cost of debugging a public\
    \ repo that does not match the plan. Convergence is not \"code merged\" \u2014\
    \ convergence is \"state + code + tracker + docs all agree on what shipped.\""
  principle: Truth-sync is the final convergence. Before any external commit, the
    internal state-of-truth must match disk. Publish only what the trackers prove.
  grokster_verdict: "L3 \u2014 PROMOTE (Architect override 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-120
  date: '2026-08-27'
  narrative: Today, 8 vault research sessions delivered ~1.6M input tokens of work.
    The task() tool results said "Task cancelled" for 7 of them. I almost re-dispatched
    8 fresh sessions, discarding all the work. The user intervened. Querying the opencode
    DB revealed all 8 sessions still existed, resumable via their task_ids.
  insight: "The task_id returned by task() IS the session_id. It persists in the OpenCode\
    \ SQLite database for the life of the database. A \"Task cancelled\" or \"Subagent\
    \ failed\" tool result is a UI artifact \u2014 the underlying session is not destroyed\
    \ unless explicitly purged. The opencode-sessions-explorer-list-sessions MCP tool\
    \ is the canonical recovery path."
  principle: A session that exists can be resumed. Always. The task_id is the handle.
    The DB is the ground truth. "Cancelled" is a display state, not a destruction
    event. Agents that dispatch subagents MUST capture task_ids at dispatch time,
    maintain a session registry, and consult the DB before any "continue" action.
  grokster_verdict: "L3 \u2014 PROMOTE (Architect directive 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-121
  date: '2026-08-27'
  narrative: The team has repeatedly relaunched subagents instead of resuming them.
    The pattern is so common it has been called out in multiple post-mortems. The
    default reaction to "session appears stuck" has been "launch fresh."
  insight: "The cost asymmetry is enormous. Resuming a session costs ~1 message and\
    \ 0 lost context. Relaunching costs N messages, full re-research time, and 100%\
    \ context loss. The expected value calculation always favors resume \u2014 UNLESS\
    \ the user explicitly says \"start over.\""
  principle: 'The default for "continue" is RESUME, not RESTART. The burden of proof
    is on the restarter: they must show that the existing session is genuinely unsalvageable,
    not just that it "looks stuck." This is a fleet-wide standing law.'
  grokster_verdict: "L3 \u2014 PROMOTE (Architect directive 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-122
  date: '2026-08-27'
  narrative: Today's 8-dispatch happened in a single parallel batch. The tool results
    came back in a block. I focused on the bodies (which said "cancelled") and lost
    the IDs (which were per-result).
  insight: "M27 (Tracking Integrity) requires every operation to have a verifiable\
    \ state. Parallel dispatch makes this harder because the result block is dense.\
    \ The pattern must be: dispatch \u2192 IMMEDIATELY write IDs to session gnosis\
    \ BEFORE doing anything else. Even before reading the response body."
  principle: Session ID capture is a M27 hard requirement, not a "nice to have." The
    capture must happen BEFORE response processing, not after. Agents that dispatch
    in parallel must use the "capture-then-process" pattern.
  grokster_verdict: "L3 \u2014 PROMOTE (Architect directive 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-123
  date: '2026-08-27'
  narrative: Today's 8-file vault research burst demonstrated that MiniMax M3 writes
    long files (1,000+ lines) with 100% success, while Nemotron 3 Ultra fails on the
    same workload due to streaming timeouts. The probe data confirms MiniMax M3 has
    87% free tier availability vs Nemotron 3 Ultra's 72%.
  insight: "Not all \"capable\" models are equally capable at long outputs. The bottleneck\
    \ is not intelligence \u2014 it's streaming reliability on sustained output. Nemotron\
    \ 3 Ultra's thinkingLevel: \"MINIMAL\" causes reasoning tokens to interleave with\
    \ output, triggering server-side timeouts. MiniMax M3 uses a different generation\
    \ strategy that avoids this."
  principle: Long-file-write capability is a model-specific trait, not a general capability.
    Route by output length, not by general model tier. For any task producing > 300
    lines, consult a "long-write-tested" model registry. MiniMax M3 is the current
    champion.
  grokster_verdict: "L3 \u2014 PROMOTE (Architect directive 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-124
  date: '2026-08-27'
  narrative: Through daily use, the Architect observed that MiniMax M3 (and the MiniMax
    family generally) delivers the fastest TPS (tokens per second) output of any model
    seen through the OpenCode CLI. This is in addition to the long-file-write reliability
    already documented (L3 123).
  insight: "Speed (TPS) and reliability (long-write) are independent axes of model\
    \ quality. A model that is fast but truncates is worse than a model that is slower\
    \ but completes. MiniMax M3 wins on BOTH axes \u2014 making it the current overall\
    \ default for research, refactor, and documentation tasks."
  principle: "TPS and reliability are multiplicative, not additive. The best model\
    \ is the one that is BOTH fast AND complete. Optimize for the product of TPS \xD7\
    \ completion_rate, not either alone. The MiniMax family currently leads on this\
    \ product."
  grokster_verdict: "L3 \u2014 PROMOTE (Architect observation 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-125
  date: '2026-08-27'
  narrative: 'The 402 "Insufficient balance" error on free MiniMax M3 was treated
    as architectural (add $10 credits) when it was operational (transient per-minute
    cap). Roc forensic confirmed: 39/42 Ma''at session turns succeeded; cost field
    = $0.00 throughout. The Architect''s correction: "Did we have to change API keys
    or add money? No. We prompted Continue., and it continued."'
  insight: Operational errors on free services are part of the deal by definition.
    Retry first. Add money, rotate keys, or re-architect only after evidence of chronic
    failure. The cost field ($0.00) is the evidence the service is genuinely free;
    the 402 is a rate-cap quirk, not a balance issue.
  principle: 'Operational errors on free services: retry, don''t remediate. Only remediate
    architectural failures (chronic, persistent, structural). The $0.00 cost field
    is the test for "is this actually a free service?"'
  grokster_verdict: "L3 \u2014 PROMOTE (Architect directive 2026-08-27, Grokster concurrence)"
  promotion_ready: true
- id: kali-20260827-126
  date: '2026-08-27'
  narrative: 'I noticed MiniMax M3 was reliable on long writes (L3 123) but did not
    notice it was also the fastest TPS of any model the Architect had used. The Architect
    saw both axes simultaneously. Grokster suggests this is itself an L3: "Quality
    is a product of axes, not a single metric." Falsifiable: any single-metric optimization
    is incomplete.'
  insight: "Speed (TPS), reliability (completion), context (size), multimodal, cost,\
    \ tool-use \u2014 these are independent axes. The best model is the one that is\
    \ strong on the PRODUCT of relevant axes, not any single one. MiniMax M3 is strong\
    \ on TPS \xD7 completion (and cost = free). Other models may be strong on context\
    \ \xD7 multimodal but weak on speed \xD7 cost."
  principle: Quality is a product of axes, not a single metric. Evaluate models, tools,
    and agents on the product of relevant dimensions, not any one in isolation. The
    dimensions depend on the task; the principle is universal.
  grokster_verdict: "L3 \u2014 PROMOTE (Grokster synthesis 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-127
  date: '2026-08-27'
  narrative: "The Architect articulated: \"There is little, if any, actual code required\
    \ to get OpenCode agents working in powerful new ways, using only existing data,\
    \ systems, and tools that are already readily available to them. The problem is\
    \ that the agents don't know, and the human users don't know!\" The Session Continuity\
    \ Protocol is 4 rules + 3 lessons \u2014 no code. The MiniMax M3 promotion is\
    \ documentation \u2014 no code. The 402 transient observation reframes existing\
    \ behavior \u2014 no code."
  insight: 'For every "we need to build X" feature, ask: "Does X already exist but
    isn''t being used? Is the bottleneck knowledge or capability?" The leverage of
    documentation (x100) dwarfs the leverage of new code (x10). When the Architect
    said "the team spent a year discovering what was already there," that''s the cost
    of not documenting.'
  principle: 'Most agent improvements are documentation, not code. The capability
    exists. The knowledge doesn''t. Documentation has 100x leverage over new code.
    Always ask: "What already works that nobody is using?" before proposing to build.'
  grokster_verdict: "L3 \u2014 PROMOTE (Architect observation 2026-08-27)"
  promotion_ready: true
- id: kali-20260827-128
  date: '2026-08-27'
  narrative: 'Agents consistently get stuck at three points: treating operational
    issues as architectural (over-remediation), hedging on foundational decisions
    (false equivalence), punting decisions to humans (unresolved contradictions).
    These are all forms of analysis paralysis.'
  insight: "Each failure type has a correct response. Operational \u2192 retry. Foundational\
    \ \u2192 rebuild. Knowledge \u2192 document. Don't cross the streams (don't re-architect\
    \ for an operational blip; don't retry a broken foundation; don't document a missing\
    \ capability)."
  principle: "Match action to failure type. Operational \u2192 retry. Foundational\
    \ \u2192 rebuild. Knowledge \u2192 document. Don't cross the streams. Agents that\
    \ ask \"is this operational, foundational, or knowledge?\" before acting avoid\
    \ the three failure modes."
  grokster_verdict: "L3 \u2014 PROMOTE (Kali synthesis from human intelligence patterns,\
    \ 2026-08-27)"
  promotion_ready: true
