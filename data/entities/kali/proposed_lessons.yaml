proposals:
  - level: L1
    narrative: >-
      Codified the GitHub secret-scrub learning curve into three artifacts:
      scripts/git-secret-scan.sh (validated history-blob scanner),
      .opencode/skills/git-secret-scrub/SKILL.md (10-step scrub procedure),
      docs/strategy/GITHUB_FORENSICS_SCRIPTING_GUIDE.md (10 rules for writing
      helpful git scripts). Validation against known-positive samples caught
      three silent failures: grep -q SIGPIPE dropping large-blob matches under
      pipefail, ${VAR:-default} brace truncation corrupting the regex, and bash
      case not re-parsing | alternation from variables.
  - level: L2
    insight: >-
      Silent failures are the real cost of ad-hoc scripting. Every one of the
      three bugs produced no error message — only wrong output. The only reason
      they were caught is that the script was validated against a known-positive
      sample (a tracked file with a known prose match). Codification converts
      one agent's debugging session into every agent's precondition.
  - level: L3
    principle: >-
      A tool that fails silently is worse than no tool — it manufactures false
      confidence. Verification against known truth is the minimum bar for any
      automation; codification is how a fleet compounds a single debugging
      session into permanent capability.
- level: L1
    narrative: >-
      Completed vault overhaul synthesis across 5-part spec + 3-part review + migration
      surface amendment. Verified 12+ VaultCore callers against live codebase; applied
      talk-path filter revealing only 2 callers on omega talk path (providers.py,
      google_compat.py), both with env fallbacks — vault deletion safe for debut.
      Produced Opus 4.6 deep review identifying systemic spec-over-ship local maximum
      (27 mandates, 3,500 lines spec vs 0 shipped fixes), Carmack's lazy resolution
      insight applied to entire codebase (Oracle.__init__ eagerly constructs 20
      subsystems). Submitted Cline handoff (ho_74cd96735874) with 21-document inventory
      for consolidation into single implementations manual.
  - level: L2
    insight: >-
      The vault spec work was architecturally correct but temporally misaligned — it
      answered a post-debut question while the debut critical path (INST-1) sat
      completely unstarted. The reward structure (mandates, temple-grade, comprehensive
      specs) optimizes for documentation quality, creating a local maximum where
      spec production displaces deployment velocity. The talk-path filter is the
      critical analytical tool: most "dangerous" dependencies are off the critical
      execution path and have fallbacks. Systemic pattern: lazy construction (deferred
      subsystem initialization) solves the same problems as deletion (startup latency,
      import bloat, fallback behavior) while preserving optionality.
  - level: L3
    principle: >-
      Specification without execution horizon is cognitive inventory, not engineering.
      Every spec must declare its execution phase (debut / post-debut / horizon) and
      its blocking dependencies. A 3,500-line spec that blocks a 2-line fix is
      negative value. The fleet's context window is the scarcest resource — specs
      that don't fit in it alongside the code they govern are effectively unread.
      Verification against live codebase (grep, import traces, runtime paths) is the
      only way to distinguish real blockers from architectural theater.
