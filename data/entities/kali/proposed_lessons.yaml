- id: kali-20260828-135
  date: '2026-08-28'
  narrative: 'Architect observed: a ~400K context compaction with M3 took 57.6 seconds.
    Contexts half that size (200K) have taken 3m 30s (210 seconds) in the past. Math:
    400K -> 57.6s = 6.94K context/sec; 200K -> 210s = 0.95K context/sec. Speed difference:
    7.3x faster for the LARGER context. The compaction time does not scale linearly
    with context size; it scales sub-linearly. This suggests M3 has internal optimizations
    for large-context operations.'
  insight: M3 compaction speed is exponential (sub-linear) at scale. M3 has internal
    optimizations for large-context operations that make compaction dramatically faster
    for larger contexts.
  principle: 'M3 compacts 400K context in 57.6s vs 200K context in 210s. The compaction
    time scales sub-linearly with context size. M3 has internal optimizations for
    large-context operations. This is an additional reason to use M3 for all long-write
    and high-context work: not just does it perform better, it compacts better.'
  grokster_verdict: "L3 \u2014 PROMOTE (Architect direct observation 2026-08-28, post-compaction)"
  promotion_ready: true
