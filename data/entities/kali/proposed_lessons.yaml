- id: kali-20260828-131
  date: '2026-08-28'
  narrative: 'The Architect wants to push MiniMax M3 to its limits: 500K+ active context,
    sustained stress, concurrent subagent dispatch, error recovery at scale. The Architect
    observed that 1M context models usually truncate around 350K, then drop 75-150K.
    M3 sustained 394.2K. We need to FIND THE LIMITS, not assume them.'
  insight: 'The community assumes model limits based on general 1M window behavior.
    But model-specific behavior differs: M3 may sustain higher than expected. To find
    the real limit, you must PUSH until truncation. The methodology: progressive load
    (100K, 200K, 300K, 400K, 500K), measure sustained active context, log truncation
    events, characterize the curve.'
  principle: "Push models to their limits to find their limits. Don't assume based\
    \ on general behavior. M3 sustained 394.2K with no degradation \u2014 the next\
    \ 100K might be fine, or it might truncate. The only way to know is to push. The\
    \ Omega Engine team should make this a standard practice for any new model: progressive\
    \ load test, characterize the curve, publish the result."
  grokster_verdict: "L3 \u2014 PROMOTE (Architect observation 2026-08-28, this session)"
  promotion_ready: true
- id: kali-20260828-132
  date: '2026-08-28'
  narrative: During 6 rounds of deep dive, specialists created 14 scripts in scripts/
    without M13 Temple-Grade gate. 2 are high-risk (hardcoded OAuth CLIENT_SECRET,
    4 P0 bugs in allowlist cut-tool). The bulk-commit pattern obscured individual
    accountability. No pre-commit hook enforced scripts/ review. Specialists produced
    work that bypassed the review pipeline.
  insight: 'Specialists creating operational code without an M13 gate is the same
    class of bug as specialists writing code in markdown without extracting it. Both
    are: specialist produces work that bypasses the review pipeline. The fix is the
    same shape: enforce the pipeline. Operational code = pre-commit hook + architect
    approval. Research code = extraction pipeline + review.'
  principle: 'Specialist file creation in operational locations (scripts/) requires
    an M13 Temple-Grade gate. The gate has three parts: (1) pre-commit hook enforcing
    make temple-grade, (2) hardcoded-secret scanner, (3) specialist charter amendment
    requiring explicit architect approval for operational code. Without the gate,
    specialists produce work that is loud about findings and quiet about fixes.'
  grokster_verdict: "L3 \u2014 PROMOTE (Architect directive 2026-08-28, post-incident)"
  promotion_ready: true
- id: kali-20260828-133
  date: '2026-08-28'
  narrative: The Architect flagged that I (Kali, orchestrator) did not know about
    14 scripts created by specialists. I had tracked dispatches (TASK_REGISTRY has
    139 tasks) but not file creations. The specialists DID tell me about creating
    the files (in their research deliverables) but I did not internalize the file-creation
