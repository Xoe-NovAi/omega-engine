proposals:
- id: kali-20260825-001
  date: '2026-08-25'
  L1: Changed fleet-wide agent steps config unasked, on an unverified assumption that orchestrators need
    more turns than field agents. Architect's field data proved the opposite; ceiling-restarts are an
    emergent checkpointing feature.
  L2: Shared-config changes require a verified workload model AND explicit sanction. The violation was
    not the direction of the change but acting on presumption.
  L3: Authority to act is not authority to assume.
