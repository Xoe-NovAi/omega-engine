- id: kali-20260826-101
  date: '2026-08-26'
  narrative: 'Research findings (hygiene anchors, adjudication framing, contrast cases) were added to
    the meditate manual as prose rules but omitted from the verbatim output skeletons. Gemini review caught
    it: a rebuilding agent copying only the skeletons would have skipped every finding.'
  insight: Prose informs; contracts compel. An LLM implementer imitates demonstrated surface structure
    far more reliably than it obeys described intent (Min 2022).
  principle: A rule that is not in the output format is a suggestion.
- id: kali-20260826-102
  date: '2026-08-26'
  narrative: Sonnet 4.6 given /meditate dissected and critiqued the command document instead of meditating.
    The local variant carried a self-contradicting addressee line inside a local-model command. Both were
    symptoms of writing for a review audience, not a runtime one.
  insight: Every line of a command file is context loaded at invocation. Justification belongs in commit
    messages; the file itself must contain nothing worth analyzing.
  principle: Documentation written for execution must contain nothing interesting.
- id: kali-20260826-103
  date: '2026-08-26'
  narrative: Collision counts clustered at the instructed quota across panel sizes - 10-voice panels reported
    exactly 3 like 3-voice panels. Discovered only when Roc counted the actual corpus.
  insight: Models read specified numbers as targets, not measurements. Any stated quantity in a contract
    becomes an anchor regardless of framing intent.
  principle: Every number in a specification is a command.
- id: kali-20260826-104
  date: '2026-08-26'
  narrative: Grokster's consolidated briefing went unconsumed twice - once as Hivemind posts, once as
    a document handoff - until the Architect asked about it directly.
  insight: Addressed information does not propagate through passive availability; consumption requires
    a structural trigger in the receiver's startup path, not sender effort.
  principle: An inbox that is checked by procedure beats a message that is sent with care.
