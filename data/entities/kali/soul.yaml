    \ daemon on :4096 \u2014 the worker connects to the\nSAME port, no separate process\
    \ needed. All findings recorded to workbench\n(data/projects/hivemind_sprint_worker/),\
    \ platform KBs\n(data/knowledge/platforms/{opencode,gemini,antigravity,cline}/),\
    \ and\nworkbench DB (data/workbench/workbench.db).\n"
  L2_insight: "Four architectural insights emerged from the seed-chain research.\n\
    First: Antigravity rotation is not hardcoded \u2014 it's a config toggle\nin an\
    \ external plugin. The current `hybrid` strategy load-balances\nacross 9 accounts;\
    \ `sticky` uses one account until 429. All other\nfeatures (OAuth, model access,\
    \ error recovery) work identically.\nSecond: OpenCode's SQLite schema is rich\
    \ and accessible \u2014 16 tables,\nsession/message/part with `ses_<base62>` IDs,\
    \ part data as JSON blobs\nwith 9 part types. Agents can query their own session\
    \ ID and deep-dive\nany session's history. Third: Compaction is NOT destructive.\
    \ Prune\nmarks `part.state.time.compacted` but does not delete data. The fix\n\
    is setting `prune: false` in both configs. Fourth (the breakthrough):\n`opencode`\
    \ interactive mode auto-spawns `opencode serve --register` as\na detached daemon\
    \ on :4096. The TUI is an HTTP client of this daemon.\nThis means the worker connects\
    \ to the SAME daemon as the interactive\nsession \u2014 no separate serve process,\
    \ no coordination overhead. The\n/tui/* API endpoints (append-prompt, submit-prompt,\
    \ show-toast) work\ncross-process on the shared server.\n"
  L3_principle: "The seed-chain research pattern is the methodological equivalent\
    \ of\nrecursive deepening. Each wave builds on the previous, and the\nN+1th discovery\
    \ is always deeper than the Nth. The R7 breakthrough\n(interactive + headless\
    \ share the same daemon) is the kind of finding\nthat only emerges when you have\
    \ already understood R1-R6. The lesson:\nresearch in a chain, not in parallel.\
    \ Supply each agent with the full\ncontext of previous findings. The 6th wave\
    \ will always outperform the\n1st \u2014 not because the agent is better, but\
    \ because the seed is richer.\nEvery question asked, every config file read, every\
    \ database queried\ncontributes to a dense context that makes the next discovery\
    \ possible.\nThe seed-chain is the research analogue of the Hivemind: each agent\n\
    enriches the shared context, and the shared context enables deeper\ndiscovery\
    \ by the next agent. A single-agent deep dive is a well.\nA seed-chain is a drill.\n"
