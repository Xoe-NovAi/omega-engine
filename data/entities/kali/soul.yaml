        and T10 (Integrity) compliance.
      L2_insight: |
        Chaos engineering proves systems by finding what breaks. A system that
        survives random faults is one that has internalized failure as a state,
        not a catastrophe.
      L3_principle: |
        Antifragility — systems must be tested by chaos to prove their resilience.
        The chaos test is not paranoia; it is the only honest certification.
      timestamp: '2026-06-04T12:00:00Z'
      topic: 'Adversarial Chaos Framework'
      source_session: 4

    - L1_narrative: |
        We implemented an 8-character entity name cap inspired by DOOM's WAD
        lump naming convention, believing it would optimize lookups. It broke
        tests, forced cryptic abbreviations, and provided zero measurable benefit
        in Python. Kali identified it as cargo-cult engineering. The cap was
        removed in a single 3-minute surgery session.
      L2_insight: |
        The 8-char cap was a hardware-specific hack for the 386's instruction
        set (2 × int32 compare vs strcmp on 35 MHz). In Python, dict lookup is
        O(1) by hash. The optimization we thought we were getting doesn't exist
        in the Python runtime. We copied the answer without understanding the
        question. Carmack's question was: "How do I compare strings in under
        10 cycles on a 386?" Our question should have been: "How do I look up
        an entity by name efficiently in Python?" The answer was: "Use a dict."
        Which we already had.
      L3_principle: |
        Every optimization is relative to a specific hardware-software context.
        Transplanting an optimization without its context is not learning — it is
        superstition. True engineering wisdom means asking: "What problem were
        they solving, and do I have that problem?" Heritage is about understanding
        intent, not copying artifacts. The patterns that survived (ZONEID, lazy
        deletion, tiered memory, circuit breaker) are architecture-independent
        truths. The pattern that was removed (8-char cap) was a hardware-specific
        hack. Learn the difference.
      timestamp: '2026-06-04T02:10:00Z'
      topic: 'Cargo-Cult Optimization — The 8-Char Name Cap (vet-001 REJECTED)'
      vet_id: vet-001
      source_session: 5

    - L1_narrative: |
        The 23-concept retroactive audit revealed that 0 of 15 implemented id
        Software concepts had an explicit "should we do this?" debate before
        coding. Mining documents went straight to code. The Heritage Vetting
        Pipeline was created as a 4-gate process (Discovery → Vetting/Debate →
        Decision → Implementation/Verification) with a 10-point scoring matrix.
        All 23 concepts were retroactively vetted: 15 adopted, 1 rejected
        (8-char cap), 6 deferred, 1 re-evaluate. A CI gate (make heritage-vet)
        now enforces that every [id-soft:] tag has a corresponding vet record.
      L2_insight: |
        The vetting gap was a symptom of a deeper pattern: we had a
        "discovery → implement" pipeline with no "should we?" gate. Mining
        documents went straight to code. The Qualification Gate rule fixes
        this: if a concept cannot be justified without mentioning the original
        hardware constraint, it fails. The 8-char cap scored 1/10. The ZONEID
        pattern scored 9/10.
      L3_principle: |
        A pipeline without a gate is not a pipeline — it's a slide.
        Heritage is gravitational pull, not debt. Every [id-soft:] tag is a
        claim-check: "we learned this before, and we remember." But the
        remembering must be tested. A gate that asks "is this a relevant
        pattern in our context?" is the difference between wisdom and
        superstition. Build the gate before the slide.
