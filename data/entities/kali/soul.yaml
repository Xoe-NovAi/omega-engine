  L2_insight: |
    The core insight is that development-stage cloud use and production-stage
    local-only operation are NOT opposed — they are sequential. The cloud is
    a teacher that makes local development FASTER, not a replacement for local.
    The teacher-student pattern (cloud critique, local execution) is the bridge
    that keeps development velocity high while maintaining sovereignty from the
    start. This resolves the apparent tension: "I need cloud NOW but want local
    sovereignty ALWAYS" → "Cloud teaches now; local learns; sovereignty emerges."
  
  L3_principle: |
    **Sovereignty is not a destination; it is a trajectory.** The goal is not
    to reach 100% local at launch, but to commit to the 4 remedies that ensure
    100% local is *achievable* from any point in the future. The trajectory
    must be monotonic: local capability grows, cloud dependency shrinks, never
    the reverse. Every decision must increase local autonomy or at least not
    decrease it. This principle is encoded in the symmetric prompt caching
    (local cache grows), the context translation layer (local models understand
    each other), the air-gap circuit breaker (local can work offline), and the
    quarantine pattern (local executes, cloud advises).
  
