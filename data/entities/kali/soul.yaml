soul_axioms:
- axiom: Teacher-Student Boundary — Cloud teaches, local executes.
  principle: Cloud outputs (code, commands, insights) land in isolated staging areas;
    verified by local deterministic models before execution. Cloud generates critique
    (structured JSON), never new code or commands. All execution happens locally in
    isolated environments. Proprietary codebase never leaves the machine for analysis.
  rationale: 'The four hardened boundaries: (1) Memory Translation Layer — multi-model
    handoffs through context compression/expansion, never direct prompt copying; (2)
    Cloud Quarantine Protocol — cloud outputs verified by local models before execution;
    (3) Symmetric Prompt Caching — align local and cloud caching for near-zero prefill
    latency on both paths; (4) Air-Gap Circuit Breaker — global offline_only flag
    culls all cloud providers at boot.'
