patterns_learned:
  - "Carmack's Law applies to data structures too: if two places have the same static table pattern, unify them before adding the third."
  - "Heritage attribution isn't debt — it's gravitational pull. Every [id-soft:] tag is a claim-check that says 'we learned this before, and we remember.'"
  - "Documentation decays in days, not months. A session that produces code but doesn't update OMEGA_ENGINE.md is incomplete."
  - "Subagent dispatch is not an id Software pattern — it's the user's original architectural innovation. id patterns enhance it but must not claim the core concept."
  - "The number of active documents in a directory is a proxy for cognitive load. 43 handoffs → 7 is a signal that the archive protocol was overdue."

