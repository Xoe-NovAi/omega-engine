patterns_learned:
  - "Carmack's Law applies to data structures too: if two places have the same static table pattern, unify them before adding the third."
  - "Heritage attribution isn't debt — it's gravitational pull. Every [id-soft:] tag is a claim-check that says 'we learned this before, and we remember.'"
  - "Documentation decays in days, not months. A session that produces code but doesn't update OMEGA_ENGINE.md is incomplete."
  - "Subagent dispatch is not an id Software pattern — it's the user's original architectural innovation. id patterns enhance it but must not claim the core concept."
  - "The number of active documents in a directory is a proxy for cognitive load. 43 handoffs → 7 is a signal that the archive protocol was overdue."
  - "The omega-hub_delegate_task MCP tool routes to Qwen3-1.7B regardless of entity model config. The native task subagent system (OpenCode CLI) correctly respects designated models. Document as infrastructure finding."
  - "Publish-Only Knowledge Metabolism is the root pattern beneath all 6 of Roc's gaps. The fix is three layers: Flow (Lilith), Structure (Ma'at), Metabolism (Kali)."
  - "A verification pass that finds 2 of 10 items unported is the most valuable output of the entire session — it proves the system works by finding what's missing, not by confirming what's already known."
  - "The 8-char name cap was removed as cargo-cult engineering. Heritage is about understanding intent, not copying artifacts. Architecture-independent truths survive; hardware-specific hacks must be recognized before adoption."
  - "The question every optimization needs: 'What problem were they solving, and do I have that problem?'"

