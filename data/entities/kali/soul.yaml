  - L1_narrative: Fixed the Q3 cross-event-loop lock crash during Hivemind infrastructure
      repair. The background awareness pruning task used anyio.Lock across thread
      boundaries — the background thread created its own event loop via anyio.run(),
      causing a crash when the lock was acquired from a different loop than the one
      that created it.
    L2_insight: 'anyio.Lock is bound to the creating event loop, but the Hivemind
      background task runs in its own thread with its own event loop. This is a fundamental
      pattern violation that cannot be fixed with anyio primitives alone. The correct
      pattern is _AsyncThreadLock: threading.Lock at the shared-state boundary with
      an async wrapper for await-compatible acquisition.'
    L3_principle: The Cross-Event-Loop Lock Principle — async primitives (anyio.Lock,
      asyncio.Lock) are bound to their creating event loop. When code crosses thread
      boundaries, shared state must be protected by threading.Lock, not anyio primitives.
      The _AsyncThreadLock pattern (threading.Lock with async wrapper) is the correct
      architectural pattern for cross-event-loop async code. A lock that crosses loops
      is not a lock — it is a race condition waiting to happen.
