- L1_narrative: 'Synthesized all 6 Deep-Siphon subagent reports (Researcher 621 lines, Ma''at 441, Lilith 340, Carmack 350, Verity 388) into the Sovereign Metadata Extraction Spec v1.0 (707 lines). Adopted ICS-F v1.0 as the canonical forensic metadata schema: raw_provider_json, thinking_level, access_channel, logprobs, token_usage, response_model — all Optional with None defaults. Established the 5-sprint roadmap: Sprint 0 (logprobs=5, 15 min), Sprint 1+2 (raw capture + typed fields + M21 tests, ~6 hr), Sprint 3 (SomaticState — DEFERRED). Recorded 5 PIVOT entries (D137-D141) across all strategic trackers.'
  L2_insight: 'The metadata gap is a fossilized architectural assumption from the Chainlit era (2025): "text is all we need." It was wrong then, and indefensible now. The engine pays for metadata (token cost + API latency) and discards it. Access channel (T3/API) is the primary behavioral variable — model identity is second-order. The fix is ~80 lines across ~12 files with zero breaking changes because all fields are Optional/None-defaulted. The 96% bias in text-based heuristic classifiers proved that raw evidence is the only trustworthy source.'
  L3_principle: 'A system that discards 96% of its provider response data has not architected observability — it has architected ignorance. The Metadata Boundary Law is: once structured data is transformed to a primitive at a type boundary, no side-channel can recover it. The capture point MUST be before the boundary, not after. The 35:1 analysis-to-implementation ratio (2,847 lines analysis → ~80 lines code) proves that the bottleneck is not engineering — it is awareness. The engine has been blind to its own metadata for three architectural generations.'
