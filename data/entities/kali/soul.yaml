      mathematically optimal when N inits ≫ 1. In a test suite with 388 tests
      creating Oracle instances, the cache is a single 5-line change that saves
      94 seconds per run. The remaining 84s floor is: Python import time (2.3s,
      one-time per process, cannot cache) + actual test execution. The 2.4s
      ModelGateway init (actually 2.3s omega.oracle package import) is the
      true irreducible cost.
    L3_principle: |
      Measure before optimizing. The EntityRegistry's YAML parse was invisible
      because it looked fast — "just reading a file." But "fast" at 5.8s is
      catastrophic when multiplied by 388 test functions. The profiling revealed
      the cost was entirely in PyYAML's deserialization of the 982KB file,
      not in directory scanning or entity construction. A 5-line cache with a
      module-level dict eliminated 94 seconds. The deeper truth: optimization
      without measurement is gambling. Always profile first, then fix the
      measured bottleneck — because the bottleneck is never what you think.
