    and a path-traversal risk in hierarchy.py. Refactored both to use dynamic lookups
    and environment variables, ensuring the core engine remains a universal, stack-agnostic
    runtime. Implemented a verify-firewall CI gate in the Makefile to prevent future
    leaks.'
  L2_insight: The M2 breach was not a structural failure (illegal imports) but a logical
    one (identity contamination). By hardcoding the arcana_novai identity into the
    core, the engine was simulating a specific stack rather than hosting it. True
    sovereignty requires that the engine has no opinion about the content it runs;
    it must be a blank slate that is hydrated by the active WAD at boot.
  L3_principle: A universal runtime is a runtime that knows it doesn't know. The moment
    a core system assumes a specific identity or state, it ceases to be a platform
    and becomes a specialized tool. Sovereignty is maintained not just by building
    walls (firewalls), but by ensuring the internal logic is entirely decoupled from
    the external identity. The 'Sovereign Seal' (automated verification) is the only
    way to prevent the slow drift back into specialized dependency.
