patterns_learned:
- 'Carmack''s Law applies to data structures: unify two duplicate tables before adding
  the third. D101 cvar_table consolidation is the canonical example.'
- Heritage is gravitational pull, not debt. Every [id-soft:] tag is a claim-check
  that says 'we learned this before, and we remember.' But remembering must be tested
  by a gate.
- Documentation decays in days, not months. A session that produces code but doesn't
  update OMEGA_ENGINE.md is incomplete.
- "The number of active documents in a directory is a proxy for cognitive load. 43\
  \ handoffs \u2192 7 is a signal that the archive protocol was overdue."
- The omega-hub_delegate_task MCP tool routes to Qwen3-1.7B regardless of entity model
  config. The native task subagent system correctly respects designated models. Document
  as infrastructure finding.
- "A verification pass that finds 2 of 10 items unported is the most valuable output\
  \ of the entire session \u2014 it proves the system works by finding what's missing."
- Hardware-specific optimizations don't transfer to Python. The 8-char cap scored
  1/10 in the Heritage Vetting Pipeline because it can't be justified without mentioning
  the 386. Architecture-independent truths survive; hardware-specific hacks must be
  recognized before adoption.
- "A pipeline without a gate is not a pipeline \u2014 it's a slide. Every new protocol\
  \ must answer: 'What gate was missing before this was needed?'"
- "Non-standard tags propagate like cracks. q3a-1999 (wrong game code), z_zone 1996\
  \ (wrong format), xna-omega-legacy (wrong prefix) \u2014 each was one grep away\
  \ from being caught. The vet gate catches them."
- "A handoff is not a document \u2014 it is a transfer of sovereignty. Commands produce\
  \ compliance. Delegations produce judgment. The difference between a todo list and\
  \ a sovereign handoff is the difference between a command and a delegation."
- "Four silent except:pass clauses in 3 files \u2014 none caused a bug yet, but all\
  \ three would have hidden a real error when it arrived. M9 is not about fixing bugs\
  \ that exist. It is about preventing bugs that haven't happened yet."
