      fabric \u2014 it is a broadcast receiver. True coordination requires every\n\
      agent to be both a consumer AND a producer of shared context. The\nabsence of\
      \ a write mandate is not a neutral omission; it actively\nentrenches the chat-as-primary-channel\
      \ default. A sovereign fleet\nmust flip the default: Hivemind-first, chat-second.\
