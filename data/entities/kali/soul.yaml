      awareness, logged errors, responded in chat. Everything functioned.\nBut the\
      \ Hivemind was a READ-ONLY sensor, not a WRITE channel. The\ngap was a pattern\
      \ of omission \u2014 no instruction to post, framed as\n\"MANDATORY for parallel\
      \ work\" (conditional) rather than unconditional.\nThis is a tool-use default\
      \ problem, not a model training problem.\nEvery model (Gemma 4, DeepSeek V4,\
      \ MiMo, Gemini) defaults to chat\noutput because that is the primary interaction\
      \ pattern of the\nassistant paradigm. The fix must be universal because the\
