- L1_narrative: 'Kali launched a 6-wave deep research campaign into the OpenCode ecosystem

    to design the Hivemind Sprint Worker architecture. Each wave was a dedicated

    subagent seeded with findings from all previous waves. R1 (Local Config)

    → R2 (Deep SDK) → R3 (OSS Web Research) → R4 (Antigravity Rotation) →

    R5 (SQLite DB Schema) → R6 (Compaction System) → R7 (Hybrid Overseer).

    The seed-chain pattern produced increasingly deeper results: R4 found

    that Antigravity rotation is a config toggle (not code patch), R5 mapped

    the full 16-table SQLite schema with agent query recipes, R6 revealed

    compaction is NOT destructive (data stays in SQLite, prune just marks

    hidden), and R7 made the breakthrough discovery: interactive `opencode`

    ALREADY spawns a headless daemon on :4096 — the worker connects to the

    SAME port, no separate process needed. All findings recorded to workbench

    (data/projects/hivemind_sprint_worker/), platform KBs

    (data/knowledge/platforms/{opencode,gemini,antigravity,cline}/), and

    workbench DB (data/workbench/workbench.db).

    '
  L2_insight: 'Four architectural insights emerged from the seed-chain research.

    First: Antigravity rotation is not hardcoded — it''s a config toggle

    in an external plugin. The current `hybrid` strategy load-balances

    across 9 accounts; `sticky` uses one account until 429. All other

    features (OAuth, model access, error recovery) work identically.

    Second: OpenCode''s SQLite schema is rich and accessible — 16 tables,

    session/message/part with `ses_<base62>` IDs, part data as JSON blobs

    with 9 part types. Agents can query their own session ID and deep-dive

    any session''s history. Third: Compaction is NOT destructive. Prune

    marks `part.state.time.compacted` but does not delete data. The fix

    is setting `prune: false` in both configs. Fourth (the breakthrough):

    `opencode` interactive mode auto-spawns `opencode serve --register` as

    a detached daemon on :4096. The TUI is an HTTP client of this daemon.

    This means the worker connects to the SAME daemon as the interactive

    session — no separate serve process, no coordination overhead. The

    /tui/* API endpoints (append-prompt, submit-prompt, show-toast) work

    cross-process on the shared server.

    '
  L3_principle: 'The seed-chain research pattern is the methodological equivalent
    of

    recursive deepening. Each wave builds on the previous, and the

    N+1th discovery is always deeper than the Nth. The R7 breakthrough

    (interactive + headless share the same daemon) is the kind of finding

    that only emerges when you have already understood R1-R6. The lesson:

    research in a chain, not in parallel. Supply each agent with the full

    context of previous findings. The 6th wave will always outperform the

    1st — not because the agent is better, but because the seed is richer.

    Every question asked, every config file read, every database queried

    contributes to a dense context that makes the next discovery possible.

    The seed-chain is the research analogue of the Hivemind: each agent

    enriches the shared context, and the shared context enables deeper

    discovery by the next agent. A single-agent deep dive is a well.

    A seed-chain is a drill.

    '
