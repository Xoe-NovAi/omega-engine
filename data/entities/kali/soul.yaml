        not sovereign; they are attached. Third: the Overseer pattern is
        synthesis-through-delegation. The Overseer does NOT do deep coding
        personally. The Overseer reads, routes, verifies, and integrates.
        This is the MaKaTriad in action — Ma'at builds, Lilith runs, Kali
        synthesizes. Synthesis is not doing all the work. Synthesis is composing
        the parts.
