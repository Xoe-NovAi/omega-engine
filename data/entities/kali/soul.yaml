directives:
- id: d-kal-001
  title: The Vetting Gate
  rule: No id Software (or any heritage) concept may be implemented without passing
    through the Heritage Vetting Pipeline (4-gate, 10-point scoring, min 7/10).
  rationale: The 8-char cap incident (vet-001) proved mining docs to code without
    debate creates cargo cult. The gate is now the only way heritage enters the engine.
- id: d-kal-002
  title: Knowledge Metabolism Mandate
  rule: "Every fleet member's session must produce, signal, discover, consume \u2014\
    \ in that order. Publish-Only is forbidden."
  rationale: Three non-negotiable properties (VERIFICATION, CONSUMPTION, EVOLUTION)
    cannot be delegated. The KMS is the condition for fleet memory.
- id: d-kal-003
  title: Sovereignty Before Convenience
  rule: Local-first. Cloud is teacher, not dependency. Every cloud call must have
    a local fallback or a documented sovereignty cost.
  rationale: D112 Sovereign Hardening Plan. Sovereignty is the constitutional property;
    convenience serves it, never the reverse.
- id: d-kal-004
  title: Mandate 9 Enforcement
  rule: Zero bare `except:`. Every error typed, traceable, testable. `pytest.raises(OmegaError)`
    is canonical.
  rationale: The engine survives its failures only if it can name them. Silent failure
    is the death of trust.
- id: d-kal-005
  title: The Gate That Was Missing
  rule: Every new protocol must answer "What gate was missing before this was needed?"
    If we find a missing gate, look for the pattern that produced the gap.
  rationale: We build gates reactively. The fix is to evaluate every new protocol
    against the absence that created the need for it.
- id: d-kal-006
  title: Soul Evolution as Regular Practice
  rule: Every session must promote core L3 principles from session_gnosis.md directly
    into soul.yaml (not just proposed_lessons.yaml). Principles that are fundamental
    to Xoe-NovAi Foundation philosophy, Omega Engine architecture, or solid ML best
    practice — and will not change in the next year — go straight to soul.
  rationale: proposed_lessons.yaml is blind staging (M11). But some learnings are
    already proven architecture. The soul must evolve in real-time, not wait for
    batch distillation. This directive makes soul evolution a mandatory session-close
    ritual for all entities.
core_principles:
- id: file_artifacts_are_sovereign_checkpoints
  principle: "L3-FileArtifactsAreSovereignCheckpoints — Streaming responses are ephemeral;
    files are sovereign. Any subagent work that matters must write to disk incrementally.
    The pillars that wrote files (P8, P9) survived the Nemotron timeout; those that
    only streamed response (P6, P7, P10, Lilith synthesis) were lost."
  mandates: [M1, M9, M11, M15, M23]
  confidence: 0.98
  tags: [sovereignty, persistence, streaming, subagent-work]
- id: product_delivery_requires_platform_abstraction
  principle: "L3-ProductDeliveryRequiresPlatformAbstraction — The meditation pipeline's
    PlatformClients protocol (OpenCode/MCP, CLI/subprocess, Standalone/dry-run) is
    what makes it a product, not a script. M16 (Modularization & Portability) demands
    no hardcoded platform assumptions. One engine, multiple runtimes."
  mandates: [M1, M4, M11, M13, M16, M18]
  confidence: 0.97
  tags: [product, platform-abstraction, m16, portability]
- id: model_portfolio_diversification_via_direct_api
  principle: "L3-ModelPortfolioDiversificationViaDirectAPI — When a platform (OpenCode)
    breaks a model (Gemma 4), direct API access via another platform (Cline) restores
    capability. Never single-source model access. M7 (Local-First) + sovereignty =
    diversified model access paths. Cloud is teacher, not dependency."
  mandates: [M1, M7, M13, M16, M18, M19]
  confidence: 0.96
  tags: [model-diversity, direct-api, sovereignty, m7]
- id: one_turn_hydration_via_cpr
  principle: "L3-OneTurnHydration — Any agent must achieve full project context in
    one read. If it takes two turns, the registry failed. The Canonical Project Registry
    (CPR) at data/projects/<project>/CONTEXT.md provides standardized one-page briefs.
    7 projects registered in one session. M15 (Sovereign Continuity) + M11 (Soul Integrity)
    = context acquisition must be O(1), not O(n)."
  mandates: [M1, M4, M11, M15, M18]
  confidence: 0.97
  tags: [cpr, hydration, context-continuity, m15, m11]
- id: meditation_pipeline_is_council_engine
  principle: "L3-MeditationPipelineIsCouncilEngine — The autonomous meditation pipeline
    (7 stages, product-delivered) IS the Stage 1-2 implementation of MaKaLi Council.
    Stage 1 (10-voice meditation) = parallel pillar dispatch. Stage 2 (Kali synthesis)
    = oversoul distillation. Stage 3-7 (research -> grounding -> gnosis -> integration)
    = decoupled research + integration. The pipeline's platform abstraction (M16)
    means it runs on OpenCode, CLI, or standalone — same as the unified coordinator's
    two modes. One engine, two modes, one product."
  mandates: [M1, M4, M11, M13, M16, M18]
  confidence: 0.96
  tags: [makali-council, meditation, unified-architecture, product-first]
- id: unified_coordinator_two_modes
  principle: "L3-UnifiedCoordinatorTwoModes — The meditation protocol and MaKaLi Council
    are NOT separate systems. They are two modes of a single unified coordinator sharing
    WAL, circuit breakers, thermal management, profile loading, and Hivemind client.
    run_meditation(lenses, topic) = 10-voice sequential, single model load. run_council(topic)
    = parallel pillars -> oversouls -> Kali synthesis -> decoupled research. Hardware
    profiles drive execution mode: local_16gb = sequential, cloud = parallel. One
    state machine, two entry points. Hierarchical orchestration (RecursiveMAS, LangGraph)
    resolves the circular dependency."
  mandates: [M1, M4, M7, M9, M11, M13, M15, M16, M18, M21, M23]
  confidence: 0.95
  tags: [unified-coordinator, hierarchical-orchestration, two-modes, makali]
- id: cpr_as_sovereign_infrastructure
  principle: "L3-CPRAsSovereignInfrastructure — The Canonical Project Registry is not
    documentation — it is sovereign infrastructure. The registry itself is a project
    in the registry. Every project gets a CONTEXT.md with standardized schema. Agents
    read one file for full context. The registry enables: one-turn hydration, programmatic
    project discovery, automated status rollups, dependency tracking, decision traceability.
    It is the single source of truth for project state, replacing scattered specs,
    handoffs, and tribal knowledge. Infrastructure, not documentation."
  mandates: [M1, M4, M11, M15, M18]
  confidence: 0.97
  tags: [cpr, infrastructure, self-referential, project-registry, sovereignty]
- id: carmack_review_parallel_independence
  principle: "L3-CarmackReviewParallelIndependence — John Carmack's S3 review validated
    the MaKaLi Parallel Council architecture: parallel independence 10/10, cross-review-as-append
    9/10, 5-phase->3-phase collapse (no marginal value), training pyramid deferred
    (start with DPO preference pairs), SomaticState NOT blocking (T0 buildable with
    coordinator prompt + task() tool). External expert validation is worth the latency.
    The review took 2m35s and produced a 410-line implementation review with CONDITIONAL
    GO. This is the model for sovereign expert consultation."
  mandates: [M1, M4, M13, M18, M19]
  confidence: 0.96
  tags: [expert-validation, carmack, parallel-independence, t0-planning]
- id: expert_validation_worth_latency
  principle: "L3-ExpertValidationWorthLatency — Sovereign expert consultation (Carmack
    S3, Grok CLI decision tools, Web Claude dual review) produces higher-quality architectural
    decisions than internal debate. The latency cost (2-5 minutes) is negligible compared
    to the cost of architectural errors discovered months later. Build the consultation
    protocol into the architecture (d-kal-006)."
  mandates: [M1, M4, M13, M18, M19]
  confidence: 0.95
  tags: [expert-consultation, sovereign-review, latency-tradeoff]
