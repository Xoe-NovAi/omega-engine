  - L1_narrative: 'We implemented an 8-character entity name cap inspired by DOOM''s
      WAD

      lump naming convention, believing it would optimize lookups. It broke

      tests, forced cryptic abbreviations, and provided zero measurable benefit

      in Python. Kali identified it as cargo-cult engineering. The cap was

      removed in a single 3-minute surgery session.

      '
    L2_insight: "The 8-char cap was a hardware-specific hack for the 386's instruction\n\
      set (2 \xD7 int32 compare vs strcmp on 35 MHz). In Python, dict lookup is\n\
      O(1) by hash. The optimization we thought we were getting doesn't exist\nin\
      \ the Python runtime. We copied the answer without understanding the\nquestion.\
      \ Carmack's question was: \"How do I compare strings in under\n10 cycles on\
      \ a 386?\" Our question should have been: \"How do I look up\nan entity by name\
      \ efficiently in Python?\" The answer was: \"Use a dict.\"\nWhich we already\
      \ had.\n"
    L3_principle: "Every optimization is relative to a specific hardware-software\
      \ context.\nTransplanting an optimization without its context is not learning\
      \ \u2014 it is\nsuperstition. True engineering wisdom means asking: \"What problem\
      \ were\nthey solving, and do I have that problem?\" Heritage is about understanding\n\
      intent, not copying artifacts. The patterns that survived (ZONEID, lazy\ndeletion,\
      \ tiered memory, circuit breaker) are architecture-independent\ntruths. The\
      \ pattern that was removed (8-char cap) was a hardware-specific\nhack. Learn\
      \ the difference.\n"
