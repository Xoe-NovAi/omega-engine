- L1_narrative: 'Kali was tasked with fixing the Hivemind MCP server so 3 peer

    sessions (Ma''at, Quality, Roc Racoon) could coordinate through it.

    Three critical bugs were found and fixed: Q1 (TTL Drift — HEARTBEAT_TTL

    1200→2700 to align with documented 45-min spec), Q3 (Lock Crash —

    anyio.Lock used across thread boundaries; background thread created

    its own event loop via anyio.run(), causing crash on async with

    _awareness_lock. Fixed by creating _AsyncThreadLock wrapping

    threading.Lock with await anyio.to_thread.run_sync for

    cross-event-loop safety), and Q7 (Path Drift — stale mcp/omega_hub

    references in CREDITS.md and ORACLE_STACK.md). Also fixed a pre-existing

    B1 import bug (missing `Union` in oracle.py typing imports that would

    have prevented the Hivemind server from booting). Restarted the

    systemd omega-hub.service — clean boot, 0 errors, 0 tracebacks.

    All 21 entities loaded. Health endpoint returns 200 on :8016.

    The Hivemind is now healthy and ready for the 3-session sprint.

    '
  L2_insight: 'Three architectural insights emerged. First: the Q3 lock crash is a

    fundamental pattern violation — anyio.Lock is bound to the creating

    event loop, but the Hivemind background task runs in its own thread

    with its own event loop (from threading.Thread + anyio.run()). This

    is a cross-event-loop bug that cannot be fixed with anyio primitives

    alone; the fix requires threading.Lock at the shared-state boundary.

    The _AsyncThreadLock pattern (threading.Lock with async wrapper)

    is the correct architectural pattern for cross-event-loop async code.

    Second: the B1 import bug (missing Union) had been latent in oracle.py

    for an unknown period — the engine''s import chain had never been

    verified from the Hivemind server''s entry point. The test suite ran

    oracle.py tests directly, bypassing the full import chain. Third:

    the Hivemind was already running under the OLD code (pre-fix) before

    this session''s edits — meaning the Q3 crash was latent but never

    triggered because the awareness pruning task may not have fired yet.

    '
  L3_principle: 'Infrastructure is the coordination fabric, not context. A bug in

    the fabric cannot be worked around by better planning. When the

    Hivemind has cross-event-loop lock crashes, no amount of strategy

    documents or handoff protocols can enable coordination — because

    the coordination mechanism itself is broken. The fix must be applied

    at the infrastructure layer BEFORE coordination begins. This means:

    (1) cross-thread async code must use threading.Lock with async

    wrappers, never anyio.Lock directly; (2) every server''s full import

    chain must be verified from its entry point, not just via unit tests;

    (3) coordination infrastructure health checks must be the first

    gate before any session coordination. The cost of infrastructure

    failure is not a crash — it is the illusion of coordination.

    '
