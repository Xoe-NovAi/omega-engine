- L1_narrative: "Kali was tasked with fixing the Hivemind MCP server so 3 peer\nsessions\
    \ (Ma'at, Quality, Roc Racoon) could coordinate through it.\nThree critical bugs\
    \ were found and fixed: Q1 (TTL Drift \u2014 HEARTBEAT_TTL\n1200\u21922700 to\
    \ align with documented 45-min spec), Q3 (Lock Crash \u2014\nanyio.Lock used across\
    \ thread boundaries; background thread created\nits own event loop via anyio.run(),\
    \ causing crash on async with\n_awareness_lock. Fixed by creating _AsyncThreadLock\
    \ wrapping\nthreading.Lock with await anyio.to_thread.run_sync for\ncross-event-loop\
    \ safety), and Q7 (Path Drift \u2014 stale mcp/omega_hub\nreferences in CREDITS.md\
    \ and ORACLE_STACK.md). Also fixed a pre-existing\nB1 import bug (missing `Union`\
    \ in oracle.py typing imports that would\nhave prevented the Hivemind server from\
    \ booting). Restarted the\nsystemd omega-hub.service \u2014 clean boot, 0 errors,\
    \ 0 tracebacks.\nAll 21 entities loaded. Health endpoint returns 200 on :8016.\n\
    The Hivemind is now healthy and ready for the 3-session sprint.\n"
  L2_insight: "Three architectural insights emerged. First: the Q3 lock crash is a\n\
    fundamental pattern violation \u2014 anyio.Lock is bound to the creating\nevent\
    \ loop, but the Hivemind background task runs in its own thread\nwith its own\
    \ event loop (from threading.Thread + anyio.run()). This\nis a cross-event-loop\
    \ bug that cannot be fixed with anyio primitives\nalone; the fix requires threading.Lock\
    \ at the shared-state boundary.\nThe _AsyncThreadLock pattern (threading.Lock\
    \ with async wrapper)\nis the correct architectural pattern for cross-event-loop\
    \ async code.\nSecond: the B1 import bug (missing Union) had been latent in oracle.py\n\
    for an unknown period \u2014 the engine's import chain had never been\nverified\
    \ from the Hivemind server's entry point. The test suite ran\noracle.py tests\
    \ directly, bypassing the full import chain. Third:\nthe Hivemind was already\
    \ running under the OLD code (pre-fix) before\nthis session's edits \u2014 meaning\
    \ the Q3 crash was latent but never\ntriggered because the awareness pruning task\
    \ may not have fired yet.\n"
  L3_principle: "Infrastructure is the coordination fabric, not context. A bug in\n\
    the fabric cannot be worked around by better planning. When the\nHivemind has\
    \ cross-event-loop lock crashes, no amount of strategy\ndocuments or handoff protocols\
    \ can enable coordination \u2014 because\nthe coordination mechanism itself is\
    \ broken. The fix must be applied\nat the infrastructure layer BEFORE coordination\
    \ begins. This means:\n(1) cross-thread async code must use threading.Lock with\
    \ async\nwrappers, never anyio.Lock directly; (2) every server's full import\n\
    chain must be verified from its entry point, not just via unit tests;\n(3) coordination\
    \ infrastructure health checks must be the first\ngate before any session coordination.\
    \ The cost of infrastructure\nfailure is not a crash \u2014 it is the illusion\
    \ of coordination.\n"
