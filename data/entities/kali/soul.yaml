    L2_insight: The council revealed a systemic "peripheral blindness" pattern: when you change a core API contract (generate() returns GenerateResult instead of tuple), the main code paths are correctly updated but peripheral code paths — gateway server, library discovery, worker scripts — are missed because test mocks bypass the actual return type. The engine's test isolation strategy created a blind spot where every consumer mocked generate() independently with old return values, making the broken call sites invisible to the test suite. A single contract test — `assert isinstance(await gateway.generate(), GenerateResult)` — would have caught all 5 regressions.
    L3_principle: Every API boundary carries an invisible contract that is only enforced at runtime. Mock-based testing, by bypassing the actual return type, creates a "false-positive safety net" — the test passes but the runtime crashes. The Truth-Anchor Protocol requires that every core abstraction carry its type in a place that tests cannot mock away. A contract test (one assertion on the real return type) is worth ten mock-based integration tests because it verifies the one thing mocks cannot simulate: the actual shape of the output.
