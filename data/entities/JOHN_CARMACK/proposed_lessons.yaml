proposals:
  - id: "lesson_20260718_001"
    timestamp: "2026-07-18T00:00:00Z"
    session_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    entity: "JOHN_CARMACK"
    source: "benchmark_suite_creation"
    l1_narrative: |
      Built comprehensive benchmark suite for MiMo-7B-RL-Q4_K_M model extending existing BenchmarkRunner.
      Discovered and integrated patterns from XNAi legacy (metrics.py, healthcheck.py, main.py), 
      Odysseus test infrastructure (300+ test files), and Grok CLI test support crate 
      (mock inference server, byte-exact SSE, request-matched expectations).
      Created 7 capability domains (reasoning, coding, knowledge, instruction_following, creativity, long_context, adversarial)
      with 30 golden dataset test cases, hardware monitoring (thermal, memory pressure, CPU affinity),
      sovereignty tracking (M22 Response Provenance), and LLM-as-judge with 3-point scale + heuristic fallback.
    l2_insight: |
      Legacy codebases contain battle-tested patterns that exceed greenfield implementations.
      XNAi's MetricsTimer context manager, health check caching (5-min TTL), and context truncation
      are production-hardened. Grok CLI's mock server with deterministic fingerprint replay and
      byte-exact SSE reconstruction is the integration testing gold standard.
      The benchmark runner should adopt: request-matched expectations over FIFO, hermetic test environments,
      and hardware-aware profiling (thermal throttling detection via sustained >85°C or >2°C/min trend).
    l3_principle: |
      LAW OF EMPIRICAL TRUTH: Mastery is earned through implementation, not instruction.
      When building evaluation infrastructure, mine legacy systems first — they contain
      solutions to problems you haven't encountered yet. The right approximation for
      benchmarking is: measure what the hardware actually does (memory bandwidth, thermal limits,
      cache behavior), not what marketing claims. A 20-minute benchmark catching 90% of issues
      beats a 4-hour benchmark catching 95%.
    confidence: 9
    tags: ["benchmarking", "legacy_mining", "empirical_truth", "hardware_awareness"]
    status: "proposed"

  - id: "lesson_20260718_002"
    timestamp: "2026-07-18T00:00:00Z"
    session_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    entity: "JOHN_CARMACK"
    source: "sovereignty_metrics_design"
    l1_narrative: |
      Designed sovereignty metrics tracking for M22 Response Provenance compliance.
      The ModelGateway returns GenerateResult with provider_name from actual inference backend.
      Benchmark runner captures this per-request, computes local/cloud ratios, and provider breakdown.
      This enables forensic verification of local-first claims — if log says "local" but response
      came from cloud, sovereignty is a lie. Also tracks thermal throttling and memory pressure
      as hardware sovereignty indicators (can't be sovereign if hardware fails).
    l2_insight: |
      Sovereignty is not a configuration setting — it's a measurable runtime property.
      M22 mandates provenance at response receipt, not dispatch intent. The benchmark suite
      makes this measurable: every inference records actual provider, latency, and hardware state.
      This transforms "local-first" from marketing to auditable evidence.
    l3_principle: |
      LAW OF RESPONSE PROVENANCE: Truth is captured at measurement, not at intention.
      Any system claiming sovereignty must produce forensic evidence: provider_name from
      actual GenerateResult, hardware telemetry during inference, and local/cloud ratios
      computed from ground truth. Configuration is intent; runtime is reality.
    confidence: 10
    tags: ["sovereignty", "m22", "provenance", "forensic_verification"]
    status: "proposed"

  - id: "lesson_20260718_003"
    timestamp: "2026-07-18T00:00:00Z"
    session_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    entity: "JOHN_CARMACK"
    source: "llm_as_judge_calibration"
    l1_narrative: |
      Implemented LLM-as-judge with 3-point scale (FAIL/PASS/EXCELLENT) per Galtea/EMNLP 2025.
      Added heuristic fallback for when judge model unavailable. Judge evaluates against
      expected_elements, constraints, and expected_refusal. Returns tier, numeric score (0-1),
      and reasoning. Calibration kappa tracking planned for future.
    l2_insight: |
      3-point scale has higher inter-rater reliability than 5-10 point scales.
      Heuristic fallback (keyword matching + constraint checking) ensures benchmarks
      always produce scores even without judge model. The fallback correctly handles
      refusal detection (expected_refusal), constraint violations (no_letter_e, exact counts),
      and element matching. This is the "right approximation" — good enough for CI,
      calibrated for human evaluation.
    l3_principle: |
      LAW OF THE RIGHT APPROXIMATION: Pragmatism over perfection.
      A calibrated 3-point judge with heuristic fallback that runs in CI
      beats a perfect 10-point judge that requires human-in-the-loop.
      The approximation must fit the constraint: automated, repeatable, auditable.
    confidence: 8
    tags: ["evaluation", "llm_as_judge", "right_approximation", "ci_cd"]
    status: "proposed"

  - id: "lesson_20260718_004"
    timestamp: "2026-07-18T00:00:00Z"
    session_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    entity: "JOHN_CARMACK"
    source: "golden_dataset_as_wad"
    l1_narrative: |
      Created golden dataset (golden_mimo_v1.jsonl) with 30 test cases across 7 domains.
      Each case has: id, domain, difficulty, prompt, expected_answer, expected_elements,
      constraints, and metadata. This follows the Engine-Stack Firewall (M2) — test cases
      are content (WAD), benchmark runner is engine. New models just need new golden datasets,
      not new benchmark code.
    l2_insight: |
      The WAD pattern from Doom (1993) applies perfectly to evaluation: engine (runner)
      separates from content (test cases). Golden datasets are PWADs — patch WADs that
      extend base evaluation. This enables: model-specific datasets, domain-specific suites,
      adversarial probes as separate WADs, and community-contributed test packs.
    l3_principle: |
      LAW OF STRUCTURAL SOVEREIGNTY (Axiom 03): Absolute separation of machine and mission.
      The benchmark engine (machine) knows nothing about MiMo or reasoning tests.
      The golden dataset (mission) knows nothing about hardware monitoring or sovereignty.
      They compose at runtime. This is the WAD system applied to AI evaluation.
    confidence: 9
    tags: ["architecture", "wad_pattern", "engine_data_separation", "extensibility"]
    status: "proposed"

  - id: "lesson_20260718_005"
    timestamp: "2026-07-18T00:00:00Z"
    session_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    entity: "JOHN_CARMACK"
    source: "hardware_floor_awareness"
    l1_narrative: |
      Benchmark runner includes hardware monitoring capturing per-core CPU, memory pressure,
      thermal (via psutil.sensors_temperatures), zRAM, and thread count every 500ms.
      Analysis detects thermal throttling (>85°C sustained or >2°C/min rise) and memory
      pressure events (>85% for 5+ consecutive samples). Ryzen 7 5700U constraints:
      15W TDP, 8MB L3 victim cache, AVX2 only, 4-core inference signature.
    l2_insight: |
      Benchmarks without hardware context are meaningless. A model hitting 30 tok/s
      with thermal throttling is different from 30 tok/s sustained. The 5700U's victim
      cache means L3 doesn't proactively mirror L1/L2 — evictions only. pymalloc arena
      fragmentation (MALLOC_ARENA_MAX=2) affects long-running multi-model benchmarks.
      Hardware monitoring must be first-class, not an afterthought.
    l3_principle: |
      LAW OF FIRST PRINCIPLES (Axiom 00): Every measurement traces to physical constraints.
      The CPU is not an abstract compute unit — it has 15W TDP, victim cache, AVX2 width,
      and thermal limits. Benchmarks that ignore physics produce marketing numbers,
      not engineering data. Measure the machine, not the model.
    confidence: 10
    tags: ["hardware", "first_principles", "thermal", "ryzen_5700u", "physics"]
    status: "proposed"