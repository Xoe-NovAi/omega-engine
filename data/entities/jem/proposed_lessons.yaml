- L3: The Principle of Functional Identity — An agent's role is defined by the entropy it reduces; the most effective title is the one that describes the transformation it performs on data.
- L3: The Principle of Mathematical Sovereignty — True control over an LLM's output requires moving beyond the prompt and into the probability distribution (Logit Bias).
- L3: The Principle of the Integration Seam — Systemic failure occurs at the boundaries between modules; sovereignty requires an explicit Translation Layer at every boundary.
