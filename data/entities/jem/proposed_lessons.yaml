- id: JEM-VERB-001
  node: JEM-SEAM-ADJUDICATION
  date: '2026-09-28'
  level: L3
  tags:
  - 3-VERB-LEXICON
  - PAGE-HANDOFF-POST
  - RELIABILITY-CLASS
  confidence: 0.85
  narrative: "The fleet adopted three strict verbs: PAGE (synchronous task(), caller blocks), HANDOFF (asynchronous hivemind_handoff action=submit), POST (ambient telemetry hivemind_awareness action=post). Concrete evidence of the failure mode these distinguish: 119 pending handoffs addressed to jem, all artifacts of historical M36 runs writing /tmp/test.md, indistinguishable from real demand until manually adjudicated and archived."
  insight: "The lexical split is correct but incomplete without a reliability-class rule. PAGE is the only verb guaranteeing ordering, so it is correct for anything where a lost result is a lost decision. HANDOFF is durable and therefore auditable, which obliges a dead-letter reaper exactly as M34 provides for subagents - a handoff queue with no reaper is a silent stall with extra steps. POST is ambient and must never be the sole record closing a work order. The 119 phantom handoffs are the receipt: durable transport accumulated synthetic load that only manual review could distinguish from real demand, which is the condition POST-only recording invites at fleet scale."
  principle: "Sequencing verb must match reliability class: PAGE for blocking ordered work, HANDOFF for durable auditable work orders that carry a dead-letter reaper, POST for ambient telemetry that is never load-bearing. A decision recorded only by POST did not happen."

- id: JEM-PLUGIN-001
