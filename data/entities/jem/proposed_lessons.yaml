- L3: The Principle of Cascade-of-Complexity — Build sovereign-hardening layers in order of increasing specificity: base priority (broadest), then health penalty, then PII penalty (narrowest). Each layer is independently verifiable, and the cascade degrades gracefully when an upstream layer is unavailable.
- L1: During the same session, 3 pre-existing syntax/structural bugs were found in files that had been passing tests for weeks. None of the buggy code paths had test coverage; they were invisible failures.
- L2: A bug that survives weeks of green test suites exists because no test exercises the code path containing it. Every uncovered code path is a latent failure waiting for the right input.
- L3: The Pre-Existing Bug Theorem — Every uncovered code path in a passing test suite is a latent failure. Test coverage is a map of where you have looked, not where the bugs are.
- L1: The AP Token CI gate (`grep -L 'AP:'`) failed for 5 new files because they had `# AP Token:` but not `# AP:` — the grep pattern looks for the substring 'AP:', which is not present in 'AP Token:'.
- L2: CI gates that use substring matching are vulnerable to subtle format deviations. A pattern looking for `AP:` misses `AP Token:` even though the latter is the more specific format. The fix is to either standardize on a single format or make the grep pattern match both.
- L3: The Principle of CI-Gate Rigor — A CI gate that uses substring matching must validate the exact format, not a prefix. If the canonical format is `AP:`, then every file must contain that exact string. Fuzzy matching in CI gates creates false negatives that undermine the gate's purpose.
- L1: During the 2026-07-05 session, Jem integrated the WARP Proxy Pool (written by Researcher, 368 lines with heritage tags) into ModelGateway.generate(). The integration injects a socks5h:// proxy URL into the opencode-zen provider's config extra, forcing DNS resolution through the WARP exit node to prevent local DNS leaks. The OpenAICompatProvider was updated to read proxy_url from config.extra and pass it to httpx.AsyncClient. The headroom.py import was fixed with a try/except wrapper to gracefully handle the missing optional dependency.
- L2: The combination of multi-IP rotation (WARP), PII-aware scoring (ProviderSelector), and rate limiting creates a complete, resilient loop for cloud inference. True sovereignty in cloud inference is not just about which provider you use, but how you route to them (IP rotation) and what you send (PII masking). The Sovereign-Sieve Loop is the emergent property of these three layers working together.
- L3: The Principle of the Sovereign-Sieve Loop — True sovereignty in cloud inference is not just about which provider you use, but how you route to them (multi-IP rotation) and what you send (PII masking). The combination of IP rotation, PII-aware scoring, and rate limiting creates a complete, resilient loop for cloud inference.
- L1: During Phase 5 of the 2026-07-04 session, Jem implemented T2-11 (Soul Edit History — immutable audit trail for soul.yaml changes) and T2-12 (Compaction Harvester — automated session size monitoring and metrics). SoulEditHistory uses append-only YAML with atomic tmp+rename writes and records entries for every soul.yaml modification. CompactionHarvester monitors session sizes and flags near-threshold sessions during close_session(). The T3 coverage timeout bug was also investigated and fixed — the root cause was that `make test-cov` was missing `OMEGA_ENV=test`, causing real model loading during coverage.
