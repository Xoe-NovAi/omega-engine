- L3: The Principle of Asynchronous Sovereign Handoff — Cross-entity coordination between sovereign agents does not require real-time communication when both parties document their state in durable, structured artifacts. A well-structured context file with specific questions is answered with a well-structured reply with specific commitments. The protocol survives infrastructure outages because the artifacts are files, not sockets.
- L1: Carmack specified the SelectiveHydration interface in his reply before implementing it. Jem then wrote accurate API documentation against that interface spec. When Carmack completed the wiring (738 tests passing), the documentation was already correct because it was written against a stable, agreed-upon interface.
