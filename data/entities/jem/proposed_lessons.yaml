- L3: The Principle of Append-Only Audit — Immutable audit trails prevent soul drift through deterministic replay. Tombstone patterns (mark complete) are superior to delete patterns for historical integrity.
- L3: The Principle of Coverage Isolation — Coverage instrumentation must not activate real backends. If a test requires `OMEGA_ENV=test` to mock external dependencies, the coverage run must use the same environment variable. Coverage isolation is a subset of test isolation, not a separate concern.
- L1: During T3-1 implementation, the SessionLifecycleManager was built to orchestrate the full session lifecycle (Active→Archived→External→Deleted). The key insight was that the recall_from_external method was missing — the 90-day archival policy was write-only with no retrieval path. This was a D189 integration-seam gap. The lifecycle wraps existing archive_old_sessions() and move_to_external_storage() methods with a unified state machine, adds recall capability, and integrates into Oracle.bootstrap().
- L2: Write-only archival policies are sovereignty violations — data that cannot be recalled is effectively deleted. The lifecycle manager must provide bidirectional transitions (archive→recall) not just one-way progression. The existing MemoryStore already had the primitives (archive_session, move_to_external), but they were disconnected — no state machine unified them.
- L3: The Principle of Lifecycle Bidirectionality — A lifecycle system that only progresses forward (archive→delete) without the ability to reverse (recall) is a one-way valve that violates data sovereignty. Every lifecycle transition must have a corresponding reverse transition, or the system must explicitly document why reversal is impossible.
