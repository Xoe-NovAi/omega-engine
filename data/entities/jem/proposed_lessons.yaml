- L3: The Principle of Interface-Then-Document — Specify the API contract before writing documentation. The interface spec is the single source of truth that both implementer and documenter reference independently. Documentation written against a stable interface spec is accurate on first write; documentation written against an in-progress implementation drifts immediately.
- L1: Jem audited the documentation landscape and found three separate documents claiming to be the Single Source of Truth (OMEGA_ENGINE.md, ORACLE_STACK.md, and MASTER_DOCUMENT_SSOT.md). These documents overlapped in their claims, drifted in their content (one was 3 weeks stale), and created confusion for agents. Jem consolidated them by designating OMEGA_ENGINE.md as the sole System State SSOT, rebranding ORACLE_STACK.md as the Architecture Guide, and archiving the stale index.
