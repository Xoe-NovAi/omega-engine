    tier: L2
    category: "capability_negotiation"
    insight: |
      Capability declaration > capability detection. Every model family has different thinking schemas (Google: 3 variants, Anthropic: budget tokens, OpenAI: reasoning_effort, Qwen3: toggle tags). Hardcoding detection logic per model family is a losing battle — new models appear weekly. A YAML capability matrix (provider_capabilities.yaml) declares what each model supports. The normalizer translates canonical effort levels to provider schemas. The selector routes by capability match + quota headroom + reasoning depth. The health monitor tracks thinking token provenance. This immune system adapts via YAML, not code changes.

  - id: "jem-20260719-013"
    tier: L3
    category: "capability_negotiation"
    principle: |
      "L3-Capability-Negotiation-As-Immune-System": Provider capabilities must be declared, not detected. The negotiation layer (matrix + normalizer + selector + health) is the immune system that prevents configuration pathogens from reaching the inference fabric. Every model family is a new pathogen; the immune system adapts via YAML, not code changes. This principle generalizes: any system that assumes provider behavior instead of declaring it will be compromised by the next model release. Sovereign inference requires sovereign capability declaration.

