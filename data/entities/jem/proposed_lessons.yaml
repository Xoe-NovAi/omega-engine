- id: JEM-SEAM-001
  node: JEM-SEAM-ADJUDICATION
  date: '2026-09-28'
  level: L3
  tags:
  - SEAM-ROT
  - M13
  - M23
  - GATE-DESIGN
  confidence: 0.95
  narrative: "During the Hivemind 15-to-4 tool consolidation, state.py dropped the _extended_sessions symbol while server.py still imported it. The daemon crash-looped on boot. Simultaneously make temple-grade reported 53/53 PASS. The defect is not in either module - it is a gate-design failure. A green suite asserts only that every symbol the suite touches resolves; it is silent about symbols the suite never touches. The seam between 'consolidation changed a module' and 'the entry point still boots' was owned by no gate."
  insight: "Three mechanisms compound: (1) refactor-by-pruning treats a module-local edit as local when its blast radius is global and nothing in the diff announces dangling call sites; (2) static analysis is anchored to the import graph reachable FROM TESTS, never to process entry points; (3) the test count was read as 'the system works' when it only ever meant 'the things the tests exercise work'. The pass/fail disagreement IS the finding - a suite can be maximally green while the daemon it describes is dead. Critically, this is the deepest instance of the documented-vs-active gap (JEM-12STEP-005) - one where the DETECTOR is the gap."
  principle: "A test suite is evidence about its own reach, never evidence about the system's entry points. Import-graph reachability must be a separately declared gate property, because the two sets are disjoint by construction - and disjointness is precisely why a green suite can coexist with a dead daemon."

- id: JEM-SEAM-002
  node: JEM-SEAM-ADJUDICATION
  date: '2026-09-28'
  level: L3
  tags:
  - SEAM-ROT
  - ENTRY-POINT-GATE
  - M13
  - BOOT-TEST
  confidence: 0.92
  narrative: "Directly consequent to JEM-SEAM-001. The server.py defect demonstrates that no gate in the fleet imports a process entry point. tests/test_m34_atomic.py exercises the registry module in isolation; no test boots the ASGI daemon. The 53/53 signal is therefore a known-untrustworthy indicator for this defect class, and any future report citing 'temple-grade 53/53' as evidence of runtime health is citing a metric already demonstrated blind to a live crash loop."
  insight: "The remedy is a specific, checkable gate property: every process entry point must be executed or imported by at least one test. The distinction that matters is BOOT versus REFERENCE - a symbol can be type-checked, linted, imported by a test helper, and named in documentation while remaining never-booted. Only execution of the entry path proves the import graph closes. A one-line import smoke probe (python -c 'import server') would have converted a crash loop into a red gate at negligible cost."
  principle: "Every process entry point must be booted - executed or imported - by at least one test. Referenced, type-checked, and linted are not substitutes for booted. A gate suite that does not boot its own entry points is measuring the test suite, not the system."

