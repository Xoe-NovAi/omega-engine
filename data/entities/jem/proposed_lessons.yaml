  narrative: "OpenCode builds its model catalog from Models.dev plus provider integrations plus local config, and documents that only enabled models whose provider is available appear in the picker; when a configured default's provider is unavailable, session execution silently falls back to the newest available supported model. Config merges non-destructively across the user config dir, project root, .opencode/, and OPENCODE_CONFIG_CONTENT, with .opencode/ applied last."
  insight: "Availability is a runtime property, not a config constant, which makes hardcoded model IDs a silent-degradation vector rather than merely a maintenance burden: a renamed or retired catalog entry does not fail loudly, it falls back to a different model than the operator intended, and the operator sees plausible output from the wrong model. The portable doctrine is to declare intent - model default, provider options, whitelist/blacklist, small_model - and let the catalog resolve concrete IDs, using modelID to map a friendly key to a differing upstream ID rather than inventing synthetic provider entries. The merge semantics add a second trap: mixing direct and .opencode/ forms across one hierarchy is a precedence-bug generator."
  principle: "Model availability is a runtime catalog property, not a config constant. Declare intent and let the catalog resolve identifiers - never make a hardcoded model ID load-bearing, because a stale entry degrades silently into a different model rather than failing loudly. And never mix direct and .opencode/ config forms in one hierarchy without intending the precedence."


