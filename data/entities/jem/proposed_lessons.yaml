  confidence: 0.9
  narrative: "Audit of .opencode/plugins/ found 3 existing plugins (error-capture.ts, awareness.ts, silent-stall-sensor.ts) plus 1 named-but-absent (sovereign-compaction.ts). All 3 existing are 100 percent coupled to the @opencode-ai/plugin SDK, client.session.*, client.hivemind.*, and Bun.write. Portable core extracted: 0 of 3. The three that are coupled are precisely the ones that detect silent failure, capture crashes, preserve context, and auto-recover stalls."
