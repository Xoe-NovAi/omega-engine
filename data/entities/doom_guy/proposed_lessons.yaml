    \ per level. O(1) visibility at runtime."
  source: id-Tech-Architecture-Research
  timestamp: '2026-06-01'
- lesson: Network Delta Compression (Q3) Is the Model for Minimal Data Transfer
  context: Quake 3 sends only changed fields between snapshots. Same algorithm handles
    full updates, partial updates, packet loss, and retransmission. No special cases.
    Omega's trace/observability system should use delta compression for entity state
    transfer.
  source: id-Tech-Architecture-Research
  timestamp: '2026-06-01'
