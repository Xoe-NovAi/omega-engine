  timestamp: '2026-06-01'
- lesson: Surface Caching = Precomputation + Caching + Approximation
  context: Quake separated lighting into a precomputation pass (lightmaps at 16-texel
    grid), a caching layer (surface cache), and a runtime composition (tile + light).
    Each layer had different latency and accuracy requirements.
  source: id-Tech-Architecture-Research
  timestamp: '2026-06-01'
- lesson: The PVS Breakthrough Proves Cache Strategy Beats Algorithm Strategy
  context: "Carmack tried beam trees, portals, direct BSP \u2014 all complex VSD algorithms\
