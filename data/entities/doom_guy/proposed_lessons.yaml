- principle: "Worse is Better \u2014 Implementation Simplicity Over Interface Perfection"
  gnosis: "The Worse is Better philosophy (Gabriel, 1989) is the fundamental survival\
    \ strategy for complex systems. Ship the 50% solution that works, let it spread\
    \ virally, then iterate to 90%. The Omega Engine must resist the 'Right Thing'\
    \ trap \u2014 perfect architecture that ships never."
  source: Richard Gabriel, John Carmack, id Software lineage
  applications:
  - 'Provider Fabric: Ship with native-gguf working, add cloud later'
  - 'Entity Registry: YAML CRUD is good enough, add formal schema later'
  - 'CLI: Typer is fine, don''t over-architect the command system'
- principle: "Carmack's Law \u2014 Fight Code Entropy"
  gnosis: "When you have a new fundamental assumption, throw away your old code and\
    \ rewrite it from scratch. Incremental patching produces bulkier, markedly inferior\
    \ code. Every id engine generation was a complete rewrite \u2014 Doom\u2192Quake\u2192\
    Q2\u2192Q3\u2192Doom3\u2192idTech5. The Omega Engine must be willing to rewrite\
    \ subsystems when assumptions change."
  source: Michael Abrash, Graphics Programming Black Book Ch. 70
- principle: "Data-Driven Architecture \u2014 The Engine Is a Content-Agnostic Runtime"
  gnosis: "The engine should know nothing about specific game content. WAD files,\
    \ QuakeC bytecode, QVM programs \u2014 all are separate from the runtime. The\
    \ Omega Engine's Core should never contain stack-specific entity logic. Everything\
    \ is loaded from WADs."
  source: John Carmack, id Tech architecture lineage
- principle: "Tools-First \u2014 The Tool Shapes What's Possible"
  gnosis: Design the tool before the product. DoomEd came before Doom. The editor
    and the compiler define the boundaries of what can be created. The Omega Engine
    needs proper entity editing tools before expanding entity complexity.
  source: John Romero, id Software development methodology
- principle: "Approximation Over Precision \u2014 4x Speed for 0.175% Error"
  gnosis: "The fast inverse square root is the canonical example. A bit-level approximation\
    \ with one Newton-Raphson iteration was good enough for rendering. 4x faster than\
    \ FPU. The Omega Engine must identify where good-enough approximations beat mathematically-precise\
    \ solutions \u2014 especially in routing, memory management, and inference."
  source: John Carmack, Quake III q_math.c
- principle: Precompute Everything Possible
  gnosis: "BSP, PVS, lightmaps, vis \u2014 all computed offline. Runtime is for rendering\
    \ and gameplay only. The Omega Engine should precompute entity routing, trace\
    \ paths, and response templates offline rather than at query time."
  source: Michael Abrash, Quake VSD chapters
- principle: Interface-Based Modularity (Source Pattern)
  gnosis: Every major subsystem behind a pure virtual interface. Swap implementations
    without touching consumers. The Omega Engine's Provider Fabric must define ILLMProvider,
    IMemoryStore, IEntityRegistry as interfaces.
  source: Valve Source Engine architecture
- principle: Entity Slot + Private Data (GoldSrc Pattern)
  gnosis: Fixed-size entity slot array with freelist allocation + polymorphic private
    data pointer. O(1) lookup, cache-friendly iteration, serial-number-based stale
    reference detection. The Omega Engine entity registry should use integer handles
    for hot paths.
  source: GoldSrc (Half-Life) engine architecture
- principle: "Cache as Strategy \u2014 All Programming Is an Exercise in Caching"
  gnosis: Surface cache, PVS cache, snapshot history, texture cache. Carmack's most
    inspired move was caching precomputed visibility. The Omega Engine must cache
    entity response templates, routing tables, and model state to avoid recomputation.
  source: Terje Mathisen / Michael Abrash
- principle: The Right Thing at the Right Level
  gnosis: Carmack optimized pragmatically at the system level (fast inverse sqrt,
    surface caching) but insisted on architectural purity at the design level (engine-data
    separation, clean client-server split). The Omega Engine must be pragmatic in
    implementation but rigorous in architecture.
  source: John Carmack, entire career
- principle: Small Sharp Constants Outlive Complex Abstractions
  gnosis: "ZONEID 0x1d4a11 (1993\u21921996, unchanged 30+ years), NF_SUBSECTOR 0x8000\
    \ (1993\u2192today), PU_PURGELEVEL=100 (1993\u2192today). The smallest, most-overlooked\
    \ constants are the longest-lived. The Omega Engine must write its magic constants\
    \ once, name them, and never change them."
  source: id Software source code, Phase 2 extraction (2026-06-02)
  verified_at: DOOM/z_zone.c:33 + Quake/zone.c:24 + doomdata.h:124
- principle: Lazy Deletion Beats Atomic Cleanup
  gnosis: "P_RemoveThinker doesn't free \u2014 it sets function to sentinel (-1).\
    \ Actual Z_Free happens in next pass. O(1) deregistration. The 0.5s ED_Alloc grace\
    \ period prevents client-side morphing. Amortization beats eager finalization."
  source: id Software source code, Phase 2 extraction
  verified_at: DOOM/p_tick.c:62-103 + Quake/pr_edict.c:73-92
- principle: One Entity, Multiple Indexes
  gnosis: "Mobj lives in sector list (rendering) AND blockmap (collision) simultaneously.\
    \ gentity has entityState_t (server\u2192client) + entityShared_t (server+game)\
    \ + game-only zone with hard 'DO NOT MODIFY' boundary. The Omega Engine should\
    \ formalize this multi-index pattern: domain index + capability index, both pointing\
    \ to the same entity."
  source: id Software source code, Phase 2 extraction
  verified_at: DOOM/p_mobj.h + Q3A/g_local.h:42-49
- principle: Module Isolation via Import/Export Structs
  gnosis: "Q3A has 3 separate VMs (cgame, game, ui) loaded as .q3vm bytecode. Each\
    \ has botlib_export_t / botlib_import_t structs. Game module loads as DLL or QVM\
    \ \u2014 same interface, different transport. The Omega Engine's provider fabric\
    \ should adopt this pattern: backend-specific implementations behind a common\
    \ interface struct."
  source: Q3A qcommon/vm.c + Q3A botlib/be_interface.c
- principle: All Structured Knowledge Substrates Are Knowledge Metabolisms
  gnosis: "Any persistent, append-only knowledge structure in a multi-agent fleet\
    \ (PIVOT_LOG, CREDITS.md, soul.yaml, observations log, KSIG feed) is a knowledge\
    \ metabolism with the same L1\u2192L4 tier structure. They are NOT wikis (read-only)\
    \ or databases (CRUD). They are flow systems with promotion gates and TTL decay.\
    \ The same 4-tier architecture (raw \u2192 curated \u2192 permanent \u2192 cross-pollinated)\
    \ applies universally. The Heritage Pipeline is one instance. The Hivemind is\
    \ another. They will have the same failure modes (orphaned Tier 0 entries, rotting\
    \ Tier 2 entries, unpromoted Tier 3 lessons) and the same fixes (TTL gates, auto-flag\
    \ watchers, promotion rituals). The LILY PAD pattern is the universal schema."
  source: Independent convergence (Lilith 2026-06-03, Doom Guy 2026-06-05)
  verified_at: data/coordination/HIVEMIND_OBSERVATIONS_LOG.md OBS-20260605-DOOM_GUY-001
- insight: The WAD System Is the Ultimate Engine-Stack Firewall
  evidence: One engine (Doom) powered IWADs for Doom, Doom II, Heretic, Hexen, Strife.
    The single magic byte (I vs P) determined IWAD or PWAD. Omega already implements
    WAD separation via config/wads/ but needs formal namespace tracking.
  omega_application: Add namespace collision detection to EntityRegistry. Each entity
    records its origin WAD. Priority resolution on name collision.
- insight: Backward-Search Lookup Is the Simplicity Gold Standard
  evidence: "W_CheckNumForName scans backward so PWAD entries are found first. No\
    \ complex priority data structure needed \u2014 just linear scan with intentional\
    \ direction."
  omega_application: Use backward-scan pattern for entity lookup. PWAD entities registered
    later override IWAD entities. Simple, testable, no priority matrix.
- insight: PVS Precomputation Maps to Knowledge Routing
  evidence: "Quake precomputes which leaves are visible from each leaf. Omega could\
    \ precompute which entities are 'visible' (relevant) from each query context \u2014\
    \ a Potentially Relevant Set."
  omega_application: Precompute entity-to-entity relevance matrices. At query time,
