  source: Adjacent-Engine-Architecture-Research
  timestamp: '2026-06-01'
- lesson: Build Engine's Fixed-Size Array Architecture Proves Pre-allocation Wins
  context: "sector[1024], wall[8192], sprite[4096] \u2014 fixed arrays with integer\
