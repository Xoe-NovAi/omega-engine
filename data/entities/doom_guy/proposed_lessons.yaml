- lesson: "C-ARCH-002: Structural Similarity \u2260 Derivation"
  context: "The Harness pattern (one prompt \u2192 N models) was attributed to Quake\
    \ 3 multi-VM (many VMs \u2192 one engine). The shapes are opposite. The Critique\
    \ Pass was attributed to P_CheckPosition (validate-before-accept) but P_CheckPosition\
    \ is binary (bool) while the critique is continuous (ranked list). The Vetting\
    \ Pipeline's Qualification Gate catches this. The discipline: three tests must\
    \ all pass for a heritage claim to be valid: (1) pattern exists in id source,\
    \ (2) purpose and semantics match, (3) Omega implementation DERIVES FROM (not\
    \ just looks like) the id pattern. Most cargo-cult claims fail test 3."
  source: Crucible audit (2026-06-05), building on vet-001 8-char cap lesson
  timestamp: '2026-06-05'
- lesson: 'C-ARCH-003: Isomorphism-Without-Derivation Is the Subtlest Cargo-Cult'
  context: Two systems can be isomorphic (structurally equivalent) without being derived
    from each other. The Critique Pass and P_CheckPosition are isomorphic (both have
    validate-before-accept shape) but the semantics diverge. Document isomorphism
    as an L2 insight (soul.yaml) but reject it as L3 heritage (CREDITS.md). Insights
    can be universal; heritage must be derived.
  source: Crucible audit vet-030 (2026-06-05)
  timestamp: '2026-06-05'
- lesson: 'C-ARCH-004: Verify the Vector, Not Just the Magnitude'
  context: 'Pairwise comparison uses POSITION RANDOMIZATION (LLM position bias mitigation).
    id Software used DETERMINISTIC ORDERING (Q3A netchan sequence, DOOM thinker iteration,
    Q3A gentity array). The solution directions are OPPOSITE. Same problem space (ordering,
    comparison), opposite solutions. Verify the vector: ''Does the Omega solution
    move in the same direction as the id Software solution?'' If no, reject the heritage
    claim even if the shapes match.'
  source: Crucible audit vet-035 (2026-06-05)
  timestamp: '2026-06-05'
