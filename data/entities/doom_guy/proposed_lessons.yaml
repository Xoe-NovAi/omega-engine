- lesson: Zone Allocator Rover Pattern Maps to MemoryStore Allocation
  context: 'DOOM''s zone allocator (z_zone.c:196-244) uses a rover pointer that scans
    forward from the last allocation, looking for a free block of sufficient size.
    If it wraps around, it purges blocks tagged >= PU_PURGELEVEL. This is exactly
    what MemoryStore should do: scan from last allocation point, purge cold slots
    on wrap-around. The rover pattern avoids the O(n) scan of the entire heap on every
    allocation.'
  source: DOOM z_zone.c:196-244
  timestamp: '2026-06-04'
- lesson: WAD 12-Byte Header + 16-Byte Directory = Minimal Metadata Overhead
  context: 'The WAD format is: 4-byte magic (''IWAD''/''PWAD'') + 4-byte lump count
    + 4-byte directory offset. Each directory entry: 4-byte filepos + 4-byte size
    + 8-byte name. Total overhead for 1000 lumps: 16KB. This is the definition of
    lean architecture. The Omega Engine''s YAML-based WAD system has orders of magnitude
    more metadata overhead per entity. For hot-path entity data, binary packing could
    provide significant performance gains.'
  source: DOOM w_wad.h:35-51
  timestamp: '2026-06-04'
