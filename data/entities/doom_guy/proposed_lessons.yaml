# 🔱 Omega Engine — Proposed Lessons
# Auto-generated during Soul v6.1 migration

- lesson: The WAD Binary Format Is an Architectural Template
  context: 12-byte header + 16-byte directory entries + lump data. IWAD vs PWAD distinguished
    by single magic byte. The Omega Engine's config/wads/ directory structure mirrors
    this pattern but could benefit from binary packing for performance-critical entity
    data.
  source: id-Tech-Architecture-Research
  timestamp: '2026-06-01'
- lesson: Romero's 10 Programming Principles Are an Operating System for Small Teams
  context: No prototypes. Shippable code always. Fix bugs immediately. Great tools.
    Code for this game only. These principles enabled 13 games in year one with 4
    people.
  source: id-Software-Philosophy-Research
  timestamp: '2026-06-01'
- lesson: The 'It Just Works' Philosophy Means Knowing What Not to Do
  context: 'Carmack''s focus philosophy: ''Focus is a matter of deciding what things
    you''re not going to do.'' The Omega Engine must ruthlessly cut features that
    don''t serve the core mission: sovereign local-first AI.'
  source: id-Software-Philosophy-Research
  timestamp: '2026-06-01'
- lesson: GoldSrc's DLL Function Table Is the Pattern for Provider Fabric
