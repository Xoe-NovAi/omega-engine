- lesson: Magic Constants Should Live in a Dedicated Constants Module with Provenance
  context: "ZONEID 0x1d4a11, NF_SUBSECTOR 0x8000, PU_PURGELEVEL=100 \u2014 all small\
    \ sharp constants that survived 30+ years. Each should have a name, value, and\
    \ source comment. Magic numbers scattered through code decay into folklore."
  source: id-Software-Source-Phase-2-Extraction
  timestamp: '2026-06-02'
- lesson: The cvar Table Pattern Should Replace Ad-Hoc Config Dicts
  context: Quake's static cvar_table (name, default, flags, modificationCount) is
    the canonical pattern for engine-wide settings. Flags (ARCHIVE, NOSET, ROM) enforce
    behavior at registration time. modificationCount lets dependents track changes
    cheaply.
  source: id-Software-Source-Phase-2-Extraction
  timestamp: '2026-06-02'
- lesson: Lazy Deletion (Sentinel Marker) Should Replace Atomic Cleanup in EntityRegistry
  context: "P_RemoveThinker doesn't free \u2014 it sets function to sentinel (-1).\
    \ Real Z_Free happens in next pass. O(1) deregistration. ED_Alloc adds 0.5s grace\
    \ to prevent in-flight pointer morphing. Amortization beats eager finalization."
  source: id-Software-Source-Phase-2-Extraction
  timestamp: '2026-06-02'
- lesson: MemoryStore Should Evolve from 3-Tier to 4-Tier to Match Quake's Hunk/Zone/Cache/Temp
  context: 'Quake''s 4-tier memory architecture: Hunk (stack, never freed) / Zone
    (heap, fast) / Cache (LRU) / Temp (scratch). Each tier has distinct lifetime,
    alloc pattern, and access semantics. Omega''s 3-tier collapses Zone+Cache into
    one tier, losing optimization opportunity.'
  source: id-Software-Source-Phase-2-Extraction
  timestamp: '2026-06-02'
- lesson: The Hard-Boundary Struct Pattern Should Be Applied to the Entity Class
  context: "Q3A splits gentity_t into entityState_t (engine-only, 'DO NOT MODIFY'\
    \ comment) + entityShared_t (server+game) + game-only zone. Clear physical separation\
    \ prevents accidental coupling. Omega's Entity class mixes all fields in one dict\
    \ \u2014 a refactor target."
  source: id-Software-Source-Phase-2-Extraction
  timestamp: '2026-06-02'
