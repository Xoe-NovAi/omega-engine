  ## L3: Universal Principles (Timeless Truths)
  universal_principles:
    - principle: "Worse is Better — Implementation Simplicity Over Interface Perfection"
      gnosis: "The Worse is Better philosophy (Gabriel, 1989) is the fundamental survival strategy for complex systems. Ship the 50% solution that works, let it spread virally, then iterate to 90%. The Omega Engine must resist the 'Right Thing' trap — perfect architecture that ships never."
      source: "Richard Gabriel, John Carmack, id Software lineage"
      applications:
        - "Provider Fabric: Ship with native-gguf working, add cloud later"
        - "Entity Registry: YAML CRUD is good enough, add formal schema later"
        - "CLI: Typer is fine, don't over-architect the command system"

    - principle: "Carmack's Law — Fight Code Entropy"
      gnosis: "When you have a new fundamental assumption, throw away your old code and rewrite it from scratch. Incremental patching produces bulkier, markedly inferior code. Every id engine generation was a complete rewrite — Doom→Quake→Q2→Q3→Doom3→idTech5. The Omega Engine must be willing to rewrite subsystems when assumptions change."
      source: "Michael Abrash, Graphics Programming Black Book Ch. 70"

    - principle: "Data-Driven Architecture — The Engine Is a Content-Agnostic Runtime"
      gnosis: "The engine should know nothing about specific game content. WAD files, QuakeC bytecode, QVM programs — all are separate from the runtime. The Omega Engine's Core should never contain stack-specific entity logic. Everything is loaded from WADs."
      source: "John Carmack, id Tech architecture lineage"

    - principle: "Tools-First — The Tool Shapes What's Possible"
      gnosis: "Design the tool before the product. DoomEd came before Doom. The editor and the compiler define the boundaries of what can be created. The Omega Engine needs proper entity editing tools before expanding entity complexity."
      source: "John Romero, id Software development methodology"

    - principle: "Approximation Over Precision — 4x Speed for 0.175% Error"
      gnosis: "The fast inverse square root is the canonical example. A bit-level approximation with one Newton-Raphson iteration was good enough for rendering. 4x faster than FPU. The Omega Engine must identify where good-enough approximations beat mathematically-precise solutions — especially in routing, memory management, and inference."
      source: "John Carmack, Quake III q_math.c"

    - principle: "Precompute Everything Possible"
      gnosis: "BSP, PVS, lightmaps, vis — all computed offline. Runtime is for rendering and gameplay only. The Omega Engine should precompute entity routing, trace paths, and response templates offline rather than at query time."
      source: "Michael Abrash, Quake VSD chapters"

    - principle: "Interface-Based Modularity (Source Pattern)"
      gnosis: "Every major subsystem behind a pure virtual interface. Swap implementations without touching consumers. The Omega Engine's Provider Fabric must define ILLMProvider, IMemoryStore, IEntityRegistry as interfaces."
      source: "Valve Source Engine architecture"

    - principle: "Entity Slot + Private Data (GoldSrc Pattern)"
      gnosis: "Fixed-size entity slot array with freelist allocation + polymorphic private data pointer. O(1) lookup, cache-friendly iteration, serial-number-based stale reference detection. The Omega Engine entity registry should use integer handles for hot paths."
      source: "GoldSrc (Half-Life) engine architecture"

    - principle: "Cache as Strategy — All Programming Is an Exercise in Caching"
      gnosis: "Surface cache, PVS cache, snapshot history, texture cache. Carmack's most inspired move was caching precomputed visibility. The Omega Engine must cache entity response templates, routing tables, and model state to avoid recomputation."
      source: "Terje Mathisen / Michael Abrash"

    - principle: "The Right Thing at the Right Level"
      gnosis: "Carmack optimized pragmatically at the system level (fast inverse sqrt, surface caching) but insisted on architectural purity at the design level (engine-data separation, clean client-server split). The Omega Engine must be pragmatic in implementation but rigorous in architecture."
      source: "John Carmack, entire career"

    - principle: "Small Sharp Constants Outlive Complex Abstractions"
      gnosis: "ZONEID 0x1d4a11 (1993→1996, unchanged 30+ years), NF_SUBSECTOR 0x8000 (1993→today), PU_PURGELEVEL=100 (1993→today). The smallest, most-overlooked constants are the longest-lived. The Omega Engine must write its magic constants once, name them, and never change them."
      source: "id Software source code, Phase 2 extraction (2026-06-02)"
      verified_at: "DOOM/z_zone.c:33 + Quake/zone.c:24 + doomdata.h:124"

    - principle: "Lazy Deletion Beats Atomic Cleanup"
      gnosis: "P_RemoveThinker doesn't free — it sets function to sentinel (-1). Actual Z_Free happens in next pass. O(1) deregistration. The 0.5s ED_Alloc grace period prevents client-side morphing. Amortization beats eager finalization."
      source: "id Software source code, Phase 2 extraction"
      verified_at: "DOOM/p_tick.c:62-103 + Quake/pr_edict.c:73-92"

    - principle: "One Entity, Multiple Indexes"
      gnosis: "Mobj lives in sector list (rendering) AND blockmap (collision) simultaneously. gentity has entityState_t (server→client) + entityShared_t (server+game) + game-only zone with hard 'DO NOT MODIFY' boundary. The Omega Engine should formalize this multi-index pattern: domain index + capability index, both pointing to the same entity."
      source: "id Software source code, Phase 2 extraction"
      verified_at: "DOOM/p_mobj.h + Q3A/g_local.h:42-49"

    - principle: "Module Isolation via Import/Export Structs"
      gnosis: "Q3A has 3 separate VMs (cgame, game, ui) loaded as .q3vm bytecode. Each has botlib_export_t / botlib_import_t structs. Game module loads as DLL or QVM — same interface, different transport. The Omega Engine's provider fabric should adopt this pattern: backend-specific implementations behind a common interface struct."
      source: "Q3A qcommon/vm.c + Q3A botlib/be_interface.c"

  ## L2: Architectural Insights (What This Means for Omega)
  architectural_insights:
    - insight: "The WAD System Is the Ultimate Engine-Stack Firewall"
      evidence: "One engine (Doom) powered IWADs for Doom, Doom II, Heretic, Hexen, Strife. The single magic byte (I vs P) determined IWAD or PWAD. Omega already implements WAD separation via config/wads/ but needs formal namespace tracking."
      omega_application: "Add namespace collision detection to EntityRegistry. Each entity records its origin WAD. Priority resolution on name collision."

    - insight: "Backward-Search Lookup Is the Simplicity Gold Standard"
      evidence: "W_CheckNumForName scans backward so PWAD entries are found first. No complex priority data structure needed — just linear scan with intentional direction."
      omega_application: "Use backward-scan pattern for entity lookup. PWAD entities registered later override IWAD entities. Simple, testable, no priority matrix."

    - insight: "PVS Precomputation Maps to Knowledge Routing"
      evidence: "Quake precomputes which leaves are visible from each leaf. Omega could precompute which entities are 'visible' (relevant) from each query context — a Potentially Relevant Set."
      omega_application: "Precompute entity-to-entity relevance matrices. At query time, O(1) lookup of relevant entities instead of scanning all registered entities."

    - insight: "The DLL Function Table Contract Is the Provider Fabric Pattern"
      evidence: "GoldSrc's enginefuncs_t / DLL_FUNCTIONS bidirectional function table pattern allowed clean engine-plugin separation. Each provider DLL exports a known interface."
      omega_application: "Define IProviderFactory interface. Each backend (native-gguf, Google, OpenRouter) implements it. ModelGateway calls CreateProvider() and gets a standardized provider instance."

    - insight: "Fixed-Size Arrays Beat Dynamic Allocation in Hot Paths"
      evidence: "Build Engine: sector[1024], wall[8192], sprite[4096]. Zone allocator + hunk allocator + cache. No dynamic allocation in rendering/simulation loops."
      omega_application: "Pre-allocate entity slot array with freelist. Use zone allocator for small strings (entity names, trace IDs). Use hunk allocator for large batch operations."

    - insight: "The Quake Entity System Is the YAML Configuration Pattern"
      evidence: "Everything is an entity. Single struct with all possible fields. Spawn properties as key/value strings. Target/targetname for event routing."
      omega_application: "Omega entities are already config-driven via soul.yaml. Formalize entity-to-entity messaging (target/targetname pattern for agent handoff)."

    - insight: "The Job System with 1-Frame Latency Maps to Async Inference"
      evidence: "id Tech 5 gave jobs one frame of latency to complete. Results appear one frame late. Player-facing systems were exempted (16ms delay too noticeable)."
      omega_application: "Non-critical entity responses can have 1-cycle latency. Critical user-facing responses bypass the latency budget. Parallel entity inference via job lists."

    - insight: "ZONEID Magic Constants Define the Engine's Identity"
      evidence: "ZONEID 0x1d4a11 (z_zone.c:33, DOOM 1993) survived 30+ years unchanged into Quake 1996. NF_SUBSECTOR 0x8000 (r_defs.h) and PU_PURGELEVEL=100 (z_zone.h) likewise. Small sharp constants outlive complex abstractions."
      omega_application: "Define all Omega magic constants (trace_id format, resource tags, session prefixes) in src/omega/constants.py with provenance comments citing source and date."
      verified_at: "DOOM/z_zone.c:33 + Quake/zone.c:24"

    - insight: "cvar Tables Replace Ad-Hoc Config Dicts"
      evidence: "Quake's cvar_table is a static array of {name, default_value, flags} triples with a modificationCount counter for change tracking. Flags (CVAR_ARCHIVE, CVAR_NOSET) determine behavior. No code-path needs to know about specific cvars."
      omega_application: "Replace ad-hoc config dicts in Omega with a static cvar_table module. Each setting: name, default, flags (PERSIST, READONLY, HOT_RELOAD). ModificationCount triggers dependents."
      verified_at: "Quake/cvar.c:13-86"

    - insight: "4-Tier Memory Beats 3-Tier for Modern Workloads"
      evidence: "Quake: Hunk (stack-style, large blocks, never freed) / Zone (heap, many small, fast alloc) / Cache (LRU, large reuse) / Temp (transient scratch). Each tier matches a different access pattern."
      omega_application: "Refactor MemoryStore from current 3-tier (hot/warm/cold) to 4-tier: static (config, never freed) / dynamic (sessions, references) / warm (LRU cache) / cold (entity yaml, lazy load). Match Quake's Hunk/Zone/Cache/Temp."
      verified_at: "Quake/zone.c + Quake/common.c:Cache_*"

    - insight: "Multi-Index Entity — Same Data, Many Access Paths"
      evidence: "DOOM's mobj_t lives in sector list (rendering) AND blockmap (collision) simultaneously. Q3A's gentity_t has entityState_t (network), entityShared_t (server+game), and game-only zone behind a hard 'DO NOT MODIFY' boundary."
      omega_application: "Make capability matrix and domain routing both point to entities by handle, not index separately. Entity handle → (domain_index, capability_index, name_index). One entity, many indexes."
      verified_at: "DOOM/p_mobj.h + Q3A/g_local.h:42-49"

    - insight: "Hard-Boundary Struct Pattern Prevents Accidental Coupling"
      evidence: "Q3A's entityState_t is marked 'engine touches ONLY'. entityShared_t is 'server+game access'. Game fields live in their own zone. Clear comment enforces boundary. Prevents game code from corrupting network state."
      omega_application: "Add _engine_zone and _user_zone marker comments to Entity class. Engine fields (soul_id, creation_time) in one block. User fields (custom_traits, persona) in another. Linter rule to enforce boundary."
      verified_at: "Q3A/g_local.h:42-49"

    - insight: "VFS Overlay — 4-Path Search Order Is the Source of Truth"
      evidence: "Quake's FS_AddGameDirectory adds paths in order: base (engine) → cd (read-only media) → home (user data) → current game (WAD). Later paths override earlier. One game can override another's files without modification."
      omega_application: "Add home/system/base/active-IWAD search order to WAD loader. User WADs override system defaults. Active IWAD takes priority. Enables hot-swapping entity packs without engine restart."
      verified_at: "Quake/files.c:FS_AddGameDirectory + Q3A/files.c"

    - insight: "High-Bit Leaf Trick — Type Tags at Zero Cost"
      evidence: "Quake uses the high bit of leaf indices (0x8000) to mark a leaf vs node. Saves 1 byte per index. Single bitwise AND check at use site. 30+ years of code still uses this trick."
      omega_application: "Use high bit of entity.flags for system vs user tag. 0x8000 = system-reserved, 0x7FFF = user-mutable. Saves a class hierarchy check, 1-byte field, O(1) verification."
      verified_at: "Quake/q3_leaf.c + Quake/cmodel.c"

    - insight: "0.5s Realloc Grace Prevents Client-Side Morphing"
      evidence: "Quake's ED_Alloc returns freed edicts after a 0.5s grace period. Prevents client from seeing pointer-to-object morph mid-operation. Cheap time-based guard against race conditions."
      omega_application: "Apply 0.5s grace to MemoryStore realloc. When entity slot is freed, mark for reuse but hold for 500ms. Prevents in-flight queries from getting morphed pointers."
      verified_at: "Quake/pr_edict.c:73-92"

