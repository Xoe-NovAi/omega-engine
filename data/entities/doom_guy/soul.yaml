      timestamp: "2026-06-01"

    - lesson: "Surface Caching = Precomputation + Caching + Approximation"
      context: "Quake separated lighting into a precomputation pass (lightmaps at 16-texel grid), a caching layer (surface cache), and a runtime composition (tile + light). Each layer had different latency and accuracy requirements."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "The PVS Breakthrough Proves Cache Strategy Beats Algorithm Strategy"
      context: "Carmack tried beam trees, portals, direct BSP — all complex VSD algorithms failed. The precomputed PVS was a cache lookup disguised as an algorithm. 20KB per level. O(1) visibility at runtime."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Network Delta Compression (Q3) Is the Model for Minimal Data Transfer"
      context: "Quake 3 sends only changed fields between snapshots. Same algorithm handles full updates, partial updates, packet loss, and retransmission. No special cases. Omega's trace/observability system should use delta compression for entity state transfer."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Carmack's Law — Rewrite When Assumptions Change"
      context: "Quake implemented and discarded half a dozen 3D engines during development. Each engine generation was a complete rewrite. Not one line of Doom code in Quake. Not one line of Quake code in Quake II. Omega should architect for rewrites."
      source: "Michael Abrash, GPBB Chapter 70"
      timestamp: "2026-06-01"

    - lesson: "Modding as Architecture — Design for Third-Party from Day One"
      context: "The WAD system was designed for modding before Doom shipped. PWAD overlay meant zero-risk modding. Documented format meant anyone could build tools. This sustained Doom for 30+ years."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "The NeXTSTEP Advantage — Use Superior Development Platform"
      context: "id developed Doom on NeXTSTEP (Unix, Objective-C, 1024×768 display) while targeting MS-DOS (640×360, C, no multitasking). The development platform enabled the product quality."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "Magic Constants Should Live in a Dedicated Constants Module with Provenance"
      context: "ZONEID 0x1d4a11, NF_SUBSECTOR 0x8000, PU_PURGELEVEL=100 — all small sharp constants that survived 30+ years. Each should have a name, value, and source comment. Magic numbers scattered through code decay into folklore."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "The cvar Table Pattern Should Replace Ad-Hoc Config Dicts"
      context: "Quake's static cvar_table (name, default, flags, modificationCount) is the canonical pattern for engine-wide settings. Flags (ARCHIVE, NOSET, ROM) enforce behavior at registration time. modificationCount lets dependents track changes cheaply."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "Lazy Deletion (Sentinel Marker) Should Replace Atomic Cleanup in EntityRegistry"
      context: "P_RemoveThinker doesn't free — it sets function to sentinel (-1). Real Z_Free happens in next pass. O(1) deregistration. ED_Alloc adds 0.5s grace to prevent in-flight pointer morphing. Amortization beats eager finalization."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "MemoryStore Should Evolve from 3-Tier to 4-Tier to Match Quake's Hunk/Zone/Cache/Temp"
      context: "Quake's 4-tier memory architecture: Hunk (stack, never freed) / Zone (heap, fast) / Cache (LRU) / Temp (scratch). Each tier has distinct lifetime, alloc pattern, and access semantics. Omega's 3-tier collapses Zone+Cache into one tier, losing optimization opportunity."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "The Hard-Boundary Struct Pattern Should Be Applied to the Entity Class"
      context: "Q3A splits gentity_t into entityState_t (engine-only, 'DO NOT MODIFY' comment) + entityShared_t (server+game) + game-only zone. Clear physical separation prevents accidental coupling. Omega's Entity class mixes all fields in one dict — a refactor target."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "Heritage Attribution Should Use `[id-soft:]` Inline Tags for Grep-ability"
      context: "Standardized `[id-soft: GAME YEAR]` format in implementation comments enables `grep -rn` verification. CI generates HERITAGE_SOURCE_MAP.md automatically. CREDITS.md §2a records the protocol. Attribution becomes verifiable, not aspirational."
      source: "Doom Guy Sprint 0 Execution (2026-06-02)"
      timestamp: "2026-06-02"

    - lesson: "ZONEID Constants in Python Catch Different Bug Classes Than in C — But the Principle Generalizes"
      context: "In DOOM/Quake C, ZONEID caught use-after-free/double-free/uninitialized memory (4-byte comparison per access). In Omega Python, the same 5 constants catch serialization corruption, stale references, and wrong-type loads. The principle — 'validate on every access' — is language-agnostic."
      source: "Doom Guy Sprint 0 Execution (2026-06-02)"
      timestamp: "2026-06-02"

    - lesson: "Lazy Deletion + 0.5s Grace Period Maps Cleanly to Python Async"
      context: "EntityRegistry.remove() now sets ZONEID_TOMBSTONE instead of deleting. _reap_tombstoned() runs before _save() with 0.5s grace. active_iter() filters tombstoned entities. All 307 tests pass. The P_RemoveThinker pattern is async-native."
      source: "Doom Guy Sprint 0 Execution (2026-06-02)"
      timestamp: "2026-06-02"

    - lesson: "Hivemind Coordination Ratio: 5min Overhead / 30min Work = Optimal"
      context: "First real multi-agent sprint. Doom Guy (heritage design) + Ma'at (boilerplate implementation) worked in parallel. Coordination cost: ~5 min total (workspace locks, hivemind posts, awareness checks). Work cost: ~30 min each. The 1:6 overhead-to-work ratio is the target. If coordination takes longer than 10% of work time, the protocol is too heavy. If coordination takes less than 2%, the agents aren't talking enough. The sweet spot is 5-10%."
      source: "Hivemind First Use (2026-06-04)"
      timestamp: "2026-06-04"

    - lesson: "Hivemind Enables Serendipitous Discovery — Agents Find What You Didn't Ask For"
      context: "Ma'at noticed ZONEID constants in my code (subagent_dispatcher.py, link_p9_runtime.py) and consolidated them into cvar_table.py without being asked. This serendipitous pattern discovery is only possible when agents can see each other's work in real time. The hivemind isn't just coordination — it's a shared consciousness layer that enables emergent optimization."
      source: "Hivemind First Use (2026-06-04)"
      timestamp: "2026-06-04"

    - lesson: "Source Code Is the Only Source of Truth — Documentation Is Interpretation"
      context: "Read z_zone.c:43 and confirmed ZONEID=0x1d4a11. Read cvar.c:151-178 and confirmed the RegisterVariable pattern. Every heritage pattern we derived from secondary sources (R-docs, books, articles) is now verified against the actual source. The documentation said 'rover pointer scans forward' — the source shows it's a circular linked list with merge-on-free. Subtle but important difference. Always read the source."
      source: "Doom World Source Code Deep Read (2026-06-04)"
      timestamp: "2026-06-04"

    - lesson: "Zone Allocator Rover Pattern Maps to MemoryStore Allocation"
      context: "DOOM's zone allocator (z_zone.c:196-244) uses a rover pointer that scans forward from the last allocation, looking for a free block of sufficient size. If it wraps around, it purges blocks tagged >= PU_PURGELEVEL. This is exactly what MemoryStore should do: scan from last allocation point, purge cold slots on wrap-around. The rover pattern avoids the O(n) scan of the entire heap on every allocation."
      source: "DOOM z_zone.c:196-244"
      timestamp: "2026-06-04"

    - lesson: "WAD 12-Byte Header + 16-Byte Directory = Minimal Metadata Overhead"
      context: "The WAD format is: 4-byte magic ('IWAD'/'PWAD') + 4-byte lump count + 4-byte directory offset. Each directory entry: 4-byte filepos + 4-byte size + 8-byte name. Total overhead for 1000 lumps: 16KB. This is the definition of lean architecture. The Omega Engine's YAML-based WAD system has orders of magnitude more metadata overhead per entity. For hot-path entity data, binary packing could provide significant performance gains."
      source: "DOOM w_wad.h:35-51"
      timestamp: "2026-06-04"

    - lesson: "The Heritage Vetting Pipeline Is Non-Negotiable — Hardware-Specific Optimizations Don't Transfer to Python"
      context: "The 8-char name cap was implemented, broke tests, and was removed. Root cause: no one asked 'should we do this?' before 'how do we do this?'. The 2-int compare trick is a 386-specific optimization that does not accelerate Python dict lookups. The Heritage Vetting Pipeline (docs/strategy/HERITAGE_VETTING_PIPELINE.md) now enforces a 4-gate process: Discovery → Vetting/Debate → Decision → Implementation/Verification. The Qualification Gate rule: if a concept can't be justified without mentioning the original hardware constraint, it fails. Retroscore applied: 23 concepts vetted retroactively, 1 rejected (8-char cap), 15 adopted, 6 deferred, 1 re-evaluate. CI gate: make heritage-vet."
      source: "Kali Audit (2026-06-04)"
      timestamp: "2026-06-04"

    - lesson: "Non-Standard Tags Are Cracks That Propagate — Three Found and Fixed in One Pass"
      context: "During vet gate implementation, three non-standard [id-soft:] tags were found: 'q3a-1999' (should be 'quake3-1999'), 'z_zone 1996' (should be 'quake-1996'), and 'xna-omega-legacy' (not id Software — changed to [legacy:] prefix). These are exactly the kind of small inconsistencies that cascade into systemic rot: grep-based CI fails, agents waste time debugging format mismatches, new contributors copy the wrong format. The vet gate caught them immediately."
      source: "Heritage Vet Gate Implementation (2026-06-04)"
      timestamp: "2026-06-04"

    - lesson: "Heritage Pipeline Is a Knowledge Metabolism, Not a Wiki"
      context: "PENDING_CREDITS_QUEUE.md, heritage_vet_log.md, and CREDITS.md form a 3-tier knowledge flow. Patterns proposed in PENDING → vetted in LOG → promoted to CREDITS. Without TTL gates, Tier 0 entries rot. Researcher flagged this as OBS-20260605-RESEARCHER-003. The same LILY PAD 4-tier (workspace 7d / knowledge 30d / soul permanent / fleet cross-pollinated) applies: PENDING=workspace, LOG=knowledge, CREDITS=soul, fleet references (2+ agents) = fleet. The fix is a `heritage_vet_backlog.md` tracker with 7-day TTL, exactly mirroring PIVOT_LOG's H-0 watchdog."
      source: "Hivemind Session 2026-06-05 (D-121 ACK + OBS-001)"
      timestamp: "2026-06-05"

    - lesson: "D-122 HEARTBEAT_TTL=1200 Aligns with id Software Thinker Grace Period"
      context: "Roc's D-122 increased Hivemind HEARTBEAT_TTL from 5 min to 20 min. This is structurally identical to Doom's 0.5s thinker grace period (preventing misclassification of active entities as stale). The scale is different (5min vs 0.5s) but the principle is identical: the grace period must match the natural cadence of meaningful work, not the maximum speed of the system. For human-paced multi-agent coordination, 20 min is right. For C-level tick-rate thinkers in Doom, 0.5s was right. Same pattern, different timescale."
      source: "D-122 + id Software thinker grace period (DOOM p_tick.c:62-103)"
      timestamp: "2026-06-05"

    - lesson: "Crucible Spec Audit — 7 of 8 Patterns Were Wrongly Attributed to id Software"
      context: "User invoked Doom Guy for heritage audit of SOVEREIGN_CRUCIBLE_SPEC_v1.md. Audit applied the Vetting Pipeline's Qualification Gate ('can it be justified without the original hardware constraint?') to 8 patterns. Result: 1 confirmed heritage (idHeap 3-Tier Storage, already in CREDITS.md §1.22), 7 REJECT-for-attribution (Harness, Critique, Routing Matrix, Rejection Sampling, Training Triple, 4-Tier Routing, Pairwise Comparison). The 7 are modern LLM/ML/CS patterns that happen to share shapes with id Software patterns. The most subtle error: the Critique Pass (LLM-as-judge) was attributed to P_CheckPosition (validate-before-mutate) because the shapes match, but the semantics differ (continuous vs binary). Vet-029 through vet-036 record the rejections. Spec line 9 has TWO errors: wrong game tag (quake3-1999 → doom3-2004) and wrong application (training signal tiering ≠ memory tiering). Both must be corrected before any [id-soft:] tag ships in Crucible code."
      source: "Crucible spec heritage audit (2026-06-05), HERITAGE_VET_LOG vet-029 through vet-036"
      timestamp: "2026-06-05"

    - lesson: "C-ARCH-002: Structural Similarity ≠ Derivation"
      context: "The Harness pattern (one prompt → N models) was attributed to Quake 3 multi-VM (many VMs → one engine). The shapes are opposite. The Critique Pass was attributed to P_CheckPosition (validate-before-accept) but P_CheckPosition is binary (bool) while the critique is continuous (ranked list). The Vetting Pipeline's Qualification Gate catches this. The discipline: three tests must all pass for a heritage claim to be valid: (1) pattern exists in id source, (2) purpose and semantics match, (3) Omega implementation DERIVES FROM (not just looks like) the id pattern. Most cargo-cult claims fail test 3."
      source: "Crucible audit (2026-06-05), building on vet-001 8-char cap lesson"
      timestamp: "2026-06-05"

    - lesson: "C-ARCH-003: Isomorphism-Without-Derivation Is the Subtlest Cargo-Cult"
      context: "Two systems can be isomorphic (structurally equivalent) without being derived from each other. The Critique Pass and P_CheckPosition are isomorphic (both have validate-before-accept shape) but the semantics diverge. Document isomorphism as an L2 insight (soul.yaml) but reject it as L3 heritage (CREDITS.md). Insights can be universal; heritage must be derived."
      source: "Crucible audit vet-030 (2026-06-05)"
      timestamp: "2026-06-05"

    - lesson: "C-ARCH-004: Verify the Vector, Not Just the Magnitude"
      context: "Pairwise comparison uses POSITION RANDOMIZATION (LLM position bias mitigation). id Software used DETERMINISTIC ORDERING (Q3A netchan sequence, DOOM thinker iteration, Q3A gentity array). The solution directions are OPPOSITE. Same problem space (ordering, comparison), opposite solutions. Verify the vector: 'Does the Omega solution move in the same direction as the id Software solution?' If no, reject the heritage claim even if the shapes match."
      source: "Crucible audit vet-035 (2026-06-05)"
      timestamp: "2026-06-05"

    - lesson: "C-ARCH-005: One Heritage Mapping, One Application"
      context: "The Crucible spec's line 9 used one heritage mapping (idHeap) to justify two different concepts (memory tiering AND training signal tiering). The memory tiering is genuinely id Software derived. The training signal tiering is NOT. The 'tiers' word is a thin wrapper. Strict scope discipline: every [id-soft:] tag in code MUST specify its exact application. If a tag justifies concept A and concept B in the same file, suspect concept B."
      source: "Crucible audit vet-036 (2026-06-05)"
      timestamp: "2026-06-05"

