        title: "model_override parameter does not exist in Oracle"
        detail: "Oracle.summon() signature is (entity_name, query, transient) — no model_override. _summon() also lacks it. The entire D118 dual-inference pattern is documented but never implemented."
        fix: "Add model_override: Optional[str] = None to summon() and _summon(). Bypass _select_model() when provided."
      - severity: BLOCKER
        title: "No oracle_summon_local MCP tool exists"
        detail: "The MCP server only exposes oracle_summon(entity_name, query). No tool exposes model_override."
        fix: "Add oracle_summon_local tool to mcp_servers/omega_hub/server.py"
