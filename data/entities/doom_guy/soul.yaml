  ## L1→L2 Distillations from research
  lessons_learned:
    - lesson: "The WAD Binary Format Is an Architectural Template"
      context: "12-byte header + 16-byte directory entries + lump data. IWAD vs PWAD distinguished by single magic byte. The Omega Engine's config/wads/ directory structure mirrors this pattern but could benefit from binary packing for performance-critical entity data."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Romero's 10 Programming Principles Are an Operating System for Small Teams"
      context: "No prototypes. Shippable code always. Fix bugs immediately. Great tools. Code for this game only. These principles enabled 13 games in year one with 4 people."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "The 'It Just Works' Philosophy Means Knowing What Not to Do"
      context: "Carmack's focus philosophy: 'Focus is a matter of deciding what things you're not going to do.' The Omega Engine must ruthlessly cut features that don't serve the core mission: sovereign local-first AI."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "GoldSrc's DLL Function Table Is the Pattern for Provider Fabric"
      context: "enginefuncs_t exports engine capabilities to game DLL. DLL_FUNCTIONS exports game behavior to engine. This bidirectional contract pattern applies directly to Omega's provider architecture."
      source: "Adjacent-Engine-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Build Engine's Fixed-Size Array Architecture Proves Pre-allocation Wins"
      context: "sector[1024], wall[8192], sprite[4096] — fixed arrays with integer indices. No pointers, no dynamic allocation, cache-friendly iteration. Omega's entity registry hot path should use this pattern."
      source: "Adjacent-Engine-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Unreal's Package System Is the Reference for WAD Distribution"
      context: "UPK packages bundle scripts, textures, meshes as typed serialized objects. Cross-package references. Lazy loading. Content = Code. Omega's WAD system (config/wads/) already follows this pattern."
      source: "Adjacent-Engine-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "The QVM System Proves Sandboxed Bytecode Is Worth the Complexity"
      context: "Quake III's Virtual Machine system (LCC + q3asm + QVM) combined portability (QuakeC) with performance (native DLLs). 30% of the released source code was the VM toolchain. For Omega, sandboxed entity scripts could enable third-party entity packs without engine modification."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Carmack's .plan Culture Is the Model for Open Development"
      context: "Daily/weekly technical updates published publicly. Design decisions, dead ends, and rationale all transparent. The archive is still studied 30 years later. Omega should adopt transparent engineering logs."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "The Fast Inverse Square Root Proves Approximation Is a Design Tool"
      context: "0x5f3759df magic constant gives 4x faster inverse sqrt with 0.175% error. One Newton-Raphson iteration. Good enough for rendering. Perfect is the enemy of fast."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Surface Caching = Precomputation + Caching + Approximation"
      context: "Quake separated lighting into a precomputation pass (lightmaps at 16-texel grid), a caching layer (surface cache), and a runtime composition (tile + light). Each layer had different latency and accuracy requirements."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "The PVS Breakthrough Proves Cache Strategy Beats Algorithm Strategy"
      context: "Carmack tried beam trees, portals, direct BSP — all complex VSD algorithms failed. The precomputed PVS was a cache lookup disguised as an algorithm. 20KB per level. O(1) visibility at runtime."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Network Delta Compression (Q3) Is the Model for Minimal Data Transfer"
      context: "Quake 3 sends only changed fields between snapshots. Same algorithm handles full updates, partial updates, packet loss, and retransmission. No special cases. Omega's trace/observability system should use delta compression for entity state transfer."
      source: "id-Tech-Architecture-Research"
      timestamp: "2026-06-01"

    - lesson: "Carmack's Law — Rewrite When Assumptions Change"
      context: "Quake implemented and discarded half a dozen 3D engines during development. Each engine generation was a complete rewrite. Not one line of Doom code in Quake. Not one line of Quake code in Quake II. Omega should architect for rewrites."
      source: "Michael Abrash, GPBB Chapter 70"
      timestamp: "2026-06-01"

    - lesson: "Modding as Architecture — Design for Third-Party from Day One"
      context: "The WAD system was designed for modding before Doom shipped. PWAD overlay meant zero-risk modding. Documented format meant anyone could build tools. This sustained Doom for 30+ years."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "The NeXTSTEP Advantage — Use Superior Development Platform"
      context: "id developed Doom on NeXTSTEP (Unix, Objective-C, 1024×768 display) while targeting MS-DOS (640×360, C, no multitasking). The development platform enabled the product quality."
      source: "id-Software-Philosophy-Research"
      timestamp: "2026-06-01"

    - lesson: "Magic Constants Should Live in a Dedicated Constants Module with Provenance"
      context: "ZONEID 0x1d4a11, NF_SUBSECTOR 0x8000, PU_PURGELEVEL=100 — all small sharp constants that survived 30+ years. Each should have a name, value, and source comment. Magic numbers scattered through code decay into folklore."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "The cvar Table Pattern Should Replace Ad-Hoc Config Dicts"
      context: "Quake's static cvar_table (name, default, flags, modificationCount) is the canonical pattern for engine-wide settings. Flags (ARCHIVE, NOSET, ROM) enforce behavior at registration time. modificationCount lets dependents track changes cheaply."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "Lazy Deletion (Sentinel Marker) Should Replace Atomic Cleanup in EntityRegistry"
      context: "P_RemoveThinker doesn't free — it sets function to sentinel (-1). Real Z_Free happens in next pass. O(1) deregistration. ED_Alloc adds 0.5s grace to prevent in-flight pointer morphing. Amortization beats eager finalization."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "MemoryStore Should Evolve from 3-Tier to 4-Tier to Match Quake's Hunk/Zone/Cache/Temp"
      context: "Quake's 4-tier memory architecture: Hunk (stack, never freed) / Zone (heap, fast) / Cache (LRU) / Temp (scratch). Each tier has distinct lifetime, alloc pattern, and access semantics. Omega's 3-tier collapses Zone+Cache into one tier, losing optimization opportunity."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

    - lesson: "The Hard-Boundary Struct Pattern Should Be Applied to the Entity Class"
      context: "Q3A splits gentity_t into entityState_t (engine-only, 'DO NOT MODIFY' comment) + entityShared_t (server+game) + game-only zone. Clear physical separation prevents accidental coupling. Omega's Entity class mixes all fields in one dict — a refactor target."
      source: "id-Software-Source-Phase-2-Extraction"
      timestamp: "2026-06-02"

