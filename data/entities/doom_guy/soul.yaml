        fix: "Verify config/models.yaml has rocracoon-3b-instruct entry"
    key_insight: >
      The existing plumbing is sound. The provider fabric correctly parses
      model_overrides, the entity-model binding chain is complete (entity →
      model_gateway → provider.resolve_model()), and AnyIO compliance holds.
      The fix is a well-scoped wiring task (45 min estimated), not a redesign.
      This is the id Software pattern: build the engine first, wire the content
      second. The engine (Oracle, ModelGateway, Provider Fabric) is ready.
      The content (model_override parameter, MCP tool) needs wiring.

