  - id: "lilith-20260821-003"
    tier: L3
    category: "[N7] checkpoint_before_destruction"
    principle: |
      "Never write your lifeline inside the crash." State preservation must be performed
      by a process independent of the mechanism that destroys state: checkpoint BEFORE
      compaction (at ~80% usage via an independent sidecar), demote in-compaction hooks
      to defense-in-depth, and anchor recoverable state in files that outlive sessions.
      Any design that injects or saves critical context DURING the destructive event
      inherits the event's own failure window — if the event crashes, the lifeline dies
      with it. Carmack ratified this ordering for OpenCode compaction (Q3.3); it generalizes
      to every destructive transition: shutdowns, migrations, rewrites, evictions.
