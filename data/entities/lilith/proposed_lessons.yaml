- id: lilith-20260927-sync-brief-001
    date: 2026-09-27
    session_id: ses_fb9721079ffe094GT8MX6a0pXI
    status: proposed
    domain: observability-watchtower-m23
    L1: >-
      Received MaKaLi post-compaction sync brief. Confirmed ground truth (debut
      live @ 268528e7, N1 43/43, SearXNG :8888, D-1024 native, 4-tool surface).
      Diagnosed live hub crash-loop: omega-hub.service NRestarts=31, root cause
      stale import `_extended_sessions` from state.py (refactored away). Watchdog
      running but blind to import-time crashes (polls /health only). data/health/
      missing. Reported M22 provenance honestly: opencode/big-pickle, not the
      brief's nemotron-3-ultra-free. Did not modify code per brief.
    L2: >-
      A /health 200 proves a process served a request, not that it booted.
      Import-time crashes are invisible to endpoint polling. The watchdog must
      watch NRestarts, exit codes, and stderr. The 2026-09-01 failure class
      (stale import after refactor) repeated — detection requires an
      ExecStartPre import-graph gate. Cross-Tailnet peer probes make the mesh
      the redundancy: a silent hub is detected by the peer.
    L3: >-
      Health-probe is not boot-proof: watch restart counters, exit codes, and
      stderr for the crash-loop class. Crash-loop is an incident, not a retry:
      NRestarts past StartLimitBurst is a hard-stop (M23). Peer-probe is the
      mesh-redundancy: federation is the observer. Provenance is observed, not
      requested: M22 reports the injected model even when a brief suggests
      another.
    evidence:
      - docs/federation/LILITH_SYNC_RESPONSE_20260927.md
