  - id: "lilith-20260807-013"
    tier: L1
    category: "wad_dependency_resolution_absent"
    narrative: |
      Tested WAD pack dependency resolution and circular dependency handling.
      WADLoader at oracle/wad_loader.py parses the 'dependencies' field in manifest V2
      but does NOT process or resolve dependencies. No circular dependency detection
      exists (no topological sort, no cycle detection). Test results: circular deps
      (A→B→A) loaded without error — no detection. Linear chain (C→D→E) loaded without
      resolving dependencies. Existing safeguards: path traversal guard (line 158-161),
      file size guard (S1.5a, 1MB max), schema validation (V1+V2, extra=forbid), entity
      collision detection (priority-based override). Default IWAD _omega_default has
      dependencies: [] (correct for base IWAD).

  - id: "lilith-20260807-014"
    tier: L2
    category: "wad_dependency_resolution_absent"
    insight: |
      The WAD manifest schema (V2) includes a 'dependencies' field with proper type
      validation, but the WADLoader never reads or processes it. This means WAD packs
      cannot declare dependencies on other WADs, and circular dependencies go undetected.
      The loader has strong safeguards (path traversal, file size, schema validation,
      entity collision) but lacks the dependency resolution layer. This is a critical
      gap for the WAD pack marketplace vision — without dependency resolution, WAD
      authors cannot build on each other's work safely. The fix requires a topological
      sort with cycle detection, applied during load_all_wads() before individual WAD
      loading.

  - id: "lilith-20260807-015"
    tier: L3
    category: "wad_dependency_resolution_absent"
    principle: |
      "Schema fields without processors are documentation, not functionality."
      A 'dependencies' field in the manifest schema that is never read by the loader
      creates a false promise to WAD authors — they believe they can declare
      dependencies, but the engine ignores them. This is worse than not having the
      field at all, because it creates silent failures (WADs that appear to load
      successfully but have unresolved dependencies). Sovereign systems must ensure
      that every schema field has a corresponding processor — if a field is parsed
      but not acted upon, it should be removed from the schema until the processor
      is implemented. The schema is a contract; unfulfilled fields are broken promises.

