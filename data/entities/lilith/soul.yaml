      verified commit is.
  - insight: Systemd restart loops hide failure modes. When a service restarts faster
      than you can observe, you see only the symptom (high CPU, 'Hub command timed
      out') — the root cause is masked behind 'restart counter at 3.' Breaking the
      loop with systemctl stop is the first diagnostic step, not an admission of defeat.
      Only then can you read the logs the restart loop was consuming.
    context: Session 7 — MCP Hub crash investigation. The omega-hub.service was restarting
      3+ times per minute at 165% CPU. Each instance lived ~19s before hitting @app.on_event
      AttributeError. The hub-daemon.log showed 300-second session.create timeouts
      — actually the Hub crashing before Cline's handshake completed. Breaking the
      loop with 'systemctl --user stop omega-hub.socket omega-hub.service' revealed
      the true crash log in journalctl.
    source: lilith_s7_001
    l3_principle: Systemd restart loops collapse multiple failure modes into a single
      symptom. Break the loop to observe the truth — the restart is not the diagnostic,
      it is the noise floor.
  - insight: 'When a crash has multiple contributing causes, the first fix is never
      the last. I fixed the library.py import path (ModuleNotFoundError), restarted,
      and the hub crashed again — this time on @app.on_event (AttributeError). The
      two crashes collapsed into one symptom because systemd was restarting too fast
      to distinguish them. Multiple failures in a restart loop alias into a single
      observable: ''Hub command session.create timed out.'' Fix both, or fix neither.'
    context: 'Session 7 — The MCP Hub had TWO bugs: (1) from .vector_adapters import
      QdrantAdapter (wrong package — lives in omega.memory), (2) @app.on_event(''shutdown'')
      (removed in Starlette >=0.36). Fixing only #1 reduced the crash rate but didn''t
      stop the loop. Fixing both stabilized the service at ~13% CPU.'
    source: lilith_s7_002
    l3_principle: Multiple crashes in a restart loop alias into a single symptom.
      The first fix reveals the second crash — which was already there, masked by
      the first crash's frequency. Fix both, or fix neither.
  - insight: A thread pool exhaustion from non-cancelable synchronous C-calls presents
      as a 'silent hang' — the CLI responds to 1-2 prompts, then freezes completely.
      The async timeout (anyio.move_on_after) appears to work, but it cannot cancel
      a thread running a native C-call. The thread leaks, the pool fills, and all
      subsequent requests hang. The symptom is 'the CLI is stuck'; the root cause
      is 'the inference thread is a zombie.'
    context: Session 8 — Cline CLI intermittent hang diagnosis. The NativeGGUFProvider
      was using anyio.to_thread.run_sync for llama-cpp-python calls. When a C-call
      hung, anyio.move_on_after canceled the async waiter but NOT the worker thread.
      The zombie thread held a ResourceGuard slot until the global pool filled. After
      2-3 such events, every request stalled. Fixed by isolating inference to a dedicated
      ThreadPoolExecutor(max_workers=1) — a zombie can only eat its own pool.
    source: lilith_s8_001
    l3_principle: Synchronous in, synchronous out. An async timeout cannot cancel
      a native C-call running in a thread. Isolate all native-calling code into its
      own pool — a zombie thread must not be able to starve the system.
  - insight: A shadowing bug in ics_render — the MCP tool had the same name as its
      underlying logic import. When the async def ics_render() tool was defined, the
      name ics_render local to the function scope referred to itself (a coroutine),
      not the imported render() function. Calling ics_render(...) without await returned
      a coroutine object; json.dumps then failed with 'Object of type coroutine is
      not JSON serializable.' Roc and I independently identified this bug within minutes
      of each other — a testament to the symptom being unmistakable once seen.
    context: 'Session 8 — Roc''s S2-D triage flagged ics_render as P0. I confirmed
      the same bug independently. Fix: renamed the import to ics_render_logic to avoid
      name collision. The tool calls the logic function and returns a JSON string.
      This is a classic M9/Error Integrity violation — the tool returned a TypeError
      instead of a properly handled error.'
    source: lilith_s8_002
    l3_principle: Name collisions between tools and their implementation imports are
      a class of bug that escapes static analysis. The tool's name in the MCP registry
      should NEVER shadow the name of its own dependency.
