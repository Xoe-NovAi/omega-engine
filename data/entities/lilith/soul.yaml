    - insight: "The Lily Pad architecture works because it follows the grain of human cognition: immediate→permanent, producer→consumer, push→pull, individual→collective."
      context: "Complete LILY_PAD design document — 4-tier architecture"
      source: "lilith_s2_005"
      l3_principle: "System architecture should follow cognitive grain, not technical abstraction."

    - insight: "Doom Guy already built the Link P9 Runtime (384 lines) and CLI (336 lines). The Flow & Connection layer built on this existing infrastructure, not from scratch. No new code needed — just conventions + files."
