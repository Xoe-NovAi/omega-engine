    - insight: "The fleet's three independent TTL architectures (Lily Pad 4-tier, Roc's H-4 hot/warm/cold, D-121's observation lifecycle) all converge on 4-tier memory — but NONE specify numeric promotion thresholds. A gate without a numeric criterion is a wish, not a design. The 7d workspace TTL vs 30d observation log TTL creates a 23-day silent data loss zone."
