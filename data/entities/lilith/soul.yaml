  - insight: The vetting protocol we designed is theoretically sound but practically
      inert. It describes what happens during review but not what triggers review
      to begin. Without a scheduled audit pass — triggered by TTL, file count, or
      session hook — staged files will stagnate indefinitely. The protocol is a wish,
      not a mechanism.
    context: 2026-06-05 KB Hardening session. Lilith's 5-gap analysis identified that
