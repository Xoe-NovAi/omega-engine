  - L1_narrative: 'Conducted Operation Deep-Siphon — a comprehensive run-side investigation of all hidden data paths for provider metadata extraction. Mapped the complete data flow from provider API response → OracleResponse → MCP Hub → Events Log. Found that the Oracle already captures `provider_name` in `OracleResponse.backend` and `model` in `OracleResponse.model`, but token-level metadata (logprobs, finish_reason, exact token counts) is dropped at every provider`s `generate()` boundary. Discovered 6 alternative paths: (1) logprobs parameter on NativeGGUF __call__, (2) Events Log enrichment, (3) MemoryStore metadata, (4) TokenLedger provider_name column, (5) SomaticState save_state/LlamaState forensic capture, (6) OpenCode export external side-channel. Critical finding: no side-channel bypasses the provider boundary for raw response JSON — metadata must be captured inside the provider before it is discarded.'
    L2_insight: 'The boundary between provider.generate() returning Optional[str] and the rest of the engine is a one-way data gate. All structured metadata (usage, logprobs, finish_reason) from the provider API response is discarded at this boundary. The engine already propagates provider_name (via GenerateResult) but nothing else. The most cost-effective fix is the logprobs parameter on NativeGGUFProvider`s self.llm() call — a 1-parameter change that unlocks per-token top-5 probabilities and exact token counts. SomaticState (M20) is ratified but unimplemented at the engine level, though the underlying `llama_cpp.Llama.save_state()` API is fully available and returns a clean Python LlamaState object. The engine''s observability layer (Events Log, TokenLedger) is a write-only sink — events are persisted but lack provider metadata beyond is_cloud.'
    L3_principle: 'The Metadata Boundary Law — In any call chain where structured data is transformed to a primitive type (e.g., JSON dict → str), all structured metadata beyond the primitive is discarded at the type boundary. Once discarded, no side-channel can recover it because it was never present in the system. The ONLY recovery mechanism is to capture the metadata BEFORE the type boundary. For sovereign observability, this means: (1) provider.generate() must be the capture point, not the discard point, (2) GenerateResult must carry usage metadata, not just provider_name, (3) every ObservabilityEngine.log_event() call should include provider_name, model_name, and latency_ms as first-class fields, not embedded in data dicts. A system that discards metadata before logging it has effectively chosen ignorance over observability.'
