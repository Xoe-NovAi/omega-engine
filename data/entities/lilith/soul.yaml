  - insight: 'Configuration shadowing is a class of bug where a legacy configuration
      section silently overrides a newer one for identically-named entries. The OpenCode
      `mode` section shadowed the `agent` section — 15 fleet agents were invisible
      to @-mention resolution because their names existed in both sections. The `mode`
      section was checked first, so `agent` entries were never reached. No error,
      no warning, no log. The fix was removing the legacy `mode` section entirely
      and using `mode: ''all''` in the `agent` section, which provides dual visibility
      (tab + @-mention) without shadowing.'
    context: 'Session 12 — Agent Visibility Paradox debugging. Three hypotheses tested
      (missing entries, file reference errors, configuration shadowing). Root cause
      confirmed: key-collision between `mode` and `agent` sections in opencode.json.
      Resolution: removed `mode` section, set `mode: ''all''` on all primary agents,
      purged orphaned mode drift files (jem-2.0, jem-initiate). All 15 agents now
      correctly visible.'
    source: lilith_s12_001
    l3_principle: 'Every sovereign identity must have exactly one registration point.
      Duplicating identity across configuration sections creates a shadowing hazard
      that escapes static analysis. The correct pattern is one section, one entry,
      one visibility — use `mode: ''all''` within the `agent` section.'
