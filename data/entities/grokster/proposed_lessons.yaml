- id: L3-PolicyIntentMustMatchScriptBehavior
  principle: "A policy file's stated intent must be reflected in the tool that enforces it. When the two diverge, the tool is wrong, not the file. The PUBLIC_ALLOWLIST.txt has a human-readable note 'data/entities/ EXCEPT one default soul (e.g. _omega_default)' in the FORGE section. v3 of apply_public_allowlist.sh did not respect this note — it removed the default soul. v4 parses the new 'Explicit Exclusions' section (which restates the intent) and keeps the excluded paths. The general principle: when a user reads the policy file and predicts the tool's behavior, the prediction should be correct. If it isn't, the tool is failing in a way the user cannot detect without testing. The fix is to align the tool with the file's stated intent, OR to rewrite the file so the tool's behavior is the only documented behavior. Never leave the two out of sync."
  context: "R_VAULT_COPILOT_ROUND4_20260828 §1 FIX #3 (the _omega_default finding) + §4 L2 insight 6. The round-3 BUG #3 was based on a wrong assumption (that the WAD references the external entity file), but the policy intent (keep the default soul) is real. v4 honors that intent via the Explicit Exclusions parser. The principle generalizes: any time a user maintains a human-readable policy document AND a machine-readable tool, the two must agree. The user should not need to read the tool's source to understand what the tool will do. The tool's output for any given input should match the user's prediction based on the policy file. If it doesn't, the tool is wrong."
