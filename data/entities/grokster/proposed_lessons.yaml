- id: L3-SecretsInVersionControlMustBeConsideredCompromised
  principle: "The instant a secret (API key, OAuth secret, PAT, password) is committed to a version-controlled file, it MUST be considered compromised. Even after the secret is removed from the working tree (e.g., by moving to an env var), the secret is still in git history. The only complete remediation is: (1) rotate the secret at the provider, (2) optionally rewrite history with git-filter-repo. The reasoning: a secret's compromise is determined by its access surface, not its current location. The access surface includes anyone who has ever cloned the repo, anyone who can access the git host's web UI, anyone with access to backups, and any CI that ran against the historical commit. Removing the secret from the working tree shrinks the future access surface but does not shrink the past access surface. The M23 fail-closed doctrine requires treating the past surface as compromised until rotation."
