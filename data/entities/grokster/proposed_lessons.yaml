- id: L3-CompletionIllusionDefense
  principle: LLMs synthesize graceful markdown footers (*⬡ COMPLETE*) and report state=completed even
    when planned outline is truncated mid-stride. Orchestrators MUST probe with sentinel prompts ('Continue;
    reply STREAM_EXHAUSTED when 100% finished') before accepting completion. This is the Completion Illusion
    — the LLM's tendency to hallucinate completion when output tokens are exhausted.
