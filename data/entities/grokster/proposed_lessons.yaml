- id: L3-ReasoningModelLowMaxTokensIsNotFailure
  principle: "A reasoning model with max_tokens < reasoning_budget returns HTTP 200 with content:null and finish_reason:length — this is the model's normal behavior when the visible-answer budget is consumed by the thinking phase, NOT a network/auth/account failure. Detection code that treats 200+null-content as failure will false-positive on every reasoning model (M2.7, Claude thinking, Nemotron reasoning) under any tight token budget. The correct distinguisher is usage.completion_tokens > 0 OR completion_tokens_details.reasoning_tokens > 0."
