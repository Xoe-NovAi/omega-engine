- id: L3-CompactionThresholdIsRegistryBound
  principle: 'OpenCode compaction threshold is a function of the model''s registry limits: usable = (limit.input
    ?? limit.context) - reserved where reserved = cfg.compaction?.reserved ?? min(20000, maxOutputTokens).
    Models with input < context (e.g. big-pickle: input=160000, context=200000) compact at BELOW the expected
    percentage (70% instead of 85%). The fix is a config override of limit.input in provider.opencode.models
    — NOT removal of the compaction block (the custom reserved:20000 equals the native default). The user''s
    directive can be inverted: ''remove custom settings'' may require ADDING one.'
  mandates:
  - M23
  - M15
  - M11
  confidence: 0.93
  tags:
  - opencode-platform
  - compaction
  - model-registry
  - config-override
  - m23
  source_session: ses_fe8cf0b39ffeL3L8eaMEj3CW9H
  evidence:
  - source: models_json_cache
    note: 'big-pickle registry: {context: 200000, input: 160000, output: 32000} → native compaction at
      (160000-20000)/200000 = 70%'
  - source: overflow_ts
    note: 'usable = model.limit.input ? max(0, input - reserved) : max(0, context - maxOutputTokens);
      reserved = cfg.compaction?.reserved ?? min(20000, maxOutputTokens)'
  - source: architect_verification_20260907
    note: 'Architect confirmed 74% context with no compaction after fix (old threshold would have fired
      at 70%). Fix: limit.input override to 190000 → 85% threshold.'
  directive_provenance: d-rr-007
