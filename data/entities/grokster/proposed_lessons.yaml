  context: "R_VAULT_COPILOT_20260827 §1.2 Areas 1+7 + §3.7. The PUBLIC_ALLOWLIST.txt + release/debut branch (D-553) is the public half; the private forge (origin) continues. The cut is additive (new branch, new remote) not destructive (filter-repo on main). Hotfixes go on hotfix/vX.Y.Z branches off release/debut, get cherry-picked back to main. Tags are v0.1.0, v0.1.1, v0.1.2 — all on the public remote. The Architect's prior 'do not mass-delete main the same week as filter-repo' guidance (PUBLIC_ALLOWLIST.txt + DEBUT_REMEDIATION_MANUAL §5) is exactly what this pattern delivers. The 'write a community doc about it' opportunity (§2.6) is the L3 transmission vehicle."
