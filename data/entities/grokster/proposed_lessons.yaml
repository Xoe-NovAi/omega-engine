- id: L3-SelfReferentialToolsMustSelfExempt
  principle: "A tool that applies a filter MUST exempt itself from the filter, or the tool will be filtered. This is the 'immune system' of any self-referential enforcement: a linter exempts its own config, a deploy tool ships its own binary, a cut-tool keeps itself in the output. The exceptions list is not an oversight to fix; it is a structural feature. The cost of forgetting it: the tool that was supposed to maintain the policy is the first thing the policy removes. INST-1 fails, the debut is irreversible, the team has no recovery path. The fix is mechanical: a hard-coded EXCEPTIONS list in the script, with comments explaining WHY each entry is exempt (so future maintainers don't accidentally remove them). The same pattern applies to allowlists: any file that IMPLEMENTS the allowlist must itself be in the allowlist (or in exceptions)."
