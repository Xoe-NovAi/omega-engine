- id: L3-BashCommandSubstitutionIsAReInterpretationBoundary
  principle: "Bash command substitution `$(... | awk ...)` runs the inner tool in a subshell, and the output goes through bash's command-substitution processing. Characters like backslash, caret, dollar, and asterisk may be re-interpreted by the outer shell, even if the inner tool produced them as literal escapes. The robust pattern is to design the inner tool to produce the EXACT string the outer shell needs, not to escape-and-hope. In apply_public_allowlist.sh v3, the awk escaped ^ as \\^ (literal backslash + caret), but bash command substitution treated \\^ as \\^ (still literal), so the regex `^data/entities/[^/]*` became `^data/entities/\\[^/\\]*` which matched nothing. The fix: remove ^ from the awk escape set, because ^ only has special meaning at the start of a regex (we prepend our own ^). The general principle: when piping tool output to bash, test against an actual bash invocation, not a synthetic one — bash's command-substitution processing is a re-interpretation boundary that tools don't model."
  context: "R_VAULT_COPILOT_ROUND4_20260828 §1 FIX #1 + §4 L2 insight 4. The double-escape bug was discovered during the round-4 sandbox test of the Explicit Exclusions parser. The exclusion 'data/entities/*/soul.yaml' was being translated to the regex `^data/entities/\\[\\^/\\]*/soul\\.yaml` (with caret escaped), which bash interpreted as a literal-^ inside a character class — different from the intended `^data/entities/[^/]*/soul\\.yaml` (any non-/ char). The fix: change the awk's gsub pattern from `gsub(/[(){}+.|^$\\\\]/, '\\\\&')` to `gsub(/[(){}+.|$\\\\]/, '\\\\&')` (removing ^). After the fix, the exclusion correctly matches. The same pattern of 'inner-tool-escape + outer-shell-reprocess' bugs appears in any pipeline that pipes a tool's string output into bash's regex/string contexts."
