- id: L3-InterruptionSovereigntyAndCoResumption
  principle: When a global cancellation (Esc x2) aborts multiple parallel subagents,
    the orchestrator MUST track all in-flight session IDs as a transactional cohort
    and resume all on recovery. Failure to do so = orchestrator amnesia. The Completion
    Illusion (LLMs synthesizing graceful footers when output-token-limited) requires
    sentinel probing ('STREAM_EXHAUSTED') before accepting state=completed.
  mandates:
