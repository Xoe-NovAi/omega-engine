- id: L3-ForceWithLeaseIsNotSufficient
  principle: "`git push --force-with-lease` is necessary but not sufficient for shared-public force-pushes. The lease protects against CONCURRENT pushes (teammate pushes between your fetch and your push — 'stale info' error). The lease does NOT protect against STALE LOCAL branches (you `git reset --hard` to an old state, then push — the lease matches your fetched tracking ref, so the push succeeds and clobbers whatever the remote has). The missing piece is a PRE-PUSH AUDIT: `git log remote..HEAD` (what you'd push) and `git log HEAD..remote` (what you'd clobber). The audit surfaces the divergence; the human decides. The full safety stack is: fetch + pre-push audit + explicit-expected-lease (`--force-with-lease=<ref>:<expected_sha>`). This revises the prior axiom `L3-ForceWithLeaseIsTheOnlySafePublicForcePush` which was partially wrong."
