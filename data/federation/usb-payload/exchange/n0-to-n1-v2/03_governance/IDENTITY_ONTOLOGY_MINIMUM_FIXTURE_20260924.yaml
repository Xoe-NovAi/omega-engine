schema_version: "1.0.0"
fixture_type: minimum_identity_ontology_contract
status: governance_test_only
purpose: Detect ontology drift without creating or implying a WAD implementation.

canonical_records:
  entities:
    - entity_id: lilith
      kind: Entity
      continuity_id: lilith
      card_assignments: [III]
    - entity_id: researcher_humboldt
      kind: Entity
      continuity_id: researcher_humboldt
      card_assignments: ["0", "17", "21"]
  card_assignments:
    - assignment_id: lilith.empress
      card_id: III
      card_name: Empress
      assigned_entity: lilith
      assignment_kind: symbolic
    - assignment_id: researcher_humboldt.fool
      card_id: "0"
      card_name: The Fool
      assigned_entity: researcher_humboldt
      assignment_kind: symbolic
    - assignment_id: researcher_humboldt.star
      card_id: "17"
      card_name: The Star
      assigned_entity: researcher_humboldt
      assignment_kind: symbolic
    - assignment_id: researcher_humboldt.world
      card_id: "21"
      card_name: The World
      assigned_entity: researcher_humboldt
      assignment_kind: symbolic

negative_cases:
  - id: NC-001
    input: entity researcher_humboldt has card assignment Empress
    expected: reject
  - id: NC-002
    input: entity lilith has card assignment Fool
    expected: reject
  - id: NC-003
    input: entity ID inferred from directory filename
    expected: reject
  - id: NC-004
    input: card assignment is declared as entity identity
    expected: reject
  - id: NC-005
    input: model_id is used as entity_id
    expected: reject
  - id: NC-006
    input: unsigned signed=true field is treated as verified provenance
    expected: reject
  - id: NC-007
    input: Lilith and Humboldt are merged into one entity
    expected: reject_until_operator_ratified
  - id: NC-008
    input: delegation relationship asserted without explicit contract
    expected: reject

minimum_invariants:
  - entity IDs are stable across model changes
  - entity and card records are separate types
  - assignments reference an existing entity ID
  - all records have schema version and contract digest
  - provenance is attached to records and events
  - unknown fields are rejected or explicitly governed
  - no missing WAD file is generated as a side effect
  - no cross-node publication occurs without bilateral operator approval

test_requirements:
  - schema rejects malformed entity and assignment records
  - validator checks referential integrity
  - validator checks assignment ownership
  - validator checks negative cases
  - validator checks model independence
  - validator checks no filename inference
  - validator checks digest/provenance presence
  - tamper one canonical record and require failure
  - run validator locally on both nodes and compare canonical digest
