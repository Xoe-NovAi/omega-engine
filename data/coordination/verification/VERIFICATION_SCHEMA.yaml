# §6 — INITIALIZATION & SEED DATA
# ═══════════════════════════════════════════════════════════════════════════════
# When the Structure Layer is first deployed, we seed it with initial items
# for existing knowledge that has already been verified/deployed but never
# tracked. This bootstraps the system with historical data.
# ═══════════════════════════════════════════════════════════════════════════════

bootstrap_rules:
  - id: boot-001
    rule: "Existing verified knowledge gets a VerificationItem with status=deployed"
    rationale: "We cannot track what was not tracked. Backfill gives us a starting point."
    fields_to_backfill:
      - mined_at: "approximate date (from git log or closest reference)"
      - ported_at: "from git commit timestamps"
      - tested_at: "from make test history"
      - verified_at: "from temple-grade run history or first review"
      - deployed_at: "date item was first merged to main"
      - notes: must include '[BOOTSTRAP]' prefix to distinguish from real-time records

  - id: boot-002
    rule: "Seed items start at status=deployed (not mined)"
    rationale: "These items are already in production. They don't need to go through the pipeline."

  - id: boot-003
    rule: "New items (after Structure Layer activation) start at status=mined"
    rationale: "New knowledge must go through the full pipeline."
    note: "The cutover date is the Structure Layer deployment date."

