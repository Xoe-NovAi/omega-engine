  priority: P0
  status: completed
  claimed_by: researcher
  depends_on: []
  capabilities_needed:
  - web_research
  - systems
  - memory_management
  - linux
  queries:
  - psutil.virtual_memory available vs total 2026
  - /proc/meminfo MemAvailable vs MemFree Linux 2026
  - OOM killer prediction userspace 2026
  - software RAM counter vs kernel available drift
  - llama.cpp memory mapping vs RSS accounting
  deliverable: docs/research/R_RESOURCEGUARD_RAM_TRUTH.md
  decision_gate: Prefer OOMProtector path; kill dual counter; derive max_ram_mb from
    boot-time available
  sources_count: 8
  started_at: '2026-07-21T10:00:00Z'
  completed_at: '2026-07-21T10:40:00Z'
  key_findings:
  - "psutil.virtual_memory().available reads /proc/meminfo MemAvailable \u2014 the\
    \ same metric the OOM killer uses \u2014 this is authoritative"
  - ResourceGuard._current_ram_mb is a SOFTWARE COUNTER that drifts from reality (shared
    memory, mmap overcommit, kernel cache)
  - 'Dual counter creates false safety: default max_ram_mb=12288 on a system with
    8GB available allows loads that OOM'
  - "Default 12288 (12GB) exceeds actual available RAM on this 16GB system (~8GB at\
    \ idle) \u2014 actively dangerous ceiling"
  - Kill the software counter entirely; OOMProtector (reads kernel MemAvailable) is
    the sole arbiter
  - "llama.cpp uses mmap() \u2014 RSS is demand-paged and varies with inference; kernel\
    \ knows best"
