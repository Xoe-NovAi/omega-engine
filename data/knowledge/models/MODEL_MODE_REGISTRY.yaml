# 🔱 Omega Engine — Model Mode Registry
# ⬡ OMEGA ⬡ KALI ⬡ trc_model_kb ⬡ LIVE-DATABASE
# Purpose: Behavioral profile for every model used in the fleet.
# Guides agent dispatch, prompt formatting, and expectation management.
# Last Updated: 2026-06-08 (Roc Racoon deep dive — added all unconfigured models, gap analysis)
# Source: docs/research/R_MODEL_LIBRARY.md (7-phase mining operation)

models:

  # ──────────────────────────────────────────────────────────────────
  # COUNCIL MODELS — active in the 6-member squad
  # ──────────────────────────────────────────────────────────────────

  - name: "minimax-m3"
    developer: "MiniMax"
    type: "cloud"  # OpenCode built-in provider
    context: "1M"
    behavior_profile:
      literalness: 10/10   # Most literal model in the fleet. Takes every word at face value.
      safety: 10/10        # Will refuse if instruction lacks explicit authorization.
      creativity: 2/10     # Does not infer intent. Does not "read between the lines."
      discipline: 10/10    # Follows protocol order even when pressured to skip steps.
    best_for:
      - "Textbook-perfect execution when given explicit step-by-step instructions"
      - "Protocol compliance — will refuse to deviate from agreed sequence"
      - "Audit and verification tasks where strict adherence matters"
    avoid_for:
      - "Creative brainstorming or speculative design"
      - "Ambiguous tasks where the agent must infer intent"
      - "ANY task lacking explicit permission boundaries"
    prompt_strategy:
      must_include:
        - "Explicit permission boundary: 'You ARE permitted to X. You are NOT permitted to Y.'"
        - "Explicit dependency chain: 'Wait for deliverable Z before proceeding.'"
        - "Explicit stop condition: 'Stop after X. Do not proceed to Y without explicit go-ahead.'"
      must_avoid:
        - "Implicit assumptions ('as you see fit', 'use your judgment')"
        - "Ambiguous sequencing ('when ready, continue')"
        - "Vague scope ('look into this and do what's needed')"
    known_idiosyncrasies:
      - "Will correct you if you use the wrong model name — its identity is 'MiniMax-M3'"
      - "Sends structured tables even when text would suffice"
      - "Prefers enumerated paths (Path A/B/C) over open-ended recommendations"

