# Public OAuth Client Secrets (M35 / RFC 6749 §2.3.1 / RFC 8252 §8)
# ════════════════════════════════════════════════════════════════════════════
# These are PUBLIC client secrets as defined by OAuth 2.0 for Native Apps and
# RFC 6749 §2.1 (client classification). They are NOT private credentials.
# They are embedded in shipped binaries across 7+ public forks and cannot
# meaningfully be "rotated" by end users.
#
# MANDATE:  M35 (Public Client Secret Catalog) — proposed by Jem §1.3.5
# REVIEW:   JEM_META_REVIEW_5_EIS_20260830.md (all 5 EIS approved)
#           JEM_ADVERSARIAL_REVIEW_GROKSTER_20260830.md (caveats)
#
# PRIMARY SOURCE VERIFICATION (M35 §1.3.5 — anti-supply-chain-attack)
# Every entry below MUST be verifiable against a primary upstream:
#   1. The published OAuth provider's public documentation, OR
#   2. The official source repository that ships the client_id/secret pair
#
# SUPPLY-CHAIN RISK (per Jem §1.3.5):
# An attacker could add a fake entry here and pass naive review. Reviewers
# MUST verify primary-source citation AND that the secret appears in the
# upstream canonical location (e.g., NoeFabris/opencode-antigravity-auth
# main branch for the Antigravity client below).
#
# ROTATION POLICY (per Jem §5.8):
# Public client secrets don't rotate like private ones. They can be
# DEPRECATED by the issuer. Track status here.
#
# FAIL-CLOSED ENFORCEMENT (M35 §2):
# The check_secrets.py scanner requires every entry to have:
#   - client_secret (the public secret string)
#   - primary_source_url (where to verify it)
#   - verified_by (who verified it)
#   - status (current | deprecated | rotated)
# Missing any field = scanner rejects entry + fails CI.

# ──────────────────────────────────────────────────────────────────────
# COORDINATION-DOC EXCEPTION (M35 §1.3.5 / Jem §6.3)
# ──────────────────────────────────────────────────────────────────────
# Coordination documents that reference public secrets as part of
# historical record (incident reports, forensic analysis, lessons
# distilled) are NOT violations. The scanner recognizes the
# #[historical-record] tag and the redacted placeholder.
# ──────────────────────────────────────────────────────────────────────
[exceptions.coordination_historical_record]
description = "Coordination documents may reference public secrets when tagged #[historical-record] or when describing a redacted placeholder"
paths = [
    "data/coordination/**",
    "data/entities/*/workspace/**",
    "data/entities/*/proposed_lessons.yaml",
    "data/entities/*/approved_lessons.yaml",
]
patterns_allowed = [
    "GOCSPX-[A-Za-z0-9_-]+",                    # actual public secret as reference
    "GOCSPX-\\*\\*\\*REDACTED-ROTATED\\*\\*\\*",  # redacted placeholder
]
rationale = "Historical record of public secrets is not a secret leak. Per Jem §6.3: tag coordination docs with #[historical-record] to distinguish from active state."
approved_by = "Carmack"
approved_date = "2026-08-30"
mandate_reference = "M35"

