use_default_settings: true

server:
  secret_key: "***REMOVED***"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

ui:
  static_use_hash: true
  default_locale: ""
  results_on_new_tab: true

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: brave
    engine: brave
    shortcut: bv
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: arxiv
    engine: arxiv
    shortcut: arx
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  - name: semantic scholar
    engine: semantic_scholar
    shortcut: ss
    disabled: false
