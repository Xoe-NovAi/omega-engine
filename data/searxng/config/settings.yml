server:
  secret_key: "CHANGE_ME_RUN: openssl rand -hex 32  # redacted from repo (B1)"
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 4017

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 20.0
  max_request_timeout: 30.0
  retries: 2
  enable_http2: true

ui:
  static_use_hash: true
  default_locale: ""
  results_on_new_tab: true

