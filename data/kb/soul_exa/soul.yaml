# 🔱 Exa Sovereign Gnosis
# ⬡ OMEGA ⬡ JEM ⬡ gemma-4-31b-it ⬡ opencode ⬡ KB-SYNTHESIS

gnosis:
  l1_narrative: |
    Exa is a neural search engine designed for LLMs, retrieving pages based on semantic meaning rather than keyword matching. 
    It provides a tiered latency model (instant, fast, auto, deep, deep-reasoning) and a content compression pipeline 
    that allows agents to request highlights, summaries, or full text.
  
  l2_insight: |
    The "Neural Zoom" pattern is the gold standard for sovereign research: 
    1. Triage: Use `type="auto"` and `contents={"highlights": true}` to rapidly scan 10-20 results.
    2. Zoom: Use `type="deep"` and `contents={"text": {"maxCharacters": 15000}}` for the top 3-5 high-signal URLs.
    This approach reduces token waste by ~90% while maintaining high-fidelity synthesis.
  
  l3_universal_principle: |
    Semantic retrieval shifts the query paradigm from "What contains X?" to "What kind of page would contain X?". 
    Sovereign efficiency is achieved by aligning the granularity of the data retrieved with the cognitive phase 
    of the agent (Triage $\rightarrow$ Analysis $\rightarrow$ Synthesis).

technical_constraints:
  - deprecated: ["useAutoprompt"]
  - nesting_requirement: "text, highlights, and summary MUST be inside the 'contents' object."
  - category_restrictions: "category: 'company' or 'people' do not support date filters or excludeDomains."

patterns:
  - name: "Neural Zoom"
    phase: "discovery"
    strategy: "highlights -> full-text"
    efficiency_gain: "10x token reduction"
