# ⬡ OMEGA ⬡ DOOM_GUY ⬡ S1 ⬡ logrotate for omega-research flat logs
#
# WHY THIS FILE EXISTS NOW
#   omega-research.service used StandardError=append:.../error.log, an
#   unbounded flat file that reached 81,533,309 bytes. It is now routed to
#   the systemd journal, so nothing writes these files anymore. They remain
#   on disk because a log belongs on disk (M8 local-first) and because the
#   62-day crash loop they recorded is a permanent audit artifact (M28).
#
#   This config bounds any FUTURE flat file that lands in this directory so
#   the 81MB recurrence cannot happen silently again.
#
# The archive artifact error.log.20260730-20260930.crashloop.zst is NOT matched
# (suffix .zst) and is therefore never rotated or removed by this policy.
# Its provenance is recorded in CRASHLOOP_ARCHIVE_20260930.md in the same dir.
#
# M28: retention is 7 compressed generations. Rotated logs are compressed and
# kept, not deleted. Anything beyond that needs an explicit operator act.

/home/arcana-novai/Documents/Xoe-NovAi/omega-engine/data/entities/*/workspace/HALL_OF_RECORDS/*.log {
    size 10M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    # Writer keeps its fd open across rotation; copytruncate avoids a
    # half-written rotation that would look like data loss.
    copytruncate
    dateext
    dateformat -%Y%m%d
    su arcana-novai arcana-novai
    create 0664 arcana-novai arcana-novai
}