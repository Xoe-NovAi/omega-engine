# Omega Engine Alpha — Open WebUI stack
# Open WebUI talks to the host's native Ollama (systemd service) via host-gateway.
# Start:  docker compose up -d
# Stop:   docker compose down          (data persists in the open-webui-data volume)
# Requires OLLAMA_HOST=0.0.0.0:11434 (see .env.ollama) so the container can reach it.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=true
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data: