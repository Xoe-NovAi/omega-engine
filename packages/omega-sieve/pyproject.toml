[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-sieve"
version = "0.1.0"
description = "Sovereign-Sieve — T1→T2→T3 tiered web research & extraction. Your data, your computer, no cloud required."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["web-scraping", "research", "sovereign", "local-first", "tiered-extraction"]
authors = [
    {name = "Xoe-NovAi Foundation", email = "foundation@xoe-nov.ai"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
# Fast extraction (text-only pages)
fast = [
    "trafilatura>=1.6.0",
]

# Full extraction with JS rendering
full = [
    "omega-sieve[fast]",
    "crawl4ai>=0.4.0",
]

# YouTube support
youtube = [
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.0",
]

# Transcription (VAD + Whisper)
transcription = [
    "omega-sieve[youtube]",
    "whisper-cpp-python>=0.3.0",
    "silero-vad>=4.0.0",
]

# Everything
all = [
    "omega-sieve[full,youtube,transcription]",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.3.0",
]

[project.scripts]
sieve = "omega_sieve.cli:app"

[project.urls]
Homepage = "https://github.com/Xoe-NovAi/omega-sieve"
Repository = "https://github.com/Xoe-NovAi/omega-engine"
Issues = "https://github.com/Xoe-NovAi/omega-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_sieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]