kv_cache:
  default_key_type: q8_0
  default_value_type: q8_0
  models:
    qwen3-1.7b:
      key_type: f16
      value_type: f16
    qwen3-0.6b-q6_k:
      key_type: f16
      value_type: f16
    qwen3-4b-thinking-q4_k_m:
      key_type: q8_0
      value_type: q8_0
zen2_build:
  march: znver2
  cmake_flags:
  - -DLLAMA_AVX2=ON
  - -DLLAMA_FMA=ON
  - -DLLAMA_F16C=ON
  - -DLLAMA_NO_AVX512=ON
  - -DGGML_FLASH_ATTN=ON
  - -DLLAMA_BLAS=OFF
  - -DLLAMA_CUDA=OFF
  - -DLLAMA_METAL=OFF
  - -DCMAKE_C_FLAGS='-march=znver2'
  - -DCMAKE_CXX_FLAGS='-march=znver2'
  runtime_env:
    OMP_NUM_THREADS: '6'
    OMP_PROC_BIND: close
    OMP_PLACES: cores
    OPENBLAS_CORETYPE: ZEN
loading:
  max_concurrent_models: 1
  nova_always_on: true
  warm_models:
  - qwen3-0.6b-q6_k
  unload_after_idle_minutes: 5
  emergency_swap_threshold_mb: 1024
