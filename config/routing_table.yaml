# ⬡ OMEGA ⬡ ROUTING TABLE ⬡ v1.0
# Static, version-controlled routing rules for hybrid local/cloud inference.
# No ML. No statistics. No learning. If it routes wrong, edit this file.
# Human knows; machine obeys.

version: 1
updated: "2026-08-16"
author: "kali"
source: "CARMACK_REVIEW_HYBRID_20260816"

# Priority: higher = evaluated first. First match wins.
rules:
  - name: "privacy_always_local"
    description: "Privacy-sensitive content never leaves the machine. Tag at ingestion."
    condition: "privacy_tag == true"
    action: "local"
    priority: 100
    rationale: "M8 Zero Telemetry + M7 Local-First. Hard constraint."

  - name: "long_context_cloud"
    description: "Context exceeding local RAM capacity routes to cloud (Gemini 1M+)."
    condition: "context_tokens > 32000"
    action: "cloud"
    preferred_provider: "google"
    preferred_model: "gemini-1.5-pro"
    fallback_provider: "openrouter"
    fallback_model: "google/gemini-1.5-pro"
    priority: 90
    rationale: "Local 5700U: 16GB RAM → max ~32K context at Q4. Cloud: 1M+."

  - name: "code_simple_local"
    description: "Code completion and simple QA: local 7B models are fast, private, sufficient."
    condition: "task_category in ['code_completion', 'simple_qa'] and local_7b_available == true"
    action: "local"
    preferred_model: "qwen3-1.7b"
    fallback_model: "qwen3-4b"
    priority: 80
    rationale: "Local latency <50ms, zero cost, BFCL 60%+ on 7B."

  - name: "complex_reasoning_cloud"
    description: "Multi-step reasoning, planning, function calling: cloud models dominate."
    condition: "task_category in ['complex_reasoning', 'planning', 'function_calling']"
    action: "cloud"
    preferred_provider: "anthropic"
    preferred_model: "claude-opus-4"
    fallback_provider: "openrouter"
    fallback_model: "anthropic/claude-opus-4"
    priority: 70
    rationale: "BFCL 85%+ vs local 60%. Quality gap >15% justifies cost."

  - name: "default_sovereign"
    description: "Default to local sovereignty. Cloud is opt-in, not default."
    condition: "true"
    action: "local"
    preferred_model: "qwen3-1.7b"
    priority: 0
    rationale: "M7 Local-First. Cloud is fallback, not primary."

# Cloud provider configuration (referenced by rules)
providers:
  google:
    models:
      - "gemini-1.5-pro"
      - "gemini-1.5-flash"
    rate_limit_rpm: 15
    free_tier_tokens_per_day: 1000000
    pricing_ref: "config/cloud_pricing.yaml#google"
  
  anthropic:
    models:
      - "claude-opus-4"
      - "claude-sonnet-4"
    rate_limit_rpm: 50
    pricing_ref: "config/cloud_pricing.yaml#anthropic"
  
  openrouter:
    models:
      - "google/gemini-1.5-pro"
      - "anthropic/claude-opus-4"
      - "meta-llama/llama-3.1-405b"
    rate_limit_rpm: 60
    pricing_ref: "config/cloud_pricing.yaml#openrouter"

# Local model availability (checked at runtime)
local_models:
  qwen3-1.7b:
    path: "/media/arcana-novai/omega_library/models/gguf/Qwen3-1.7B-Q6_K.gguf"
    context_max: 32768
    bfcl_score: 0.62
    size_gb: 1.5
  
  qwen3-4b:
    path: "/media/arcana-novai/omega_library/models/gguf/Qwen3-4B-Q5_K_M.gguf"
    context_max: 32768
    bfcl_score: 0.71
    size_gb: 3.2
  
  qwen3-8b:
    path: "/media/arcana-novai/omega_library/models/gguf/Qwen3-8B-Q4_K_M.gguf"
    context_max: 32768
    bfcl_score: 0.78
    size_gb: 5.8