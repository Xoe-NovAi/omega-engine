# 🔱 Model Research Profiles
# Maps model architectures to research protocol adaptations.
# Used by R_MODEL_RESEARCH_PROTOCOL.md §2.3
# Date: 2026-06-12

profiles:
  gemma_4_31b:
    context_window: 256000  # Massive — can hold full evidence sets
    reasoning_depth: iterative  # Strong synthesis but needs forcing to deepen
    tool_fidelity: medium  # Good but drifts on >5 step chains
    guardrails:
      - "Force 3+ tool rounds before ANY synthesis output"
      - "Require explicit 'deepen' pass after first draft"
      - "Write intermediate evidence to disk every 3 tool calls"
      - "Hold all evidence in context; use it for cross-referencing"
    failure_signature: "shallow"  # S1 — tends to stop at surface
    shadow_focus: "force_deepening"  # Shadow Protocol should push past first layer

  deepseek_v4_flash:
    context_window: 32000  # Moderate — disk is extension of context
    reasoning_depth: deep  # Excellent at gap analysis and contradiction detection
    tool_fidelity: high  # Good tool adherence
    guardrails:
      - "Write to disk every 2 tool calls (context pressure safety)"
      - "Leverage gap-analysis strength: always include 'what's missing' section"
      - "Limit synthesis scope to fit remaining context window"
      - "Use reasoning depth to identify failure modes others miss"
    failure_signature: "over-analysis"  # S4 — thinks too long before writing
    shadow_focus: "force_persistence"  # Shadow Protocol should force disk writes early

  claude_4_sonnet:
    context_window: 100000  # Large
    reasoning_depth: fast  # Quick, structured synthesis
    tool_fidelity: medium  # Drifts on long chains
    guardrails:
      - "Use structured output templates (format discipline is a strength)"
      - "Verify tool output within 1 step — don't batch tool calls"
      - "Split long research chains into 5-step max batches"
      - "Map every finding to a code location immediately"
    failure_signature: "tool_drift"  # S5 — defaults to familiar tool on long chains
    shadow_focus: "verify_tool_use"  # Shadow Protocol should audit tool diversity

  claude_3_5_sonnet:
    context_window: 200000  # Large
    reasoning_depth: fast
    tool_fidelity: medium
    guardrails:
      - "Same as claude_4_sonnet plus context advantage"
      - "Can hold more evidence; use for complex multi-source topics"
    failure_signature: "tool_drift"
    shadow_focus: "verify_tool_use"

  gpt_4o:
    context_window: 128000  # Large
    reasoning_depth: fast
    tool_fidelity: low  # Prone to hallucinated tool outputs
    guardrails:
      - "Verify every tool output against known facts"
      - "Cross-reference with specific citations"
      - "Do not assume tool results are accurate"
    failure_signature: "hallucination"  # May fabricate tool results
    shadow_focus: "verify_claims"  # Shadow Protocol should fact-check every claim

  gemini_2_5_flash:
    context_window: 1000000  # Massive — context overflow risk mitigated by window
    reasoning_depth: fast
    tool_fidelity: medium
    guardrails:
      - "Context is effectively unlimited — use structured chunking"
      - "Write checkpoints at natural boundaries (not time-based)"
      - "Use context advantage for full multi-perspective coverage"
    failure_signature: "context_overload"  # May include irrelevant detail
    shadow_focus: "prune_and_distill"  # Shadow Protocol should trim to essentials

  # Default fallback for unknown models
  default:
    context_window: 32000
    reasoning_depth: fast
    tool_fidelity: medium
    guardrails:
      - "Conservative: write to disk every 2 tool calls"
      - "Always run Shadow Protocol after main protocol"
    failure_signature: "unknown"
    shadow_focus: "full_audit"  # Run all Shadow Protocol checks
