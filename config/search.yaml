# 🔱 SSP-V2 — Sovereign Search Configuration
# AP: AP-SSP-V2-CONFIG-v1.0.0
# Tier mapping per SSP-V2 spec: T0=Local, T1=SearXNG, T2=Exa, T3=Firecrawl

version: "2.1.0"

tiers:
  T0:
    name: local_cache
    provider: memory_store
    timeout_seconds: 5
    retries: 0
    enabled: true
  T1:
    name: searxng
    provider: searxng_mcp
    url: "http://127.0.0.1:8017"
    timeout_seconds: 15
    retries: 2
    retry_delay_seconds: [5, 10]
    enabled: true
    categories:
      - general
      - science
      - it
    engines: ""
    language: auto
  T2:
    name: exa
    provider: exa_cloud_mcp
    url: "https://mcp.exa.ai/mcp"
    timeout_seconds: 15
    retries: 2
    retry_delay_seconds: [5, 10]
    enabled: true
    search_type: auto
  T3:
    name: firecrawl
    provider: firecrawl_mcp
    url: "http://127.0.0.1:8015"
    timeout_seconds: 30
    retries: 1
    retry_delay_seconds: [10]
    enabled: true
    credit_threshold: 100
    default_limit: 10

routing:
  intent_signals:
    - has_url
    - iris_confidence
    - entity_domain
    - query_category
    - credit_status
    - provider_health
  depth_map:
    high_confidence: T0
    factual: T1
    research: T2
    technical: T1
    deep: T3
  fallback_chain:
    1: 2    # SearXNG fails → try Exa
    2: 1    # Exa fails → try SearXNG (broader keywords)
    3: 2    # Firecrawl fails → try Exa for URL

cache:
  enabled: true
  directory: ".firecrawl"
  ttl_seconds: 86400    # 24 hours
  search_ttl_seconds: 3600  # 1 hour for search results
  max_entries: 1000

observability:
  log_tier_latency: true
  log_provider_errors: true
  log_credits_used: true
  hivemind_notify_on: [auth_failure, credit_exhaustion, persistent_rate_limit]
