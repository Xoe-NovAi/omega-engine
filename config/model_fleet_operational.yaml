  subagent: "inherit"
  extraction: "native_gguf_lfm"  # v2.0.0: was native_gguf_extractor (Qwen3-1.7B)
  agentic_local: "native_gguf_lfm"  # v2.0.0: NEW role for LFM2.5-2.6B
  reasoning: "native_gguf_reasoner"  # v2.0.0: opt-in only (RAM constraint)
  bulk_coding: "deepseek_v4_flash"
  long_context: "longcat_3_0"
  specialized_coding: "laguna_s_2_1"
  fast_cheap: "zen_free.mimo-v2.5-free"
  reasoning_cloud: "zen_free.nemotron-3-ultra-free"
  chinese_code: "zen_free.hy3-free"
  finance: "zen_free.ling-3.0-flash-fin-free"  # v2.0.0: now 262K context
  creative: "zen_free.muse-spark-1.2-contributor-free"  # v2.0.0: now 1M context
  multimodal: "zen_free.muse-spark-1.2-contributor-free"  # v2.0.0: NEW role
  vnr_analyst: "zen_free.ling-3.0-flash-fin-free"  # v2.0.0: NEW role (probe)
  premium_reasoning: "zen_paid.gpt-5.6-sol"
  premium_coding: "zen_paid.claude-sonnet-4"
  fallback_chain:
    - "native_gguf_lfm"  # v2.0.0: LFM2.5-2.6B is now primary fallback
    - "ollama"
    - "m3_primary"
    - "zen_free.mimo-v2.5-free"

health_checks:
  interval_seconds: 60
  timeout_seconds: 10
  failure_threshold: 3
  recovery_threshold: 2
  endpoints:
    - name: "ollama"
      url: "http://127.0.0.1:11434/api/tags"
      expected_status: 200
    - name: "native_gguf_extractor"
      url: "http://127.0.0.1:1234/v1/models"
      expected_status: 200
    - name: "native_gguf_reasoner"
      url: "http://127.0.0.1:1235/v1/models"
      expected_status: 200
    - name: "lmstudio"
      url: "http://localhost:1234/v1/models"
      expected_status: 200
    - name: "openrouter"
      url: "https://openrouter.ai/api/v1/models"
      expected_status: 200
    - name: "opencode_zen"
      url: "https://api.opencode.ai/v1/models"
      expected_status: 200

budgets:
  daily_usd_limit: 50.00
  monthly_usd_limit: 1000.00
  per_model_daily:
    m3_primary: 0.00
    deepseek_v4_flash: 15.00
    longcat_3_0: 15.00
    laguna_s_2_1: 5.00
    zen_paid: 20.00
  alerts:
    - threshold: 0.8
      action: "warn"
    - threshold: 0.95
      action: "pause_paid_tiers"
    - threshold: 1.0
      action: "pause_all_cloud"

