schema_version: "1.0"
document_type: "operational_config"

# OPERATIONAL, MACHINE-LOCAL MODEL FLEET — NOT LOADED BY ANY CODE.
# Nothing in src/, mcp_servers/ or scripts/ reads this file; it is a working
# reference for local fleet provisioning.
#
# M29 (2026-10-09): absolute machine paths were removed so the public tree no
# longer discloses the local account name and mount layout. `model_path` values
# are now `${OMEGA_MODELS_DIR}/<file>.gguf`.
#
# ⚠️ THERE IS NO ENV EXPANDER FOR THIS FILE. It is not wired to
# `os.path.expandvars`, and no other config in this repo uses `${VAR}` — that
# convention exists only here. If this file is ever promoted to be loaded, the
# expander must be added FIRST, or `model_path` resolves to a literal
# "${OMEGA_MODELS_DIR}/..." string. Prefer excluding it from the public cut
# over promoting it.
document_id: "MODEL_FLEET_OPERATIONAL-20260901"
title: "Omega Engine — Model Fleet Operational Configuration"
status: "ACTIVE — RUNTIME CONFIG"
date: "2026-09-01"
sprint: "PUBLIC-DEBUT-01"
owner: "Grokster"

# CHANGELOG v2.0.0 (2026-09-01, Grokster per Architect directive):
#   - LFM2.5-2.6B added as agentic_local in tier_0_local_sovereign
#   - Qwen3-4B-Thinking-2507 removed from hot-load default (RAM constraint)
#     — now opt-in via `start-reasoner` subcommand
#   - Muse Spark 1.2 context fixed: 32K → 1,048,576 (32x correction)
#   - Ling 3.0 Flash Fin context fixed: 32K → 262,144 (8x correction)
#   - LFM2.5-2.6B context: 131,072 (128K)
#   - See: data/coordination/R_RESEARCHER_NES_MODEL_SPECS_VNR_20260901.md
#          data/coordination/GROKSTER_JC_EIS_BRIEFING_LFM_FLEET_20260901.md

fleet_overview:
  description: "Operational model fleet for Omega Engine alpha launch and post-launch operations. Maps logical roles to concrete model endpoints with health checks, fallbacks, and cost controls."
  philosophy: "Local-first (M7), cloud fallback only, sovereign entity ownership."

fleet_topology:
  tier_0_local_sovereign:
    description: "Primary - Local inference only, no cloud dependency"
    providers:
      - name: "ollama"
        port: 11434
        models: ["qwen2.5:0.5b", "nomic-embed-text:v1.5"]
      - name: "native-gguf-lfm"
        # v2.0.0: LFM2.5-2.6B (1.67GB Q4_K_M) — primary agentic_local
        # Purpose-built for tool use, open weights lfm1.0, <2.5GB memory
        port: 1234
        model: "LFM2.5-2.6B-Q4_K_M.gguf"
      - name: "native-gguf-qwen"
        # v2.0.0: Qwen3-1.7B (1.67GB Q6_K) — extraction fallback
        # Available as second instance on port 1236 if RAM allows
        port: 1236
        model: "Qwen3-1.7B-Q6_K.gguf"
        optional: true
        condition: "16GB+ RAM available"
      - name: "native-gguf-reasoner"
        # v2.0.0: Qwen3-4B-Thinking is OPT-IN (port 1235)
        # Loaded only via `scripts/serve_native_gguf.sh start-reasoner`
        # Architect system (16GB RAM) cannot run this with other models
        port: 1235
        model: "Qwen3-4B-Thinking-2507-Q4_K_M.gguf"
        optional: true
        opt_in: true
        condition: "16GB+ RAM available, opt-in only"
      - name: "lmstudio"
        port: 1234
        models: ["Qwen3-1.7B-Q6_K.gguf"]
  
  tier_1_cloud_workhorse:
    description: "OpenCode native models - primary workhorse"
    providers:
      - name: "m3_primary"
        provider: "openrouter"
        model_id: "minimax/minimax-m3:free"
        count: 1
      - name: "deepseek_v4_flash"
        provider: "openrouter"
        model_id: "deepseek/deepseek-v4-flash-0731"
        count: 3
      - name: "longcat_3_0"
        provider: "openrouter"
        model_id: "longcat/longcat-3.0-1m"
        count: 3
      - name: "laguna_s_2_1"
        provider: "openrouter"
        model_id: "poolside/laguna-s-2.1"
        count: 1
  
  tier_2_specialized_cloud:
    description: "OpenCode Zen models - specialized roles"
    zen_free:
      provider: "opencode-zen"
      models:
        - "mimo-v2.5-free"
        - "nemotron-3-ultra-free"
        - "hy3-free"
        - "ling-3.0-flash-fin-free"
        - "muse-spark-1.2-contributor-free"
        - "deepseek-v4-flash-free"
        - "nemotron-3.5-lightning-free"
        - "x-preview-f-free"
    zen_paid:
      provider: "opencode-zen"
      models:
        - "gpt-5.6-sol"
        - "claude-sonnet-4"
        - "gemini-3-pro"
  
  tier_3_premium_cloud:
    description: "Premium paid models on-demand"
    providers:
      - name: "glm_5_3_flash"
        provider: "z.ai"
        model_id: "glm-5.3-flash"
      - name: "deepseek_v4_flash_paid"
        provider: "openrouter"
        model_id: "deepseek/deepseek-v4-flash-0731"

tier_0_local_sovereign_details:
  ollama:
    enabled: true
    endpoint: "http://127.0.0.1:11434/v1"
    models:
      - id: "qwen2.5:0.5b"
        role: "fast_local"
        context: 32768
        max_output: 4096
        use_case: "Quick local inference, embeddings"
      - id: "nomic-embed-text:v1.5"
        role: "embedding"
        context: 8192
        use_case: "Local embeddings (768-dim)"
    health_check: "/api/tags"
    timeout: 30
    max_concurrent: 2

  native_gguf_lfm:
    # v2.0.0: New primary agentic_local provider
    enabled: true
    endpoint: "http://127.0.0.1:1234/v1"
    model_path: "${OMEGA_MODELS_DIR}/LFM2.5-2.6B-Q4_K_M.gguf"
    models:
      - id: "lfm-2.5-2.6b-local"
        role: "agentic_local"
        context: 131072
        max_output: 8192
        use_case: "Subagent dispatch, tool calling, instruction following. Open weights (lfm1.0 license), <2.5GB memory, M7 compliant."
    health_check: "/v1/models"
    timeout: 60
    max_concurrent: 1
    notes: |
      LFM2.5-2.6B (Liquid AI, 2026-08-04) is the highest-priority local model addition.
      Replaces Qwen3-1.7B as default for native-gguf-extractor on port 1234.
      Speed: 113 tok/s on Ryzen AI Max+ 395, ~30-50 tok/s on Ryzen 7 5700U.
      Leads at instruction following (80.1% Multi-IF, 85.5% IFStruct).
      Falls behind Qwen3-4B-Thinking on knowledge/coding — reasoner remains opt-in.

  native_gguf_qwen:
    # v2.0.0: Qwen3-1.7B available as second instance (port 1236) if RAM allows
    enabled: true
    endpoint: "http://127.0.0.1:1236/v1"
    model_path: "${OMEGA_MODELS_DIR}/Qwen3-1.7B-Q6_K.gguf"
    models:
      - id: "qwen3-1.7b-local"
        role: "extraction"
        context: 4096
        max_output: 2048
        use_case: "Entity extraction, summarization, classification. Higher quality than LFM2.5-2.6B on these tasks per Qwen family strengths."
    health_check: "/v1/models"
    timeout: 60
    max_concurrent: 1
    optional: true
    notes: |
      Run on a separate port (1236) only if system has 16GB+ RAM.
      The Architect's system runs LFM2.5-2.6B on port 1234 (default) and skips this
      unless explicit test mode. Use scripts/test_lfm_vs_qwen.py to compare.

  native_gguf_extractor:
    enabled: true
    endpoint: "http://127.0.0.1:1234/v1"
    model_path: "${OMEGA_MODELS_DIR}/LFM2.5-2.6B-Q4_K_M.gguf"
    models:
      - id: "lfm-2.5-2.6b-local"
        role: "extraction"
        context: 131072
        max_output: 8192
        use_case: "Primary local extraction (was Qwen3-1.7B-Q6_K, replaced by LFM2.5-2.6B)"
    health_check: "/v1/models"
    timeout: 60
    max_concurrent: 1
    notes: |
      v2.0.0: model_path changed to LFM2.5-2.6B-Q4_K_M.gguf.
      To revert to Qwen3-1.7B: set OMEGA_NATIVE_GGUF_MODEL=Qwen3-1.7B-Q6_K.gguf

  native_gguf_reasoner:
    # v2.0.0: OPT-IN only (Architect directive: 16GB RAM constraint)
    enabled: false
    opt_in: true
    endpoint: "http://127.0.0.1:1235/v1"
    model_path: "${OMEGA_MODELS_DIR}/Qwen3-4B-Thinking-2507-Q4_K_M.gguf"
    models:
      - id: "qwen3-4b-thinking"
        role: "reasoning"
        context: 32768
        max_output: 8192
        use_case: "Chain-of-thought, multi-step reasoning"
    health_check: "/v1/models"
    timeout: 120
    max_concurrent: 1
    notes: |
      v2.0.0: NOT hot-loaded by default. Architect's 16GB system cannot run this
      alongside LFM2.5-2.6B + OS + applications. To enable:
        $ scripts/serve_native_gguf.sh start-reasoner
      RAM cost: ~3GB additional when active.

  lmstudio:
    enabled: true
    endpoint: "http://localhost:1234/v1"
    models:
      - id: "qwen3-1.7b-q6_k"
        role: "local_fallback"
        context: 4096
      - id: "qwen3-4b-thinking"
        role: "reasoning_fallback"
        context: 32768
    health_check: "/v1/models"
    timeout: 60
    max_concurrent: 1

