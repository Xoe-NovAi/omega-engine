# =============================================================================
# Entity→Model Affinity Database — v1.0.0
# Maps Omega entities to preferred models across inference tiers.
# AP-Token: AP-ENTITY-AFFINITY-CONFIG-v1.0.0
# ⬡ OMEGA ⬡ LILITH ⬡ deepseek-v4-flash-free ⬡ opencode ⬡ PORT-SPEC
#
# Ported from xna-omega-legacy/config/entity_model_affinity.yaml (382 lines).
# Uses STRUCTURED MATCH SCHEMA (not legacy string conditions).
# =============================================================================
#
# ── Default (for unregistered entities or generic queries) ──────────────────

__default__:
  preferred_models:
    local_fast:
      model: "qwen3-1.7b"
      provider: "native-gguf"
      size: "~1.7B"
    local_deep:
      model: "qwen3-4b-thinking-q4_k_m"
      provider: "native-gguf"
      size: "~4B"
    cloud:
      model: "gemini-3.5-flash"
      provider: "google"
  routing_rules:
    - match:
        domain: ["general"]
        prompt_length_lt: 100
      use: iris
    - match:
        domain: ["coding", "technical", "shell"]
      use: local_fast
    - match:
        complexity_gt: 0.7
      use: local_deep
    - match:
        online: true
        requires: ["verification"]
      use: cloud
  inference_presets:
    temperature: 0.7
    preferred_context: 8192

