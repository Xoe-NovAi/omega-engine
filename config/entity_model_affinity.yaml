# Entity Model Affinity Configuration (Phase 4.4 — Backburner)
# Maps entities to preferred models for provider-affinity routing.
# Manual user selection (OMEGA_MODEL_OVERRIDE / OPENCODE_MODEL) always takes precedence.
# When no affinity is defined, falls back to DEFAULT_ENTITY_MODEL (opencode/big-pickle).

entity_affinities:
  # Format: entity_name: [model_1, model_2, ...] (preferred order)
  # Leave empty to use default for all entities.

  # Example (uncomment when ready):
  # kali: ["opencode/big-pickle"]
  # maat: ["opencode/big-pickle"]
  # lilith: ["opencode/big-pickle"]

# Inference presets (used by entity_affinity.py if present)
inference_presets:
  default:
    temperature: 0.7
    context_window: 8192
  creative:
    temperature: 0.9
    context_window: 8192
  analytical:
    temperature: 0.3
    context_window: 8192