# LAN EXPOSURE ALLOWLIST — versioned, reviewable, authoritative.
#
# WHY THIS FILE EXISTS (2026-09-28, E1 dispatch):
#   Three separate times a service was found bound to a non-loopback interface
#   while the tailnet policy was believed to describe the whole exposure:
#     1. NFS      — 0.0.0.0:[::] on 2049, 20048, 32803
#     2. Redis    — *:6379 via the omega-redis quadlet
#     3. deluged  — 192.168.1.100%<WIFI_IFACE>:51372 and 10.0.0.1%<TAILSCALE_IFACE>:51372
#   None were visible in the tailnet policy. None would have been caught by any
#   existing gate. "Policy excision is not host excision" — this file is the
#   machine-checkable form of that sentence.
#
# HOW TO USE IT:
#   Every listener returned by `ss -ltn` that is bound to a NON-loopback address
#   must appear in `allowed_lan_bindings` below, or `make check-lan-exposure`
#   goes RED and temple-grade fails. Adding an entry is a deliberate, visible,
#   reviewable act. There is no glob and no wildcard for ports: an entry is
#   (address, port, process-substring) and must be justified in review.
#
#   Do NOT "fix" a failing gate by adding the offender to this file without
#   recording why in the PR. That is the exact failure mode this gate exists to
#   prevent.

version: 1
updated: "2026-09-28"
owner: doom_guy (S1)

# Addresses that are never reported: loopback and the systemd-resolved stub.
always_exempt_addresses:
  - 127.0.0.1
  - 127.0.0.53
  - 127.0.0.54
  - ::1
  - fe80::/10          # link-local, unroutable off-link

# Tailnet addresses (Tailscale CGNAT 100.64.0.0/10 + fd7a::/8). These are a
# DIFFERENT exposure class: a tailnet bind is still gated by the Tailscale
# packet filter, so a bind here is not equivalent to a LAN bind. The audit
# reports them in a separate section and applies a separate allowlist.
tailnet_addresses:
  - 10.0.0.1      # n0 tailnet IPv4
  - fd7a:115c:a1e0::d835:3344   # n0 tailnet IPv6

# Interfaces whose addresses count as "tailnet" for classification purposes.
tailnet_interfaces:
  - <TAILSCALE_IFACE>

# LAN / routable bindings that are APPROVED. Currently none.
#
# Every entry removed from this list during E1:
#   - 0.0.0.0:2049 nfsd        (NFS server excised)
#   - 0.0.0.0:20048 mountd     (NFS server excised)
#   - 0.0.0.0:32803 lockd      (NFS server excised)
#   - 0.0.0.0:6379 redis       (rebound to 127.0.0.1 in E1)
#   - 0.0.0.0:51372 deluged    (removal in progress, E1)
allowed_lan_bindings: []
#   example shape (do not enable without review):
#   - address: "0.0.0.0"
#     port: 8080
#     process: "caddy"
#     reason: "Approved public entrypoint, PR #123"

# Tailnet bindings that are APPROVED. These are policy-gated by tailscaled, so
# the risk is lower than a LAN bind, but they are still enumerated so that a
# new one cannot appear silently.
allowed_tailnet_bindings:
  - address: "10.0.0.1"
    port: 8016
    process: "tailscaled"
    reason: "Hub MCP — Tailscale Serve route, tailnet-only, ACL-gated"
  - address: "10.0.0.1"
    port: 8019
    process: "tailscaled"
    reason: "Omega exchange pipe — Tailscale Serve route, tailnet-only, read-only"
  - address: "10.0.0.1"
    port: 40656
    process: "tailscaled"
    reason: "tailscaled internal (peerapi/DERP), not user-facing"
  # tailscaled also holds a v4 listener on an ephemeral high port for its own
  # peer/telemetry traffic. Attribution was confirmed with a root-side
  # `ss -ltnp`: 10.0.0.1:43961 is tailscaled pid 2280 fd=22. It is
  # infrastructure, not a user service, and it is tailnet-scoped. The port
  # number is assigned by tailscaled and can change across restarts, so it is
  # matched by process rather than pinned — if a future run reports a
  # different high port from tailscaled, update this entry rather than
  # widening the LAN allowlist.
  - address: "10.0.0.1"
    port: 43961
    process: "tailscaled"
    reason: "tailscaled internal peer/telemetry listener (root-confirmed pid 2280)"
  # Same two Serve ports, IPv6. Tailscale Serve listens on BOTH the v4 and the
  # fd7a:: address, so approving only the v4 entry leaves the v6 socket
  # reported on every run — a gate that cries wolf is a gate that gets ignored.
  - address: "fd7a:115c:a1e0::d835:3344"
    port: 8016
    process: "tailscaled"
    reason: "Hub MCP — IPv6 twin of the 8016 Serve route"
  - address: "fd7a:115c:a1e0::d835:3344"
    port: 8019
    process: "tailscaled"
    reason: "Exchange pipe — IPv6 twin of the 8019 Serve route"
  - address: "fd7a:115c:a1e0::d835:3344"
    port: 40656
    process: "tailscaled"
    reason: "tailscaled internal (peerapi/DERP), IPv6"

# Ports the audit should NEVER report regardless of bind address, because they
# are transient or kernel-internal and produce false positives. Keep this short
# and justify every entry — a long list here is a gate that cannot fail.
suppressed_ports:
  - 0        # ephemeral bind
