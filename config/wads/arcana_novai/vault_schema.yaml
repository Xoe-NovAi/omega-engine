# 🔱 Arcana-NovAi — Entity Vault Schema
# AP: AP-VAULT-SCHEMA-v1.0.0
# ⬡ OMEGA ⬡ ARCANA-NOVAI ⬡ VAULT ⬡ v1.0.0 ⬡ 2026-06-15
#
# Defines the structure of entity vault entries — shadow state that tracks
# session activity, evolution, and Qliphothic failure history.
#
# The vault is per-entity shadow state accessible via IMemoryAdapter.
# Each entity has one or more vault keys stored by the MnemosyneAdapter.

vault:

  # ── Shadow State (per-entity activity tracker) ──
  shadow:
    description: "Entity session activity history and evolution tracking"
    schema:
      evolution_stage:
        type: string
        enum: ["DORMANT", "AWAKENING", "ACTIVE", "EVOLVING", "TRANSCENDENT"]
        description: "Current evolution stage of the entity"
        default: "DORMANT"
      shadow_xp:
        type: integer
        description: "Cumulative experience points — decrements on failures"
        default: 0
      exchange_count:
        type: integer
        description: "Total exchanges across all sessions"
        default: 0
      last_exchange_ts:
        type: float
        description: "Unix timestamp of last exchange"
        default: 0.0
      last_session_id:
        type: string
        description: "Session ID of the last active session"
        default: null
        nullable: true
      session_count:
        type: integer
        description: "Total sessions initiated"
        default: 0
      current_session_start:
        type: float
        description: "Unix timestamp of current/last session start"
        default: null
        nullable: true
      access_count_7d:
        type: integer
        description: "Times entity was invoked in last 7 days"
        default: 0
      last_audit_score:
        type: float
        description: "Latest soul.yaml integrity audit score (0.0-1.0)"
        default: null
        nullable: true

  # ── Qliphothic History (failure event log) ──
  qliphoth_history:
    description: "Named failure events detected for this entity"
    schema:
      failures:
        type: array
        items:
          type: object
          properties:
            shell_name:
              type: string
              description: "Qliphothic shell name (e.g., 'gemaliel')"
            timestamp:
              type: float
              description: "When the failure occurred"
            trace_id:
              type: string
              description: "Trace ID from the failing operation"
            severity:
              type: string
              enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
            recovery:
              type: string
              description: "Recovery action taken"
        default: []

  # ── Sphere Resonance (cross-entity relationships) ──
  resonance:
    description: "Cross-entity affinity scores tracked during sessions"
    schema:
      affinities:
        type: object
        description: "entity_name -> affinity_score (0.0-1.0)"
        additional_properties:
          type: number
          minimum: 0.0
          maximum: 1.0
        default: {}
      dominant_sphere:
        type: string
        description: "Sphere this entity most resonates with"
        default: null
        nullable: true
      last_resonance_update:
        type: float
        description: "Unix timestamp of last affinity recalculation"
        default: 0.0

  # ── Session Summary (recent session overviews) ──
  session_summaries:
    description: "Rolling window of recent session summaries"
    schema:
      max_count:
        type: integer
        default: 10
      sessions:
        type: array
        items:
          type: object
          properties:
            session_id:
              type: string
            timestamp:
              type: float
            exchange_count:
              type: integer
            l1_narrative:
              type: string
              description: "L1 summary of session content"
            l2_insight:
              type: string
              nullable: true
            l3_principle:
              type: string
              nullable: true
        default: []
