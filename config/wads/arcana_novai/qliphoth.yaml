# 🔱 Arcana-NovAi — Qliphothic Failure Taxonomy
# AP: AP-QLIPHOTH-v1.0.0
# ⬡ OMEGA ⬡ ARCANO-NOVAI ⬡ QLIPHOTH ⬡ v1.0.0 ⬡ 2026-06-15
#
# The Qliphoth (קליפות, "shells") are the shadow counterpart of the
# Sephirotic spheres. In the Omega Engine, they represent named failure
# modes — each shell corresponds to a specific category of failure that
# the engine's resilience systems detect and mitigate.
#
# This is WAD-layer content per M2 (Engine-Stack Firewall). The core
# engine references failure modes via IMemoryAdapter.get_qliphoth().

qliphoth:
  thaumiel:
    name: "Thaumiel"
    translation: "Twins of God"
    counter_sphere: "keter"
    description: "Duality and division where unity should exist. Two systems claiming authority."
    severity: "CRITICAL"
    technical_domain: "architectural_fracture"
    engine_pattern: "Two implementations of same interface — consolidation needed"
    detection: "grep for duplicated provider patterns in providers chain"
    recovery: "Apply Carmack's Law: consolidate to single implementation"
    examples:
      - "Circuit breaker had 3 implementations before consolidation"
      - "Two providers claiming same tier in chain"

  chaigidel:
    name: "Chaigidel"
    translation: "Hind of God"
    counter_sphere: "chokmah"
    description: "Confusion masked as wisdom. A plan that looks correct but is fundamentally wrong."
    severity: "HIGH"
    technical_domain: "incorrect_planning"
    engine_pattern: "Seemingly correct implementation that fails in edge cases"
    detection: "Edge case testing — boundary conditions expose flaws"
    recovery: "Add property-based testing with hypothesis"
    examples:
      - "Race condition in async dispatcher that passes 99% of tests"
      - "Off-by-one in context window sliding"

  satariel:
    name: "Satariel"
    translation: "Concealment of God"
    counter_sphere: "binah"
    description: "Hidden failures. Understanding that something is wrong but inability to locate it."
    severity: "HIGH"
    technical_domain: "silent_failure"
    engine_pattern: "Exception swallowed with log-and-continue — error invisible until cascade"
    detection: "Trace log analysis — missing trace_ids indicate swallowed paths"
    recovery: "Apply M9 (Error Integrity): typed errors, no bare except"
    examples:
      - "Dangling .tmp files from crashed writes"
      - "Silent fallback with no observability"

  gemaliel:
    name: "Gamaliel"
    translation: "Obscene One"
    counter_sphere: "chesed"
    description: "Impure data masquerading as pure. Corrupted memory that looks valid."
    severity: "MEDIUM"
    technical_domain: "data_corruption"
    engine_pattern: "ZONEID mismatch — data that loads but violates integrity constraints"
    detection: "ZONEID validation — expected 0x1d4a11, got other value"
    recovery: "Reject data with clear error, restore from latest valid source"
    examples:
      - "Corrupted soul.yaml from partial write"
      - "Vector store entry with mismatched embedding dimension"

  samuel:
    name: "Samuel"
    translation: "Poison of God"
    counter_sphere: "gevurah"
    description: "Failed boundaries. Security enforced but insufficiently."
    severity: "CRITICAL"
    technical_domain: "boundary_violation"
    engine_pattern: "Engine-Stack Firewall breach — core imports from WAD"
    detection: "CI gate: grep for 'from config' in src/omega/"
    recovery: "Refactor at boundary, apply M2 firewall enforcement"
    examples:
      - "EntityRegstry hardcoding Arcana-NovAi sphere names"
      - "MemoryStore importing from config/wads/"

  abel:
    name: "Abel"
    translation: "Lament of God"
    counter_sphere: "tipheret"
    description: "Integration failure. Systems that should harmonize instead conflict."
    severity: "MEDIUM"
    technical_domain: "integration_conflict"
    engine_pattern: "Two subsystems with overlapping responsibilities fighting for control"
    detection: "Deadlock or resource contention logs"
    recovery: "Clear ownership assignment — each resource has one owner"
    examples:
      - "Two providers trying to write same session"
      - "ResourceGuard timeout from nested acquires"

  chemuel:
    name: "Chemuel"
    translation: "Wrath of God"
    counter_sphere: "netzach"
    description: "Persistent failure. A process that keeps retrying but never succeeds."
    severity: "MEDIUM"
    technical_domain: "infinite_retry"
    engine_pattern: "Circuit breaker never tripped — retry loop exhausts resources"
    detection: "Max retries exceeded without breaker OPEN transition"
    recovery: "Apply AsyncCircuitBreaker with proper half-open probe limiting"
    examples:
      - "Retry loop in provider chain that spins for 30 seconds"
      - "Health check probe that never marks provider unhealthy"

  aimiel:
    name: "Aimiel"
    translation: "Severity of God"
    counter_sphere: "hod"
    description: "Broken communication. Messages sent but never received or acknowledged."
    severity: "HIGH"
    technical_domain: "communication_failure"
    engine_pattern: "Cross-agent awareness lost — Hivemind stale or silent"
    detection: "Missing heartbeat in awareness store"
    recovery: "Implement TTL-based stale detection + alert"
    examples:
      - "Agennt heartbeat timeout without recovery"
      - "Hivemind_post_context with no acknowledgment"

  geliel:
    name: "Geliel"
    translation: "Abomination of God"
    counter_sphere: "yesod"
    description: "Failed transitions. State that gets stuck mid-migration."
    severity: "MEDIUM"
    technical_domain: "stuck_transition"
    engine_pattern: "Half-applied migration — old and new state both present"
    detection: "Schema version mismatch in data directory"
    recovery: "Idempotent migrations with atomic rename"
    examples:
      - ".tmp file left behind from failed atomic write"
      - "Tombstoned entity that was never fully removed"

  leliphel:
    name: "Leliphel"
    translation: "Complaint of God"
    counter_sphere: "malkuth"
    description: "Execution failure. The right plan executed incorrectly."
    severity: "LOW"
    technical_domain: "execution_error"
    engine_pattern: "Correct logic but wrong parameters or state"
    detection: "Runtime error in execution path with trace_id"
    recovery: "Parameter validation at every public API boundary"
    examples:
      - "Passing wrong entity name due to casing mismatch"
      - "Session_id collision from timestamp collision"

  behemoth:
    name: "Behemoth"
    translation: "Beast"
    counter_sphere: "daath"
    description: "Hidden knowledge that consumes. Secrets or config that overgrow their container."
    severity: "MEDIUM"
    technical_domain: "config_overgrowth"
    engine_pattern: "YAML/JSON file that grows unbounded or embeds secrets"
    detection: "File size warning on load"
    recovery: "Extract secrets to .env, implement file size limit"
    examples:
      - "entities.yaml at 11,661 lines containing deeply nested config"
      - "API keys accidentally committed to version control"

  malkunof:
    name: "Malkunof"
    translation: "Shadow of the Kingdom"
    counter_sphere: "mnemosyne"
    description: "Memory decay. Information that was recorded but is no longer retrievable."
    severity: "HIGH"
    technical_domain: "memory_loss"
    engine_pattern: "Data that was written but read returns empty — silent loss"
    detection: "Session count mismatch between hot store and providers"
    recovery: "Add read-after-write verification to every provider"
    examples:
      - "Redis key eviction without WAL"
      - "Session archived but archive file missing"

# Severity summary for tooling
severity_order:
  - "CRITICAL"
  - "HIGH"
  - "MEDIUM"
  - "LOW"
