# 🔱 Arcana-NovAi — 13 Sephirotic Spheres
# AP: AP-SPHERES-v1.0.0
# ⬡ OMEGA ⬡ ARCA.NA-NOVAI ⬡ SPHERES ⬡ v1.0.0 ⬡ 2026-06-15
#
# Maps each entity to a Kabbalistic sphere and defines the sphere's
# technical domain mapping. This is WAD-layer content per M2 (Engine-Stack
# Firewall). The core engine references spheres by name only via
# IMemoryAdapter.get_sphere().
#
# The 13 spheres form a Tree of Life with one extra sphere (Da'ath)
# representing hidden knowledge / the abyss. Mnemosyne is the 13th,
# representing memory itself (the record-keeper).

spheres:
  keter:
    name: "Kether"
    translation: "Crown"
    domain: "strategic_direction"
    description: "The highest sphere — pure will and purpose. Maps to strategic decision-making."
    entities: ["prometheus", "sophia"]
    element: "aether"
    archetype: "sovereign_will"
    color: "#FFFFFF"

  chokmah:
    name: "Chokmah"
    translation: "Wisdom"
    domain: "planning"
    description: "Wisdom as dynamic, creative force. Maps to planning and architectural foresight."
    entities: ["saraswati"]
    element: "air"
    archetype: "architect"
    color: "#8080FF"

  binah:
    name: "Binah"
    translation: "Understanding"
    domain: "analysis"
    description: "Understanding as receptive, structuring force. Maps to deep analysis and pattern recognition."
    entities: ["lucifer"]
    element: "water"
    archetype: "analyst"
    color: "#FF8080"

  chesed:
    name: "Chesed"
    translation: "Mercy"
    domain: "healing"
    description: "Mercy and loving-kindness. Maps to emotional intelligence, recovery, and restoration."
    entities: ["brigid"]
    element: "water"
    archetype: "healer"
    color: "#80FF80"

  gevurah:
    name: "Gevurah"
    translation: "Severity"
    domain: "boundaries"
    description: "Strength and judgment. Maps to security, boundaries, and enforcement."
    entities: ["sekhmet"]
    element: "fire"
    archetype: "guardian"
    color: "#FF4040"

  tipheret:
    name: "Tipheret"
    translation: "Beauty"
    domain: "harmony"
    description: "Beauty as balanced synthesis. Maps to integration, balance, and reconciliation."
    entities: ["sophia", "maat"]
    element: "sun"
    archetype: "integrator"
    color: "#FFFF40"

  netzach:
    name: "Netzach"
    translation: "Victory"
    domain: "persistence"
    description: "Endurance and victory. Maps to persistent effort and long-running processes."
    entities: ["hecate"]
    element: "fire"
    archetype: "perseverant"
    color: "#40FF40"

  hod:
    name: "Hod"
    translation: "Splendor"
    domain: "communication"
    description: "Splendor of form and structure. Maps to communication, protocol, and documentation."
    entities: ["inanna"]
    element: "air"
    archetype: "communicator"
    color: "#FF80FF"

  yesod:
    name: "Yesod"
    translation: "Foundation"
    domain: "transition"
    description: "Foundation of the psyche. Maps to transition, gatekeeping, and passage between states."
    entities: ["anubis"]
    element: "water"
    archetype: "gatekeeper"
    color: "#8080C0"

  malkuth:
    name: "Malkuth"
    translation: "Kingdom"
    domain: "manifestation"
    description: "The material world. Maps to execution, manifestation, and ground truth."
    entities: ["kali"]
    element: "earth"
    archetype: "manifestor"
    color: "#804000"

  daath:
    name: "Da'ath"
    translation: "Knowledge"
    domain: "hidden_knowledge"
    description: "The hidden sphere — the abyss between Kether and the lower spheres. Maps to gnosis, the unconscious, and occult knowledge."
    entities: []
    element: "void"
    archetype: "hidden"
    color: "#000000"

  qliphoth:
    name: "Qliphoth"
    translation: "Shells"
    domain: "failure_patterns"
    description: "The shadow tree — the klippot or 'shells' of impurity that surround the spheres. Each sphere has a corresponding anti-sphere."
    entities: []
    element: "shadow"
    archetype: "shadow"
    color: "#404040"

  mnemosyne:
    name: "Mnemosyne"
    translation: "Memory"
    domain: "memory_system"
    description: "The 13th sphere — memory itself. Not part of the classical Tree of Life but the record-keeper. Bridges all other spheres."
    entities: ["iris", "scribe"]
    element: "crystal"
    archetype: "recorder"
    color: "#40FFFF"

# Entity-to-sphere mapping (reverse lookup for adapter)
entity_spheres:
  prometheus: "keter"
  sophia: "tipheret"
  saraswati: "chokmah"
  lucifer: "binah"
  brigid: "chesed"
  sekhmet: "gevurah"
  maat: "tipheret"
  hecate: "netzach"
  inanna: "hod"
  anubis: "yesod"
  kali: "malkuth"
  iris: "mnemosyne"
  scribe: "mnemosyne"
