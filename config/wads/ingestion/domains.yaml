# Omega Engine — Sovereign Ingestion Domain Configuration
# M2 Compliance: Domain policies belong in the WAD layer, not Engine Core.
# This file is loaded by SovereignScraper at runtime.

ingestion:
  domain_allowlist:
    # Project Gutenberg — Free eBooks
    gutenberg: "^https?://[^.]*\\.gutenberg\\.org/.*$"
    
    # arXiv — Pre-print research papers
    arxiv: "^https?://arxiv\\.org/.*$"
    
    # PubMed — Biomedical literature
    pubmed: "^https?://pubmed\\.ncbi\\.nlm\\.nih\\.gov/.*$"
    
    # Internet Archive — Digital library
    internet_archive: "^https?://[^.]*\\.archive\\.org/.*$"
    
    # Open Library — Book metadata
    open_library: "^https?://openlibrary\\.org/.*$"
    
    # Library of Congress — US national library
    loc: "^https?://[^.]*\\.loc\\.gov/.*$"
    
    # JSTOR — Academic journals (requires auth)
    # jstor: "^https?://[^.]*\\.jstor\\.org/.*$"
    
    # Project MUSE — Humanities and social sciences
    # muse: "^https?://[^.]*\\.muse\\.jhu\\.edu/.*$"

  # Extraction tier defaults
  extraction:
    default_tier: "fast"  # fast | surgical | deep
    fallback_tier: "surgical"
    deep_tier_threshold: 0.3  # Delta threshold to trigger T2 Surgical
    
  # CAS (Content-Addressable Storage) configuration
  cas:
    base_dir: "data/archive/cas"
    hash_algorithm: "sha256"
    
  # Worker configuration
  worker:
    redis_url: "redis://localhost:6379"
    queue_name: "curation_queue"
    max_retries: 3
    backoff_base_ms: 100
    backoff_max_ms: 60000
