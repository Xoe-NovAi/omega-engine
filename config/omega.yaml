omega:
  identity:
    name: Omega Engine
    version: 1.0.0-alpha
    description: Local-first, entity-centric, provider-agnostic AI council runtime
    maintainer: Xoe-NovAi
    license: Apache-2.0
  session_header:
    mode: compact
    default_entity: default
  entity:
    active_iwad: _omega_default
    default: default
    user: arch
    allow_transient: true
  data:
    dir: data
    entities_dir: data/entities
    session_log: true
    session_log_dir: data/sessions
  inference:
    strategy: local_first
    vector_quantization:
      enabled: true
      type: "scalar"
      precision: "int8"
      always_ram: true
    hardware:
      cpu: "AMD Ryzen 7 5700U"
      architecture: "zen2"
      physical_cores: [0, 2, 4, 6]
      io_threads: [1, 3, 5, 7, 9, 11]
      threads: 6
      ram_total_mb: 14336
      ram_os_overhead_mb: 2000
      ram_available_ai_mb: 12336
      draft_resident_mb: 300
      draft_entity: iris
  observability:
    enable_dataset_collection: true
    enable_trace_logging: true
    trace_length: 12
  location:
    sovereign_home:
      latitude: 0.0
      longitude: 0.0
      timezone: "UTC"
      name: "Sovereign Void"
  hivemind:
    url: "http://127.0.0.1:8016"
    cli: "opencode"
    retention:
      workspace_days: 30      # P7 Alignment: matches observation log (was 7)
      observation_days: 30    # Observability log retention
      grace_ratio: 0.25       # 25% grace period (id Software pattern)
      warm_ttl_hours: 24      # Warm awareness tier
      hot_ttl_minutes: 5      # Hot presence tier (in-memory)
  model_updater:
    enabled: true
    schedule: "0 */6 * * *"
    model: "gemma-4-31b-it"
    thread_limit: 2
    confidence_minimum: 0.85
    max_changes_per_cycle: 30
    providers:
      - name: opencode-zen
        enabled: true
      - name: google
        enabled: true
      - name: cline
        enabled: true
    notifications:
      on_change: true
      on_error: true
      channel: observability
  sovereignty:
    mandates:
      ratified: [M1, M2, M3, M4, M5, M6, M7, M8, M9, M10, M11, M12, M13, M14, M15, M16, M17, M18, M19, M20, M21, M22]
      count: 22
      version: 3.5.0
    fleet:
      agent_count: 11
      max_slots: 10
      cap_with_review: 14
