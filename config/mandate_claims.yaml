# mandate_claims.yaml — data-driven claims-vs-disk rules (verify-mandate-claims)
#
# Each rule: a document pattern that ASSERTS a mechanical fact, plus the
# probe paths that must exist on disk for the claim to be true.
# Born from C2-class finding: 4 documents asserted an uninstalled pre-commit
# hook (Team-Study #1, ruling S7). Probe-path bound to each evidence claim
# per ledger O-Q4 concurrence.
claims:
  - id: tracking-precommit-hook-installed
    pattern: '(pre-commit|tracking-state) hook .*(installed|active|wired|enforced)'
    file_globs:
      - '**/*.md'
    probe_paths:
      - .pre-commit-config.yaml
    probe_contains:
      - omega-tracking-state
  - id: verify-mandate-claims-wired
    pattern: 'verify-mandate-claims .*(wired|installed|enforced|in CI)'
    file_globs:
      - '**/*.md'
    probe_paths:
      - scripts/verify_mandate_claims.py

# Forbidden patterns — HARD-FAIL rules (unlike claims above, these exit 1
# regardless of warn-only phase). Scanned across the WHOLE tree, not just
# the diff: re-introduction anywhere must break the gate.
forbidden:
  - id: d593-hardcoded-redis-password
    # Matches bare AND type-annotated defaults: password="omega",
    # password: str = 'omega', self.password: Optional[str] = "omega".
    # RETAINED deliberately after the 2026-09-28 Redis removal. The literal
    # "omega" was a plaintext credential committed to git history and is
    # compromised regardless of the service being gone; this rule is the
    # control that stops it (or any sibling credential) being reintroduced.
    pattern: 'password\s*(?::[^=\n]+)?=\s*["'']omega["'']'
    file_globs:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
    reference: 'D-593 / DC-29 — never a literal default; use an env lookup (OMEGA_REDIS_PASSWORD pattern) or the vault'
