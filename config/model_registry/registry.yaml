# 🔱 Omega Engine — Model Registry Metadata
# ⬡ OMEGA ⬡ KALI ⬡ MODEL-REGISTRY ⬡ 2026-07-18

version: "1.0.0"
schema_version: "1.0.0"
created_at: "2026-07-18"
updated_at: "2026-07-18"
author: "kali"

# Registry configuration
registry:
  name: "omega-model-registry"
  description: "Unified model registry merging Provider Fabric, Research Profiles, Model Card Library, and Model Study KB"
  source_of_truth: "files"  # Files are source; SQLite is derived index
  index_path: "config/model_registry/index.sqlite"

# Model card schema reference
model_card_schema:
  required_fields:
    - model_id
    - display_name
    - version
    - provider
    - platform
    - tier
    - status
    - context_window
    - capabilities
    - pricing
    - routing
    - research_profile
    - provider_fabric
    - tags
    - created_at
    - updated_at
    - schema_version
  optional_fields:
    - identity_history
    - community_intelligence
    - live_api_state
    - empirical_evidence
    - synergies

# Tier definitions
tiers:
  T1:
    name: "Reflex / Fast"
    description: "Near-instant response for simple tasks"
    typical_latency_ms: "< 1000"
    use_cases: ["reflex", "classification", "extraction", "simple_qa"]
  T2:
    name: "Balanced"
    description: "Good reasoning with reasonable latency"
    typical_latency_ms: "1000-3000"
    use_cases: ["coding", "analysis", "synthesis", "tool_use"]
  T3:
    name: "Reasoning / Knowledge"
    description: "Deep reasoning, large context, high capability"
    typical_latency_ms: "> 3000"
    use_cases: ["architecture", "debugging", "research", "complex_reasoning"]

# Platform definitions
platforms:
  cloud:
    description: "Cloud API models (OpenRouter, Google, Anthropic, OpenAI)"
    providers: ["openrouter", "google", "anthropic", "openai", "together", "sambanova"]
  local:
    description: "Local GGUF models via native-gguf, LM Studio, Ollama"
    providers: ["native-gguf", "lmster", "ollama"]
  cli:
    description: "CLI-exclusive models (OpenCode Zen, Cline)"
    providers: ["opencode-zen", "cline"]
  stealth:
    description: "Models with identity swapping (Big Pickle)"
    providers: ["opencode-zen"]

# Status definitions
statuses:
  active: "Currently available and recommended"
  deprecated: "No longer recommended; replacement exists"
  experimental: "New or unstable; use with caution"
  stealth: "Identity may change without notice"

# Provider fabric integration
provider_fabric:
  fallback_chain:
    - provider: "native-gguf"
      priority: 0
      description: "Local GGUF via llama.cpp (highest priority)"
    - provider: "lmster"
      priority: 1
      description: "LM Studio local server"
    - provider: "ollama"
      priority: 2
      description: "Ollama local server"
    - provider: "antigravity"
      priority: 3
      description: "Antigravity OAuth-based frontier models (Gemini, Claude, GPT-OSS)"
    - provider: "google"
      priority: 4
      description: "Google AI Studio / Vertex"
    - provider: "openrouter"
      priority: 5
      description: "OpenRouter free tier"
    - provider: "opencode-zen"
      priority: 6
      description: "OpenCode Zen (CLI)"
    - provider: "cline"
      priority: 7
      description: "Cline (CLI)"
    - provider: "mock"
      priority: 99
      description: "Test mock provider"

# Validation gates (Temple-Grade)
validation_gates:
  - id: "SCHEMA_VALID"
    description: "All model cards validate against schema"
  - id: "NO_DUPLICATES"
    description: "Unique model_id across registry"
  - id: "PROVIDER_CHAIN_COMPLETE"
    description: "Fallback chain has no gaps"
  - id: "RESEARCH_PROFILES_COMPLETE"
    description: "All models in KB have research profile"
  - id: "EMPIRICAL_EVIDENCE_LINKED"
    description: "Test runs reference valid test_run_ids"
  - id: "SYNERGIES_BIDIRECTIONAL"
    description: "If A references B, B references A"
  - id: "INDEX_SYNC"
    description: "SQLite index matches file contents"
  - id: "PROVIDER_FABRIC_COMPATIBLE"
    description: "Registry can generate providers.yaml"