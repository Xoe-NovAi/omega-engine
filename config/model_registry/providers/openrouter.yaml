# OpenRouter Provider Configuration
# ⬡ OMEGA ⬡ KALI ⬡ MODEL-REGISTRY ⬡ 2026-07-18

provider: "openrouter"
priority: 5
enabled: true
description: "OpenRouter free tier and paid models"

api_key: "env:OPENROUTER_API_KEY"
base_url: "https://openrouter.ai/api"

