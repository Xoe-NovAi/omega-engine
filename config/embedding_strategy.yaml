# 🔱 Omega Engine — Embedding Strategy Configuration
# ⬡ OMEGA ⬡ JEM ⬡ 2026-07-20
# SOURCE OF TRUTH for all embedding dimensions, models, collections
# Derived from: docs/strategy/EMBEDDING_HARDENING_STRATEGY_20260720.md

version: "1.2.0"   # 1.2.0 — D-1024-DIM-NATIVE-20260926 (768 -> 1024)
canonical_dimension: 1024

# MRL truncation ladder (AVAILABLE, NOT canonical).
# 1024 is first because native width == canonical width.
mrl_dimensions: [1024, 768, 512, 256, 128, 64]

# Vec0 table lock — HARDCODED, prevents silent corruption
# NOTE (Carmack audit 2026-09-26): `vec0_lock` is DECLARATIVE ONLY. It is read
# by tests/contracts/test_embedding_dimension.py, not by any runtime code path.
# The ENFORCED runtime guards are:
#   - omega.memory.sqlite_vec_adapter_optimized._ensure_collection_vec_table
#     (compares provider width against the TARGET COLLECTION's declared dim)
#   - omega.memory.embeddings.EmbeddingManager._assert_canonical_width
#     (compares provider width against canonical 1024 — the D-1024 guard)
# A collection whose declared dimension is 768 will happily accept a native-768
# vector; only the canonical-collection write path is model-locked.
vec0_lock:
  enabled: true
  dimension: 1024
  error_on_mismatch: true
  message: |
    Embedding dimension mismatch: provider={actual_dim}, canonical=1024.
    All providers MUST output 1024-dim vectors. MRL truncation available but NOT canonical.

# Provider chain (quality-first order)
# D-1024-DIM-NATIVE-20260926: Qwen3-Embedding-0.6B at 1024-dim native is canonical
providers:
  - id: "qwen3_primary"
    class: "Qwen3GGUFEmbeddingProvider"
    model_path: "env:OMEGA_MODELS_DIR/embeddings/qwen3-embedding-0.6b-Q5_K_M.gguf"
    native_dim: 1024
    mrl_enabled: true
    mrl_dimensions: [768, 512, 256, 128, 64]
    default_mrl: 1024
    pooling: "last"
    instruction_prefix: "Instruct: Retrieve relevant technical documentation\nQuery: "
    collection: "omega_vec_qwen_1024"
    quantization: "int8_rescore"
    oversample: 2
    priority: 0
    capabilities: ["multilingual", "code", "mrl", "instruction_aware", "last_token_pooling"]

  # [D-1024-DIM-NATIVE-20260926 / M23] The priority-1 `nomic_fallback` entry was
  # REMOVED as a SUBSTITUTION PATH. It was a natively-768 nomic-embed-text
  # provider: when the canonical Qwen3-1024 provider was unavailable the chain
  # silently answered with 768-D vectors from a DIFFERENT MODEL, then wrote them
  # to omega_vec_nomic_768 — a different collection than the caller asked for —
  # so neither the vec0 lock nor any dimension validator could see it.
  # A 1024-D Qwen3 vector truncated by MRL to 768/512/... remains LEGAL and is
  # unchanged; what is now forbidden is emitting a NATIVE 768-D vector from a
  # non-canonical model on the canonical write path. Failures now raise.
  # Retirement: Step 19 (D-1024 full re-embed) + Step 20 (legacy alias removal).

  - id: "minilm_speed"
    class: "LocalGGUFEmbeddingProvider"
    model_path: "env:OMEGA_MODELS_DIR/embeddings/all-MiniLM-L6-v2-Q4_K_M.gguf"
    native_dim: 384
    mrl_enabled: false
    collection: "omega_vec_minilm_384"
    quantization: "none"
    priority: 4
    capabilities: ["fast", "english_only"]
    
  - id: "static_zero_cost"
    class: "StaticEmbeddingProvider"
    model_name: "minishlab/potion-base-2M"
    native_dim: 64
    mrl_enabled: false
    collection: "omega_vec_static_64"
    priority: 5
    capabilities: ["zero_cost", "no_dependencies"]

# Session Corpus Search Index (SEPARATE from main vector store)
# -------------------------------------------------------------
# Purpose: Semantic search over HALL_OF_RECORDS + session_gnosis metadata
#          (decisions, continuations, task_current, focus_chain)
# Model: all-MiniLM-L6-v2 (384-dim) via ONNX Runtime (torch-free)
# Index: data/search/session_semantic.db (sqlite-vec, cosine similarity)
# Rationale: Qwen3-Embedding-0.6B has no ONNX export; this index is isolated
#            from canonical 1024-dim vector store. Auto-downloads ~90MB.
# MCP Tools: session_search_semantic, session_search_hybrid, session_search_semantic_stats
# Harvester: mine_semantic_patterns() → topic clusters in radar
session_corpus_search:
  enabled: true
  model: "all-MiniLM-L6-v2"
  format: "onnx"
  dimension: 384
  index_path: "data/search/session_semantic.db"
  source: ["hall_of_records", "session_gnosis"]
  note: "Separate from canonical Qwen3 1024-dim vector store (D-1024-DIM-NATIVE)"

# Collection definitions (maps to vec0 tables)
# D-1024-DIM-NATIVE-20260926: qwen_1024 is canonical
collections:
  omega_vec_qwen_1024:
    dimension: 1024
    metric: "cosine"
    quantization: "int8_rescore"
    hnsw_params:
      m: 16
      ef_construction: 200
      ef_search: 64

  omega_vec_library_1024:
    dimension: 1024
    metric: "cosine"
    quantization: "none"
    rrf_weights: {"fts": 0.6, "vec": 0.4}
       
  # ---- LEGACY / DEPRECATED (pre-D-1024 nomic tier) ------------------------
  # [D-1024-DIM-NATIVE-20260926] These three collections are RETAINED as
  # read/write targets for Step 19 (D-1024 full re-embed) and are DEPRECATED as
  # a semantic space: `nomic` refers to nomic-embed-text, a DIFFERENT MODEL from
  # the canonical Qwen3-Embedding-0.6B. Vectors currently stored here are
  # natively-768 nomic output and are NOT comparable with the canonical space.
  # MRL-truncated Qwen3 (legal) and native nomic (illegal) both land at 768 —
  # the width alone does not identify the model, which is exactly why the
  # fallback had to be removed rather than merely width-checked.
  # REMOVAL: Step 19 (D-1024 full re-embed) + Step 20 (legacy alias removal).
  omega_vec_nomic_768:
    dimension: 768
    metric: "cosine"
    quantization: "int8_rescore"
    deprecated: true
    deprecated_by: omega_vec_qwen_1024
    removal: "Step 19 (D-1024 full re-embed) + Step 20 (legacy alias removal)"
    semantic_space: "nomic-embed-text (natively 768-D) — NOT comparable with canonical Qwen3-1024"
    hnsw_params:
      m: 16
      ef_construction: 200
      ef_search: 64

  omega_vec_nomic_512:
    dimension: 512
    metric: "cosine"
    quantization: "int8_rescore"
    deprecated: true
    deprecated_by: omega_vec_qwen_1024
    removal: "Step 19 (D-1024 full re-embed) + Step 20 (legacy alias removal)"
    semantic_space: "nomic-embed-text (natively 768-D) — NOT comparable with canonical Qwen3-1024"
    hnsw_params:
      m: 16
      ef_construction: 200
      ef_search: 64

  omega_vec_nomic_256:
    dimension: 256
    metric: "cosine"
    quantization: "int8_rescore"
    deprecated: true
    deprecated_by: omega_vec_qwen_1024
    removal: "Step 19 (D-1024 full re-embed) + Step 20 (legacy alias removal)"
    semantic_space: "nomic-embed-text (natively 768-D) — NOT comparable with canonical Qwen3-1024"
    hnsw_params:
      m: 16
      ef_construction: 200
      ef_search: 64

  omega_vec_minilm_384:
    dimension: 384
    metric: "cosine"
    quantization: "none"
    hnsw_params:
      m: 16
      ef_construction: 200
      ef_search: 64
       
  omega_vec_static_64:
    dimension: 64
    metric: "cosine"
    quantization: "none"

# RRF Fusion (universal k=60)
# D-1024-DIM-NATIVE-20260926: qwen3_primary at 1024 is canonical
fusion:
  method: "rrf"
  k: 60
  # [D-1024-DIM-NATIVE-20260926] `nomic_fallback` weight removed with the
  # provider it named. Mixing a non-canonical space into RRF fusion is the same
  # cross-model comparison error the decision forbids; the legacy tiers below
  # are retained for their own collections only, never fused with canonical.
  weights:
    qwen3_primary: 1.0
    nomic_512: 0.6
    nomic_256: 0.4
    minilm_speed: 0.3
    static_zero_cost: 0.1
  final_k: 10