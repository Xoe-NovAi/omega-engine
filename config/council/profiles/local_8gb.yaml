# 🔱 MaKaLi Council — Local 8GB Profile
# 8GB RAM, no GPU, very constrained
# Nodes: batch_2 or serial_independent (2B models max)
# Oversouls: 4B local (cloud if available)
# Kali: cloud (8B won't fit with anything else)

council:
  phase1_execution_mode: "batch_2"
  model_tiers:
    nodes: "gemma-2b-local"
    oversouls: "gemma-4b-local"
    kali: "nemotron-8b-cloud"
    research: "local_2b"
  hardware:
    total_ram_gb: 8
