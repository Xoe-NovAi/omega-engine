# Handoff Retention Policy — Single Source of Truth [M29]
# 
# This file defines THE constants for handoff lifecycle. 
# stale_threshold_days and hot_storage_max_days MUST be identical.
# Coincidence is a bug waiting to drift.
# 
# Enforced by: make check-policy-constants
# Referenced by: background.py reaper, Carmack's hot storage policy

handoff:
  # Lifecycle threshold — packets older than this move to stale/
  # This is THE constant. hot_storage_max_days MUST equal this.
  stale_threshold_days: 90
  
  # Carmack's hot storage policy — packets older than this are eligible
  # for cold storage release. MUST equal stale_threshold_days.
  # One constant, not two. Coincidence is a bug waiting to drift.
  hot_storage_max_days: 90
  
  # Archive threshold — packets older than this move to archive/
  archive_threshold_days: 365
  
  # Deep archival cadence to external 8TB drive
  deep_archive_cadence: quarterly
  
  # Reaper move thresholds (NOT deletion — M29 forbids deletion)
  # These are move operations only: pending->stale, active->stale, completed->archive
  reaper:
    pending_to_stale_hours: 24
    active_to_stale_hours: 48
    completed_to_archive_days: 7
    # NO stale_to_delete or archive_to_delete — M29 forbids automatic deletion