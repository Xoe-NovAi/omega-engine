## 📝 PROPOSED LESSONS FORMAT (for domain evolution)

When any entity distills an L3 principle relevant to a domain:

```yaml
# data/entities/<entity>/proposed_lessons.yaml
proposals:
  - level: L3
    principle: "Principle content here"
    domain: "engineering"  # TAGS THE DOMAIN
    utility_score: 0.85
    source_trajectories: ["session_id_1", "session_id_2"]
```

**Scribe/Verity pipeline**: On session end, domain-tagged principles are routed to the domain's curator for review and potential inclusion in `config/domains/<domain>/PRINCIPLES/`.

