## ⚖️ GOVERNANCE ENFORCEMENT (Lattice Fabric)

### Write Access
- **Curator entity** (listed above) — full write access to domain module
- **Designated co-authors** (for SHARED_WRITE domains) — write access via explicit grant
- **All other entities** — NO write access (enforced by `domain_loader.py`)

### Read Access
- **SHARED_READ** — All fleet entities may load domain via `load_domain()`
- **PRIVATE** — Only curator may load (enforced by `domain_loader.py`)

### Review Gate
- **Critic entity** (Verity for compliance/security; Kali for synthesis) — mandatory review for:
  - New domain module creation
  - Major version bumps (metadata.yaml version)
  - Governance level changes
  - AFFINITY_PRESETS.yaml modifications

### Proposal Mechanism
- Non-curator entities may propose changes via:
  1. `proposed_lessons.yaml` L3 principle with `domain: <domain>` tag
  2. Handoff packet to curator entity with `intent: handoff` + domain context
  3. GitHub PR to `config/domains/<domain>/` (curator is required reviewer)

