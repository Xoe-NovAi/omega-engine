## 🎯 PURPOSE

This registry enforces **domain ownership at the fabric level**, not convention.
The Lattice Fabric enforces: **Curator = write; Others = read + propose; Critic = review gate.**

Governance levels per domain:
- **PRIVATE** — Only curator entity may write; others may not read
- **SHARED_READ** — Curator writes; all fleet entities may read
- **SHARED_WRITE** — Curator + designated co-authors may write; all may read

