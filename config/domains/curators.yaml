## 🔧 IMPLEMENTATION HOOKS

### Domain Loader Enforcement (`src/omega/oracle/domain_loader.py`)

```python
async def load_domain(domain: str, token_budget: int, requester: str) -> DomainModule:
    """Load domain module with governance enforcement."""
    curator = CURATOR_REGISTRY[domain].curator
    governance = CURATOR_REGISTRY[domain].governance
    
    if governance == "PRIVATE" and requester != curator:
        raise PermissionError(f"Domain '{domain}' is PRIVATE; only {curator} may access")
    
    # Load domain module...
    return DomainModule(...)
```

