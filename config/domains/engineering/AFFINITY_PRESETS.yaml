## 🏷️ DOMAIN-SPECIFIC ROUTING RULES

### When to Use Planner Model
- Sprint planning and task decomposition
- Architecture decisions and trade-off analysis
- Complex debugging requiring multi-step reasoning
- Cross-domain integration planning

### When to Use Executor Model
- Code implementation from structured plan
- Test writing and fixing
- Configuration changes
- Documentation updates

### When to Use Critic Model
- Code review with rubric
- Security audit of changes
- Mandate compliance verification
- Test result analysis

---

## ☁️ CLOUD ESCALATION TRIGGERS

| Trigger | Action |
|---------|--------|
| Local model OOM (OOMProtector) | Escalate to cloud with `cost_warning` |
| Context exceeds local window | Escalate to cloud with larger context |
| Local model quality below threshold | Escalate to cloud for specific task |
| Concurrent local requests >1 slot | Queue or escalate (C-10 admission control) |

