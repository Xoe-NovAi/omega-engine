## 📜 CONTENT

> **pyproject.toml is the single source of truth for all dependencies.** No duplicate configuration in requirements.txt, setup.py, Dockerfiles, or CI configs. All extras (`[native]`, `[cli]`, `[warp]`, `[qdrant]`, `[redis]`, `[youtube]`, `[dev]`) defined in pyproject.toml only.

