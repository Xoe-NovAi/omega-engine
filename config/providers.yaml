version: 1.3.0
generated_at: '2026-07-22'
source: config/model_registry
strategy: local_first

# [C-5] MaKaLi Routing — Kali local, Ma'at+Lilith cloud
# Spec: docs/strategy/IMPLEMENTATION_MANUAL_C0_C2.md §C-5
maakali_routing:
  kali:
    prefer: native-gguf    # Local first for Kali (synthesis voice)
    fallback: antigravity
  maat:
    prefer: antigravity    # Cloud for Ma'at (build side)
    fallback: google
  lilith:
    prefer: antigravity    # Cloud for Lilith (run side)
    fallback: google

# Dynamic Fallback Resolver Configuration
# Replaces hardcoded fallback_provider with model-aware resolution
fallback_resolver:
  enabled: true
  strategy: "model_aware"  # "model_aware" | "priority_chain" | "static"
  cvars:
    # Per-provider fallback chains (ordered by preference)
    # Resolution: 1) same_model providers → 2) configured chain → 3) same_family → 4) native-gguff
    opencode-zen:
      - openrouter          # Same models often available (Nemotron, DeepSeek, etc.)
      - anthropic           # Claude models
      - google-compat       # Gemini models
      - native-gguf         # Last resort
    openrouter:
      - opencode-zen
      - cline               # DeepSeek V4 Flash, MiMo
      - anthropic
      - google-compat
      - native-gguf
    google:
      - google-compat       # Same models, different endpoint
      - openrouter
      - native-gguf
    google-compat:
      - google
      - openrouter
      - native-gguf
    anthropic:
      - openrouter
      - opencode-zen
      - native-gguf
    xai:
      - openrouter
      - native-gguf
    cline:
      - openrouter          # DeepSeek V4 Flash, MiMo
      - opencode-zen
      - native-gguf
    antigravity:
      - openrouter
      - opencode-zen
      - native-gguf

inference:
  fallback_chain:
  - provider: native-gguf
    priority: 0
    enabled: true
    is_cloud: false
    description: Local GGUF inference via llama.cpp (highest priority - local-first)
  - provider: lmster
    priority: 1
    enabled: true
    is_cloud: false
    description: LM Studio local server (OpenAI-compatible API)
  - provider: ollama
    priority: 2
    enabled: false
    is_cloud: false
    description: Ollama local server (OpenAI-compatible API)
  - provider: antigravity
    priority: 3
    enabled: true
    is_cloud: true
    description: Antigravity OAuth-based frontier models (Google DeepMind, Anthropic,
      OpenAI)
  - provider: google
    priority: 4
    enabled: true
    is_cloud: true
    description: Google AI Studio / Vertex AI - Google's own models only
  - provider: google-compat
    priority: 4
    enabled: true
    is_cloud: true
    description: Google AI Studio / Vertex AI compatible provider with Gemma 4 thinking
      support
  - provider: openrouter
    priority: 5
    enabled: true
    is_cloud: true
    description: OpenRouter free tier and paid models
  - provider: opencode-zen
    priority: 6
    enabled: true
    is_cloud: true
    description: OpenCode Zen - CLI-exclusive cloud models
  - provider: cline
    priority: 7
    enabled: true
    is_cloud: true
    description: Cline - CLI agent with DeepSeek V4 Flash / MiMo V2.5
  - provider: anthropic
    priority: 8
    enabled: true
    is_cloud: true
    description: Anthropic - Claude models (Sonnet, Haiku, Opus)
  - provider: xai
    priority: 9
    enabled: true
    is_cloud: true
    description: xAI - Grok models
  - provider: mock
    priority: 10
    enabled: false
    is_cloud: false
    description: Test mock provider for unit tests
  providers:
    native-gguf:
      priority: 0
      enabled: true
      is_cloud: false
      description: Local GGUF inference via llama.cpp (highest priority - local-first)
      model_path: env:OMEGA_MODELS_DIR/Qwen3-1.7B-Q6_K.gguf
      n_threads: 4
      max_concurrent: 1          # [C-10] Enforced by AdmissionController
      numa: "disable"            # [C-10] Prevent cross-CCX migration
      # thread_pin: "0-3"       # [C-10] Optional: explicit CCX pinning via taskset
      supported_models:
      - llama-4-scout-local
      - gpt-oss-120b-local
      - qwen-3.5-72b-local
      - nemotron-3-ultra-local
      - qwen3-1.7b-local
      - qwen3-4b-thinking-local
      - krikri-8b-local
      - deepseek-r1-qwen3-8b-local
      - ministral-3b-local
      - qwen3-0.6b-local
      - qwen2.5-0.5b-local
      - functiongemma-270m-local
      - embeddinggemma-300m-local
    lmster:
      priority: 1
      enabled: true
      is_cloud: false
      description: LM Studio local server (OpenAI-compatible API)
      api_key: lm-studio
      base_url: http://localhost:1234/v1
      n_threads: 4
      supported_models:
      - llama-4-scout-local
      - gpt-oss-120b-local
      - qwen-3.5-72b-local
      - nemotron-3-ultra-local
      - qwen3-1.7b-local
      - qwen3-4b-thinking-local
      - krikri-8b-local
      - deepseek-r1-qwen3-8b-local
      - ministral-3b-local
      - qwen3-0.6b-local
      - qwen2.5-0.5b-local
      - functiongemma-270m-local
      - embeddinggemma-300m-local
    ollama:
      priority: 2
      enabled: false
      is_cloud: false
      description: Ollama local server (OpenAI-compatible API)
      api_key: ollama
      base_url: http://localhost:11434/v1
      n_threads: 4
      supported_models:
      - llama-4-scout-local
      - gpt-oss-120b-local
      - qwen-3.5-72b-local
      - nemotron-3-ultra-local
      - qwen3-1.7b-local
      - qwen3-4b-thinking-local
      - krikri-8b-local
      - deepseek-r1-qwen3-8b-local
      - ministral-3b-local
