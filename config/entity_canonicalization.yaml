# ─────────────────────────────────────────────────────────────────────────────
# DECLARED CANONICAL ENTITY IDENTITY — single authoritative surface (D-614)
# ─────────────────────────────────────────────────────────────────────────────
#
# THE QUESTION THIS FILE ANSWERS, AND ONLY THIS FILE:
#   "which spellings address the SAME seat?"  One seat, one canonical name.
#
# WHY IT IS DECLARED, NOT DERIVED (the inversion this file exists to cause)
# --------------------------------------------------------------------------
# `handoff_alias.py` used to DERIVE identity from the live queue: group every
# packet by folded name, let the most frequent raw spelling win. That is a
# self-referential signal — the fork elects its own winner by majority, so the
# louder fork is canonised and the quieter one is declared defective. It also
# produced a function that stated two opposite policies at once (see
# `resolve_target_entity`): one comment said a node-qualified name is a DISTINCT
# destination, the next said that same suffix spelling IS the defect.
#
# A heuristic cannot arbitrate identity, so it must not try. Identity is
# DECLARED here, reviewed in review, and tested by
# `tests/test_entity_canonicalization.py`. Spelling noise (case, `_` vs `-`) is
# still folded mechanically at call time; this file only ever answers the
# question a fold cannot: "is this the same seat, or a different one?"
#
# Consumed by: mcp_servers.omega_hub.handoff_alias.canonical_entity_name()
# Contract: a bare (non node-qualified) alias resolves here FIRST and wins over
#           every derived signal. A DECLARED canonical is never overridden by a
#           queue majority. A table ABSENT entry is not a merge — it falls
#           through to the derived path unchanged.
#
# M28: nothing here deletes or rewrites history. Packets addressed to an alias
# stay on disk, byte-identical, and canonicalise at RESOLUTION time only. The
# merge record is data/coordination/ENTITY_CANONICALIZATION_20261005.json.
# ─────────────────────────────────────────────────────────────────────────────

schema_version: "1.0"
document_type: "entity_canonical_identity"
authority: "handoff target identity (NOT live EIS session identity — that is opencode.db, M29)"
decided_by: "Architect ruling via makali-n0 [D-614]"

canonical:
  # ── The MaKaLi seat ───────────────────────────────────────────────────────
  # Measured on the live queue at decision time (data/handoff/**):
  #   makali         15 packets   makali-fusion  32 packets   makali-n0  14 packets
  # `makali_fusion`'s own soul.yaml and config/a2a/agent_cards/makali_fusion.json
  # both describe it as "the Kali + Ma'at + Lilith unified identity embodied as a
  # single seat" at hierarchy_level 1 — the same seat `makali` names. Three
  # spellings, one seat: 61 distinct packets, one address.
  # The fork was measured, not inferred: ho_98ae17535622 -> makali and
  # ho_7db7cfdb09ac -> makali-n0, byte-identical task+context, 6s apart.
  makali-n0:
    aliases:
      - makali
      - makali-fusion          # folded form of makali_fusion
      - makali_fusion
    authority_note: >
      Architect ruling, D-614: makali-n0 is authoritative. Note this canonical
      name has NO data/entities/ directory; its own deliverability is carried by
      the derived queue spelling. Tracked as open work, not silently assumed.

# ── DELIBERATELY NOT MERGED ─────────────────────────────────────────────────
# Recorded so the next agent to read this file does not "helpfully" merge them.
# Each line is a DISTINCT seat or a DISTINCT machine. Merging any of these is
# the exact class of defect D-614 fixes, in the opposite direction.
deliberately_not_merged:
  - names: ["lilith", "lilith-n1"]
    reason: >
      Distinct NODES. Live packets address both (ho_980cba3b3341 targets
      opencode/lilith-n1). Folding them delivered mail to the wrong machine
      while reporting resolved:true — the P0 FIX 1 evidence defect. Node
      suffixes stay ROUTING tokens, never spelling.

  - names: ["researcher", "researcher-humboldt"]
    reason: >
      Distinct SEATS on distinct nodes, not spellings. researcher_humboldt
      carries its own continuity_id and assignment ids (researcher_humboldt.fool,
      .star) in the N0->N1 identity fixture, and its own Exchange pointers.
      A parallel session reported this as a spelling hazard; that reading is
      REJECTED — evidence contradicts it. Two agents, one name-family.

  - names: ["ge-n0", "ge-n1"]
    reason: "Distinct nodes. `ge_n1` vs `ge-n1` IS a real spelling fold, handled mechanically by canonical_form()."

  - names: ["john-carmack-n1", "john_carmack"]
    reason: "Distinct nodes; `john_carmack` vs `john-carmack` is a mechanical separator fold, not a node merge."
