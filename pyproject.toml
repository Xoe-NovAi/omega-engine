[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "1.2.0"
description = "Omega Engine — Sovereign AI Runtime — Local-first, entity-centric, provider-agnostic AI council"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "warp-proxy-pool",

    "headroom-ai[all]",
    "aiosqlite==0.22.1",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "APScheduler==3.10.4",
    "attrs==26.1.0",
    "certifi==2026.4.22",
    "cffi==2.0.0",
    "click==8.3.3",
    "cryptography==48.0.0",
    "python-age>=1.0.0",  # C-2: age encryption package (NOT "age")
    "fastapi==0.136.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx2==2.5.0",  # [Strike 7.1] Pydantic fork of httpx; API-compatible superset
    "httpx-sse==0.4.3",
    "idna==3.18",  # relaxed from 3.15: httpx2 requires idna>=3.18
    "iniconfig==2.3.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "mcp==1.27.1",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pydantic_core==2.46.4",
    "Pygments==2.20.0",
    "PyJWT==2.12.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.28",
    "pytz==2026.2",
    "PyYAML==6.0.3",
    "keyring>=24.0.0",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sse-starlette==3.4.4",
    "starlette==1.0.0",
    "tenacity==9.1.4",
    "tiktoken>=0.7.0",
    "typer==0.25.1",
    "youtube-transcript-api>=0.6.3",
    "yt-dlp>=2025.1.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "tzlocal==5.3.1",
    "uvicorn==0.46.0",
    "prompt-toolkit==3.0.52",
    "psutil==7.2.2",
    "qdrant-client==1.18.0",
    "redis==7.4.1",
    "sqlite-vec>=0.1.9,<0.2.0",
    "rich==15.0.0",
    "python-docx==1.2.0",
    "PyMuPDF==1.25.3",
    "odfpy==1.4.1",
    "striprtf==0.0.25",
    "beautifulsoup4==4.13.4",
]

[project.optional-dependencies]
native = ["llama-cpp-python>=0.3.0,<0.4.0"]
cli = ["typer[full]", "rich>=15.0.0", "shellingham>=1.5.0"]
dev = ["pytest>=9.0.0", "pytest-asyncio>=0.25.0", "pytest-cov>=6.0.0", "pytest-timeout>=2.4.0", "flake8>=7.0.0", "hypothesis>=6.100.0"]
all = ["omega[native,cli,dev]"]

[project.scripts]
omega = "omega.cli.oracle_cli:main"

[project.urls]
Homepage = "https://github.com/Xoe-NovAi/omega-engine"
Repository = "https://github.com/Xoe-NovAi/omega-engine"
Issues = "https://github.com/Xoe-NovAi/omega-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
addopts = "--ignore=data/entities/roc_racoon/workspace/odysseus-dev --timeout=60 --durations=15"

[tool.coverage.run]
source = ["src/omega"]
omit = [
    "src/omega/workers/*",
    "src/omega/ingestion/*",
    "src/omega/library/*",
]
