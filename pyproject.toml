[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "1.0.0-alpha"
description = "Omega Engine — Sovereign AI Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anyio>=4.13.0",
    "APScheduler>=3.10.4",
    "click>=8.3.3",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=1.27.1",
    "prompt-toolkit>=3.0.0,<4.0.0",
    "psutil>=5.9.8",
    "pydantic>=2.13.4",
    "PyJWT>=2.12.1",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "qdrant-client>=1.13.0",
    "redis>=7.0.0,<8.0.0",
    "rich>=15.0.0",
    "sse-starlette>=3.4.4",
    "starlette>=1.0.0",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
native = ["llama-cpp-python>=0.3.0,<0.4.0"]
cli = ["typer[full]", "rich>=15.0.0", "shellingham>=1.5.0"]
dev = ["pytest>=9.0.0", "pytest-asyncio>=0.25.0", "pytest-cov>=6.0.0", "flake8>=7.0.0"]
all = ["omega[native,cli,dev]"]

[project.scripts]
omega = "omega.cli.oracle_cli:main"

[project.urls]
Homepage = "https://github.com/Xoe-NovAi/omega-engine"
Repository = "https://github.com/Xoe-NovAi/omega-engine"
Issues = "https://github.com/Xoe-NovAi/omega-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=data/entities/roc_racoon/workspace/odysseus-dev"
