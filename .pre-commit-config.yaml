# Pre-commit hooks for Omega Engine
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  # Standard Python hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.12
        args: ["--line-length=100"]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML, types-cryptography]
        args: ["--ignore-missing-imports", "--no-strict-optional"]

  # M37 Heritage — REUSE v3.3 SPDX compliance
  # Per RESEARCHER_GAP_FILL_PHASE_2_20260830.md MED-3 pattern.
  # https://reuse.software/spec-3.3/ — every file MUST have SPDX headers.
  # reuse-lint-file: faster per-file check on staged files
  # reuse: whole-project lint (slower, runs in CI)
  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        args: ["lint"]
        stages: [pre-push]  # Full project lint on push (slower)
      - id: reuse-lint-file
        stages: [pre-commit]  # Per-file lint on commit (fast)

  # Security - detect secrets (C3-P0-1c — gitleaks is the canonical gate)
  # [INST-1-C3] gitleaks + trufflehog wired to pre-commit AND CI
  # Per DEBUT_REMEDIATION_MANUAL §5 P0-1c: planted sk-/csk-/AIza fixture must fail.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        # Enforce on all files (including staged for commit)
        # allow_staged: false is the default; commits with secrets are blocked.
        args: ['--redact', '--verbose']
        stages: [pre-commit, pre-push]

  # Trufflehog (deep secret scanner — verifies gitleaks did not miss entropy)
  # [INST-1-C3] Backup layer; if gitleaks is bypassed, trufflehog catches entropy.
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.97.1
    hooks:
      - id: trufflehog
        # Filesystem mode — scans staged files; much faster than git history scan.
        args: ['filesystem', '--no-update-check', '--fail', '--only-verified']
        pass_filenames: false
        stages: [pre-commit]

  # Legacy detect-secrets (kept for backwards compatibility — not the gate)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'tests/|docs/|data/'

  # Custom Omega Engine hooks
  - repo: local
    hooks:
      # Detect API keys in source code (os.environ.get, os.getenv patterns)
      - id: omega-detect-api-keys
        name: Detect API keys in source code
        entry: python -m src.omega.tools.detect_api_keys
        language: python
        types: [python]
        args: ['--strict']
        pass_filenames: true

      # Ensure VaultCore is used instead of os.environ.get for API keys
      - id: omega-enforce-vaultcore
        name: Enforce VaultCore usage for API keys
        entry: python -m src.omega.tools.enforce_vaultcore
        language: python
        types: [python]
        args: ['--strict']
        pass_filenames: true

      # Verify no KeyVault imports (deprecated)
      - id: omega-no-keyvault
        name: No KeyVault imports
        entry: python -c "import sys, ast; [sys.exit(1) for n in ast.walk(ast.parse(open(f).read())) if isinstance(n, ast.ImportFrom) and n.module and 'key_vault' in n.module.lower() for f in sys.argv[1:]]"
        language: python
        types: [python]
        pass_filenames: true

      # Check for hardcoded secrets patterns
      - id: omega-no-hardcoded-secrets
        name: No hardcoded secrets
        entry: python -m src.omega.tools.check_hardcoded_secrets
        language: python
        types: [python, yaml, toml, json]
        pass_filenames: true

      # [INST-1-C3] Local C3 secret scanner (gitleaks mirror, no network)
      # Catches sk-, csk-, AIza, ghp_, xai-, age-secret-key patterns.
      # This is the FALLBACK if gitleaks/trufflehog cannot be installed.
      - id: omega-c3-secret-scan
        name: C3 Secret Scan (sk/csk/AIza/ghp/xai)
        entry: python scripts/ci_secret_scan.py
        language: python
        types_or: [python, yaml, toml, json, shell, markdown]
        pass_filenames: true
        stages: [pre-commit]

      # Fast mandate compliance checks (per Carmack Verdict — moved from runtime Vetter to CI)
      - id: omega-check-m1-anyio
        name: Check M1 AnyIO (no asyncio)
        entry: make check-m1-anyio
        language: system
        pass_filenames: false
        always_run: true
      - id: omega-check-asyncio-import
        name: Check M1 companion (no asyncio in anyio.run modules)
        entry: make check-asyncio-import
        language: system
        pass_filenames: false
        always_run: true
      - id: omega-check-m9-error-integrity
        name: Check M9 Error Integrity (no bare except)
        entry: make check-m9-error-integrity
        language: system
        pass_filenames: false
        always_run: true
      - id: omega-check-m8-zero-telemetry
        name: Check M8 Zero Telemetry
        entry: make check-m8-zero-telemetry
        language: system
        pass_filenames: false
        always_run: true
      - id: omega-check-m7-local-first
        name: Check M7 Local-First config
        entry: make check-m7-local-first
        language: system
        pass_filenames: false
        always_run: true
      - id: omega-check-m23-failure-integrity
        name: Check M23 Failure Integrity
        entry: make check-m23-failure-integrity
        language: system
        pass_filenames: false
        always_run: true

      # F821 Gate — Enforce no undefined names (forward refs must use TYPE_CHECKING)
      - id: omega-check-f821
        name: Check F821 undefined names
        entry: python -m flake8 src/omega/ --select=F821 --count
        language: system
        pass_filenames: false
        always_run: true

      # Cognitive State Validator (M27 Tracking Integrity — the Iron Gate)
      # Blocks ANY commit that corrupts the 5-Tier tracking state (bad statuses,
      # relational R-ID gaps, duplicate topics).
      - id: omega-tracking-state
        name: Validate tracking state (M27)
        entry: python scripts/validate_tracking_state.py
        language: system
        pass_filenames: false
        always_run: true

      # Verify Temple-Grade compliance (comprehensive — slower, CI-focused)
      - id: omega-temple-grade
        name: Temple-Grade compliance check
        entry: make temple-grade
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true