title = "Omega Engine gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''sk-or-v1-[0-9a-f]{64}'''
keywords = ["sk-or-v1-"]

# Allowlist for known false positives and public-by-design secrets.
# AP tokens are internal artifact tokens (AP-<ENTITY>-<TOPIC>-<DATE>-v1.0.0),
# not credentials. GOCSPX-K58FWR... is a PUBLIC OAuth client secret
# (RFC 8252 native-app pattern) allowlisted in data/secrets-public.toml.
[allowlist]
description = "Omega Engine known-safe patterns"
# The ignore file must exclude ITSELF. Every entry is a bare fingerprint of
# the form <40-hex commit sha>:<path>:<rule>:<line>, and that 40-hex sha matches
# gitleaks' own `generic-api-key` entropy rule. Scanning .gitleaksignore against
# itself therefore reports a finding for every entry it contains (124 entries =>
# 124 self-referential findings, PR #4). This is the standard self-exclusion
# pattern; the C3 mirror scanner already does the same for its own source
# (scripts/ci_secret_scan.py in its --exclude list).
#
# This does NOT weaken the gate: .gitleaksignore contains no secret material.
# Every non-comment, non-blank line is a bare fingerprint (verified), so there
# is nothing in this file for a secret scanner to find.
paths = [
    '''^\.gitleaksignore$''',
]
regexes = [
    '''AP-[A-Z0-9]+-[A-Z0-9-]+-[0-9]{8}-v[0-9]+\.[0-9]+\.[0-9]+''',  # internal artifact tokens
    '''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''',                      # public client secret (RFC 8252)
    '''GOCSPX-\*\*\*REDACTED-ROTATED\*\*\*''',                      # redaction placeholder
    '''GOCSPX-NEW_VALUE''',                                         # doc placeholder
    '''GOCSPX-ATTACKER-XXX''',                                      # adversarial test placeholder
    '''GOCSPX-NEW''',                                               # rotation log placeholder
]
