# 🔱 Omega Engine — Context Packer Profile Configuration
# AP: AP-CONTEXT-PACKER-CONFIG-v2.0.0
# Updated: 2026-07-11 (Sonnet 4.6 hardening — core_engine split, 3 new profiles)
# Max slots: 12 per profile (safe zone below Claude Projects RAG threshold of 13)
# Token target: keep each theme bundle under ~80K tokens for effective Claude usage

profiles:

  # ── Sovereign Audit (hardened — core_engine split into 5 sub-themes) ──────
  sovereign-audit:
    description: "Core Engine and Mandates Audit — hardened 2026-07-11"
    max_slots: 12
    include:
      - "SOVEREIGN_MANDATES.md"
      - "OMEGA_ENGINE.md"
      - "AGENTS.md"
      - "src/omega/**/*.py"
      - "config/providers.yaml"
      - "config/models.yaml"
      - "docs/strategy/**/*.md"
    exclude:
      - "**/__pycache__/**"
      - "**/*.pyc"
      - "**/*.log"
      - "**/*.tmp"
      - "context_packs/**"
    themes:
      mandates:
        - "SOVEREIGN_MANDATES.md"
        - "OMEGA_ENGINE.md"
        - "AGENTS.md"
      oracle_core:
        - "src/omega/oracle/oracle.py"
        - "src/omega/oracle/model_gateway.py"
        - "src/omega/oracle/entity_registry.py"
        - "src/omega/oracle/entity_workspace.py"
        - "src/omega/oracle/orchestrator.py"
        - "src/omega/oracle/resource_guard.py"
        - "src/omega/oracle/cpu_optimizer.py"
        - "src/omega/oracle/context_builder.py"
        - "src/omega/oracle/session_lifecycle.py"
        - "src/omega/oracle/iris.py"
      memory:
        - "src/omega/memory_store.py"
        - "src/omega/memory/**/*.py"
        # NOTE: context_builder.py belongs to oracle_core only — removed from here
        # to prevent the file appearing in two XML bundles (token waste).
      providers:
        - "src/omega/oracle/backends/**/*.py"
        - "config/providers.yaml"
        - "config/models.yaml"
      observability:
        - "src/omega/observability/**/*.py"
        - "src/omega/monitoring/**/*.py"
      mcp_hub:
        - "src/omega/mcp_runtime.py"
        - "src/omega/hub.py"
        - "src/omega/gateway/**/*.py"
      # NOTE: `config` theme removed — its files are already covered by `providers`.
      # Duplicate themes produce duplicate XML bundles and waste Claude quota.
      strategy:
        - "docs/strategy/**/*.md"

  # ── Provider Fabric Review (for Web Claude deep review) ─────────────────────
  provider-fabric-review:
    description: "Deep review of local inference (NativeGGUFProvider) + provider fabric with cloud backends, routing, and streaming"
    target_platform: "web-claude"
    target_model: "claude-sonnet-5"
    max_slots: 12
    format: "xml"
    bundle_ordering: "litm-u-shaped"
    prompt_caching:
      enabled: true
      cache_prefix: ["manifest", "mandates", "engine_state"]
    token_budget:
      total: 150000
      per_bundle: 15000
      reserved_output: 50000
    multishot_examples: true
    xml_delimiters: "spotlighting"
    include:
      # ── Sovereign Mandates (espec. M7 Local-First, M22 Provenance, M25 Streaming) ─
      - "SOVEREIGN_MANDATES.md"
      - "OMEGA_ENGINE.md"
      - "ORACLE_STACK.md"
      # ── Core Gateway + Provider Fabric ──
      - "src/omega/oracle/model_gateway.py"
      - "src/omega/oracle/providers.py"
      # ── Cloud Backends ──
      - "src/omega/oracle/backends/__init__.py"
      - "src/omega/oracle/backends/remote_provider.py"
      - "src/omega/oracle/backends/openai_compat.py"
      - "src/omega/oracle/backends/antigravity_provider.py"
      - "src/omega/oracle/backends/google_compat.py"
      - "src/omega/oracle/backends/mock.py"
      # ── Infrastructure ──
