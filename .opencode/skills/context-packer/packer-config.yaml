      - "src/omega/oracle/resource_guard.py"
      - "src/omega/oracle/cpu_optimizer.py"
      - "src/omega/oracle/admission_controller.py"
      - "src/omega/oracle/stream_handler.py"
      - "src/omega/oracle/health_monitor.py"
      # ── Routing & Resilience ──
