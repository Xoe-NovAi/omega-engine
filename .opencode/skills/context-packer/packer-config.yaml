      - "src/omega/oracle/cascade_router.py"
      - "src/omega/oracle/retry_policy.py"
      - "src/omega/oracle/rate_limiter.py"
      - "src/omega/oracle/quota_tracker.py"
      - "src/omega/oracle/token_estimator.py"
      - "src/omega/oracle/local_worker_pool.py"
      # ── Config ──
      - "config/providers.yaml"
      - "config/models.yaml"
      - "config/model_registry/providers/native-gguf.yaml"
      # ── Strategy ──
      - "docs/strategy/SOVEREIGN_ARK_BLUEPRINT.md"
      # ── Tests ──
      - "tests/test_providers.py"
      - "tests/test_model_gateway.py"
      - "tests/test_e2e_inference_chain.py"
      - "tests/test_antigravity_provider.py"
    exclude:
      - "**/__pycache__/**"
      - "**/*.pyc"
      - "**/*.log"
      - "**/*.tmp"
      - "context_packs/**"
    themes:
      mandates:
        - "SOVEREIGN_MANDATES.md"
      engine_state:
        - "OMEGA_ENGINE.md"
        - "ORACLE_STACK.md"
      gateway:
